<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区分账管理台 · 离线演示</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f3f5f8;color:#182433;margin:0}main{max-width:1000px;margin:auto;padding:24px}header,section{background:#fff;padding:22px;border-radius:12px;margin:16px 0}nav{display:flex;gap:12px}button,select{font:inherit;padding:9px;border-radius:7px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #dce2e9}small{color:#555}section[hidden]{display:none}.warning{color:#963b26}button:focus-visible{outline:3px solid #2889cb}</style></head><body><main><header><h1>社区分账 · 管理后台演示</h1><p class="warning">本地模拟数据，不连接真实商户、支付或财务系统。</p><label for="role">演示角色</label> <select id="role"><option value="MERCHANT_ADMIN">商家管理员</option><option value="STORE_STAFF">门店员工</option><option value="PLATFORM_REVIEWER">平台审核员</option><option value="FINANCE_APPROVER">财务审批员</option></select><nav><button id="merchantButton">商家后台</button><button id="platformButton">平台后台</button></nav></header><p role="status" id="notice"></p><section id="merchant"><h2>商家后台</h2><h3>订单列表</h3><table><thead><tr><th>订单</th><th>状态</th><th>金额（元）</th></tr></thead><tbody id="orders"></tbody></table><h3>广告管理</h3><table><thead><tr><th>广告</th><th>投放位置</th><th>状态</th></tr></thead><tbody id="ads"></tbody></table><small>商家只能管理本商家授权数据，平台审核不允许商家自批。</small></section><section id="platform" hidden><h2>平台管理后台</h2><p>商家审核与财务审批职责分离。此处仅显示模拟操作结果。</p><button id="merchantApproval">模拟商家审核</button> <button id="splitApproval">模拟分账审批</button><p id="platformResult" role="status"></p></section></main><script src="./admin.js" defer></script></body></html>
