<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玄钧云汇 · SaaS 离线业务台</title>
<style>body{font:16px system-ui,sans-serif;max-width:1040px;margin:auto;padding:28px;background:#f7f8fb;color:#1d2636}header,section{background:white;border-radius:12px;padding:22px;margin:18px 0;border:1px solid #e4e8ef}h1{margin:0 0 10px}small{color:#637083}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}button,input,select{font:inherit;padding:9px;border-radius:7px;border:1px solid #aaa}button{cursor:pointer;background:#182d54;color:white}button:disabled{background:#aaa}pre{white-space:pre-wrap;word-break:break-word;background:#edf0f5;padding:12px}label{display:block;margin:10px 0}</style></head>

</div>
