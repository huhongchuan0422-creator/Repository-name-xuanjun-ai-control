<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台模拟订单核查</title></head><body><main><h1>平台工作台 · 本地模拟订单核查</h1><p>该页面不提供平台管理员身份认证，只能按输入范围查询本地模拟订单。不能用于真实平台管理。</p><label>租户 <input id="tenant" value="tenant1"></label><label>商家 <input id="merchant" value="merchant1"></label><label>门店 <input id="store" value="store1"></label><label>订单 <input id="reference" value="demo1"></label><button id="inspect">核查模拟订单</button><p id="status" role="status">未核查</p><p id="error" role="alert"></p><dl><dt>模拟订单状态</dt><dd id="state">—</dd><dt>金额（分）</dt><dd id="amount">—</dd><dt>渠道结算验证</dt><dd id="verified">否</dd></dl><section><h2>门店和广告 · 只读模拟</h2><button id="inspectCatalog">读取当前门店</button><p id="catalogStatus" role="status">尚未读取</p><p id="catalogName"></p><ul id="catalogItems"></ul><p id="catalogAd"></p><p>广告仅展示已审核金额页素材标题；本地模拟成功不显示成功页广告。</p></section><p>模拟SUCCESS不构成渠道结算证明。无退款、分账或真实资金操作入口。</p><a href="/demo/">消费者模拟界面</a></main><script src="/demo/platform/app.js" defer></script><script src="/demo/catalog-read.js" defer></script></body></html>
