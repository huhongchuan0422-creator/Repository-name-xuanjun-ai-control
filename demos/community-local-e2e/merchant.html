<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家模拟订单工作台</title></head><body><main><h1>商家订单工作台（本地模拟）</h1><p>仅本机离线演示，无身份认证，不用于真实商家订单、结算或对账。</p><label>租户 <input id="tenant" value="tenant1"></label><label>商家 <input id="merchant" value="merchant1"></label><label>门店 <input id="store" value="store1"></label><label>订单编号 <input id="reference" value="demo1"></label><button id="load">查询模拟订单</button><p id="status" role="status">尚未查询</p><p id="error" role="alert"></p><dl><dt>金额（分）</dt><dd id="amount">—</dd><dt>币种</dt><dd id="currency">—</dd><dt>模拟状态</dt><dd id="state">—</dd><dt>交易号（模拟）</dt><dd id="transaction">—</dd><dt>真实渠道结算已验证</dt><dd id="verified">否</dd></dl><section><h2>门店模拟订单列表</h2><button id="listOrders">列出本门店订单</button><p id="listStatus" role="status">尚未读取</p><pre id="orderList"></pre><p>仅展示本地模拟记录；非真实商家认证或支付凭证。</p></section><section><h2>门店和广告 · 只读模拟</h2><button id="loadCatalog">读取当前门店</button><p id="catalogStatus" role="status">尚未读取</p><p id="catalogName"></p><ul id="catalogItems"></ul><p id="catalogAd"></p><p>广告仅展示已审核金额页素材标题；本地模拟成功不显示成功页广告。</p></section><p>注意：模拟SUCCESS不代表真实付款完成；此页面不提供真实收款凭证或成功广告。</p><a href="/demo/">返回消费者本地模拟</a></main><script src="/demo/merchant/app.js" defer></script><script src="/demo/catalog-read.js" defer></script><script src="/demo/order-list.js" defer></script></body></html>
