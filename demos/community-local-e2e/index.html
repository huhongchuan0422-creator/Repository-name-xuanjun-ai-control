<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage5本地全流程模拟</title></head><body><main><h1>商家扫码收款 · 本地模拟</h1><p>仅演示：不连接微信、不产生真实资金、不构成支付成功凭证。</p><label>租户 <input id="tenant" value="tenant1"></label><label>商家 <input id="merchant" value="merchant1"></label><label>门店 <input id="store" value="store1"></label><label>订单号 <input id="reference" value="demo1"></label><label>金额（分） <input id="amount" value="120" inputmode="numeric"></label><section><h2>门店资料与商品（本地模拟）</h2><button id="loadStorefront">加载门店</button><p id="storefrontStatus" role="status">尚未加载门店</p><p id="storefrontName"></p><ul id="storefrontProducts"></ul></section><section><h2>付款金额页</h2><aside id="adAmount">金额页广告位：当前无广告（模拟）</aside><button id="create">创建模拟订单</button></section><section><h2>订单状态</h2><button id="query">读取模拟订单</button><button id="complete">模拟支付成功事件</button><button id="fail">模拟失败事件</button><p id="status" role="status">未创建订单</p><aside id="successAd" hidden>付款结果广告位：本地模拟事件展示（非真实支付）</aside></section><section><h2>商家本地订单读取</h2><button id="merchantQuery">商家查看当前模拟订单</button><pre id="merchantResult"></pre></section><p id="error" role="alert"></p></main><script src="/demo/app.js" defer></script></body></html>
