<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区管理 · 玄钧云汇</title><link rel="stylesheet" href="/community/portal.css"></head><body><main><h1>社区管理</h1><p id="message" role="status">请从客户中心进入已授权社区工作区。</p><section><h2>个人资料与推荐关系</h2><button id="readProfile">读取我的资料</button><form id="customerProfile"><label>昵称<input id="nickname" maxlength="80"></label><label>联系方式<input id="customerContact" maxlength="200"></label><button>保存个人资料</button></form><button id="referralCode">获取我的推荐码</button><label>推荐码<input id="referralInput" maxlength="32"></label><button id="bindReferrer">确认绑定推荐人</button><button id="notices">我的通知</button><pre id="customerResult"></pre></section><section><h2>社区资料</h2><form id="profile"><label>社区名称<input id="name" maxlength="120" required></label><label>社区介绍<textarea id="description" maxlength="2000"></textarea></label><label>联系人及联系方式<input id="contact" maxlength="200" required></label><button>保存资料</button></form><button id="submit">提交审核</button><button id="mine">我的社区</button></section><section><h2>打开社区</h2><label>社区编号<input id="reference"></label><button id="read">查询</button><label>关系类型<select id="kind"><option value="CUSTOMER">消费者</option><option value="MERCHANT">商家</option></select></label><button id="join">加入社区</button><button id="leave">退出社区</button><button id="members">查看成员</button></section><section><h2>平台审核</h2><button id="pending">待审社区</button><label>审核决定<select id="decision"><option>APPROVED</option><option>CORRECTION</option><option>REJECTED</option><option>PAUSED</option></select></label><label>审核意见<textarea id="opinion" maxlength="1000"></textarea></label><button id="review">提交审核决定</button></section><section><h2>查询结果</h2><div id="records"></div><button id="more" hidden>下一页</button><pre id="result"></pre></section></main><script src="/community/portal.js" defer></script></body></html>
