<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家入驻 · 社区分账</title><link rel="stylesheet" href="/merchant/onboarding.css"></head>
<body><header><span>社区分账</span><nav><a href="/merchant/join">商家入驻</a><a href="/merchant/review">入驻审核</a></nav></header>
<main><section class="intro"><p class="eyebrow">MERCHANT CENTER</p><h1 id="title">申请商家入驻</h1><p>填写经营信息，按清单提交资料，审核结果和补件要求会保留在这里。</p><ol class="steps"><li>填写信息</li><li>提交资料</li><li>平台审核</li><li>开通工作台</li></ol></section>
<p id="status" role="status" aria-live="polite">正在读取入驻信息…</p><section id="queue" hidden><h2>待处理申请</h2><button id="reloadQueue">刷新列表</button><div id="applications"></div></section>
<section id="applicant"><div class="row"><h2>经营信息</h2><div><button id="reloadMine">刷新状态</button><button id="newApplication">新建申请</button></div></div><form id="profile"><div class="grid">
<label>主体类型<select id="entity_type"><option value="ENTERPRISE">企业</option><option value="SOLE_PROPRIETOR">个体工商户</option></select></label>
<label>经营类目<select id="category"><option value="GENERAL">一般经营类目</option><option value="FOOD">餐饮/食品</option></select></label>
<label>主体名称<input id="legal_name" maxlength="512" autocomplete="organization"></label><label>门店名称<input id="store_name" maxlength="512"></label>
<label>经营地址<input id="address" maxlength="512" autocomplete="street-address"></label><label>联系人及联系方式<input id="contact" maxlength="512"></label>
</div><label class="check"><input id="delegated" type="checkbox">由授权经办人办理</label><button id="saveDraft" type="submit">保存草稿</button></form><div id="mine"></div></section>
<section id="detail" hidden><div class="row"><h2 id="applicationTitle">入驻申请</h2><span id="applicationState" class="badge"></span></div><dl id="summary"></dl><p id="reviewNote"></p><h3>资料清单</h3><p>支持 PDF、PNG、JPEG，每份不超过 5 MB。涉及证件和账户的资料仅供本申请及授权审核人查看。</p><div id="materials"></div>
<button id="submitApplication">提交审核</button><section id="reviewActions" hidden><h3>审核处理</h3><label>处理说明（最多80字）<textarea id="note" maxlength="80" rows="3"></textarea></label><div class="actions"><button data-action="BEGIN_REVIEW">开始审核</button><button data-action="CORRECTION">要求补件</button><button data-action="REJECT" class="danger">驳回申请</button><button data-action="APPROVE">通过入驻审核</button></div></section>
<p id="opening"></p><div id="openingActions" hidden><label>开通到已绑定门店<select id="openingWorkspace"></select></label><button id="openWorkbench">开通 / 恢复工作台</button></div></section></main><script src="/merchant/onboarding.js" defer></script></body></html>
