<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue76 逐页UI原型审阅</title><style>
:root{font:14px system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#21382f;background:#f2f5f3}*{box-sizing:border-box}body{margin:0}header{padding:18px 22px;background:#fff;border-bottom:1px solid #dce6df}h1{font-size:22px;margin:0 0 8px}.note{color:#576a61;max-width:960px;line-height:1.6}main{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);min-height:calc(100vh - 145px)}nav{background:#fff;border-right:1px solid #dce6df;max-height:calc(100vh - 145px);overflow:auto;padding:12px}nav a{display:block;padding:10px 12px;color:#254d40;text-decoration:none;border-radius:9px;margin-bottom:4px}nav a:hover,nav a[aria-current]{background:#e9f3ee}nav small{color:#6a7b72}section{padding:18px}iframe{height:75vh;width:100%;border:1px solid #bccdc3;border-radius:14px;background:#fff}button{border:1px solid #b9cbbf;background:white;color:#244939;padding:7px 12px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#225f49;color:white}.controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.status{color:#586b61;font-size:12px}@media(max-width:800px){main{display:block}nav{max-height:30vh;border-bottom:1px solid #ddd}iframe{height:65vh}} </style></head><body>
<header><h1>社区 Issue76 · 66 个既有路由 UI 原型审阅</h1><div class="note">34 个主画面入口 + 32 个详情/编辑路由，来自现有隔离预览资产。该数目是审阅路径数量，不是66个独立功能已交付。真实微信登录、付款、审核提交和平台全局财务均未接入；不得用于正式客户验收。条件证件页须先在「主体与门店」选择相应证件类型。</div></header>
<main><nav id="route-index" aria-label="逐页入口"></nav><section><div class="controls"><button data-width="390" aria-pressed="true">手机390</button><button data-width="1440" aria-pressed="false">PC1440</button><span class="status" id="route-info"></span><a id="open-page" target="_blank" rel="noopener">独立打开原路由</a></div><iframe id="prototype" title="原源码原型渲染，不连接后台" sandbox="allow-scripts allow-same-origin"></iframe><p class="status">本页仅用于本地与受限审阅环境。订单/通知延期范围只展示原代码路由，不执行支付或数据提交。</p></section></main>
<script>
'use strict';
const mainRoutes=[["merchant","home","商家工作台"],["merchant","merchant-native-orders","merchant-native-orders"],["merchant","merchant-native-summary","merchant-native-summary"],["merchant","merchant-native-profile","merchant-native-profile"],["merchant","merchant-native-detail","merchant-native-detail"],["merchant","merchant-native-collection","merchant-native-collection"],["community","home","社区工作台"],["community","community-0-0-0","community-0-0-0"],["community","community-1-0-0","community-1-0-0"],["community","community-2-0-0","community-2-0-0"],["community","community-4-0-0","community-4-0-0"],["community","community-7-0-0","community-7-0-0"],["platform","home","平台管理"],["platform","platform-3-0-0","platform-3-0-0"],["platform","platform-4-1-0","platform-4-1-0"],["platform","platform-5-0-0","platform-5-0-0"],["platform","platform-6-0-0","platform-6-0-0"],["platform","platform-admission","platform-admission"],["admission","home","入驻首页"],["admission","admission-start","admission-start"],["admission","admission-business","admission-business"],["admission","admission-settlement","admission-settlement"],["admission","admission-result","admission-result"],["admission","admission-subject_info-business_license_info-","admission-subject_info-business_license_info-"],["admission","admission-subject_info-identity_info-id_card_info-","admission-subject_info-identity_info-id_card_info-"],["admission","admission-contact_info-","admission-contact_info-"],["admission","admission-business_info-","admission-business_info-"],["admission","admission-bank_account_info-","admission-bank_account_info-"],["consumer","home","消费者首页"],["consumer","consumer-stores","consumer-stores"],["consumer","consumer-recommendations","consumer-recommendations"],["consumer","consumer-profile","consumer-profile"],["consumer","consumer-communities","consumer-communities"],["consumer","consumer-referrals","consumer-referrals"]];
const subRoutes=[["merchant","merchant-native-orders","detail"],["merchant","merchant-native-summary","detail"],["merchant","merchant-native-profile","detail"],["merchant","merchant-native-detail","detail"],["merchant","merchant-native-collection","detail"],["merchant","merchant-native-orders","edit"],["merchant","merchant-native-summary","edit"],["merchant","merchant-native-profile","edit"],["community","community-0-0-0","detail"],["community","community-1-0-0","detail"],["community","community-2-0-0","detail"],["community","community-4-0-0","detail"],["community","community-7-0-0","detail"],["community","community-0-0-0","edit"],["community","community-1-0-0","edit"],["community","community-2-0-0","edit"],["platform","platform-3-0-0","detail"],["platform","platform-4-1-0","detail"],["platform","platform-5-0-0","detail"],["platform","platform-6-0-0","detail"],["platform","platform-admission","detail"],["platform","platform-3-0-0","edit"],["platform","platform-4-1-0","edit"],["platform","platform-5-0-0","edit"],["admission","admission-subject_info-identity_info-id_doc_info-","edit"],["admission","admission-settlement_info-","edit"],["admission","admission-beneficiary","edit"],["admission","admission-materials","edit"],["consumer","consumer-stores","detail"],["consumer","consumer-recommendations","detail"],["consumer","consumer-profile","edit"],["consumer","consumer-referrals","detail"]];
const routes=[...mainRoutes.map(([role,id,label])=>({role,id,label,mode:role==='admission'?'edit':'list',kind:'主画面'})),...subRoutes.map(([role,id,mode])=>({role,id,mode,kind:'详情/编辑',label:id+' · '+mode}))];
if(routes.length!==66||mainRoutes.length!==34||subRoutes.length!==32)throw Error('ROUTE_MATRIX_INVALID');
const index=document.getElementById('route-index'),frame=document.getElementById('prototype'),info=document.getElementById('route-info'),open=document.getElementById('open-page');let selected=0;
function route(r){return '#/'+r.role+'/'+r.id+(r.id==='home'?'':'/'+r.mode)}
function select(n){selected=n;const r=routes[n],url='./index.html'+route(r);frame.src=url;open.href=url;info.textContent=String(n+1).padStart(2,'0')+'/66 · '+r.kind+' · '+r.role+' / '+r.id;[...index.querySelectorAll('a')].forEach((a,i)=>{if(i===n)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});}
routes.forEach((r,i)=>{const a=document.createElement('a');a.href='./index.html'+route(r);a.textContent=String(i+1).padStart(2,'0')+'. '+r.label;const t=document.createElement('small');t.textContent=' · '+r.role+' · '+r.kind;a.append(t);a.addEventListener('click',ev=>{ev.preventDefault();select(i)});index.append(a)});
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.maxWidth=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));frame.style.maxWidth='390px';select(0);
</script></body></html>
