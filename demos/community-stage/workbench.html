<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家工作台</title><link rel="stylesheet" href="/merchant/workbench.css"></head><body><main><header><h1>商家工作台</h1><p>使用客户中心当前账号。当前版本订单为模拟业务数据，未开放真实收款和结算。</p><a href="/merchant/join">入驻申请</a> <a href="/merchant/review">入驻审核</a></header><p id="notice" role="status">等待客户中心加载工作台权限</p><section><h2>订单</h2><div class="row"><label>状态<select id="orderStatus"><option>ALL</option><option>PENDING</option><option>SUCCESS</option><option>FAILED</option><option>CANCELLED</option><option>REFUNDED</option></select></label><button id="loadOrders">查询订单</button><button id="exportOrders">导出当前页 CSV</button></div><p id="summary"></p><div class="scroll"><table><thead><tr><th>订单号</th><th>金额（分）</th><th>币种</th><th>模拟状态</th><th>操作</th></tr></thead><tbody id="orders"></tbody></table></div><button id="moreOrders" hidden>下一页</button><p>导出只包含当前筛选页；不是财务结算凭证。</p></section><section id="orderDetails"><h2>订单详情、退款与分账</h2><form id="detailForm"><label>订单编号<input id="detailReference" pattern="[A-Za-z0-9_-]{1,64}" required></label><button>查询详情</button></form><pre id="orderDetail"></pre><h3>退款预审</h3><p>此处记录模拟退款预审，不向微信发起退款。提交结果未知时，保留相同请求编号核对，不能换编号重复提交。</p><form id="refundForm"><label>请求编号<input id="refundEvent" pattern="[A-Za-z0-9_-]{1,64}" required></label><label>退款金额（整数分）<input id="refundAmount" type="number" min="1" max="100000000" step="1" required></label><label><input id="refundConfirm" type="checkbox" required>确认仅记录退款预审</label><button>提交退款预审</button></form><pre id="refundResult"></pre><h3>分账方案计算</h3><p>以订单金额扣除原退款预审总额计算；比例合计必须为10000基点。此处不执行真实分账。</p><form id="splitForm"><label>接收方与比例，每行“接收方编号,基点”<textarea id="splitShares" placeholder="merchant,9000&#10;platform,1000" required></textarea></label><button>计算分账方案</button></form><div id="splitResult"></div></section><section><h2>门店资料</h2><button id="loadSettings">读取资料与商品</button><form id="profileForm"><label>门店名称<input id="name" maxlength="120" required></label><label>介绍<textarea id="description" maxlength="2048" required></textarea></label><label>联系方式<input id="contact" maxlength="120" required></label><label>展示状态<select id="profileStatus"><option>PAUSED</option><option>ACTIVE</option></select></label><button>保存门店资料</button></form></section><section><h2>商品管理</h2><div id="items"></div><form id="itemForm"><label>商品编号<input id="itemId" pattern="[A-Za-z0-9_-]{1,64}" required></label><label>名称<input id="itemName" maxlength="120" required></label><label>排序<input id="itemSort" type="number" step="1" value="0" required></label><label>状态<select id="itemStatus"><option>ACTIVE</option><option>HIDDEN</option></select></label><button>保存商品</button></form></section><section><h2>广告管理与审核</h2><button id="loadAds">读取广告</button><div id="ads"></div><button id="moreAds" hidden>下一页广告</button><form id="adForm"><label>广告编号<input id="adId" pattern="[A-Za-z0-9_-]{1,64}" required></label><label>标题<input id="adTitle" maxlength="160" required></label><label>目标 HTTPS 地址<input id="adUrl" type="url" required></label><label>广告位<select id="adSlot"><option value="AD_SLOT_PAYMENT_AMOUNT">金额页</option><option value="AD_SLOT_PAYMENT_SUCCESS">模拟成功页</option></select></label><label>开始时间<input id="adStart" type="datetime-local" required></label><label>结束时间<input id="adEnd" type="datetime-local" required></label><label>优先级<input id="adPriority" type="number" min="0" max="100000" value="0" required></label><button>创建广告草稿</button></form></section><section><h2>广告事件报表</h2><label>开始<input id="reportStart" type="datetime-local" required></label><label>结束<input id="reportEnd" type="datetime-local" required></label><button id="loadReport">查询</button><div id="report"></div><button id="moreReport" hidden>下一页报表</button><p>统计为已记录事件，不代表独立访客或支付收入。</p></section><section><h2>模拟对账</h2><button id="reconcile">读取对账预览</button><pre id="finance"></pre></section></main><script src="/merchant/workbench.js" defer></script></body></html>
