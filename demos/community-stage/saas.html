<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS 模块中心</title><link rel="stylesheet" href="/customer/saas.css"></head><body><main><header><h1>SaaS 模块中心</h1><p>报价与订单关联客户中心当前账号。订单准备不代表已支付或权益已开通。</p></header><p id="notice" role="status">请从客户中心打开已授权的项目</p><section><h2>模块与方案</h2><button id="catalog">读取模块</button><div id="modules"></div><div id="offers"></div></section><section><h2>报价与订单</h2><p id="selected"></p><div id="quote"></div><label>订单币种<select id="currency"><option>CNY</option><option>USD</option></select></label><button id="prepare">准备订单</button><pre id="order"></pre><button id="readOrder">刷新订单状态</button><button id="renewal">查看续费计划</button><pre id="renewalResult"></pre></section><section><h2>我的记录</h2><button id="myQuotes">报价记录</button><button id="myOrders">订单记录</button><div id="records"></div><button id="more" hidden>下一页</button></section><section id="pricing" hidden><h2>平台方案定价</h2><form id="pricingForm"><label>方案编号<input id="offerId" required pattern="[A-Za-z0-9_-]{1,64}"></label><label>版本<input id="offerVersion" type="number" min="1" step="1" value="1" required></label><button type="button" id="loadPriceVersion">读取方案，复制为新版本</button><label>模块编号<input id="moduleId" value="storefront_catalog" required></label><label>计费方式<select id="offerKind"><option>MONTHLY</option><option>YEARLY</option><option>BUYOUT</option><option>FREE</option><option>PROMOTION</option><option>METERED</option><option>CUSTOM</option></select></label><label>服务天数<input id="termDays" type="number" min="1" value="30" required></label><label>适用租户（留空为全部）<input id="tenantScope" pattern="[A-Za-z0-9_-]{1,64}"></label><label>第三方费用支付方<select id="supplierPayment"><option>NONE</option><option>PLATFORM</option><option>CUSTOMER</option></select></label><div id="priceLines"></div><button type="button" id="addPriceLine">添加费用组成</button><button>保存新版本</button></form><h3>方案批准</h3><form id="approveForm"><label>审批记录编号<input id="approvalRef" required></label><label>成本凭据编号<input id="costEvidenceRef" required></label><button>批准当前编号与版本</button></form><p id="pricingResult"></p></section><section id="fulfillment" hidden><h2>财务确认与权益开通</h2><p>使用财务服务签发的确认回执，不接受手工勾选已付款。结果未知时先查询原订单处理状态。</p><form id="fulfillmentForm"><label>SaaS订单编号<input id="fulfillmentOrder" pattern="[A-Za-z0-9_-]{1,64}" required></label><label>财务确认回执<textarea id="financeReceipt" required></textarea></label><button>核验回执并开通权益</button></form><button id="fulfillmentRequirements">读取财务核销要求</button><button id="reverseFulfillment">核验全额冲正并恢复原权益</button><button id="fulfillmentStatus">查询处理状态</button><pre id="fulfillmentResult"></pre></section></main><script src="/customer/saas.js" defer></script></body></html>
