<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专利工作台 · PC / 手机界面预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4fa;color:#142033;font:14px/1.6 sans-serif}header{padding:16px 25px;background:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0 auto 0 0}button,a,select{border:1px solid #e2e8f1;border-radius:6px;padding:8px 14px;background:white;color:#37465e;font:inherit;text-decoration:none}button.active{background:#2057d4;color:white}main{padding:25px;display:flex;justify-content:center}iframe{border:0;background:white;box-shadow:0 10px 40px #183b3520;border-radius:12px;width:1440px;max-width:100%;height:calc(100vh - 140px);min-height:600px}iframe.phone{width:390px;max-width:100%;height:780px;border:8px solid #18353d;border-radius:28px}p{margin:0;font-size:11px;color:#78877d}@media(max-width:600px){header{padding:15px;gap:8px}main{padding:15px}iframe.phone{height:760px}h1{width:100%}}</style></head><body><header><h1>专利工作台 · 界面审阅</h1><button id="pc" class="active">PC 版</button><button id="phone">手机版</button><select id="stage" aria-label="选择预览环节"><option value="overview">项目总览</option><option value="materials">素材与技术交底</option><option value="search">检索与现有技术</option><option value="compare">差异与证据</option><option value="ideas">优化方向与验证</option><option value="documents">申请文件与附图</option><option value="review">审阅与导出</option><option value="filing">递交与官方回执</option><option value="response">审查意见答复</option><option value="deadlines">授权与期限</option><option value="blueprint">完整功能梳理</option><option value="models">私有模型配置</option><option value="cnipa">国家知识产权局接口配置</option></select><a href="index.html" target="_blank">直接打开 ↗</a><p>交互与视觉审阅稿，非正式业务系统。切换尺寸不会发送任何数据。</p></header><main><iframe title="专利工作台界面预览" src="index.html#overview" id="frame"></iframe></main><script>let frame=document.getElementById('frame');document.getElementById('phone').onclick=()=>{frame.className='phone';document.getElementById('phone').className='active';document.getElementById('pc').className=''};document.getElementById('pc').onclick=()=>{frame.className='';document.getElementById('pc').className='active';document.getElementById('phone').className=''};document.getElementById('stage').onchange=e=>frame.src='index.html#'+e.target.value;</script></body></html>
