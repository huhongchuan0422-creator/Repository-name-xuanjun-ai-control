# CANDIDATE ONLY — install only after DNS/TLS/Owner gate.
server {
    listen 443 ssl;
    server_name community-preview.wenwenwenyiyiyi.work;
    ssl_certificate /etc/letsencrypt/live/community-preview.wenwenwenyiyiyi.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community-preview.wenwenwenyiyiyi.work/privkey.pem;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://unix:/run/xuanjun-community-preview/preview.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host community-preview.wenwenwenyiyiyi.work;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Xuanjun-Client-IP "";
        proxy_set_header X-Xuanjun-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }
}
