<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/community-preview/community/fixed-cashier.css"><title>门店收款</title><body data-surface="payer"><main><header><span>到店付款 / PAY</span><h1 id="storeName">门店收款</h1><p id="status" role="status" aria-live="polite">正在读取门店信息…</p></header><section id="amountSection"><form id="payForm"><label for="yuan">付款金额（元）</label><div class="money"><span>¥</span><input id="yuan" inputmode="decimal" autocomplete="off" required pattern="[0-9]+(\.[0-9]{1,2})?" placeholder="0.00"></div><button id="pay" disabled>确认金额 · 微信支付</button></form><div class="ad" id="beforeAdBox" hidden><p id="beforeAd"></p><img id="beforeAdImage" alt="门店活动" hidden></div></section><section id="resultSection" hidden><h2 id="resultState">支付结果待核验</h2><div class="ad" id="afterAdBox" hidden><p id="afterAd"></p><img id="afterAdImage" alt="支付后门店活动" hidden></div></section><button id="check" class="secondary" hidden>查询本单支付结果</button><footer>支付结果以服务端验签查单为准。请勿重复付款。</footer></main><script src="/community-preview/community/fixed-cashier.js" defer></script></body></html>
