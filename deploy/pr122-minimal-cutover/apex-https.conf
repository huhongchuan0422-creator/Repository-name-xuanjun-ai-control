# REVIEW CANDIDATE ONLY, no installer. Include inside http{} after support file.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wenwenwenyiyiyi.work;
    root /var/www/wenwenwenyiyiyi.work/current/public;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/wenwenwenyiyiyi.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenwenwenyiyiyi.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    # Suppress raw request-bearing Nginx error messages on sensitive locations.
    error_log /dev/null crit;
    access_log /var/log/nginx/pr122-minimal-status.log pr122_minimal_status;
    include /etc/nginx/pr122-minimal-cutover/apex.locations.conf;
}
