# REVIEW ONLY. Replaces ONLY Domestic bootstrap apex port80 file after TLS passes.
server {
    listen 80;
    listen [::]:80;
    server_name wenwenwenyiyiyi.work;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://wenwenwenyiyiyi.work$request_uri; }
}
