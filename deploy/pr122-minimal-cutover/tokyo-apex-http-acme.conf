# REVIEW ONLY. New apex port80 server; do not replace Tokyo HTTPS or webroot.
server {
    listen 80;
    listen [::]:80;
    server_name wenwenwenyiyiyi.work;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://47.101.152.210;
        proxy_set_header Host wenwenwenyiyiyi.work;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_redirect off;
    }
    location / { return 308 https://wenwenwenyiyiyi.work$request_uri; }
}
