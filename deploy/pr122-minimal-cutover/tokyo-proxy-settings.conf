# REVIEW CANDIDATE ONLY. Exact IP avoids DNS recursion after apex switch.
proxy_pass https://47.245.53.152;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name wenwenwenyiyiyi.work;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate __HOST_CA_BUNDLE__;
proxy_set_header Host wenwenwenyiyiyi.work;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Connection "";
# Authorization, Cookie, Origin, CSRF and Telegram secret headers pass through.
# Tokyo keeps its own nested controls and backend ownership unchanged.
proxy_pass_request_headers on;
proxy_pass_request_body on;
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_cache off;
proxy_store off;
proxy_redirect off;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
