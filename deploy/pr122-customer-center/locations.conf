location = /customer/center { return 308 /customer/center/; }
location ^~ /customer/center/ {
    proxy_pass http://unix:/run/xuanjun-customer-api/http.sock;
    proxy_set_header X-Xuanjun-Client-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Host wenwenwenyiyiyi.work;
    proxy_set_header Connection close;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 7m;
    client_body_timeout 15s;
    access_log off;
    error_log /var/log/nginx/xuanjun-customer-error.log crit;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
}
