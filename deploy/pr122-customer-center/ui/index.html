<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>客户项目中心 · 玄钧云汇</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head><body><header><a href="/">玄钧云汇</a><span>客户项目中心</span><button id="logout" hidden>退出</button></header><main><div id="notice" role="status" aria-live="polite"></div><section id="auth"><p class="eyebrow">专属空间</p><h1>让项目协作，清晰有序。</h1><p>查看项目进展，分批准备材料，保留每一次审核记录。</p><p class="muted">项目由已核实的合同关系授权。注册账号不会自动认领项目。</p><form id="login"><label>邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><button>登录</button><button type="button" id="register">注册并发送验证邮件</button><button type="button" id="reset-request">找回账号</button></form><details><summary>验证邮箱或重置密码</summary><form id="verification"><label>邮件中的一次性验证码<input name="token" autocomplete="one-time-code" required></label><label>设置您的登录密码<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>验证邮箱</button></form><form id="reset"><label>重置验证码<input name="token" autocomplete="one-time-code" required></label><label>新密码<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>重置密码</button></form></details></section><section id="workspace" hidden><h1>我的项目</h1><div id="projects" class="cards"></div><section id="project" hidden><div class="heading"><h2 id="project-title"></h2><button id="refresh">刷新</button></div><p id="overall"></p><div id="materials" class="cards"></div><section><h2>项目沟通</h2><p>普通消息不要发送密码、密钥或令牌。敏感资料使用项目材料的专用入口。</p><div id="messages"></div><form id="message"><label>消息<textarea name="body" maxlength="4000" required></textarea></label><label>渠道<select name="channel"><option value="WEB">网页归档</option><option value="TELEGRAM">Telegram</option><option value="FEISHU">飞书</option></select></label><button>发送</button></form><p class="muted">网页消息持久保存后才显示已归档。AI回答和外部渠道实际送达以真实回执为准。</p></section><section><h2>沟通渠道</h2><div id="channel-status"></div><form id="bind"><label>渠道<select name="channel"><option value="TELEGRAM">Telegram</option><option value="FEISHU">飞书</option></select></label><label>渠道账号标识<input name="subject" required></label><button>生成绑定挑战</button></form><p id="bind-help"></p><div id="pending-links"></div><button id="unlink-telegram">解绑 Telegram</button><button id="unlink-feishu">解绑飞书</button></section><section id="members"><h2>授权项目成员</h2><p>只有项目所有者可邀请和撤销。邀请绑定已验证账号，接收者还需登录确认。</p><form id="invite"><label>成员邮箱<input name="email" type="email" required></label><label>权限<select name="role"><option value="EDITOR">提交材料</option><option value="VIEWER">仅查看</option></select></label><button>生成邀请</button></form><p id="invite-result"></p><form id="revoke"><label>撤销成员标识<input name="user_id" required></label><button>撤销权限</button></form></section></section><section><h2>接受邀请</h2><form id="accept"><label>邀请验证码<input name="invitation" required></label><button>核验并加入</button></form></section></section></main><footer><p>玄钧AI实验室 · 玄钧云汇</p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">渝ICP备2026024862号</a></footer></body></html>
