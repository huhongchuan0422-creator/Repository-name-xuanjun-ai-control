# One-time reviewed include within the existing apex HTTPS server.
location = /showcase { return 308 /showcase/; }
location = /showcase/en { return 308 /showcase/en/; }
location ^~ /showcase/ {
    root /var/lib/xuanjun-showcase/current/public;
    autoindex off;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    if ($uri ~ ^(/showcase/(?:en/)?(?:cases|projects|modules|roadmap|ecosystem)(?:/[a-z][a-z0-9-]*(?:/views/[a-z][a-z0-9-]*/v[1-9][0-9]*)?)?)$) { return 308 $1/$is_args$args; }
    try_files $uri $uri/index.html =404;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_except GET HEAD { deny all; }
}
