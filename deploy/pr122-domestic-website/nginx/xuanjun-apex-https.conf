# OFFLINE CANDIDATE ONLY. Installation requires a separate root Release Gate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wenwenwenyiyiyi.work;
    root /var/www/wenwenwenyiyiyi.work/current/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wenwenwenyiyiyi.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenwenwenyiyiyi.work/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/pr122-xuanjun-apex/pr122-dynamic-hold.locations.conf;

    location = /search { try_files /search.html =404; }
    location / { try_files $uri $uri.html $uri/index.html =404; }
}
