# Dynamic routes are intentionally unavailable until their independent backend,
# identity, data, callback and rollback contracts pass review.
location = /integrations/douyin/oauth/callback { default_type application/json; return 503 '{"status":"UNKNOWN","reason":"BACKEND_NOT_VALIDATED"}'; }
location = /integrations/tiktok/oauth/start { default_type application/json; return 503 '{"status":"UNKNOWN","reason":"BACKEND_NOT_VALIDATED"}'; }
location = /integrations/tiktok/oauth/callback { default_type application/json; return 503 '{"status":"UNKNOWN","reason":"BACKEND_NOT_VALIDATED"}'; }
location = /integrations/tiktok/status { default_type application/json; return 503 '{"status":"UNKNOWN","reason":"BACKEND_NOT_VALIDATED"}'; }
location = /integrations/tiktok/disconnect { default_type application/json; return 503 '{"status":"UNKNOWN","reason":"BACKEND_NOT_VALIDATED"}'; }

location ^~ /p/ { return 404; }
location ^~ /submit/ { return 404; }
location = /healthz { return 404; }
location = /telegram-canary/status { return 404; }
location ^~ /telegram-webhook/ { return 404; }
