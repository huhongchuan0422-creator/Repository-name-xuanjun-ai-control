# OFFLINE CANDIDATE ONLY. Tokyo remains the authoritative apex endpoint.
# A separate Tokyo root Release Gate must install this exact isolated location.
# It forwards only ACME HTTP-01 challenge objects to Domestic; all other Tokyo
# routes remain byte-for-byte unchanged.
location ^~ /.well-known/acme-challenge/ {
    proxy_pass http://47.101.152.210/.well-known/acme-challenge/;
    proxy_set_header Host wenwenwenyiyiyi.work;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
}
