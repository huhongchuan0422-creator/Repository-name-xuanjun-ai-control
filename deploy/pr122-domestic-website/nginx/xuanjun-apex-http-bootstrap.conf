# OFFLINE CANDIDATE ONLY. Installation requires a separate root Release Gate.
# Exact server_name avoids changing the existing winctl/IP server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name wenwenwenyiyiyi.work;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
