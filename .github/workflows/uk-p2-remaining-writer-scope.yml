name: P2 UK remaining writer scope readonly
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - evidence/p2-install-preparation-20261013/inspect_remaining_writer_scope.py
      - .github/workflows/uk-p2-remaining-writer-scope.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/inspect_remaining_writer_scope.py
