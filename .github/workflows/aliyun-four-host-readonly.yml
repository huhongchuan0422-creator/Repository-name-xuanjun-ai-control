name: Alibaba Cloud four-host read-only check
on:
  push:
    branches: [repair/korea-openclaw-20261030-readonly]
    paths: [".github/workflows/aliyun-four-host-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aliyun-four-host-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' && github.ref == 'refs/heads/repair/korea-openclaw-20261030-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Verify four fixed hosts through STS and SWAS
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Four-host read-only SWAS probe. No command input or automatic dispatch retry."""
          import base64
          import concurrent.futures
          import datetime
          import hashlib
          import hmac
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from pathlib import Path
          
          UK = 'acs:ram::1107191612880779:role/xuanjun-ai-esc'
          KR = 'acs:ram::1691189778575891:role/xuanjun-automation'
          CN = 'acs:ram::1384884686754410:role/xuanjun-automation'
          HOSTS = (
              ('korea', KR, 'ap-northeast-2', '09207081a09a466aa0079b07b5e3e7ca', 'iZmj7a5kwr75qc1tul4kf9Z'),
          )
          
          
          class Hold(Exception):
              pass
          
          
          def safe(value):
              return value if isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9_.:-]{1,180}', value) else 'DETAIL_WITHHELD'
          
          
          def quote(value):
              return urllib.parse.quote(str(value), safe='~')
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def rpc(endpoint, version, action, credentials, **params):
              # Endpoint and action are fixed by this program, never accepted from a task.
              if endpoint not in {'sts.aliyuncs.com'} | {'swas.' + h[2] + '.aliyuncs.com' for h in HOSTS}:
                  raise Hold('ENDPOINT_REJECTED')
              key, secret, token = credentials
              values = dict(params, Action=action, Version=version, Format='JSON',
                            AccessKeyId=key, SignatureMethod='HMAC-SHA1', SignatureVersion='1.0',
                            SignatureNonce=uuid.uuid4().hex,
                            Timestamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              if token:
                  values['SecurityToken'] = token
              canonical = '&'.join(quote(k) + '=' + quote(v) for k, v in sorted(values.items()))
              signature = hmac.new((secret + '&').encode(), ('POST&%2F&' + quote(canonical)).encode(), hashlib.sha1).digest()
              values['Signature'] = base64.b64encode(signature).decode()
              request = urllib.request.Request('https://' + endpoint + '/',
                  data=urllib.parse.urlencode(values).encode(),
                  headers={'Content-Type': 'application/x-www-form-urlencoded'}, method='POST')
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                      raw = response.read(262145)
              except urllib.error.HTTPError as error:
                  try:
                      data = json.loads(error.read(262145))
                      code = safe(data.get('Code'))
                  except Exception:
                      code = 'HTTP_' + str(error.code)
                  raise Hold(code) from None
              except Exception:
                  # Never print a URL/body, key, temporary token, or raw exception.
                  raise Hold('TRANSPORT_RESULT_UNKNOWN') from None
              if len(raw) > 262144:
                  raise Hold('RESPONSE_TOO_LARGE')
              try:
                  data = json.loads(raw)
              except Exception:
                  raise Hold('INVALID_API_RESPONSE') from None
              if not isinstance(data, dict):
                  raise Hold('INVALID_API_RESPONSE')
              if 'Code' in data:
                  raise Hold(safe(data['Code']))
              return data
          
          
          def command(hostname, nonce):
              import shlex
              code = "import os,sys,json,hashlib,subprocess,tempfile\nif os.uname().nodename!='iZmj7a5kwr75qc1tul4kf9Z' or os.geteuid()!=0:raise SystemExit(42)\npid='1022939';pre='/proc/'+pid+'/root';base=pre+'/home/admin/.openclaw/extensions/openclaw-lark/src'\nhelper=\"\\\"use strict\\\";\\nconst fs = require(\\\"node:fs\\\"), path = require(\\\"node:path\\\"), os = require(\\\"node:os\\\"), crypto = require(\\\"node:crypto\\\");\\nconst pending = new Map();\\nconst root = process.env.XUANJUN_RECEIPT_TEST_DIR || path.join(os.homedir(), \\\".openclaw/state/work-notification-receipts\\\");\\nfunction key(p) { return crypto.createHash(\\\"sha256\\\").update(p.accountId + \\\":\\\" + p.messageId).digest(\\\"hex\\\"); }\\nfunction record(s, phase) {\\n  try {\\n    fs.mkdirSync(root, {recursive:true, mode:0o700});\\n    const dest = path.join(root, s.key + \\\".json\\\");\\n    const data = {schema:1, phase, updatedAt:new Date().toISOString(), emergency:s.emergency, tradingExecutedByReceipt:false};\\n    fs.appendFileSync(dest + \\\".jsonl\\\", JSON.stringify(data) + \\\"\\\\n\\\", {mode:0o600});\\n    fs.writeFileSync(dest + \\\".tmp\\\", JSON.stringify(data), {mode:0o600});\\n    fs.renameSync(dest + \\\".tmp\\\", dest);\\n  } catch (_) { console.error(\\\"WORK_RECEIPT_PERSIST_FAILED\\\"); }\\n}\\nfunction notify(s, phase, text) {\\n  if (s.phases.has(phase)) return;\\n  s.phases.add(phase); record(s, phase + \\\"_INTENT\\\");\\n  // A timeout is UNKNOWN; it never causes another send or any business retry.\\n  let timer;\\n  const attempt = Promise.resolve().then(() => s.send(text));\\n  const deadline = new Promise((_, reject) => { timer=setTimeout(() => reject(new Error(\\\"UNKNOWN\\\")),5000); timer.unref?.(); });\\n  Promise.race([attempt, deadline]).then(\\n    () => { clearTimeout(timer); record(s, phase + \\\"_ACCEPTED\\\"); console.info(\\\"WORK_RECEIPT_\\\" + phase + \\\"_ACCEPTED\\\"); },\\n    () => { clearTimeout(timer); record(s, phase + \\\"_UNKNOWN_NO_RETRY\\\"); console.error(\\\"WORK_RECEIPT_\\\" + phase + \\\"_UNKNOWN_NO_RETRY\\\"); }\\n  );\\n}\\nfunction begin(p) {\\n  const k=key(p);\\n  if (pending.has(k) || fs.existsSync(path.join(root,k+\\\".json\\\"))) return;\\n  const s={key:k, phases:new Set(), emergency:/紧急|平仓|close[ _-]*all|emergency/i.test(p.content || \\\"\\\"), send:p.send};\\n  pending.set(k,s);\\n  notify(s,\\\"ACK\\\",s.emergency\\n    ? \\\"已收到紧急指令。此消息仅确认接收，不代表平仓已执行；执行结果将单独回报。请勿重复发送同一平仓指令。\\\"\\n    : \\\"已收到，正在处理；若等待超时或处理异常，会单独回报状态。\\\");\\n  s.timer=setTimeout(() => notify(s,\\\"PENDING\\\",s.emergency\\n    ? \\\"紧急指令处理已超过30秒，实际执行结果仍待核实。未确认的结果保持UNKNOWN，不自动重试平仓。\\\"\\n    : \\\"处理已超过30秒，任务尚未返回最终结果；不会静默结束。\\\"),30000);\\n  s.timer.unref?.();\\n}\\nfunction finish(p, outcome) {\\n  const k=key(p),s=pending.get(k);\\n  if (!s) return;\\n  clearTimeout(s.timer);\\n  if (outcome===\\\"FAILED\\\" || outcome===\\\"NO_REPLY\\\") notify(s,\\\"FAILURE\\\",s.emergency\\n    ? \\\"本次紧急指令的AI处理异常或未产生有效回复。实际交易结果UNKNOWN，未因本回执触发任何平仓或重试，需核对原订单记录。\\\"\\n    : \\\"本次AI处理异常或未产生有效回复；任务未按成功交付，请检查异常记录。\\\");\\n  record(s,outcome);\\n  pending.delete(k);\\n}\\nmodule.exports={begin,finish};\\n\"\ntest=\"const vm=require('node:vm'),assert=require('node:assert/strict'),real=require;const files=new Map(),timers=[];let calls=[];\\nconst fs={mkdirSync(){},existsSync:p=>files.has(p),writeFileSync:(p,s)=>files.set(p,s),appendFileSync:(p,s)=>files.set(p,(files.get(p)||'')+s),renameSync:(a,b)=>{files.set(b,files.get(a));files.delete(a);}};\\nconst context={module:{exports:{}},exports:{},process:{env:{XUANJUN_RECEIPT_TEST_DIR:'/fixture'}},console:{info(){},error(){}},setTimeout:(f,ms)=>{const t={f,ms,cancelled:false,unref(){}};timers.push(t);return t;},clearTimeout:t=>{if(t)t.cancelled=true;},require:n=>n==='node:fs'?fs:real(n),Promise,Set,Map,Date};\\nvm.runInNewContext(SOURCE,context);const r=context.module.exports;\\nconst tick=async()=>{for(let i=0;i<8;i++)await Promise.resolve();};\\n(async()=>{const p={accountId:'a',messageId:'m',content:'紧急平仓所有仓位',send:async text=>{calls.push(text);return {messageId:'fixture'};}};\\nr.begin(p);r.begin(p);await tick();assert.equal(calls.length,1);assert.match(calls[0],/不代表平仓已执行/);\\nconst timeout=timers.find(t=>t.ms===30000);timeout.f();await tick();assert.equal(calls.length,2);\\nr.finish(p,'NO_REPLY');await tick();assert.equal(calls.length,3);assert.match(calls[2],/UNKNOWN/);\\nr.begin(p);await tick();assert.equal(calls.length,3);\\nconst q={...p,messageId:'m2',send:async()=>{calls.push('failure');throw Error('fixture');}};r.begin(q);await tick();assert.equal(calls.length,4);\\nr.finish(q,'COMPLETE');const qt=timers.filter(t=>t.ms===30000).at(-1);assert.equal(qt.cancelled,true);\\nassert.equal([...files.values()].some(s=>s.includes('UNKNOWN_NO_RETRY')),true);\\nconsole.log('RECEIPT_FIXTURE_7_PASS_NO_NETWORK_NO_TRADING');\\n})().catch(()=>{console.error('RECEIPT_FIXTURE_FAIL');process.exitCode=1;});\".replace('SOURCE',json.dumps(helper),1)\ndef digest(s):return hashlib.sha256(s.encode()).hexdigest()\npins={'messaging/inbound/handler.js':'1fa9aeeb5eea22be2ec68593876a617d83b89f09318caaebe8f89320030ff192','messaging/inbound/dispatch.js':'39924d577ddbb5822afed77576c21aadaa09d940e57447e6c4345acd45259479','channel/event-handlers.js':'d564f1e38122709992b0c47eb596cf867bd7a7c62ca591506793d3408b3cd0db'}\nsources={}\nfor rel,pin in pins.items():\n    s=open(base+'/'+rel).read()\n    if digest(s)!=pin:raise SystemExit(43)\n    sources[rel]=s\nhandler=sources['messaging/inbound/handler.js']\nanchor='    // 4. Enrich (lightweight): sender name + permission error tracking'\nbranch=\"\"\"    // WORK_NOTIFICATION_RECEIPT_V1: same access gate, before serial agent work.\n    if (params.receiptOnly) {\n        if (forceMention || ctx.senderIsBot || event.message?.message_type !== 'text') return;\n        const receiptGate = await (0, gate_1.checkMessageGate)({ ctx, accountFeishuCfg, account, accountScopedCfg, log });\n        if (!receiptGate.allowed) return;\n        require('../../work-notification-receipt.js').begin({\n            accountId: account.accountId, messageId: ctx.messageId, content: ctx.content,\n            send: (text) => (0, send_1.sendMessageFeishu)({\n                cfg: accountScopedCfg, to: ctx.chatId, text, accountId: account.accountId,\n                replyToMessageId: ctx.messageId,\n                replyInThread: Boolean(ctx.threadId) && account.config?.replyInThread === true,\n                threadId: ctx.threadId,\n            }),\n        });\n        return;\n    }\n\"\"\"\nassert handler.count(anchor)==1\nhandler=handler.replace(anchor,branch+anchor,1)\nanchor='        error(`feishu[${account.accountId}]: failed to dispatch message: ${String(err)}`);'\nassert handler.count(anchor)==1\nhandler=handler.replace(anchor,\"        require('../../work-notification-receipt.js').finish({accountId:account.accountId,messageId:ctx.messageId}, 'FAILED');\\n\"+anchor,1)\ndispatch=sources['messaging/inbound/dispatch.js'];anchor='        markFullyComplete();'\nassert dispatch.count(anchor)==1\ndispatch=dispatch.replace(anchor,\"        require('../../work-notification-receipt.js').finish({accountId:dc.account.accountId,messageId:dc.ctx.messageId}, (!queuedFinal && counts.final === 0) ? 'NO_REPLY' : 'COMPLETE');\\n\"+anchor,1)\nevent=sources['channel/event-handlers.js'];anchor='        // ---- Abort fast-path ----'\nassert event.count(anchor)==1\nevent=event.replace(anchor,\"        await (0, handler_1.handleFeishuMessage)({cfg:ctx.cfg,event,botOpenId:ctx.lark.botOpenId,runtime:ctx.runtime,accountId,receiptOnly:true});\\n\"+anchor,1)\nanchor='                    error(`feishu[${accountId}]: error handling message: ${String(err)}`);'\nassert event.count(anchor)==1\nevent=event.replace(anchor,anchor+\"\\n                    require('../work-notification-receipt.js').finish({accountId,messageId:msgId}, 'FAILED');\",1)\nanchor='            },\\n        });\\n        log(`feishu[${accountId}]: message'\nassert event.count(anchor)==1\nevent=event.replace(anchor,\"                finally { require('../work-notification-receipt.js').finish({accountId,messageId:msgId}, 'COMPLETE'); }\\n\"+anchor,1)\ncandidates={'messaging/inbound/handler.js':handler,'messaging/inbound/dispatch.js':dispatch,'channel/event-handlers.js':event,'work-notification-receipt.js':helper}\ntmp=tempfile.mkdtemp(prefix='work-openclaw-notify-check-',dir=pre+'/tmp');inside=tmp[len(pre):]\nnode='/opt/node-v24.16.0-linux-x64/bin/node'\ndef node_run(args):\n    p=subprocess.run(['nsenter','--target',pid,'--mount','--root','--wd=/','--',node]+args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=25)\n    return p.returncode,p.stdout.decode('utf8','replace'),p.stderr.decode('utf8','replace')\nchecks=[]\nfor i,(rel,s) in enumerate(candidates.items()):\n    p=tmp+'/'+str(i)+'.js';open(p,'w').write(s)\n    rc,out,err=node_run(['--check',inside+'/'+str(i)+'.js']);checks.append({'file':rel,'syntax_exit':rc})\n    if rc:raise SystemExit(44)\nopen(tmp+'/test.js','w').write(test)\nrc,out,err=node_run([inside+'/test.js'])\nif rc or 'RECEIPT_FIXTURE_7_PASS' not in out:raise SystemExit(45)\nd={'candidate_only':True,'syntax_checks':checks,'receipt_fixture':out.strip(),'candidate_sha256':{k:digest(v) for k,v in candidates.items()},'candidate_dir':inside}\nfor p in ['/home/admin/.openclaw/gateway-supervisor-restart-handoff.json']:\n    try:\n        obj=json.load(open(pre+p));d['restart_handoff_keys']=list(obj)\n        d['restart_handoff_state']={k:v for k,v in obj.items() if isinstance(v,(bool,int)) or k in ['status','phase','reason']}\n    except Exception:pass\nprint(json.dumps({'hostname':os.uname().nodename,'uid':0,'python':list(sys.version_info[:3]),'nonce':NONCE,'diagnostic':d}))\n".replace('NONCE', repr(nonce))
              return '#!/bin/sh\nset -eu\nPYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B -c ' + shlex.quote(code) + '\n'
          
          
          def validate_output(output, expected, nonce):
              if not isinstance(output, str) or len(output) > 32768:
                  raise Hold('OUTPUT_REJECTED')
              try:
                  data = json.loads(output.strip())
              except Exception:
                  # Some legacy service responses use base64 despite current plaintext docs.
                  try:
                      data = json.loads(base64.b64decode(output.strip(), validate=True))
                  except Exception:
                      raise Hold('OUTPUT_NOT_PROBE_JSON') from None
              if not isinstance(data, dict) or set(data) != {'hostname', 'uid', 'python', 'nonce', 'diagnostic'}:
                  raise Hold('PROBE_SCHEMA_MISMATCH')
              if data['hostname'] != expected or type(data['uid']) is not int or data['uid'] != 0 or data['nonce'] != nonce:
                  raise Hold('HOST_ROOT_OR_NONCE_MISMATCH')
              version = data['python']
              if not isinstance(version, list) or len(version) != 3 or any(type(v) is not int or v < 0 or v > 100 for v in version):
                  raise Hold('PYTHON_VERSION_INVALID')
              return {'hostname': expected, 'uid': 0, 'python': version, 'diagnostic': data['diagnostic']}
          
          
          def probe(host, master):
              name, role, region, instance, expected = host
              row = {'host': name, 'instance_id': instance, 'region': region,
                     'status': 'HOLD', 'stage': 'ASSUME_ROLE', 'production_service_actions': 0}
              try:
                  result = rpc('sts.aliyuncs.com', '2015-04-01', 'AssumeRole', master,
                               RoleArn=role, RoleSessionName='xuanjun-check-' + uuid.uuid4().hex[:16], DurationSeconds=900)
                  c = result['Credentials']
                  credentials = (c['AccessKeyId'], c['AccessKeySecret'], c['SecurityToken'])
                  for value in credentials:
                      if not isinstance(value, str) or not value or '\n' in value or '\r' in value:
                          raise Hold('CREDENTIAL_RESPONSE_INVALID')
                      print('::add-mask::' + value, flush=True)
                  endpoint = 'swas.' + region + '.aliyuncs.com'
                  nonce = uuid.uuid4().hex
                  row['stage'] = 'DISPATCH_ONCE'
                  result = rpc(endpoint, '2020-06-01', 'RunCommand', credentials,
                               CommandContent=command(expected, nonce), RegionId=region,
                               Type='RunShellScript', InstanceId=instance, WorkingUser='root',
                               WorkingDir='/root', Timeout=180, Name='xuanjun-korea-openclaw-readonly-20261030')
                  invoke = result.get('InvokeId')
                  if not isinstance(invoke, str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,180}', invoke):
                      raise Hold('DISPATCH_RESULT_UNKNOWN_NO_RETRY')
                  row['invoke_id'] = invoke
                  row['stage'] = 'QUERY_RESULT'
                  print(json.dumps({'host': name, 'invoke_id': invoke, 'status': 'DISPATCHED'}), flush=True)
                  deadline = time.monotonic() + 180
                  while time.monotonic() < deadline:
                      result = rpc(endpoint, '2020-06-01', 'DescribeInvocationResult', credentials,
                                   RegionId=region, InstanceId=instance, InvokeId=invoke)
                      detail = result.get('InvocationResult', {})
                      status = detail.get('InvocationStatus')
                      if status in ('Pending', 'Running', 'Stopping'):
                          time.sleep(5)
                          continue
                      row['invocation_status'] = safe(status)
                      if status != 'Success' or detail.get('ExitCode') != 0:
                          row['api_error_code'] = safe(detail.get('ErrorCode'))
                          raise Hold('COMMAND_NOT_SUCCESS')
                      if detail.get('InstanceId') != instance or detail.get('InvokeId') != invoke:
                          raise Hold('INVOCATION_IDENTITY_MISMATCH')
                      row.update(validate_output(detail.get('Output'), expected, nonce))
                      row.update(status='PASS', stage='VERIFIED')
                      return row
                  raise Hold('REMOTE_RESULT_UNKNOWN_PRESERVE_NO_RETRY')
              except Hold as error:
                  row['error_code'] = safe(str(error))
              except Exception:
                  row['error_code'] = 'UNEXPECTED_RESPONSE_PRESERVE_NO_RETRY'
              return row
          
          
          def main():
              master = (os.environ.get('ALIYUN_ACCESS_KEY_ID', ''), os.environ.get('ALIYUN_ACCESS_KEY_SECRET', ''), '')
              if not all(master[:2]):
                  print('HOLD=MISSING_GITHUB_SECRETS')
                  return 2
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  rows = list(pool.map(lambda host: probe(host, master), HOSTS))
              receipt = {'schema': 1, 'status': 'PASS' if all(r['status'] == 'PASS' for r in rows) else 'HOLD',
                         'scope': 'KOREA_OPENCLAW_READONLY_NO_TRADING', 'hosts': rows,
                         'production_service_actions': 0, 'deployment_performed': False}
              encoded = json.dumps(receipt, indent=2, sort_keys=True)
              print(encoded, flush=True)
              Path('aliyun-four-host-receipt.json').write_text(encoded + '\n')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a') as out:
                      out.write('### Four-host Alibaba Cloud check\n```json\n' + encoded + '\n```\n')
              return 0 if receipt['status'] == 'PASS' else 2
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PY
