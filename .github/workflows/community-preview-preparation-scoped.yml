name: Community preview preparation scoped gate
on:
  push:
    branches:
      - feature/chatgpt-community-wechat-sp-offline-20261017
    paths:
      - deploy/community-preview/prepare-mini.cjs
      - tests/preview_preparation_test.py
      - .github/workflows/community-preview-preparation-scoped.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-zip-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract actual source ZIP into empty directory and prepare
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -p preview_preparation_test.py -v 2>&1 | tee preview-preparation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-preparation-evidence
          path: preview-preparation.log
