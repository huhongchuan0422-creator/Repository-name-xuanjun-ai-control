name: PR122 custody evidence offline validation
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - scripts/pr122_owner_custody_envelope.py
      - tests/test_pr122_owner_custody_envelope.py
      - .github/workflows/pr122-custody-envelope.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography==44.0.3
      - name: Run signature and denial tests without server access
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_owner_custody_envelope -v 2>&1 | tee TESTS.log
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-custody-envelope-${{ github.sha }}
          path: |
            scripts/pr122_owner_custody_envelope.py
            tests/test_pr122_owner_custody_envelope.py
            TESTS.log
          if-no-files-found: error
