name: PR122 customer target metadata only
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-customer-readiness-metadata.yml]
permissions:
  contents: read
concurrency:
  group: pr122-domestic-readonly
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 2
    steps:
      - name: Fixed unprivileged OS and runtime metadata no checkout no sudo
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import importlib.util,json,os,platform,pwd,grp,shutil,signal,stat,subprocess,time
          from pathlib import Path
          signal.alarm(40)
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          data={'production_mutations':0,'root_called':False,'python':platform.python_version(),'machine':platform.machine(),'libc':platform.libc_ver()}
          allowed={'ID','ID_LIKE','VERSION_ID','PRETTY_NAME'};values={}
          for line in Path('/etc/os-release').read_text().splitlines():
              key,sep,value=line.partition('=')
              if sep and key in allowed:values[key]=value.strip('"')
          data['os']=values
          data['tools']={k:shutil.which(k) for k in ('rpm','dnf','yum','apt-get','dpkg-query','clamdscan','clamscan')}
          data['venv_module']=importlib.util.find_spec('venv') is not None
          used_uids={p.pw_uid for p in pwd.getpwall()};used_gids={g.gr_gid for g in grp.getgrall()}
          data['available_candidate_uid_gid']=next((n for n in range(62622,62650) if n not in used_uids and n not in used_gids),None)
          data['observed_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          data['probe_commit']=os.environ['GITHUB_SHA']
          try:
              account=pwd.getpwnam('xuanjun-customer')
              data['customer_account']={'state':'PRESENT','uid':account.pw_uid,'gid':account.pw_gid,'shell':account.pw_shell}
          except KeyError:data['customer_account']={'state':'ABSENT'}
          data['fixed_objects']={}
          for name in ('/etc/xuanjun-customer-center','/etc/xuanjun-customer-center/config.json','/etc/xuanjun-customer-center/runtime.json','/etc/xuanjun-customer-center/INDEPENDENT_REVIEW_TRUST.json','/etc/xuanjun-customer-center/TARGET_ACCEPTANCE.json','/etc/xuanjun-customer-center/publisher.json','/usr/local/lib/xuanjun-customer-runtime/venv/bin/python','/usr/local/lib/xuanjun-customer-center','/run/xuanjun-customer-api/http.sock','/var/lib/xuanjun-customer-channel/grant-state.json'):
              try:
                  info=os.lstat(name)
                  data['fixed_objects'][name]={'state':'PRESENT_METADATA_ONLY','uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode)),'symlink':stat.S_ISLNK(info.st_mode)}
              except FileNotFoundError:data['fixed_objects'][name]={'state':'ABSENT'}
              except PermissionError:data['fixed_objects'][name]={'state':'UNREADABLE_NOT_ABSENT'}
          try:data['website_current']=os.readlink('/var/www/wenwenwenyiyiyi.work/current')
          except OSError:data['website_current']='UNKNOWN'
          data['private_contents_read']=False
          data['root_state_verified']=False
          data['package_versions']={}
          if data['tools']['rpm']:
              for name in ('python3','python3-pip','clamav','clamav-server','clamd'):
                  r=subprocess.run([data['tools']['rpm'],'-q','--qf','%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n',name],capture_output=True,text=True,timeout=5)
                  data['package_versions'][name]=r.stdout.strip() if r.returncode==0 else 'NOT_INSTALLED_OR_UNKNOWN'
          print('CUSTOMER_READINESS_METADATA='+json.dumps(data,sort_keys=True))
          PY
