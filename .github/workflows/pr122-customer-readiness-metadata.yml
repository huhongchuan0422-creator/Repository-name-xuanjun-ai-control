name: PR122 approved one-shot runtime metadata
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-customer-readiness-metadata.yml]
permissions:
  contents: read
concurrency:
  group: pr122-domestic-readonly
  cancel-in-progress: false
jobs:
  metadata:
    if: >-
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.event_name == 'push' &&
      github.event.forced == false &&
      github.event.deleted == false &&
      github.event.head_commit.id == github.sha &&
      github.ref == 'refs/heads/feature/work-pr122-site-hub-integration-20261016' &&
      github.event.before == 'b882ea631e6391f1fc8727766ccbaf3c66b519da' &&
      github.event.head_commit.message == 'PR122 metadata inventory approval 6230479636 one-shot' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 2
    steps:
      - name: Exact approved collector nonroot temporary files only
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
          /usr/bin/python3 -I -B - <<'PY'
          import base64,hashlib,json,os,subprocess,sys,tempfile
          from pathlib import Path
          assert os.uname().nodename == 'iZvt5t8tlrm8oiZ'
          assert os.getuid() == os.geteuid() == 1002
          assert sys.executable == '/usr/bin/python3' and sys.version_info[:2] == (3,11)
          assert sys.flags.isolated and sys.dont_write_bytecode
          raw=base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == '1f8b8c7c623dd59cf99dba2acfcab5709e2f19f7c2465e6b7739eac3cce92833'
          with tempfile.TemporaryDirectory(prefix='pr122-metadata-6230479636-',dir=os.environ['RUNNER_TEMP']) as folder:
              target=Path(folder)/'collector.py'
              target.write_bytes(raw)
              print('APPROVAL=6230479636; COLLECTOR_SHA256=1f8b8c7c623dd59cf99dba2acfcab5709e2f19f7c2465e6b7739eac3cce92833; ROOT_CALLED=false',flush=True)
              print(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'approval_request':'6230479636'},sort_keys=True),flush=True)
              result=subprocess.run(['/usr/bin/python3','-I','-B',str(target)],check=False,timeout=40)
              raise SystemExit(result.returncode)
          PY
