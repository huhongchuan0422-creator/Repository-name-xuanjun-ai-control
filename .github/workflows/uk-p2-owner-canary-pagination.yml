name: P2 UK existing Owner Canary paginated readback
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - evidence/p2-install-preparation-20261013/owner_canary_paginated_readback.py
      - .github/workflows/uk-p2-owner-canary-pagination.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bounded existing Canary readback without message sends or production changes
        env:
          P2_CANARY_RUN: "${{ github.run_id }}"
        run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/owner_canary_paginated_readback.py "$P2_CANARY_RUN"
