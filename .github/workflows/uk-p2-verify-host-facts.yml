name: P2 UK verify-only host facts
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - scripts/uk-p2-verify-host-facts.py
      - .github/workflows/uk-p2-verify-host-facts.yml
permissions:
  contents: read
concurrency:
  group: p2-uk-verify-host-facts
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Zero-model read-only UK facts under the Gateway owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/python3 -I -B - < scripts/uk-p2-verify-host-facts.py
