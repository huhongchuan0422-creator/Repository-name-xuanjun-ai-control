name: P2 pinned gh prerequisite preparation only
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - .github/workflows/p2-gh-prerequisite-prepare.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download pinned official gh release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 /tmp/p2-gh-prerequisite
          curl --proto '=https' --tlsv1.2 -fL --max-time 90 https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz -o /tmp/p2-gh.tar.gz
          curl --proto '=https' --tlsv1.2 -fL --max-time 90 https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_checksums.txt -o /tmp/p2-gh-checksums.txt
          curl --proto '=https' --tlsv1.2 -fL --max-time 30 https://raw.githubusercontent.com/cli/cli/v2.102.0/LICENSE -o /tmp/p2-gh-prerequisite/LICENSE
      - name: Verify both official digests and extract only fixed ELF binary
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,pathlib,struct,tarfile
          out=pathlib.Path('/tmp/p2-gh-prerequisite')
          archive=pathlib.Path('/tmp/p2-gh.tar.gz').read_bytes()
          checksums=pathlib.Path('/tmp/p2-gh-checksums.txt').read_bytes()
          expected='bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386'
          assert hashlib.sha256(archive).hexdigest()==expected
          assert hashlib.sha256(checksums).hexdigest()=='afe49e9affa232faa8212aed035417166f6ade9b9470acb53d4dbd28c0504e8d'
          matches=[line.split() for line in checksums.decode('ascii').splitlines() if line.split() and line.split()[-1]=='gh_2.102.0_linux_amd64.tar.gz']
          assert len(matches)==1 and matches[0][0]==expected
          assert hashlib.sha256((out/'LICENSE').read_bytes()).hexdigest()=='6da4adc42392c8485e40b4251c7e332fc3352df1947c9ffade71dd60b14a7a4f'
          with tarfile.open('/tmp/p2-gh.tar.gz','r:gz') as tf:
              members=[m for m in tf.getmembers() if m.name=='gh_2.102.0_linux_amd64/bin/gh']
              assert len(members)==1 and members[0].isfile() and 0<members[0].size<128*1024*1024
              data=tf.extractfile(members[0]).read(128*1024*1024+1)
          assert len(data)==members[0].size
          assert data[:6]==b'\x7fELF\x02\x01' and struct.unpack('<H',data[18:20])[0]==62
          binary=out/'gh';binary.write_bytes(data);binary.chmod(0o555)
          receipt={'schema':1,'state':'GH_STAGED_NOT_INSTALLED','version':'2.102.0',
              'source':'https://github.com/cli/cli/releases/tag/v2.102.0',
              'archive_sha256':expected,'binary_sha256':hashlib.sha256(data).hexdigest(),
              'license_sha256':hashlib.sha256((out/'LICENSE').read_bytes()).hexdigest(),
              'target_after_review':'/opt/xuanjun-runtime/gh/gh','model_calls':0,
              'uk_compatibility':'NOT_RUN','install_performed':False}
          (out/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Offline exact version probe only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 /tmp/p2-gh-probe-home
          env HOME=/tmp/p2-gh-probe-home PATH=/usr/bin:/bin GH_NO_UPDATE_NOTIFIER=1 GH_NO_EXTENSION_UPDATE_NOTIFIER=1 GH_PROMPT_DISABLED=1 /tmp/p2-gh-prerequisite/gh --version > /tmp/p2-gh-prerequisite/version.txt
          test "$(head -n 1 /tmp/p2-gh-prerequisite/version.txt | cut -d ' ' -f 1-3)" = 'gh version 2.102.0'
          echo GH_HOSTED_VERSION_PROBE=PASS
          echo GH_UK_COMPATIBILITY=NOT_RUN
          echo INSTALL_PERFORMED=NO
          echo MODEL_CALLS=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-gh-2.102.0-preparation
          path: /tmp/p2-gh-prerequisite/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  uk-compatibility:
    needs: prepare
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 5
    steps:
      - name: Verify pinned official binary offline in disposable UK directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          TASK_DIR="$(mktemp -d /tmp/p2-gh-compat.XXXXXXXX)"
          trap 'rm -rf -- "$TASK_DIR"' EXIT
          export TASK_DIR
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,io,os,struct,subprocess,tarfile,urllib.request
          root=os.environ['TASK_DIR']
          raw=urllib.request.urlopen('https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz',timeout=45).read(32*1024*1024+1)
          assert hashlib.sha256(raw).hexdigest()=='bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              members=[m for m in tf.getmembers() if m.name=='gh_2.102.0_linux_amd64/bin/gh']
              assert len(members)==1 and members[0].isfile() and 0<members[0].size<128*1024*1024
              binary=tf.extractfile(members[0]).read(128*1024*1024+1)
          assert len(binary)==members[0].size
          assert hashlib.sha256(binary).hexdigest()=='7469124f706944133d6a169691dd1c6c3511b12e85878d255e044e2948df4c9b'
          assert binary[:6]==b'\x7fELF\x02\x01' and struct.unpack('<H',binary[18:20])[0]==62
          path=root+'/gh'
          with open(path,'xb') as fh: fh.write(binary)
          os.chmod(path,0o500)
          os.mkdir(root+'/home',0o700)
          env={'HOME':root+'/home','PATH':'/usr/bin:/bin','GH_NO_UPDATE_NOTIFIER':'1','GH_NO_EXTENSION_UPDATE_NOTIFIER':'1','GH_PROMPT_DISABLED':'1','LANG':'C'}
          result=subprocess.check_output([path,'--version'],env=env,timeout=10).decode('utf-8')
          assert result.splitlines()[0].split()[:3]==['gh','version','2.102.0']
          print('GH_UK_EXACT_BINARY_SHA256=7469124f706944133d6a169691dd1c6c3511b12e85878d255e044e2948df4c9b')
          print('GH_UK_COMPATIBILITY=PASS')
          print('INSTALL_PERFORMED=NO')
          print('MODEL_CALLS=0')
          PY
