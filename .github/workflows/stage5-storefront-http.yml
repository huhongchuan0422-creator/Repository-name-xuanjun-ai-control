name: Stage5 Storefront HTTP Integration
on:
  pull_request:
    paths:
      - 'scripts/community_demo_api.py'
      - 'scripts/community_storefront_snapshot.py'
      - 'scripts/community_ad_store.py'
      - 'scripts/community_merchant_store.py'
      - 'tests/test_stage5_storefront_http.py'
      - '.github/workflows/stage5-storefront-http.yml'
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_stage5_storefront_http.py' -v
          python -m unittest discover -s tests -p 'test_community_demo_api.py' -v
          echo SELF_ASSERTED_LOCAL_DEMO_IDENTITY=YES
          echo REAL_PROVIDER_RECEIPT=NOT_RUN
