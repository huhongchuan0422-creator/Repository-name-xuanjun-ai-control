name: P2 B3 read-only contracts
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - 'production/p2_install/b3_contracts.py'
      - 'production/p2_install/b3_checkpoint.py'
      - 'tests/p2_install/test_b3_contracts.py'
      - 'tests/p2_install/test_b3_checkpoint.py'
      - '.github/workflows/p2-b3-contracts.yml'
  pull_request:
    paths:
      - 'production/p2_install/b3_contracts.py'
      - 'production/p2_install/b3_checkpoint.py'
      - 'tests/p2_install/test_b3_contracts.py'
      - 'tests/p2_install/test_b3_checkpoint.py'
      - '.github/workflows/p2-b3-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B tests/p2_install/test_b3_contracts.py -v
      - run: python -B tests/p2_install/test_b3_checkpoint.py -v
