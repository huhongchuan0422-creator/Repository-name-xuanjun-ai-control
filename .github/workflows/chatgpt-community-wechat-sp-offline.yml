name: Community WeChat SP Offline Gate
on:
  push:
    branches:
      - feature/chatgpt-community-wechat-sp-offline-20261017
    paths:
      - 'scripts/community_*.py'
      - 'scripts/community_*.cjs'
      - 'tests/test_community_*.py'
      - 'clients/community-mini/**'
      - 'demos/community-stage/**'
      - scripts/community_wechat_sp_offline_guard.py
      - scripts/community_wechat_sp_mock_checkout_view.py
      - scripts/community_wechat_sp_split_projection.py
      - tests/test_community_wechat_sp_offline_guard.py
      - tests/test_community_wechat_sp_mock_checkout_view.py
      - tests/test_community_wechat_sp_split_projection.py
      - .github/workflows/chatgpt-community-wechat-sp-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact browser test runner
        run: |
          python -m pip install playwright==1.55.0 cryptography==50.0.2
          python -m playwright install --with-deps chromium
      - name: Complete Phase1 and Phase2 source regression
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests -p 'test_community_*.py' -v 2>&1 | tee community-tests.log
          python3 -B -m unittest discover -s tests -p 'test_stage5_*.py' -v 2>&1 | tee stage5-tests.log
          node --test clients/community-mini/*.test.cjs scripts/community_mini_key.test.cjs
          node --test demos/community-local-e2e/*.test.mjs
          node --test demos/community-payment/demo.test.mjs
          node --test demos/community-admin/admin.test.mjs
      - name: Build deterministic offline source package
        run: python scripts/community_stage_package.py --output community-stage-source.zip
      - name: Save exact-source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-phase-integration-evidence
          path: |
            community-tests.log
            stage5-tests.log
            community-stage-source.zip
          retention-days: 14

  mini-python-runtime:
    if: contains(github.event.head_commit.message, '[mini-runtime]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare the existing pinned customer runtime wheels without secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/community-mini-wheels" cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          python - <<'VERIFY'
          import hashlib,os,runpy
          from pathlib import Path
          source=Path('scripts/pr122_customer_runtime.py').read_bytes()
          assert hashlib.sha256(source).hexdigest()=='3a483ed81eb595309665c3d2b5746e56a50016fb246617000eb326dc5ff2b959'
          runtime=runpy.run_path('scripts/pr122_customer_runtime.py')
          runtime['wheel_files'](Path(os.environ['RUNNER_TEMP'])/'community-mini-wheels')
          print('PINNED_EXISTING_RUNTIME_WHEELS=PASS')
          VERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: community-mini-python-wheels
          path: ${{ runner.temp }}/community-mini-wheels/
          retention-days: 1

  mini-runtime:
    if: contains(github.event.head_commit.message, '[mini-runtime]')
    needs: [test, mini-python-runtime]
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - name: Verify existing non-root domestic test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: community-mini-python-wheels
          path: ${{ runner.temp }}/community-mini-wheels
      - name: Reuse original temporary runtime builder and run community integration
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'VERIFY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/pr122_customer_runtime.py').read_bytes()).hexdigest()=='3a483ed81eb595309665c3d2b5746e56a50016fb246617000eb326dc5ff2b959'
          VERIFY
          COMMUNITY_RUNTIME="$RUNNER_TEMP/community-mini-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 -I -B scripts/pr122_customer_runtime.py --wheels "$RUNNER_TEMP/community-mini-wheels" --output "$COMMUNITY_RUNTIME"
          "$COMMUNITY_RUNTIME/venv/bin/python" -I -B - <<'CHECK'
          import json,os,sys,unittest
          from pathlib import Path
          sys.path[:0]=[str(Path.cwd()),str(Path.cwd()/'tests')]
          patterns=['test_community_mini*.py','test_community_saas_provider_evidence.py',
                    'test_community_provider_notification_http.py','test_community_stage_recovery.py',
                    'test_community_wechat_sp_verification.py','test_community_wechat_sp_readonly.py']
          suite=unittest.TestSuite()
          for pattern in patterns:suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'head':os.environ['GITHUB_SHA'],'host':os.uname().nodename,'uid':os.geteuid(),
                  'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),
                  'skipped':len(result.skipped),'production_install':'NOT_EXECUTED',
                  'root_called':False,'provider_network':'SYNTHETIC_FIXTURES','money_operations':False,
                  'status':'PASS' if result.wasSuccessful() and not result.skipped else 'FAIL'}
          out=Path(os.environ['RUNNER_TEMP'])/('community-mini-runtime-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          (out/'COMMUNITY_HOST_TEST_REPORT.json').write_text(json.dumps(report,sort_keys=True))
          print(json.dumps(report,sort_keys=True))
          if report['status']!='PASS':raise SystemExit(1)
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-mini-domestic-runtime
          path: |
            ${{ runner.temp }}/community-mini-runtime-${{ github.run_id }}-${{ github.run_attempt }}/RUNTIME_REPORT.json
            ${{ runner.temp }}/community-mini-runtime-${{ github.run_id }}-${{ github.run_attempt }}/COMMUNITY_HOST_TEST_REPORT.json
          if-no-files-found: error
          retention-days: 7

  mini-sdk:
    if: contains(github.event.head_commit.message, '[mini-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare official preview SDK without application credentials
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/community-mini-ci" --no-audit --no-fund miniprogram-ci@2.1.31
          mkdir "$RUNNER_TEMP/community-mini-sdk-bundle"
          tar -czf "$RUNNER_TEMP/community-mini-sdk-bundle/sdk.tar.gz" -C "$RUNNER_TEMP/community-mini-ci" node_modules
          cd "$RUNNER_TEMP/community-mini-sdk-bundle"
          sha256sum sdk.tar.gz > sdk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: community-mini-sdk-runtime
          path: ${{ runner.temp }}/community-mini-sdk-bundle/
          retention-days: 1

  # Fixed domestic egress: retain the existing WeChat upload IP allowlist.
  mini-preview:
    if: contains(github.event.head_commit.message, '[mini-preview]')
    needs: [test, mini-sdk]
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 12
    steps:
      - name: Verify existing domestic upload runner before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -un)" = githubrunner
          test "$(id -u)" -ne 0
          node_bin="$(dirname "$(dirname "$RUNNER_TEMP")")/externals/node20/bin/node"
          test -x "$node_bin"
          "$node_bin" --version
          printf 'COMMUNITY_NODE_BINARY=%s\n' "$node_bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: community-mini-sdk-runtime
          path: ${{ runner.temp }}/community-mini-sdk-bundle
      - name: Verify and unpack credential-free SDK into task temporary directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/community-mini-sdk-bundle"
          sha256sum -c sdk.sha256
          mkdir -p "$RUNNER_TEMP/community-mini-ci"
          tar --no-same-owner -xzf sdk.tar.gz -C "$RUNNER_TEMP/community-mini-ci"
      - name: Preview development code using existing upload secret
        env:
          WECHAT_MINIPROGRAM_APPID: ${{ secrets.WECHAT_MINIPROGRAM_APPID }}
          WECHAT_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
          COMMUNITY_MINI_CI_MODULE_ROOT: ${{ runner.temp }}/community-mini-ci
          COMMUNITY_PREVIEW_OUTPUT: ${{ runner.temp }}/community-mini-preview
        run: '"$COMMUNITY_NODE_BINARY" scripts/community_mini_preview.cjs'
      - name: Preserve sanitized preview receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-mini-development-preview
          path: ${{ runner.temp }}/community-mini-preview/
          retention-days: 7
