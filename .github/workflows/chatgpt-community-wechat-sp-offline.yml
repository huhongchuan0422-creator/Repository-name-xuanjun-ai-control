name: Community WeChat SP Offline Gate
# Existing preview channel; manual upload stays opt-in and exact-head/target bound.
on:
  push:
    branches:
      - feature/chatgpt-community-wechat-sp-offline-20261017
    paths:
      - 'scripts/community_*.py'
      - 'scripts/community_*.cjs'
      - 'tests/test_community_*.py'
      - 'clients/community-mini/**'
      - 'demos/community-stage/**'
      - scripts/community_wechat_sp_offline_guard.py
      - scripts/community_wechat_sp_mock_checkout_view.py
      - scripts/community_wechat_sp_split_projection.py
      - tests/test_community_wechat_sp_offline_guard.py
      - tests/test_community_wechat_sp_mock_checkout_view.py
      - tests/test_community_wechat_sp_split_projection.py
      - .github/workflows/chatgpt-community-wechat-sp-offline.yml
  workflow_dispatch:
    inputs:
      preview_enabled:
        description: 'Explicitly run existing development preview upload (default off)'
        type: boolean
        default: false
      preview_source_sha:
        description: 'Exact selected branch HEAD (40 lowercase hex); required for preview'
        type: string
        default: ''
      preview_target:
        description: 'Existing fixed preview target'
        type: choice
        options: [uk-path-candidate]
        default: uk-path-candidate
      preview_evidence_run_id:
        description: 'Successful push Hosted evidence run for the exact selected SHA'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[ui-preview-scope]')"
    outputs:
      source_sha256: ${{ steps.source_package.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse exact successful push Hosted evidence before preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview_enabled
        env:
          PREVIEW_SOURCE_SHA: ${{ inputs.preview_source_sha }}
          PREVIEW_TARGET: ${{ inputs.preview_target }}
          PREVIEW_EVIDENCE_RUN_ID: ${{ inputs.preview_evidence_run_id }}
        run: |
          python - <<'EVIDENCE'
          import datetime,json,os,re,time
          from urllib.request import HTTPRedirectHandler,ProxyHandler,Request,build_opener
          REPO='huhongchuan0422-creator/Repository-name-xuanjun-ai-control'
          BRANCH='feature/chatgpt-community-wechat-sp-offline-20261017'
          WORKFLOW='.github/workflows/chatgpt-community-wechat-sp-offline.yml'
          def validate(run,jobs,artifacts,head,evidence_id,current_id,now):
              if (not re.fullmatch('[0-9a-f]{40}',head or '') or evidence_id==current_id
                      or run.get('id')!=evidence_id or run.get('head_sha')!=head
                      or run.get('head_branch')!=BRANCH or run.get('path')!=WORKFLOW
                      or run.get('event')!='push' or run.get('status')!='completed' or run.get('conclusion')!='success'
                      or run.get('repository',{}).get('full_name')!=REPO
                      or run.get('head_repository',{}).get('full_name')!=REPO):
                  raise ValueError('EXACT_SUCCESSFUL_PUSH_EVIDENCE_REQUIRED')
              if jobs.get('total_count',101)>100 or artifacts.get('total_count',101)>100:
                  raise ValueError('BOUNDED_EVIDENCE_REQUIRED')
              accepted={'Complete Phase1 and Phase2 source regression',
                        'Preview version and entry affected scope (no provider or host I/O)',
                        'Preview entry evidence affected scope (offline only)',
                        'UK read-only inspection candidate affected scope (no site execution)'}
              tests=[j for j in jobs.get('jobs',[]) if j.get('name')=='test' and j.get('conclusion')=='success'
                     and j.get('status')=='completed' and any(s.get('name') in accepted
                     and s.get('conclusion')=='success' and s.get('status')=='completed' for s in j.get('steps',[]))]
              if len(tests)!=1:raise ValueError('SUCCESSFUL_TEST_GATE_REQUIRED')
              found=[]
              for a in artifacts.get('artifacts',[]):
                  if a.get('name')!='community-phase-integration-evidence':continue
                  binding=a.get('workflow_run',{})
                  expires=datetime.datetime.strptime(a.get('expires_at',''),'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc).timestamp()
                  if (a.get('expired') is not False or expires<=now or not 0<a.get('size_in_bytes',0)<=20000000
                          or not re.fullmatch('sha256:[0-9a-f]{64}',a.get('digest',''))
                          or binding.get('id')!=evidence_id or binding.get('head_sha')!=head
                          or binding.get('head_branch')!=BRANCH
                          or binding.get('repository_id')!=1413132159 or binding.get('head_repository_id')!=1413132159):
                      raise ValueError('UNEXPIRED_EXACT_SOURCE_ARTIFACT_REQUIRED')
                  found.append({'id':a['id'],'digest':a['digest'],'expires_at':a['expires_at']})
              if len(found)!=1:raise ValueError('ONE_SOURCE_ARTIFACT_REQUIRED')
              return dict(status='EXACT_SHA_HOSTED_TEST_EVIDENCE_REUSED',head_sha=head,
                          run_id=evidence_id,test_job_id=tests[0]['id'],artifact=found[0],
                          artifact_bytes_reverified=False,source_package='REBUILD_FROM_CURRENT_EXACT_CHECKOUT')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          def read(path):
              url='https://api.github.com/repos/'+REPO+path
              with build_opener(ProxyHandler({}),NoRedirect()).open(Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'community-preview-evidence'}),timeout=10) as response:
                  if response.status!=200 or response.geturl()!=url:raise ValueError('EXACT_GITHUB_RESPONSE_REQUIRED')
                  raw=response.read(1048577)
                  if len(raw)>1048576:raise ValueError('EVIDENCE_SIZE_LIMIT')
                  return json.loads(raw)
          if __name__=='__main__':
              try:
                  head=os.environ.get('GITHUB_SHA','');text=os.environ.get('PREVIEW_EVIDENCE_RUN_ID','')
                  if (os.environ.get('GITHUB_REPOSITORY')!=REPO or os.environ.get('GITHUB_REF')!='refs/heads/'+BRANCH
                          or os.environ.get('PREVIEW_SOURCE_SHA')!=head or os.environ.get('PREVIEW_TARGET')!='uk-path-candidate'
                          or not re.fullmatch('[1-9][0-9]{0,19}',text)):
                      raise ValueError('EXACT_PREVIEW_CONTEXT_REQUIRED')
                  evidence_id=int(text);prefix='/actions/runs/'+text
                  receipt=validate(read(prefix),read(prefix+'/jobs?per_page=100'),read(prefix+'/artifacts?per_page=100'),
                                   head,evidence_id,int(os.environ['GITHUB_RUN_ID']),time.time())
                  with open('preview-hosted-evidence.json','x') as out:json.dump(receipt,out,sort_keys=True)
                  print('EXACT_SHA_HOSTED_TEST_EVIDENCE_REUSED')
              except Exception:
                  raise SystemExit('HOSTED_EVIDENCE_NOT_VERIFIED_NO_PREVIEW')
          EVIDENCE
      - name: Preview entry evidence affected scope (offline only)
        if: contains(github.event.head_commit.message, '[preview-entry-scope]')
        run: |
          set -o pipefail
          PYTHONPATH=tests python -B -m unittest test_preview_endpoint_contract.HostedEvidence -v 2>&1 | tee community-tests.log
      - name: UK read-only inspection candidate affected scope (no site execution)
        if: contains(github.event.head_commit.message, '[preview-inspection-scope]')
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -p 'test_community_preview_version_inspect.py' -v 2>&1 | tee community-tests.log
          bash -n deploy/community-preview/inspect-version-readonly.sh
          python -B scripts/feature_compliance_check.py 2>&1 | tee -a community-tests.log
      - name: Install exact browser test runner
        if: "!(github.event_name == 'workflow_dispatch' && inputs.preview_enabled) && !contains(github.event.head_commit.message, '[preview-inspection-scope]') && !contains(github.event.head_commit.message, '[preview-entry-scope]') && !contains(github.event.head_commit.message, '[preview-version-scope]') && !contains(github.event.head_commit.message, '[preview-endpoint-scope]') && !contains(github.event.head_commit.message, '[host-config-scope]') && !contains(github.event.head_commit.message, '[community-connection-scope]') && !contains(github.event.head_commit.message, '[persistent-runtime-scope]') && !contains(github.event.head_commit.message, '[platform-host-scope]') && !contains(github.event.head_commit.message, '[wechat-registration-scope]') && !contains(github.event.head_commit.message, '[formal-package-scope]') && !contains(github.event.head_commit.message, '[web-session-browser-scope]') && !contains(github.event.head_commit.message, '[web-session-race-scope]') && !contains(github.event.head_commit.message, '[preview-upgrade-scope]') && !contains(github.event.head_commit.message, '[web-session-tabs-scope]')"
        run: |
          python -m pip install playwright==1.55.0 cryptography==50.0.2
          python -m playwright install --with-deps chromium
      - name: Complete Phase1 and Phase2 source regression
        if: "!(github.event_name == 'workflow_dispatch' && inputs.preview_enabled) && !contains(github.event.head_commit.message, '[preview-inspection-scope]') && !contains(github.event.head_commit.message, '[preview-entry-scope]') && !contains(github.event.head_commit.message, '[preview-version-scope]') && !contains(github.event.head_commit.message, '[preview-endpoint-scope]') && !contains(github.event.head_commit.message, '[host-config-scope]') && !contains(github.event.head_commit.message, '[community-connection-scope]') && !contains(github.event.head_commit.message, '[persistent-runtime-scope]') && !contains(github.event.head_commit.message, '[platform-host-scope]') && !contains(github.event.head_commit.message, '[wechat-registration-scope]') && !contains(github.event.head_commit.message, '[formal-package-scope]') && !contains(github.event.head_commit.message, '[web-session-browser-scope]') && !contains(github.event.head_commit.message, '[web-session-race-scope]') && !contains(github.event.head_commit.message, '[preview-upgrade-scope]') && !contains(github.event.head_commit.message, '[web-session-tabs-scope]')"
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests -p 'test_community_*.py' -v 2>&1 | tee community-tests.log
          python3 -B -m unittest discover -s tests -p 'test_stage5_*.py' -v 2>&1 | tee stage5-tests.log
          node --test clients/community-mini/*.test.cjs scripts/community_mini_key.test.cjs
          node --test demos/community-local-e2e/*.test.mjs
          node --test demos/community-payment/demo.test.mjs
          node --test demos/community-admin/admin.test.mjs
      - name: Preview version and entry affected scope (no provider or host I/O)
        if: contains(github.event.head_commit.message, '[preview-version-scope]')
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_preview_readiness.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_health_dependencies.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_preview_endpoint_contract.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'preview_preparation_test.py' -v 2>&1 | tee -a community-tests.log
          node --test tests/preview_endpoint_contract.test.cjs 2>&1 | tee -a community-tests.log
      - name: Preview endpoint affected scope (unchanged 1821 results reused)
        if: contains(github.event.head_commit.message, '[preview-endpoint-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_preview_endpoint_contract.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'preview_preparation_test.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_preview_readiness.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_preview_candidate.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
          node --test clients/community-mini/session.test.cjs clients/community-mini/customer-pages.test.cjs tests/preview_endpoint_contract.test.cjs 2>&1 | tee -a community-tests.log
      - name: Protected existing host composition affected scope
        if: contains(github.event.head_commit.message, '[host-config-scope]')
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_mini_config_file.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_mini_host_config.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_mini_application.py' -v 2>&1 | tee -a community-tests.log
      - name: Community fixed action candidate affected scope
        if: contains(github.event.head_commit.message, '[community-connection-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -p 'test_community_connection_collect.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Original persistent runtime affected scope
        if: contains(github.event.head_commit.message, '[persistent-runtime-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_persistent_runtime.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Verify exact original browser proxy routes with real Nginx
        if: contains(github.event.head_commit.message, '[platform-host-scope]')
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          python -B -m unittest discover -s tests -p 'test_community_web_entries_nginx.py' -v 2>&1 | tee -a community-tests.log
      - name: Formal original platform host affected scope
        if: contains(github.event.head_commit.message, '[platform-host-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_platform_host.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_mini_proxy.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_entries.py' -v 2>&1 | tee -a community-tests.log
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python -B -m unittest discover -s tests -p 'test_community_web_entries_browser.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session_browser.py' -v 2>&1 | tee -a community-tests.log
          node --test clients/community-mini/customer-pages.test.cjs clients/community-mini/checkout-community.test.cjs clients/community-mini/project-lifecycle.test.cjs 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Native WeChat consumer registration affected scope
        if: contains(github.event.head_commit.message, '[wechat-registration-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_wechat_registration.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_first_install.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_center_operations.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_mini_center_identity.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_customer_profile_native.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_mini_application.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_platform_host.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Formal host source ZIP closure affected scope
        if: contains(github.event.head_commit.message, '[formal-package-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee community-tests.log
      - name: Original web session browser affected scope
        if: contains(github.event.head_commit.message, '[web-session-browser-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install playwright==1.55.0 cryptography==50.0.2
          python -m playwright install --with-deps chromium
          python -B -m unittest discover -s tests -p 'test_community_web_session_browser.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Original session race and cookie coherence affected scope
        if: contains(github.event.head_commit.message, '[web-session-race-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install playwright==1.55.0 cryptography==50.0.2
          python -m playwright install --with-deps chromium
          node tests/community_web_session_races.cjs demos/community-stage/web-session.js 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session_browser.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_entries_browser.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Fixed community-only upgrade state machine affected scope
        if: contains(github.event.head_commit.message, '[preview-upgrade-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install cryptography==50.0.2
          python -B -m unittest discover -s tests -p 'test_community_preview_upgrade.py' -v 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Original session same-context tabs and lifecycle affected scope
        if: contains(github.event.head_commit.message, '[web-session-tabs-scope]')
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          python -m pip install playwright==1.55.0 cryptography==50.0.2
          python -m playwright install --with-deps chromium
          node tests/community_web_session_races.cjs demos/community-stage/web-session.js 2>&1 | tee community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session_coordination.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session_tabs.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_web_session_browser.py' -v 2>&1 | tee -a community-tests.log
          python -B -m unittest discover -s tests -p 'test_community_stage_package.py' -v 2>&1 | tee -a community-tests.log
      - name: Build deterministic offline source package
        id: source_package
        run: |
          python scripts/community_stage_package.py --output community-stage-source.zip
          python - <<'DIGEST'
          import hashlib,os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('sha256='+hashlib.sha256(Path('community-stage-source.zip').read_bytes()).hexdigest()+'\n')
          DIGEST
      - name: Save exact-source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-phase-integration-evidence
          path: |
            community-tests.log
            stage5-tests.log
            preview-hosted-evidence.json
            community-stage-source.zip
          retention-days: 14
      - name: Preserve complete UK read-only candidate for root review
        if: contains(github.event.head_commit.message, '[preview-inspection-scope]')
        uses: actions/upload-artifact@v4
        with:
          name: community-uk-readonly-version-candidate
          path: |
            scripts/community_preview_version_inspect.py
            deploy/community-preview/inspect-version-readonly.sh
            deploy/community-preview/readonly-version-manifest.json
            tests/test_community_preview_version_inspect.py
            docs/development/COMMUNITY_PREVIEW_VERSION_READONLY_REVIEW_20261024.md
          if-no-files-found: error
          retention-days: 14

  community-backend-image:
    if: contains(github.event.head_commit.message, '[community-image]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: community-phase-integration-evidence
          path: source-evidence
      - name: Verify actual same-run ZIP and prepare empty build context
        env:
          EXPECTED_SOURCE_ZIP_SHA256: ${{ needs.test.outputs.source_sha256 }}
        run: |
          python - <<'VERIFY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          package=Path('source-evidence/community-stage-source.zip')
          assert 0<package.stat().st_size<=30000000
          assert hashlib.sha256(package.read_bytes()).hexdigest()==os.environ['EXPECTED_SOURCE_ZIP_SHA256']
          root=Path('community-image-context');root.mkdir(mode=0o700)
          with zipfile.ZipFile(package) as archive:
              members=archive.infolist();assert len(members)<=2000
              assert len({m.filename for m in members})==len(members)
              assert sum(m.file_size for m in members)<=30000000
              for m in members:
                  p=PurePosixPath(m.filename)
                  assert str(p)==m.filename and not p.is_absolute() and '..' not in p.parts
                  assert not m.is_dir() and stat.S_ISREG(m.external_attr>>16) and m.file_size<=2000000
              manifest=json.loads(archive.read('MANIFEST.json'))
              assert manifest['purpose']=='OFFLINE_SOURCE_CANDIDATE_NOT_INSTALLABLE'
              assert set(archive.namelist())==set(manifest['files'])|{'MANIFEST.json'}
              for name,digest in manifest['files'].items():
                  assert hashlib.sha256(archive.read(name)).hexdigest()==digest
              archive.extractall(root)
          VERIFY
      - name: Download only existing hash-pinned CPython 3.11 vendor wheels
        run: |
          python -m pip download --only-binary=:all: --dest community-image-context/wheels cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          cd community-image-context
          python - <<'VERIFY'
          import hashlib,runpy
          from pathlib import Path
          p=Path('scripts/pr122_customer_runtime.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3a483ed81eb595309665c3d2b5746e56a50016fb246617000eb326dc5ff2b959'
          runpy.run_path(str(p))['wheel_files'](Path('wheels'))
          print('ORIGINAL_VENDOR_WHEEL_HASHES=PASS')
          VERIFY
      - name: Build independent image and run original host compatibility in image
        run: |
          set -euo pipefail
          docker build --network=none --target verify --build-arg SOURCE_SHA="$GITHUB_SHA" -f community-image-context/deploy/community-preview/Dockerfile community-image-context 2>&1 | tee community-image-tests.log
          docker build --network=none --target release --build-arg SOURCE_SHA="$GITHUB_SHA" -t "community-preview:$GITHUB_SHA" -f community-image-context/deploy/community-preview/Dockerfile community-image-context
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=0.5 "community-preview:$GITHUB_SHA" --help
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=0.5 --entrypoint python "community-preview:$GITHUB_SHA" -B -c 'import os,sys,cryptography,cffi,pycparser; assert os.geteuid()==10001; assert os.getegid()==1008; assert sys.version_info[:2]==(3,11); assert (cryptography.__version__,cffi.__version__,pycparser.__version__)==("46.0.3","2.0.0","2.23"); print("NONROOT_READONLY_IMAGE_IMPORT=PASS")'
          docker image inspect --format '{{.Id}}' "community-preview:$GITHUB_SHA" > community-image-id.txt
          docker image save "community-preview:$GITHUB_SHA" | gzip -n > community-backend-image.tar.gz
          sha256sum community-backend-image.tar.gz > community-backend-image.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-backend-image-candidate
          path: |
            community-image-tests.log
            community-image-id.txt
            community-backend-image.tar.gz
            community-backend-image.sha256
          retention-days: 3

  mini-python-runtime:
    if: contains(github.event.head_commit.message, '[mini-runtime]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare the existing pinned customer runtime wheels without secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/community-mini-wheels" cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          python - <<'VERIFY'
          import hashlib,os,runpy
          from pathlib import Path
          source=Path('scripts/pr122_customer_runtime.py').read_bytes()
          assert hashlib.sha256(source).hexdigest()=='3a483ed81eb595309665c3d2b5746e56a50016fb246617000eb326dc5ff2b959'
          runtime=runpy.run_path('scripts/pr122_customer_runtime.py')
          runtime['wheel_files'](Path(os.environ['RUNNER_TEMP'])/'community-mini-wheels')
          print('PINNED_EXISTING_RUNTIME_WHEELS=PASS')
          VERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: community-mini-python-wheels
          path: ${{ runner.temp }}/community-mini-wheels/
          retention-days: 1

  mini-runtime:
    if: contains(github.event.head_commit.message, '[mini-runtime]')
    needs: [test, mini-python-runtime]
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - name: Verify existing non-root domestic test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
      - uses: actions/download-artifact@v4
        with:
          name: community-phase-integration-evidence
          path: ${{ runner.temp }}/community-mini-source-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact CI source digest and every manifest file without git checkout
        env:
          COMMUNITY_EXPECTED_SOURCE_SHA256: ${{ needs.test.outputs.source_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'SOURCE'
          import hashlib,io,json,os,re,stat,zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          suffix=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          raw=(temp/('community-mini-source-input-'+suffix)/'community-stage-source.zip').read_bytes()
          expected=os.environ['COMMUNITY_EXPECTED_SOURCE_SHA256']
          assert re.fullmatch('[0-9a-f]{64}',expected) and hashlib.sha256(raw).hexdigest()==expected
          archive=zipfile.ZipFile(io.BytesIO(raw));items=archive.infolist()
          assert len(items)<2000 and len(items)==len({i.filename for i in items})
          assert sum(i.file_size for i in items)<10000000
          manifest=json.loads(archive.read('MANIFEST.json'))
          assert manifest['purpose']=='OFFLINE_SOURCE_CANDIDATE_NOT_INSTALLABLE'
          assert manifest['production_payment']=='HOLD' and manifest['production_deployment']=='HOLD'
          assert set(archive.namelist())==set(manifest['files'])|{'MANIFEST.json'}
          assert {'deploy/community-preview/prepare-mini.cjs',
                  'deploy/community-preview/endpoint.cjs',
                  'deploy/community-preview/endpoint-profiles.json',
                  'scripts/community_preview_readiness.py',
                  'clients/community-mini/session.js',
                  'clients/community-mini/pages/home/index.wxml'}.issubset(manifest['files'])
          files={}
          for item in items:
              path=Path(item.filename)
              assert not path.is_absolute() and '..' not in path.parts and chr(92) not in item.filename
              assert stat.S_ISREG(item.external_attr >> 16)
              data=archive.read(item)
              if item.filename!='MANIFEST.json':assert hashlib.sha256(data).hexdigest()==manifest['files'][item.filename]
              files[item.filename]=data
          root=temp/('community-mini-source-'+suffix);root.mkdir(mode=0o700)
          for name,data in files.items():
              path=root/name;path.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              with path.open('xb') as out:out.write(data)
              path.chmod(0o600)
          print('EXACT_CI_SOURCE_MANIFEST=PASS; FILES='+str(len(manifest['files'])))
          SOURCE
      - uses: actions/download-artifact@v4
        with:
          name: community-mini-python-wheels
          path: ${{ runner.temp }}/community-mini-wheels
      - name: Reuse original temporary runtime builder and run community integration
        working-directory: ${{ runner.temp }}/community-mini-source-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'VERIFY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/pr122_customer_runtime.py').read_bytes()).hexdigest()=='3a483ed81eb595309665c3d2b5746e56a50016fb246617000eb326dc5ff2b959'
          VERIFY
          COMMUNITY_RUNTIME="$RUNNER_TEMP/community-mini-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 -I -B scripts/pr122_customer_runtime.py --wheels "$RUNNER_TEMP/community-mini-wheels" --output "$COMMUNITY_RUNTIME"
          "$COMMUNITY_RUNTIME/venv/bin/python" -I -B - <<'CHECK'
          import json,os,sys,unittest
          from pathlib import Path
          sys.path[:0]=[str(Path.cwd()),str(Path.cwd()/'tests')]
          patterns=['test_community_mini*.py','test_community_center_operations.py', 'test_community_center_saas.py','test_community_merchant_onboarding.py','test_community_merchant_opening.py','test_community_onboarding_pagination.py','test_community_saas_provider_evidence.py','test_community_saas_reconciliation.py',
                    'test_community_provider_notification_http.py','test_community_stage_recovery.py',
                    'test_community_stage_roles.py', 'test_community_ad_report.py', 'test_community_workbench.py',
                    'test_community_wechat_sp_verification.py','test_community_wechat_sp_readonly.py', 'test_community_wechat_sp_prepay.py']
          suite=unittest.TestSuite()
          for pattern in patterns:suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'head':os.environ['GITHUB_SHA'],'host':os.uname().nodename,'uid':os.geteuid(),
                  'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),
                  'skipped':len(result.skipped),'production_install':'NOT_EXECUTED',
                  'root_called':False,'provider_network':'SYNTHETIC_FIXTURES','money_operations':False,
                  'status':'PASS' if result.wasSuccessful() and not result.skipped else 'FAIL'}
          out=Path(os.environ['RUNNER_TEMP'])/('community-mini-runtime-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          (out/'COMMUNITY_HOST_TEST_REPORT.json').write_text(json.dumps(report,sort_keys=True))
          print(json.dumps(report,sort_keys=True))
          if report['status']!='PASS':raise SystemExit(1)
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-mini-domestic-runtime
          path: |
            ${{ runner.temp }}/community-mini-runtime-${{ github.run_id }}-${{ github.run_attempt }}/RUNTIME_REPORT.json
            ${{ runner.temp }}/community-mini-runtime-${{ github.run_id }}-${{ github.run_attempt }}/COMMUNITY_HOST_TEST_REPORT.json
          if-no-files-found: error
          retention-days: 7

  mini-sdk:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[mini-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.preview_enabled == true && inputs.preview_source_sha == github.sha && inputs.preview_target == 'uk-path-candidate' && github.ref == 'refs/heads/feature/chatgpt-community-wechat-sp-offline-20261017')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare official preview SDK without application credentials
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/community-mini-ci" --no-audit --no-fund miniprogram-ci@2.1.31
          mkdir "$RUNNER_TEMP/community-mini-sdk-bundle"
          tar -czf "$RUNNER_TEMP/community-mini-sdk-bundle/sdk.tar.gz" -C "$RUNNER_TEMP/community-mini-ci" node_modules
          cd "$RUNNER_TEMP/community-mini-sdk-bundle"
          sha256sum sdk.tar.gz > sdk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: community-mini-sdk-runtime
          path: ${{ runner.temp }}/community-mini-sdk-bundle/
          retention-days: 1

  # Fixed domestic egress: retain the existing WeChat upload IP allowlist.
  mini-preview:
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[mini-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.preview_enabled == true && inputs.preview_source_sha == github.sha && inputs.preview_target == 'uk-path-candidate' && github.ref == 'refs/heads/feature/chatgpt-community-wechat-sp-offline-20261017')
    needs: [test, mini-sdk]
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 12
    env:
      COMMUNITY_PREVIEW_PROFILE: uk-path-candidate
    steps:
      - name: Verify existing domestic upload runner before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -un)" = githubrunner
          test "$(id -u)" -ne 0
          node_bin="$(dirname "$(dirname "$RUNNER_TEMP")")/externals/node20/bin/node"
          test -x "$node_bin"
          "$node_bin" --version
          printf 'COMMUNITY_NODE_BINARY=%s\n' "$node_bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: community-phase-integration-evidence
          path: ${{ runner.temp }}/community-mini-source-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact Hosted source package and unpack without git checkout
        env:
          COMMUNITY_EXPECTED_SOURCE_SHA256: ${{ needs.test.outputs.source_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'SOURCE'
          import hashlib,io,json,os,re,stat,zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          suffix=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          raw=(temp/('community-mini-source-input-'+suffix)/'community-stage-source.zip').read_bytes()
          expected=os.environ['COMMUNITY_EXPECTED_SOURCE_SHA256']
          assert re.fullmatch('[0-9a-f]{64}',expected) and hashlib.sha256(raw).hexdigest()==expected
          archive=zipfile.ZipFile(io.BytesIO(raw));items=archive.infolist()
          assert len(items)<2000 and len(items)==len({i.filename for i in items})
          assert sum(i.file_size for i in items)<10000000
          manifest=json.loads(archive.read('MANIFEST.json'))
          assert manifest['purpose']=='OFFLINE_SOURCE_CANDIDATE_NOT_INSTALLABLE'
          assert manifest['production_payment']=='HOLD' and manifest['production_deployment']=='HOLD'
          assert set(archive.namelist())==set(manifest['files'])|{'MANIFEST.json'}
          assert {'deploy/community-preview/prepare-mini.cjs',
                  'deploy/community-preview/endpoint.cjs',
                  'deploy/community-preview/endpoint-profiles.json',
                  'scripts/community_preview_readiness.py',
                  'clients/community-mini/session.js',
                  'clients/community-mini/pages/home/index.wxml'}.issubset(manifest['files'])
          files={}
          for item in items:
              path=Path(item.filename)
              assert not path.is_absolute() and '..' not in path.parts and chr(92) not in item.filename
              assert stat.S_ISREG(item.external_attr >> 16)
              data=archive.read(item)
              if item.filename!='MANIFEST.json':
                  assert hashlib.sha256(data).hexdigest()==manifest['files'][item.filename]
              files[item.filename]=data
          root=temp/('community-mini-preview-source-'+suffix);root.mkdir(mode=0o700)
          for name,data in files.items():
              path=root/name;path.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              with path.open('xb') as out:out.write(data)
              path.chmod(0o600)
          print('EXACT_PREVIEW_SOURCE_MANIFEST=PASS; FILES='+str(len(manifest['files'])))
          SOURCE
      - uses: actions/download-artifact@v4
        with:
          name: community-mini-sdk-runtime
          path: ${{ runner.temp }}/community-mini-sdk-bundle
      - name: Verify and unpack credential-free SDK into task temporary directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/community-mini-sdk-bundle"
          sha256sum -c sdk.sha256
          mkdir -p "$RUNNER_TEMP/community-mini-ci"
          tar --no-same-owner -xzf sdk.tar.gz -C "$RUNNER_TEMP/community-mini-ci"
      - name: Require live backend health before loading upload credentials
        working-directory: ${{ runner.temp }}/community-mini-preview-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: /usr/bin/python3 -I -B scripts/community_preview_readiness.py --output "$RUNNER_TEMP/community-mini-preview/backend-readiness.json"
      - name: Prepare connected development mini source
        working-directory: ${{ runner.temp }}/community-mini-preview-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          COMMUNITY_CONNECTED_MINI_OUTPUT: ${{ runner.temp }}/community-mini-connected-${{ github.run_id }}-${{ github.run_attempt }}
        run: '"$COMMUNITY_NODE_BINARY" deploy/community-preview/prepare-mini.cjs'
      - name: Preview development code using existing upload secret
        working-directory: ${{ runner.temp }}/community-mini-preview-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          WECHAT_MINIPROGRAM_APPID: ${{ secrets.WECHAT_MINIPROGRAM_APPID }}
          WECHAT_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
          COMMUNITY_MINI_CI_MODULE_ROOT: ${{ runner.temp }}/community-mini-ci
          COMMUNITY_MINI_PROJECT_PATH: ${{ runner.temp }}/community-mini-connected-${{ github.run_id }}-${{ github.run_attempt }}
          COMMUNITY_PREVIEW_OUTPUT: ${{ runner.temp }}/community-mini-preview
          COMMUNITY_PREVIEW_READINESS_RECEIPT: ${{ runner.temp }}/community-mini-preview/backend-readiness.json
        run: '"$COMMUNITY_NODE_BINARY" scripts/community_mini_preview.cjs'
      - name: Preserve sanitized preview receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-mini-development-preview
          path: ${{ runner.temp }}/community-mini-preview/
          retention-days: 7
