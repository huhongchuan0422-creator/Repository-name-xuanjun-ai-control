name: Stage5 Merchant Persistence
on:
  pull_request:
    paths:
      - 'scripts/community_merchant_store.py'
      - 'tests/test_community_merchant_store.py'
      - '.github/workflows/stage5-merchant-store.yml'
permissions:
  contents: read
jobs:
  merchant-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_community_merchant_store.py' -v
          python -m unittest discover -s tests -p 'test_community_merchant_contract.py' -v
          echo REAL_WECHAT_AUTH=NOT_RUN
