name: Community Isolated Preview Candidate
on:
  workflow_dispatch:
    inputs:
      package_only:
        description: 'Build candidate package only; this workflow never deploys.'
        required: true
        default: 'true'
        type: choice
        options: ['true']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate candidate contracts
        run: |
          set -euo pipefail
          test "${{ inputs.package_only }}" = true
          python -m unittest -v tests.test_community_preview_candidate
      - name: Build exact candidate package
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/community-preview-candidate.tar.gz" scripts tests demos clients/community-mini deploy/community-preview
          sha256sum "$RUNNER_TEMP/community-preview-candidate.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: community-isolated-preview-candidate
          path: ${{ runner.temp }}/community-preview-candidate.tar.gz
          retention-days: 7
