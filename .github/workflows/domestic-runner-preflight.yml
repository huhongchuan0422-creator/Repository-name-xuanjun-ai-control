name: Domestic Runner Read-Only Preflight
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/domestic-runner-preflight.yml'
permissions:
  contents: read
jobs:
  domestic-preflight:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      # Exact readable sources: commit df7e528db185e1e55f054a4b5160b60b3d196439.
      # Package contains synthetic tests and candidate source only, no credentials.
      # Delivery bypasses unreliable git fetch; no proxy, key or policy is changed.
      - name: Verify fixed payload and run isolated tests without checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          XJ_PR122_REVIEW_PAYLOAD: ''
        run: |
          if command -v python3.11 >/dev/null 2>&1; then
            XJ_PR122_PYTHON=python3.11
          else
            XJ_PR122_PYTHON=python3
          fi
          "$XJ_PR122_PYTHON" -B - <<'PY'
          import base64, gzip, hashlib, io, os, pwd, subprocess, sys, tarfile, tempfile
          from pathlib import Path, PurePosixPath
          assert os.uname().nodename == "iZvt5t8tlrm8oiZ", "WRONG_HOST"
          assert pwd.getpwuid(os.geteuid()).pw_name == "githubrunner", "WRONG_USER"
          assert sys.version_info >= (3,10), "PYTHON_3_10_OR_NEWER_REQUIRED"
          data = base64.b64decode(os.environ["XJ_PR122_REVIEW_PAYLOAD"],validate=True)
          assert hashlib.sha256(data).hexdigest() == "4432fb8b9c55b649819e6ee0f488200be90adb8e8da0ab16cb3dcb29f8062e30", "PAYLOAD_HASH_MISMATCH"
          with gzip.GzipFile(fileobj=io.BytesIO(data)) as compressed:
              raw = compressed.read(2_000_001)
          assert len(raw) <= 2_000_000, "PAYLOAD_TOO_LARGE"
          work = Path(tempfile.mkdtemp(prefix="pr122-oauth-fixed-",dir=os.environ["RUNNER_TEMP"]))
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:") as archive:
              members = archive.getmembers()
              assert len(members) == 9 and sum(m.size for m in members) < 1_000_000
              seen = set()
              for member in members:
                  rel = PurePosixPath(member.name)
                  assert member.isfile() and not rel.is_absolute() and ".." not in rel.parts
                  assert member.name == str(rel) and member.name not in seen
                  seen.add(member.name)
                  target = work.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open("xb") as handle:
                      handle.write(archive.extractfile(member).read())
                  target.chmod(0o400)
          env = dict(os.environ)
          env.pop("XJ_PR122_REVIEW_PAYLOAD",None)
          env["PR122_CANDIDATE_ROOT"] = str(work)
          env["PR122_INVENTORY_SOURCE"] = str(work/"pr122_domestic_channel_inventory.py")
          print("SOURCE_COMMIT=df7e528db185e1e55f054a4b5160b60b3d196439",flush=True)
          print("PAYLOAD_SHA256=4432fb8b9c55b649819e6ee0f488200be90adb8e8da0ab16cb3dcb29f8062e30",flush=True)
          print("ISOLATED_WORKSPACE="+str(work),flush=True)
          result = subprocess.run([sys.executable,"-B",str(work/"test_oauth_candidate.py"),"-v"],
                                  cwd=work,env=env,timeout=90)
          print("PRODUCTION_CHANGE=NO ROOT_INSTALL_AUTHORITY=NOT_ESTABLISHED",flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Observe existing bridge identity and health (no auth or mutation)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if command -v python3.11 >/dev/null 2>&1; then
            XJ_PR122_PYTHON=python3.11
          else
            XJ_PR122_PYTHON=python3
          fi
          "$XJ_PR122_PYTHON" -B - <<'PY'
          import hashlib, http.client, json, os, pwd, ssl, subprocess
          assert os.uname().nodename == "iZvt5t8tlrm8oiZ"
          assert pwd.getpwuid(os.geteuid()).pw_name == "githubrunner"
          def pid():
              return subprocess.check_output(["systemctl","show","provider-neutral-domestic-bridge.service","-p","MainPID","--value"],text=True).strip()
          before = pid()
          assert before == "188767", "BRIDGE_PID_CHANGED_RECHECK_REQUIRED"
          # Public health observation only. This does not establish trust in a
          # new certificate: report its fingerprint for later accepted pin binding.
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          connection = http.client.HTTPSConnection("127.0.0.1",18443,timeout=5,context=context)
          try:
              connection.connect()
              fingerprint = hashlib.sha256(connection.sock.getpeercert(binary_form=True)).hexdigest()
              connection.request("GET","/healthz")
              response = connection.getresponse()
              data = response.read(16385)
              assert len(data) <= 16384, "HEALTH_RESPONSE_TOO_LARGE"
              payload = json.loads(data.decode("utf-8"))
              checks = payload.get("checks") or {}
              result = {
                  "host":os.uname().nodename,
                  "pid":before,
                  "endpoint":"127.0.0.1:18443",
                  "http_status":response.status,
                  "reported_status":payload.get("status") if payload.get("status") in {"PASS","FAIL_CLOSED"} else "UNEXPECTED_STATUS",
                  "checks":{key:checks.get(key) is True for key in ("process_alive","bridge_auth_ready","bridge_schema_ready","domestic_core_ready")},
                  "observed_certificate_sha256":fingerprint,
                  "tls_identity":"OBSERVED_NOT_PIN_VERIFIED",
                  "production_mutation":False,
                  "message_post":False
              }
          finally:
              connection.close()
          assert pid() == before, "BRIDGE_PID_CHANGED_DURING_OBSERVATION"
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Observe existing system CA and ACME directory (no mutation)
        if: github.event_name == 'push'
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pwd,ssl,stat
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ'
          assert pwd.getpwuid(os.geteuid()).pw_name=='githubrunner'
          defaults=ssl.get_default_verify_paths()
          candidates=sorted(set(p for p in (defaults.cafile,defaults.openssl_cafile) if p))
          result={'host':os.uname().nodename,'user':'githubrunner','ca_bundles':[],
                  'production_mutation':False,'bridge_probed':False,'sudo_used':False}
          for raw in candidates:
              p=Path(raw)
              if not p.is_file():continue
              resolved=p.resolve()
              assert str(resolved).startswith(('/etc/pki/','/etc/ssl/','/usr/share/'))
              data=resolved.read_bytes()
              assert len(data)<2000000
              info=resolved.stat()
              ctx=ssl.create_default_context(cafile=str(resolved))
              result['ca_bundles'].append({'requested_path':str(p),'resolved_path':str(resolved),
                  'sha256':hashlib.sha256(data).hexdigest(),'uid':info.st_uid,
                  'mode':oct(stat.S_IMODE(info.st_mode)),
                  'cert_count':len(ctx.get_ca_certs())})
          p=Path('/var/www/letsencrypt')
          try:
              info=p.lstat()
              result['acme_root']={'exists':True,'uid':info.st_uid,
                  'mode':oct(stat.S_IMODE(info.st_mode)),'symlink':stat.S_ISLNK(info.st_mode)}
          except FileNotFoundError:result['acme_root']={'exists':False}
          assert result['ca_bundles'],'SYSTEM_CA_NOT_READABLE'
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
