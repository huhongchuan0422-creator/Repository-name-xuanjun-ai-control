name: P2 UK exact approved notifier isolation
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - evidence/p2-install-preparation-20261013/execute_notifier_review_bound.py
      - .github/workflows/uk-p2-notifier-authorized.yml
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: uk-p2-notifier-isolation-c529c379
  cancel-in-progress: false
jobs:
  isolate-approved-notifier:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
          path: notifier-execution-${{ github.run_id }}
      - name: Enforce exact independent acceptance and source digest before root operation
        working-directory: notifier-execution-${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B evidence/p2-install-preparation-20261013/execute_notifier_review_bound.py
