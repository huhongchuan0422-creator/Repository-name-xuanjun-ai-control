name: Cloud connection candidate tests
on:
  push:
    branches: [feature/cloud-connection-continuation-20261021]
    paths:
      - production/cloud_connection/**
      - tests/test_cloud_connection*.py
      - tests/oauth/**
      - deployment/cloud-connection/**
      - docs/development/CLOUD_CONNECTION*.md
      - .github/workflows/cloud-connection-tests.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.6.15-buster', 'python:3.12.15-bookworm']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source and runtime
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='%H %T %P'
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python -c 'import sys,sqlite3; print(sys.version); print(sqlite3.sqlite_version)'
      - name: Offline queue, transport and custody regression
        run: python -m unittest discover -s tests -p 'test_cloud_connection*.py' -v
  oauth-http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.11.14-bookworm', 'python:3.12.15-bookworm']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source and isolated OAuth dependencies
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='%H %T %P'
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python --version
          python -m pip install --require-hashes --only-binary=:all: -r deployment/cloud-connection/oauth/requirements.lock
          python -m pip check
      - name: Real loopback HTTP OAuth and MCP integration - simulated GitHub upstream
        run: python -m unittest discover -s tests/oauth -p 'test_*.py' -v
  oauth-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact configuration source
        run: |
          git log -1 --format='%H %T %P'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install distribution Nginx for isolated configuration tests
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Real HTTP01 bootstrap and final vhost regression
        env:
          REQUIRE_NGINX_TESTS: '1'
        run: python3 -m unittest discover -s tests -p test_cloud_connection_oauth_nginx.py -v
