name: Cloud connection candidate tests
on:
  push:
    branches: [feature/cloud-connection-continuation-20261021, feature/cloud-oauth-diagnostic-23b-20261023]
    paths:
      - production/cloud_connection/**
      - tests/test_cloud_connection*.py
      - tests/oauth/**
      - tests/browser/**
      - deployment/cloud-connection/**
      - docs/development/CLOUD_CONNECTION*.md
      - .github/workflows/cloud-connection-tests.yml
permissions:
  contents: read
jobs:
  domestic-py3116:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.11.6-bookworm@sha256:ba7a7ac30c38e119c4304f98ef0e188f90f4f67a958bb6899da9defb99bfb471
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source and independent CPython3.11.6 test environment
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='%H %T %P'
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python -c 'import sys; assert sys.version_info[:3] == (3,11,6); print(sys.version)'
          python -m venv /tmp/oauth-py3116
          /tmp/oauth-py3116/bin/python -m pip download --require-hashes --only-binary=:all: -r deployment/cloud-connection/oauth/requirements.cp3116.lock --dest /tmp/approved-wheels
          /tmp/oauth-py3116/bin/python -m pip install --no-index --find-links=/tmp/approved-wheels --require-hashes --only-binary=:all: -r deployment/cloud-connection/oauth/requirements.cp3116.lock
          /tmp/oauth-py3116/bin/python -m pip check
          /tmp/oauth-py3116/bin/python -I -B tests/oauth/record_py3116_wheels.py deployment/cloud-connection/oauth/requirements.lock /tmp/approved-wheels py3116-evidence
          cmp py3116-evidence/requirements.cp3116.lock deployment/cloud-connection/oauth/requirements.cp3116.lock
      - name: Exact-version OAuth HTTP and persistence isolation compatibility
        run: |
          /tmp/oauth-py3116/bin/python -m unittest discover -s tests/oauth -p 'test_*.py' -v
          /tmp/oauth-py3116/bin/python -m unittest discover -s tests -p 'test_cloud_connection*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: domestic-py3116-compatibility
          path: py3116-evidence/
          if-no-files-found: error
          retention-days: 14
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.6.15-buster', 'python:3.12.15-bookworm']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source and runtime
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='%H %T %P'
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python -c 'import sys,sqlite3; print(sys.version); print(sqlite3.sqlite_version)'
      - name: Offline queue, transport and custody regression
        run: python -m unittest discover -s tests -p 'test_cloud_connection*.py' -v
  oauth-http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.11.14-bookworm', 'python:3.12.15-bookworm']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact source and isolated OAuth dependencies
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format='%H %T %P'
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python --version
          python -m pip install --require-hashes --only-binary=:all: -r deployment/cloud-connection/oauth/requirements.lock
          python -m pip check
      - name: Real loopback HTTP OAuth and MCP integration - simulated GitHub upstream
        run: python -m unittest discover -s tests/oauth -p 'test_*.py' -v
  oauth-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact configuration source
        run: |
          git log -1 --format='%H %T %P'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install distribution Nginx for isolated configuration tests
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Real HTTP01 bootstrap and final vhost regression
        env:
          REQUIRE_NGINX_TESTS: '1'
        run: python3 -m unittest discover -s tests -p 'test_cloud_connection_oauth*nginx.py' -v
  oauth-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Exact source and isolated browser-only dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H %T %P'
          python -m venv /tmp/consent-browser-tests
          timeout 120s /tmp/consent-browser-tests/bin/python -m pip install --index-url https://pypi.org/simple --timeout 15 --retries 0 --require-hashes --only-binary=:all: -r tests/browser/requirements.lock
          /tmp/consent-browser-tests/bin/python -m pip check
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=30000 timeout 240s /tmp/consent-browser-tests/bin/python -m playwright install --with-deps chromium
      - name: Sandboxed synthetic two-origin form redirect regression
        run: timeout 60s /tmp/consent-browser-tests/bin/python -B tests/browser/test_consent_csp_browser.py
