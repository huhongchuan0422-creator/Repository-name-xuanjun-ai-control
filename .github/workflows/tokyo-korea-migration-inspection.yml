name: Tokyo Korea authorized migration inspection
on:
  pull_request:
    paths:
      - .github/workflows/tokyo-korea-migration-inspection.yml
      - migration-prep/**
permissions:
  contents: read
concurrency:
  group: tokyo-korea-migration-inspection
  cancel-in-progress: false
jobs:
  inspection:
    # Shared production runners remain in a public-repository Default pool.
    # Candidate development must not schedule them again.  A separately
    # authorized G1 operation removes them through SSH/OpenClaw.
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: xuanjun-tokyo-readonly
            host: iZ6wee8q9z4t03hvqumwfhZ
          - label: xuanjun-korea-binance
            host: iZmj7a5kwr75qc1tul4kf9Z
    runs-on: [self-hosted, Linux, X64, "${{ matrix.label }}"]
    timeout-minutes: 3
    steps:
      - name: Invoke installed fixed host helper without repository checkout
        env:
          XJ_EXPECTED_HOST: ${{ matrix.host }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          test "$(hostname -s)" = "$XJ_EXPECTED_HOST"
          test "$(id -un)" = githubrunner
          XJ_HELPER=/usr/local/sbin/xuanjun-migration-inspect-v1
          test -f "$XJ_HELPER"
          test ! -L "$XJ_HELPER"
          test "$(stat -c %u "$XJ_HELPER")" = 0
          test "$(stat -c %a "$XJ_HELPER")" = 755
          printf '%s  %s\n' '61bed97a32e970dd868f2d223c68ab41c012c484d314cb714c768629aac263c2' "$XJ_HELPER" | sha256sum -c -
          for XJ_PARENT in /usr /usr/local /usr/local/sbin /usr/bin /usr/sbin /etc /etc/sudoers.d; do
            test -d "$XJ_PARENT"
            test ! -L "$XJ_PARENT"
            test "$(stat -c %u "$XJ_PARENT")" = 0
            XJ_MODE=$(stat -c %a "$XJ_PARENT")
            (( (8#$XJ_MODE & 0022) == 0 ))
            stat -c 'PARENT=%n UID=%u MODE=%a' "$XJ_PARENT"
          done
          /usr/bin/sudo -n -l >/dev/null
          echo EFFECTIVE_SUDO_LIST_READ=YES
          echo GLOBAL_RUNNER_ACCESS_POLICY=NOT_VERIFIED
          echo FULL_SUDOERS_POLICY_AUDIT=NOT_VERIFIED
          /usr/bin/sudo -n "$XJ_HELPER"
          echo MIGRATION_EXECUTED=NO
          echo ORDER_WRITE_ENABLED=NO
  hosted-policy-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: phase-c-python
        with:
          python-version: '3.11'
      - name: Phase-C synthetic adapter tests (no production runner; no provider)
        env:
          XJ_TEST_PYTHON: ${{ steps.phase-c-python.outputs.python-path }}
        shell: bash
        run: |
          sudo -n -- "$XJ_TEST_PYTHON" -I -B - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'migration-prep')
          suite = unittest.defaultTestLoader.discover('migration-prep/korea/phase_c', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('PHASE_C_TESTS=%d SKIPPED=%d PRODUCTION_ACTIONS=0' % (result.testsRun, len(result.skipped)))
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
      - name: Build exact Phase-C offline adapter review artifact
        env:
          XJ_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$XJ_EXPECTED_HEAD"
          mkdir -m 0700 /tmp/pr99-phase-c-review
          python -I -B - "$XJ_EXPECTED_HEAD" <<'PY' > /tmp/pr99-phase-c-review/BUILD_RECEIPT.json
          import json, pathlib, sys
          sys.path.insert(0, 'migration-prep')
          from korea.phase_c.artifact import build
          print(json.dumps(build(pathlib.Path.cwd(), sys.argv[1], '/tmp/pr99-phase-c-review/PR99_PHASE_C_OFFLINE_REVIEW.tar.gz'), sort_keys=True))
          PY
          cat /tmp/pr99-phase-c-review/BUILD_RECEIPT.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr99-phase-c-offline-review
          path: /tmp/pr99-phase-c-review/
          if-no-files-found: error
          retention-days: 7
