name: PR122 stage approved owner readonly plan inputs
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-stage-owner-plan-inputs.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      - name: Stage exact raw approved ZIP as non-root no checkout no sudo
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,stat,urllib.request,urllib.error,urllib.parse
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          parent=Path('/home/githubrunner/pr122-owner-plan-inputs')
          if not parent.exists():parent.mkdir(mode=0o700)
          for p in (parent,Path('/home/githubrunner')):
              s=p.lstat()
              assert stat.S_ISDIR(s.st_mode) and s.st_uid==1002 and not stat.S_IMODE(s.st_mode)&0o022
          folder=parent/'pr122-customer-channel-plan-20261017-r2'
          folder.mkdir(mode=0o700)
          os.chmod(folder,0o700)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          request=urllib.request.Request('https://api.github.com/repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/12082484853/zip',headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'PR122-Nonroot-Artifact-Stage'})
          try:
              response=opener.open(request,timeout=20)
              raise RuntimeError('EXPECTED_ARTIFACT_REDIRECT')
          except urllib.error.HTTPError as e:
              assert e.code==302
              url=e.headers['Location']
          target=urllib.parse.urlsplit(url)
          assert target.scheme=='https' and target.hostname.endswith('.blob.core.windows.net') and not target.username and not target.password
          with opener.open(urllib.request.Request(url,headers={'User-Agent':'PR122-Artifact-Download'}),timeout=60) as r:raw=r.read(12000001)
          assert len(raw)<=12000000 and hashlib.sha256(raw).hexdigest()=='9ce3a924604c249c92600ed8067c4280185e63ffd43c3ad3c92629b5fa5e8fae'
          path=folder/'APPROVED_PLAN_INPUTS.zip'
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
          with os.fdopen(fd,'wb') as f:os.fchmod(f.fileno(),0o400);f.write(raw);f.flush();os.fsync(f.fileno())
          print('OWNER_PLAN_INPUT_STAGE='+json.dumps({'host':os.uname().nodename,'uid':os.getuid(),'path':str(path),'sha256':hashlib.sha256(raw).hexdigest(),'root_called':False,'plan_called':False,'production_mutations':0},sort_keys=True))
          PY
  verify-persistent-stage:
    needs: stage
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 2
    steps:
      - name: Verify approved bytes after staging job cleanup no checkout no sudo
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          path=Path('/home/githubrunner/pr122-owner-plan-inputs/pr122-customer-channel-plan-20261017-r2/APPROVED_PLAN_INPUTS.zip')
          for p in (path.parent,path.parent.parent,Path('/home/githubrunner')):
              s=p.lstat()
              assert stat.S_ISDIR(s.st_mode) and s.st_uid==1002 and not stat.S_IMODE(s.st_mode)&0o022
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
          with os.fdopen(fd,'rb') as f:
              s=os.fstat(f.fileno())
              assert stat.S_ISREG(s.st_mode) and s.st_uid==1002 and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o400 and s.st_size==5457398
              raw=f.read(5457399)
              after=os.fstat(f.fileno())
              assert (s.st_ino,s.st_size,s.st_mtime_ns)==(after.st_ino,after.st_size,after.st_mtime_ns)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='9ce3a924604c249c92600ed8067c4280185e63ffd43c3ad3c92629b5fa5e8fae'
          print('PERSISTENT_OWNER_PLAN_STAGE='+json.dumps({'path':str(path),'size':len(raw),'sha256':digest,'verified_in_separate_job':True,'root_called':False,'plan_called':False,'production_mutations':0},sort_keys=True))
          PY
