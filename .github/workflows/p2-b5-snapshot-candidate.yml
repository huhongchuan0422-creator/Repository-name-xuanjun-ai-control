name: P2 B5 bounded snapshot candidate
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - scripts/p2_b5_snapshot.py
      - scripts/p2_b5_export_probe.mjs
      - tests/p2_b5_snapshot/test_candidate.py
      - docs/p2-b5-20261020/SNAPSHOT_CANDIDATE.sh
      - .github/workflows/p2-b5-snapshot-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Only new snapshot filesystem tests, private fixtures
        run: sudo env B5_REQUIRE_UID1002=1 "$(command -v python)" -B -m unittest discover -s tests/p2_b5_snapshot -p test_candidate.py -v
      - name: Probe syntax only, never import actual SDK
        run: node --check scripts/p2_b5_export_probe.mjs
      - name: Package NEW candidate source only, not the original plugin
        run: |
          mkdir -p candidate/scripts candidate/production/p2_install candidate/docs/p2-b5-20261020
          cp scripts/p2_b5_snapshot.py scripts/p2_b5_export_probe.mjs candidate/scripts/
          cp production/p2_install/b5_loader_contract.mjs candidate/production/p2_install/
          cp docs/p2-b5-20261020/SNAPSHOT_CANDIDATE.sh docs/p2-b5-20261020/SNAPSHOT_PACKAGE.md candidate/docs/p2-b5-20261020/
          cd candidate
          sha256sum scripts/* production/p2_install/* docs/p2-b5-20261020/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: b5-snapshot-candidate-${{ matrix.python }}
          path: candidate/
