name: PR122 stage approved Owner custody inputs
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-stage-owner-custody.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      - name: Stage only exact approved bytes no checkout no sudo
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,io,json,os,stat,tarfile,urllib.request,urllib.error,urllib.parse,zipfile
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          req=urllib.request.Request('https://api.github.com/repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/12084664070/zip',headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'PR122-Nonroot-Custody-Stage'})
          try:
              opener.open(req,timeout=20)
              raise RuntimeError('EXPECTED_REDIRECT')
          except urllib.error.HTTPError as e:
              assert e.code==302
              url=e.headers['Location']
          u=urllib.parse.urlsplit(url)
          assert u.scheme=='https' and u.hostname.endswith('.blob.core.windows.net') and not u.username and not u.password
          with opener.open(urllib.request.Request(url,headers={'User-Agent':'PR122-Artifact-Download'}),timeout=60) as r:raw=r.read(12000001)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert len(raw)==5481176 and sha(raw)=='894de2a8a9c9fc1d00b7ce922c75561fe18a4e82f3526a661fbd064afe681f1a'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              tar=z.read('PR122_OWNER_CUSTODY_REVIEW.tar.gz')
          assert sha(tar)=='c43250ba388edde91f5310e8bac97f205ea21a93141c8a53c6110dd072013644'
          with tarfile.open(fileobj=io.BytesIO(tar),mode='r:gz') as t:
              ms=t.getmembers()
              assert len(ms)==len({m.name for m in ms})==7 and all(m.isfile() and not m.name.startswith('/') and '..' not in Path(m.name).parts for m in ms)
              mr=t.extractfile('owner-custody/MANIFEST.json').read()
              assert sha(mr)=='8424e670c389dc93a5967ec26e6663c8874efe7517cf6155797d7ae0a0da5fca'
              manifest=json.loads(mr)
              assert len(manifest['files'])==6 and {m.name for m in ms}=={'owner-custody/'+x['path'] for x in manifest['files']}|{'owner-custody/MANIFEST.json'}
              data={}
              for x in manifest['files']:
                  b=t.extractfile('owner-custody/'+x['path']).read()
                  assert len(b)==x['size'] and sha(b)==x['sha256']
                  data[x['path']]=b
          files={'owner-launcher.py':data['scripts/pr122_owner_channel_custody.py'],'REVIEW.zip':data['REVIEW.zip']}
          assert sha(files['owner-launcher.py'])=='41ab8fe9b73759c85055ac00ed8c7802a8546dbfa6c83fa67458d2929baf6c29'
          assert sha(files['REVIEW.zip'])=='9b59332f3806f215d2022c1510a74840f25cb84beec6a8d20e7026882d15b68d'
          parent=Path('/home/githubrunner/pr122-owner-inputs')
          if not parent.exists():parent.mkdir(mode=0o700)
          for p in (parent,Path('/home/githubrunner')):
              s=p.lstat()
              assert stat.S_ISDIR(s.st_mode) and s.st_uid==1002 and not stat.S_IMODE(s.st_mode)&0o022
          folder=parent/'channel-custody-20261017'
          folder.mkdir(mode=0o700)
          for name,b in files.items():
              fd=os.open(folder/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
              with os.fdopen(fd,'wb') as f:os.fchmod(f.fileno(),0o400);f.write(b);f.flush();os.fsync(f.fileno())
          fd=os.open(folder,os.O_RDONLY|os.O_DIRECTORY);os.fsync(fd);os.close(fd)
          print(json.dumps({'state':'NONROOT_PERSISTENT_STAGE','files':{n:sha(b) for n,b in files.items()},'root_called':False,'prepare_called':False,'production_changes':0},sort_keys=True))
          PY
  verify:
    needs: stage
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 2
    steps:
      - name: Verify persistent files after previous job cleanup no sudo
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          folder=Path('/home/githubrunner/pr122-owner-inputs/channel-custody-20261017')
          for p in (folder,folder.parent,Path('/home/githubrunner')):
              s=p.lstat()
              assert stat.S_ISDIR(s.st_mode) and s.st_uid==1002 and not stat.S_IMODE(s.st_mode)&0o022
          pins={'owner-launcher.py':'41ab8fe9b73759c85055ac00ed8c7802a8546dbfa6c83fa67458d2929baf6c29','REVIEW.zip':'9b59332f3806f215d2022c1510a74840f25cb84beec6a8d20e7026882d15b68d'}
          for name,digest in pins.items():
              fd=os.open(folder/name,os.O_RDONLY|os.O_NOFOLLOW)
              with os.fdopen(fd,'rb') as f:
                  s=os.fstat(f.fileno())
                  assert stat.S_ISREG(s.st_mode) and s.st_uid==1002 and s.st_nlink==1 and s.st_size<12000000 and stat.S_IMODE(s.st_mode)==0o400
                  raw=f.read(12000001);a=os.fstat(f.fileno())
              assert (s.st_ino,s.st_size,s.st_mtime_ns)==(a.st_ino,a.st_size,a.st_mtime_ns) and hashlib.sha256(raw).hexdigest()==digest
          print(json.dumps({'state':'CROSS_JOB_STAGE_VERIFIED','path':str(folder),'files':pins,'root_called':False,'prepare_called':False,'production_changes':0},sort_keys=True))
          PY
