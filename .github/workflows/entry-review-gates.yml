name: Entry review and continuation gates
on:
  pull_request:
    paths: ['scripts/entry_review_gate.py', 'scripts/native_syntax_*.py', 'scripts/development_entry_intake.py', 'tests/test_*gate.py', 'tests/test_native_syntax_intake.py', 'ci/native-syntax/**', '.github/workflows/entry-review-gates.yml', '.github/workflows/development-entry-intake.yml']
permissions:
  contents: read
jobs:
  data-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install integrity-locked syntax checker without package scripts
        run: npm ci --prefix ci/native-syntax --ignore-scripts --no-audit --no-fund
      - name: Exercise mechanical syntax and continuation gates
        env:
          XJ_TYPESCRIPT_MODULE: ${{ github.workspace }}/ci/native-syntax/node_modules/typescript
        run: python3 -B -m unittest discover -s tests -v
