name: Entry review and continuation gates
on:
  push:
    branches: [proposal/issue19-review-continuation-20261012]
    paths: ['scripts/entry_review_gate.py', 'scripts/native_syntax_*.py', 'tests/test_*gate.py', 'tests/test_native_syntax_intake.py', '.github/workflows/entry-review-gates.yml', '.syntax/**']
  pull_request:
    paths: ['scripts/entry_review_gate.py', 'scripts/native_syntax_*.py', 'scripts/development_entry_intake.py', 'tests/test_*gate.py', 'tests/test_native_syntax_intake.py', '.github/workflows/entry-review-gates.yml', '.github/workflows/development-entry-intake.yml', '.syntax/**']
permissions:
  contents: read
jobs:
  data-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install fixed syntax checker without package scripts
        run: |
          install -d -m 700 "$RUNNER_TEMP/xj-syntax"
          cp .syntax/package.json .syntax/package-lock.json "$RUNNER_TEMP/xj-syntax/"
          npm ci --prefix "$RUNNER_TEMP/xj-syntax" --cache "$RUNNER_TEMP/xj-syntax/npm-cache" --ignore-scripts --no-audit --no-fund
      - name: Install Stage5 browser regression dependencies for full discovery
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Exercise mechanical syntax and continuation gates
        env:
          XJ_SYNTAX_ROOT: ${{ runner.temp }}/xj-syntax
          XJ_TYPESCRIPT_MODULE: ${{ runner.temp }}/xj-syntax/node_modules/typescript/lib/typescript.js
        run: python3 -B -m unittest discover -s tests -v
  python36-gates:
    # Persistent host execution is disabled until trusted admission and isolation exist.
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Fixed nonroot UK test boundary
        run: |
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          test "$(id -u)" != 0
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3,6)'
      - name: Install integrity-bound compiler in private test directory
        run: |
          install -d -m 700 "$RUNNER_TEMP/xj-syntax"
          cp .syntax/package.json .syntax/package-lock.json "$RUNNER_TEMP/xj-syntax/"
          npm ci --prefix "$RUNNER_TEMP/xj-syntax" --cache "$RUNNER_TEMP/xj-syntax/npm-cache" --ignore-scripts --no-audit --no-fund
      - name: UK Python36 exact-source gates
        env:
          XJ_SYNTAX_ROOT: ${{ runner.temp }}/xj-syntax
          XJ_TYPESCRIPT_MODULE: ${{ runner.temp }}/xj-syntax/node_modules/typescript/lib/typescript.js
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
