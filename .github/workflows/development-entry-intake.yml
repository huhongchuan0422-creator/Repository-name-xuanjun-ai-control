name: Three native development entry receipt
on:
  issue_comment:
    types: [created]
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -p 'test_development_entry_intake.py'
  receipt:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 17 &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.comment.body, '<!-- XJ_DEV_ENTRY ')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed syntax checker without package scripts
        run: npm install --prefix "$RUNNER_TEMP/xj-syntax" typescript@5.7.3 --ignore-scripts --no-audit --no-fund
      - name: Validate metadata and return receipt without executing code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XJ_TYPESCRIPT_MODULE: ${{ runner.temp }}/xj-syntax/node_modules/typescript
        run: python3 -B scripts/development_entry_intake.py

