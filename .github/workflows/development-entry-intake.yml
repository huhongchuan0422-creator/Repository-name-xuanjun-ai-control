name: Three native development entry receipt
on:
  issue_comment:
    types: [created]
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -p 'test_development_entry_intake.py'
  receipt:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 17 &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.comment.body, '<!-- XJ_DEV_ENTRY ')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install fixed syntax checker without package scripts
        run: |
          install -d -m 700 "$RUNNER_TEMP/xj-syntax"
          cp .syntax/package.json .syntax/package-lock.json "$RUNNER_TEMP/xj-syntax/"
          npm ci --prefix "$RUNNER_TEMP/xj-syntax" --ignore-scripts --no-audit --no-fund
      - name: Validate metadata and return receipt without executing code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XJ_SYNTAX_ROOT: ${{ runner.temp }}/xj-syntax
          XJ_TYPESCRIPT_MODULE: ${{ runner.temp }}/xj-syntax/node_modules/typescript/lib/typescript.js
        run: python3 -B scripts/development_entry_intake.py

