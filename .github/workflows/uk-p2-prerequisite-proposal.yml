name: P2 UK protected prerequisite proposal
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - evidence/p2-install-preparation-20261013/prepare_protected_prerequisite_proposal.py
      - .github/workflows/uk-p2-prerequisite-proposal.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind exact source and receipts, inspect fixed identity and payload conflicts without apply
        env:
          P2_CANARY_RUN: "${{ github.run_id }}"
        run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/prepare_protected_prerequisite_proposal.py "$P2_CANARY_RUN"
