name: Reviewed native probe execution
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  reviewed-probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'probe/chatgpt-native-') ||
       startsWith(github.event.pull_request.head.ref, 'probe/dots-'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Execute only reviewed probe bytes
        env:
          PROBE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 -I -B - <<'PY'
          import hashlib, pathlib, subprocess, sys, os
          if os.environ['PROBE_BRANCH'].startswith('probe/chatgpt-native-'):
              path=pathlib.Path('evidence/entry-probes/chatgpt/native_probe.py')
              approved='aa7c816200c0826900cca20e898e25cdd64a5b383218e0760a401b0ad114ade9'
              entry='CHATGPT'
          else:
              path=pathlib.Path('evidence/entry-probes/dots/test_receipt_binding.py')
              approved='ea8188e95eddcb8770023255d049da7ebcda9ecc3136fb4ca334c0cab86bc706'
              entry='DOTS'
          assert path.is_file() and not path.is_symlink()
          raw=path.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==approved, 'UNREVIEWED_PROBE_BYTES'
          result=subprocess.run([sys.executable,'-I','-B',str(path)],
              env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'},
              stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=5)
          assert result.returncode==0, 'PROBE_PROCESS_FAILED'
          if entry=='CHATGPT':
              assert result.stdout==b'CHATGPT_NATIVE_ENTRY_PROBE_PASS\n', 'UNEXPECTED_PROBE_OUTPUT'
          else:
              assert b'Ran 5 tests' in result.stderr and b'OK' in result.stderr, 'DOTS_TEST_RECEIPT_MISSING'
          print('REVIEWED_PROBE_CODE_EXECUTED_PASS')
          print('UK_HOST_TEST=NOT_RUN; QUOTA_ATTRIBUTION=UNKNOWN')
          PY
