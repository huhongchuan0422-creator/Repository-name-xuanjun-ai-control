name: P2 Retained Runtime Checkpoint
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - 'evidence/p2-epoch7-access-repair-20261014/runtime/**'
      - 'evidence/p2-epoch7-access-repair-20261014/runtime-process/**'
      - '.github/workflows/p2-retained-runtime.yml'
permissions:
  contents: read
concurrency:
  group: p2-retained-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime-process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checkout and immutable runtime bytes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('evidence/p2-epoch7-access-repair-20261014/runtime')
          raw = (root/'deploy/integration-manifest.json').read_bytes()
          manifest = json.loads(raw)
          for path, expected in manifest['files'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest() == expected, path
          controller = manifest['files']['stage1/native_gateway_controller.py']
          unit = (root/'deploy/xuanjun-development-dispatcher.service').read_text()
          commands = [line for line in unit.splitlines() if line.startswith(('ExecStart=', 'ExecStartPre='))]
          assert len(commands) == 3
          for line in commands:
              assert '--native-controller-sha256 ' + controller in line
          print('RUNTIME_MANIFEST_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('RUNTIME_SOURCE_HASHES_VERIFIED=' + str(len(manifest['files'])))
          print('PRODUCTION_EXECUTION=NOT_RUN')
          PY
      - name: Execute required bounded-process and ledger-identity tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: evidence/p2-epoch7-access-repair-20261014/runtime/stage1:evidence/p2-epoch7-access-repair-20261014/runtime-process
        run: |
          python -B - <<'PY'
          import sys, unittest
          names = ['test_runtime_command_lifetime', 'test_gateway_command_lifetime', 'test_ledger_server_identity']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          assert suite.countTestCases() >= 72, 'REQUIRED_TEST_DISCOVERY_REDUCED'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped, 'REQUIRED_TEST_FAILED_OR_SKIPPED'
          print('EVIDENCE_SCOPE=HOSTED_RUNTIME_CHECKPOINT_ONLY_NOT_FULL_KIT_OR_UK_ACCEPTANCE')
          PY
