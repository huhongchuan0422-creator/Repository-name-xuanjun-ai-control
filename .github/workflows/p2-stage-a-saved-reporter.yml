name: P2 Stage A Saved Reporter
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - 'evidence/p2-epoch7-access-repair-20261014/stage-a-saved-reporter/**'
      - 'evidence/p2-epoch7-access-repair-20261014/stage-a-saved-coverage/**'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7/export_saved_evidence.py'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7/verify_exported_evidence.py'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7/export_schema.py'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7/test_export_schema.py'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7/test_export_saved_evidence.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/epoch7_prepare_data.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/epoch7_topology_projection.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/test_epoch7_prepare_data_r7.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/test_epoch7_topology_projection.py'
      - 'evidence/p2-epoch7-access-repair-20261014/saved-evidence-r7-actual-20261015/packet.json'
      - 'evidence/p2-epoch7-access-repair-20261014/artifacts/epoch7-kit-dc18f73e.tar.gz'
      - 'tests/test_p2_stage_a_saved_reporter.py'
      - 'tests/test_p2_stage_a_saved_reporter_contract.py'
      - '.github/workflows/p2-stage-a-saved-reporter.yml'
      - 'governance/features.json'
permissions:
  contents: read
concurrency:
  group: p2-stage-a-saved-reporter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage-a-saved-reporter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify Stage A saved-only public fixture tests
        run: |
          set -euo pipefail
          python3 --version
          umask 0077
          # Hosted /home has a default ACL. Keep production checks unchanged:
          # use only a new disposable CI workspace under the verified filesystem root.
          python3 -I -B -S - <<'PY'
          import os, stat, errno
          for path in ('/',):
              info=os.lstat(path)
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and info.st_gid==0
              assert not info.st_mode & 0o7022
              for name in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,name,follow_symlinks=False)
                  except OSError as error: assert error.errno in (errno.ENODATA,errno.ENOTSUP)
                  else: raise RuntimeError('CI_STAGING_ANCESTRY_ACL')
          PY
          CI_ROOT=$(sudo /usr/bin/mktemp -d /xuanjun-p2-ci.XXXXXXXX)
          sudo /usr/bin/chown "$(id -u):$(id -g)" "$CI_ROOT"
          test "$(stat -c %a "$CI_ROOT")" = 700
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          EXPECTED_TREE=$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_SHA^{tree}")
          git -c core.hooksPath=/dev/null clone --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$CI_ROOT/repository"
          git -C "$CI_ROOT/repository" -c core.hooksPath=/dev/null checkout --detach "$GITHUB_SHA"
          test "$(git -C "$CI_ROOT/repository" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$CI_ROOT/repository" rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          mkdir -m 700 "$CI_ROOT/temp"
          export RUNNER_TEMP="$CI_ROOT/temp" TMPDIR="$CI_ROOT/temp"
          cd "$CI_ROOT/repository"
          python3 -I -B -S - <<'PY'
          import os, stat, json
          paths=set()
          for value in (os.getcwd(),os.environ.get('RUNNER_TEMP'),os.environ.get('HOME')):
              if not value: continue
              path=os.path.abspath(value)
              while True:
                  paths.add(path)
                  parent=os.path.dirname(path)
                  if parent==path: break
                  path=parent
          for path in sorted(paths):
              info=os.lstat(path)
              row={'path':path,'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode))}
              for key in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,key,follow_symlinks=False)
                  except OSError as error: row[key]={'errno':error.errno}
                  else: row[key]={'present':True}
              print('CI_ONLY_PATH_METADATA='+json.dumps(row,sort_keys=True))
          PY
          python3 -I -B -S tests/test_p2_stage_a_saved_reporter_contract.py -v
          python3 -I -B -S tests/test_p2_stage_a_saved_reporter.py -v
