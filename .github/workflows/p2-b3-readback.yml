name: P2 B3 R03 read-only recovery evidence
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - 'production/p2_install/rebind_readback.py'
      - 'tests/p2_install/test_rebind_readback.py'
      - '.github/workflows/p2-b3-readback.yml'
  pull_request:
    paths:
      - 'production/p2_install/rebind_readback.py'
      - 'tests/p2_install/test_rebind_readback.py'
      - '.github/workflows/p2-b3-readback.yml'
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B tests/p2_install/test_rebind_readback.py -v
