name: Legal Contract Drafts Candidate
on:
  pull_request:
    paths:
      - 'docs/legal/**'
      - 'docs/development/LEGAL_CONTRACT_CENTER_20261015.md'
      - 'demos/legal/**'
      - 'demos/community-local-e2e/*.html'
      - 'demos/visual/community-payment/index.html'
      - 'scripts/build_legal_previews.py'
      - 'tests/test_legal_contract_center.py'
      - 'scripts/contract_anchor_batch.py'
      - 'tests/test_contract_anchor_batch.py'
      - 'scripts/online_contract_candidate.py'
      - 'tests/test_online_contract_candidate.py'
      - '.github/workflows/legal-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_legal_contract_center.py -v
      - run: python -m unittest discover -s tests -p test_online_contract_candidate.py -v
      - run: python -m unittest discover -s tests -p test_contract_anchor_batch.py -v
      - run: python scripts/build_legal_previews.py && git diff --exit-code -- demos/legal
      - run: python scripts/feature_compliance_check.py
