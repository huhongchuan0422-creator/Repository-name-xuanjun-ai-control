name: P2 UK readonly legacy authority reconciliation
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - evidence/p2-install-preparation-20261013/reconcile_legacy_authority_readonly.py
      - .github/workflows/uk-p2-legacy-authority.yml
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/reconcile_legacy_authority_readonly.py
