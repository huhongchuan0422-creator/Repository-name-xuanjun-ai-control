name: PR122 Domestic Website Offline Candidate
on:
  pull_request:
    paths:
      - 'deploy/pr122-domestic-website/**'
      - 'deploy/pr122-minimal-cutover/**'
      - 'scripts/pr122_*website*.py'
      - 'tests/test_pr122_*'
      - 'deploy/pr122-oauth-candidate/**'
      - 'scripts/pr122_build_oauth_candidate.py'
      - 'docs/development/PR122_DOMESTIC_WEBSITE_OFFLINE_CANDIDATE_20261015.md'
      - 'governance/features.json'
      - '.github/workflows/pr122-domestic-website-candidate.yml'
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - 'deploy/pr122-domestic-website/**'
      - 'deploy/pr122-minimal-cutover/**'
      - 'scripts/pr122_*website*.py'
      - 'tests/test_pr122_*'
      - 'deploy/pr122-oauth-candidate/**'
      - 'scripts/pr122_build_oauth_candidate.py'
      - 'docs/development/PR122_DOMESTIC_WEBSITE_OFFLINE_CANDIDATE_20261015.md'
      - 'governance/features.json'
      - '.github/workflows/pr122-domestic-website-candidate.yml'
permissions:
  contents: read
jobs:
  offline-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Reuse exact unchanged OAuth audit; test changed inventory only
        run: |
          python - <<'PYCODE'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          expected = {'deploy/pr122-oauth-candidate/pr122_oauth_candidate/__init__.py': '22abbd4cf62b08e2bda4b51a2c53c9ce0839088efb1e877fbed23100c3de463b', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/core.py': '9de722f47b628f6eb216fb1ca160628345d74d2e7034e4524e4828d0a24c37d2', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/douyin.py': '2d2627d76b5d5f76a6046c5793f2f9721448923257e1155fcf08f3b459c6cb39', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/http_candidate.py': 'ad58f196ee306bc400831efa3c955956f882218917cd145baa33bcf932f4f66e', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/oauth.py': '4f0b0bc68e9b949b46c54b50ebad672d5e63028c59b0e999814a13f779f9c50a', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/storage.py': '646b0f379797534b3f0e5bc5ad9281be271c8fd30e7263ef7247ea755e2f0ac8', 'deploy/pr122-oauth-candidate/pr122_oauth_candidate/tiktok.py': '037bbdbb7be5b89f6991257ae6c39b7c8046cb60da9f9857fe9a09bb0b2d4235', 'tests/test_pr122_oauth_candidate.py': 'dce9e339266b9339c95f579434ecb146b4e94ec1dfad61e4031e7da178b85f52'}
          unchanged=all(Path(p).is_file() and hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in expected.items())
          if unchanged:
              print('OAUTH_SOURCE_AUDIT_REUSED=d584cd60b31bf09ee45f27a73ad227bcd0e1110f; SOURCE_AND_ARTIFACT_PASS; 45_TESTS_NOT_RERUN',flush=True)
              subprocess.run([sys.executable,'-B','tests/test_pr122_oauth_candidate.py','InventoryTests','-v'],check=True)
          else:
              subprocess.run([sys.executable,'-B','tests/test_pr122_oauth_candidate.py','-v'],check=True)
          PYCODE
      - name: Install isolated CI Nginx dependency
        run: sudo apt-get install --no-install-recommends -y nginx
      - run: python -m unittest tests/test_pr122_website_release.py -v
      - run: python -m unittest tests/test_pr122_csp_browser.py -v
      - run: node --test tests/test_pr122_tiktok_integration.mjs
      - run: python -m py_compile scripts/pr122_build_website_candidate.py scripts/pr122_website_release.py
      - run: bash -n deploy/pr122-domestic-website/tls/*.sh
      - run: python scripts/feature_compliance_check.py
      - name: Package minimal cutover source for independent review (no installer)
        run: |
          python - <<'PY'
          import gzip, hashlib, io, json, os, tarfile
          from pathlib import Path
          root = Path(".")
          out = Path(os.environ["RUNNER_TEMP"]) / "pr122-minimal-review"
          out.mkdir(mode=0o700)
          paths = sorted(p for p in (root/"deploy/pr122-minimal-cutover").rglob("*") if p.is_file())
          paths += [root/"scripts/pr122_domestic_channel_inventory.py",
                    root/"scripts/pr122_website_release.py",
                    root/"tests/test_pr122_website_release.py",
                    root/"plans/XUANJUN_DOMAIN_DNS_UK_DOMESTIC_MIGRATION_MASTER_20261015.md",
                    root/"governance/features.json",
                    root/".github/workflows/pr122-domestic-website-candidate.yml",
                    root/".github/workflows/v27-four-server-batch-readonly.yml"]
          binding = {
              "schema_version":1,
              "status":"REVIEW_ONLY_NO_INSTALLER",
              "commit":os.environ["GITHUB_SHA"],
              "run_id":os.environ["GITHUB_RUN_ID"],
              "production_approved":False,
              "files":{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          }
          package = out/"PR122_MINIMAL_CUTOVER_REVIEW.tar.gz"
          with package.open("xb") as raw, gzip.GzipFile(filename="",mode="wb",fileobj=raw,mtime=0) as compressed:
              with tarfile.open(fileobj=compressed,mode="w") as archive:
                  entries = [(str(p),p.read_bytes()) for p in paths]
                  entries.append(("REVIEW_BINDING.json",(json.dumps(binding,indent=2,sort_keys=True)+"\n").encode()))
                  for name,data in entries:
                      info = tarfile.TarInfo(name)
                      info.size = len(data)
                      info.mode = 0o444
                      info.mtime = 0
                      archive.addfile(info,io.BytesIO(data))
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          (out/"SHA256SUMS").write_text(digest+"  "+package.name+"\n")
          print("REVIEW_PACKAGE_SHA256="+digest)
          print("PACKAGE_STATUS=REVIEW_ONLY_NO_INSTALLER")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-minimal-cutover-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr122-minimal-review/
          if-no-files-found: error
          retention-days: 14


