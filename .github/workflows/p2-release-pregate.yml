name: P2 release pre-gate exact authoritative artifact
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - .github/workflows/p2-release-pregate.yml
permissions:
  contents: read
  actions: read
env:
  P2_ARTIFACT_ID: "11787198841"
  P2_TAR_SHA256: "3ff24eccf3a09e87b89128d33da78ae7b4ac260051a08c3c8d9814090ce3c6cd"
  P2_SOURCE_COMMIT: "566b2bccd70ad4c722526af7587344214a9cb235"
  P2_SOURCE_TREE: "d8fadff02fba7181b6c798f0ac35fe5a9480f342"
  P2_MANIFEST_SHA256: "fe73feb4435f8f32313a86e9d434a4a6a7b994492f731b1c62dd7de801e7a69c"
  QA_SECURITY_RUN: "38336480483"
  UK_VERIFY_RUN: "38336482564"
jobs:
  release-pregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact successful prerequisite runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in "$QA_SECURITY_RUN" "$UK_VERIFY_RUN"; do
            status="$(gh api "repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/runs/$run" --jq '.status+":"+(.conclusion//"")')"
            test "$status" = "completed:success" || {
              echo "P2_PREREQUISITE_NOT_SUCCESS=$run:$status"
              exit 41
            }
          done
      - name: Download exact authoritative P2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-release-gate /tmp/p2-release-pkg
          mkdir /tmp/p2-release-gate /tmp/p2-release-pkg
          gh api repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/$P2_ARTIFACT_ID/zip > /tmp/p2-release-gate.zip
          python3 -I -B - <<'PY'
          import hashlib,io,os,tarfile,zipfile
          raw=zipfile.ZipFile('/tmp/p2-release-gate.zip').read('p2-candidate.tar.gz')
          assert hashlib.sha256(raw).hexdigest()==os.environ['P2_TAR_SHA256']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              seen=set()
              for item in tf.getmembers():
                  parts=item.name.split('/')
                  assert item.isfile() and parts[0]=='xuanjun-p2-package'
                  assert all(p not in ('','.', '..') for p in parts)
                  assert item.name not in seen
                  seen.add(item.name)
              tf.extractall('/tmp/p2-release-pkg')
          open('/tmp/p2-release-gate/p2-candidate.tar.gz','wb').write(raw)
          PY
      - name: Verify with authoritative freezer and real release installer
        run: |
          set -euo pipefail
          ROOT=/tmp/p2-release-pkg/xuanjun-p2-package
          python3 "$ROOT/tools/p2-package-freeze.py" verify             --archive /tmp/p2-release-gate/p2-candidate.tar.gz             --sha256 "$P2_TAR_SHA256"             --source-commit "$P2_SOURCE_COMMIT"             --source-tree "$P2_SOURCE_TREE"
          python3 -I -B - <<'PY'
          import importlib.util,os
          root='/tmp/p2-release-pkg/xuanjun-p2-package'
          spec=importlib.util.spec_from_file_location('installer',root+'/scripts/uk-integration-install.py')
          installer=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          installer.verify(root,root+'/deploy/integration-manifest.json',
              os.environ['P2_SOURCE_COMMIT'],os.environ['P2_MANIFEST_SHA256'],
              os.environ['P2_SOURCE_TREE'])
          print('P2_RELEASE_PREGATE_REAL_INSTALLER_VERIFY=PASS')
          PY
          echo P2_RELEASE_READY_FOR_INDEPENDENT_APPROVAL=YES
          echo P2_RELEASE_GRANTED=NO
          echo INSTALL_EXECUTED=NO
          echo MODEL_CALLS=0
