name: P2 release pre-gate exact authoritative artifact
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - .github/workflows/p2-release-pregate.yml
permissions:
  contents: read
  actions: read
env:
  P2_ARTIFACT_ID: "11796280855"
  P2_TAR_SHA256: "66cc89391b1bf4d0bdee7293ecc0fcc3ef2b3b7969da9abc72771d41042c38fd"
  P2_SOURCE_COMMIT: "f01148fdeaa60c0a6dc1e9d30e9e707b61a65c06"
  P2_SOURCE_TREE: "3fc23b2a01bd8f01ea0edcef9216ded7313409c2"
  P2_MANIFEST_SHA256: "afce7dc6b5207be938c7f12619bb36073530f6f2a883353335bdcf8cc4fa3601"
  QA_SECURITY_RUN: "38363859202"
  QA_SECURITY_HEAD: "833294374fedf21b1e8cd2eb49da4079cd0938ad"
  UK_VERIFY_RUN: "38363859135"
  UK_VERIFY_HEAD: "833294374fedf21b1e8cd2eb49da4079cd0938ad"
jobs:
  release-pregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact successful prerequisite runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64, json, os, re, subprocess
          
          REPO = 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control'
          REPO_ID = 1413132159
          BRANCH = 'repair/p2-chatgpt-clean-review-20261013'
          KEYS = ('P2_ARTIFACT_ID', 'P2_TAR_SHA256', 'P2_SOURCE_COMMIT',
                  'P2_SOURCE_TREE', 'P2_MANIFEST_SHA256')
          
          def require(ok, reason):
              if not ok:
                  raise ValueError('P2_PREREQUISITE_HOLD_' + reason)
          
          def api(endpoint):
              raw = subprocess.check_output(['gh', 'api', endpoint], timeout=30)
              require(len(raw) <= 2 * 1024 * 1024, 'RESPONSE_BOUND')
              return json.loads(raw.decode('utf-8'))
          
          def frozen_env(source):
              require(isinstance(source, str) and len(source) <= 128 * 1024, 'WORKFLOW_BOUND')
              lines = source.splitlines()
              require(lines.count('env:') == 1, 'ENV_BLOCK')
              start = lines.index('env:') + 1
              result = {}
              for line in lines[start:]:
                  if line and not line.startswith(' '):
                      break
                  match = re.fullmatch(r'  ([A-Z0-9_]+): "([^"\r\n]*)"', line)
                  if match and match.group(1) in KEYS:
                      key, value = match.groups()
                      require(key not in result, 'DUPLICATE_BINDING')
                      result[key] = value
              require(set(result) == set(KEYS), 'MISSING_BINDING')
              return result
          
          def validate(run, pages, source, run_id, head, path, jobs, runner):
              require(type(run_id) is int and type(run.get('id')) is int
                      and run['id'] == run_id, 'RUN_ID')
              require(run.get('repository', {}).get('full_name') == REPO
                      and run.get('repository', {}).get('id') == REPO_ID, 'REPOSITORY')
              require(run.get('event') == 'push' and run.get('head_branch') == BRANCH, 'EVENT')
              require(run.get('head_sha') == head and run.get('path') == path, 'WORKFLOW_HEAD')
              require(run.get('run_attempt') == 1, 'ATTEMPT')
              require(run.get('status') == 'completed'
                      and run.get('conclusion') == 'success', 'RUN_STATUS')
              require(frozen_env(source) == {key: os.environ[key] for key in KEYS}, 'ARTIFACT_BINDING')
              require(isinstance(pages, list) and pages and len(pages) <= 10, 'JOB_PAGES')
              total = pages[0].get('total_count')
              rows = []
              for page in pages:
                  require(page.get('total_count') == total and isinstance(page.get('jobs'), list), 'JOB_PAGE')
                  rows.extend(page['jobs'])
              require(type(total) is int and total == len(rows) == len(jobs), 'JOB_COMPLETENESS')
              require({row.get('name') for row in rows} == set(jobs), 'JOB_NAMES')
              require(len({row.get('id') for row in rows}) == len(rows), 'DUPLICATE_JOB')
              for row in rows:
                  require(row.get('run_id') == run_id and row.get('run_attempt') == 1, 'JOB_RUN')
                  require(row.get('head_sha') == head and row.get('status') == 'completed'
                          and row.get('conclusion') == 'success', 'JOB_STATUS')
                  steps = row.get('steps')
                  require(isinstance(steps, list) and steps, 'STEPS_MISSING')
                  require(all(step.get('status') == 'completed' and step.get('conclusion') == 'success'
                              for step in steps), 'STEP_NOT_SUCCESS')
                  require(set(jobs[row['name']]) <= {step.get('name') for step in steps}, 'REQUIRED_STEPS')
                  if runner:
                      require(row.get('runner_name') == runner, 'UK_RUNNER')
          
          def check(run_id, head, path, jobs, runner=None):
              run = api('repos/' + REPO + '/actions/runs/' + str(run_id))
              response = subprocess.check_output(
                  ['gh', 'api', '--paginate', '--slurp',
                   'repos/' + REPO + '/actions/runs/' + str(run_id) + '/attempts/1/jobs?per_page=100'],
                  timeout=30)
              require(len(response) <= 2 * 1024 * 1024, 'JOB_RESPONSE_BOUND')
              pages = json.loads(response.decode('utf-8'))
              contents = api('repos/' + REPO + '/contents/' + path + '?ref=' + head)
              require(contents.get('encoding') == 'base64', 'WORKFLOW_ENCODING')
              source = base64.b64decode(contents['content'], validate=False).decode('utf-8')
              validate(run, pages, source, run_id, head, path, jobs, runner)
              latest = api('repos/' + REPO + '/actions/runs/' + str(run_id))
              require((latest.get('run_attempt'), latest.get('status'), latest.get('conclusion'))
                      == (1, 'completed', 'success'), 'RUN_CHANGED')
              print('P2_EXACT_PREREQUISITE_VERIFIED=' + str(run_id))
          
          check(int(os.environ['QA_SECURITY_RUN']), os.environ['QA_SECURITY_HEAD'],
                '.github/workflows/p2-frozen-candidate-gates.yml',
                {'qa': ('Verify freezer and real release installer',),
                 'security': ('Download and inspect exact artifact',)})
          check(int(os.environ['UK_VERIFY_RUN']), os.environ['UK_VERIFY_HEAD'],
                '.github/workflows/uk-p2-frozen-candidate-verify.yml',
                {'verify': ('Python 3.6.8 WAL pagination and relay boundedness regressions',
                            'Verify exact package through real installer on UK')},
                'iZd7oeikknn1z21sq6ji6zZ')
          
          PY
      - name: Download exact authoritative P2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-release-gate /tmp/p2-release-pkg
          mkdir /tmp/p2-release-gate /tmp/p2-release-pkg
          gh api repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/$P2_ARTIFACT_ID/zip > /tmp/p2-release-gate.zip
          python3 -I -B - <<'PY'
          import hashlib,io,os,tarfile,zipfile
          raw=zipfile.ZipFile('/tmp/p2-release-gate.zip').read('p2-candidate.tar.gz')
          assert hashlib.sha256(raw).hexdigest()==os.environ['P2_TAR_SHA256']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              seen=set()
              for item in tf.getmembers():
                  parts=item.name.split('/')
                  assert item.isfile() and parts[0]=='xuanjun-p2-package'
                  assert all(p not in ('','.', '..') for p in parts)
                  assert item.name not in seen
                  seen.add(item.name)
              tf.extractall('/tmp/p2-release-pkg')
          open('/tmp/p2-release-gate/p2-candidate.tar.gz','wb').write(raw)
          PY
      - name: Verify with authoritative freezer and real release installer
        run: |
          set -euo pipefail
          ROOT=/tmp/p2-release-pkg/xuanjun-p2-package
          python3 "$ROOT/tools/p2-package-freeze.py" verify             --archive /tmp/p2-release-gate/p2-candidate.tar.gz             --sha256 "$P2_TAR_SHA256"             --source-commit "$P2_SOURCE_COMMIT"             --source-tree "$P2_SOURCE_TREE"
          python3 -I -B - <<'PY'
          import importlib.util,os
          root='/tmp/p2-release-pkg/xuanjun-p2-package'
          spec=importlib.util.spec_from_file_location('installer',root+'/scripts/uk-integration-install.py')
          installer=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          installer.verify(root,root+'/deploy/integration-manifest.json',
              os.environ['P2_SOURCE_COMMIT'],os.environ['P2_MANIFEST_SHA256'],
              os.environ['P2_SOURCE_TREE'])
          print('P2_RELEASE_PREGATE_REAL_INSTALLER_VERIFY=PASS')
          PY
          echo P2_RELEASE_READY_FOR_INDEPENDENT_APPROVAL=YES
          echo P2_RELEASE_GRANTED=NO
          echo INSTALL_EXECUTED=NO
          echo MODEL_CALLS=0
