name: P2 historical standalone readiness measurements
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
          path: p2-readiness-${{ github.run_id }}
      - name: Consolidated metadata and disposable authority fixture; no production install
        working-directory: p2-readiness-${{ github.run_id }}
        run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/consolidated_readiness.py "${{ github.run_id }}"
