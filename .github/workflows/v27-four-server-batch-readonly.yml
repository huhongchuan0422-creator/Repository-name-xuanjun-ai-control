name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [build/tokyo-korea-migration-prep-20261014]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh tokyo
  korea:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh korea
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic
  korea-phase-c-fixed-channel-inspect:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.actor == 'huhongchuan0422-creator' &&
      github.ref == 'refs/heads/build/tokyo-korea-migration-prep-20261014' &&
      github.event.head_commit.message == 'PR99_PHASE_C_FIXED_CHANNEL_INSPECT_ONCE_6213125007' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 2
    steps:
      - name: Invoke installed fixed inspect once without checkout or install
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          test "$(hostname -s)" = iZmj7a5kwr75qc1tul4kf9Z
          test "$(id -un)" = githubrunner
          test "$(id -u)" = 1001
          for p in /usr /usr/local /usr/local/sbin /usr/local/libexec; do
            test -d "$p" && test ! -L "$p"
            test "$(stat -c %u "$p")" = 0
            m=$(stat -c %a "$p")
            (( (8#$m & 0022) == 0 ))
          done
          p=/usr/local/sbin/xuanjun-pr99-phase-c
          test -f "$p" && test ! -L "$p"
          test "$(stat -c %u:%a:%h "$p")" = 0:755:1
          printf '%s  %s\n' 7fc89a85734a84c0ca8787423042bfaa98bd813c579ba71f774cd3a6a2086d76 "$p" | sha256sum -c -
          p=/usr/local/libexec/xuanjun-pr99-phase-c-channel.py
          test -f "$p" && test ! -L "$p"
          test "$(stat -c %u:%a:%h "$p")" = 0:444:1
          printf '%s  %s\n' a40371227b95a5fe78631b7c9e49c9b089dfeff8cf82175b9e8ca3f04c0c6497 "$p" | sha256sum -c -
          echo PR99_CHANNEL_RECEIPT_BEGIN
          /usr/bin/sudo -n /usr/local/sbin/xuanjun-pr99-phase-c inspect
          echo PR99_CHANNEL_RECEIPT_END
          echo CHANNEL_INSTALLED_BYTE_CHECK=PASS FIXED_INSPECT=PASS PHASE_C_INSTALL=NOT_CALLED SERVICE_ACTIONS=0

  phase-c-binding-metadata:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.actor == 'huhongchuan0422-creator' &&
      github.ref == 'refs/heads/build/tokyo-korea-migration-prep-20261014' &&
      github.event.head_commit.message == 'PR99_PHASE_C_BINDING_METADATA_ONCE_20261016' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: korea
            label: xuanjun-korea-binance
          - side: tokyo
            label: xuanjun-tokyo-readonly
    runs-on: [self-hosted, Linux, X64, "${{ matrix.label }}"]
    timeout-minutes: 2
    steps:
      - name: New worker allocation and DNS / source file identity only; no checkout
        env:
          XJ_SIDE: ${{ matrix.side }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/python3.11 -I -B - <<'PY'
          import grp,ipaddress,json,os,pwd,socket,stat,time
          from pathlib import Path
          side=os.environ["XJ_SIDE"]
          hosts={"korea":"iZmj7a5kwr75qc1tul4kf9Z","tokyo":"iZ6wee8q9z4t03hvqumwfhZ"}
          assert os.geteuid()==1001 and os.uname().nodename==hosts[side]
          report={"schema_version":1,"host":hosts[side],"side":side,"observed_epoch":int(time.time()),"delivery_commit":os.environ["GITHUB_SHA"],"uid":os.geteuid(),"scope":"NEW_BINDING_METADATA_ONLY","database_opened":False,"credentials_read":False,"http_requests":0,"sudo_calls":0,"service_actions":0,"production_changes":0}
          def metadata(name):
              try:
                  s=Path(name).lstat()
                  return {"status":"OBSERVED","uid":s.st_uid,"gid":s.st_gid,"mode":oct(stat.S_IMODE(s.st_mode)),"device":s.st_dev,"inode":s.st_ino,"size":s.st_size,"mtime_ns":s.st_mtime_ns,"regular":stat.S_ISREG(s.st_mode),"symlink":stat.S_ISLNK(s.st_mode)}
              except FileNotFoundError:return {"status":"ABSENT"}
              except PermissionError:return {"status":"UNKNOWN_PERMISSION_DENIED"}
          report["new_candidate_paths"]={p:metadata(p) for p in ("/opt/xuanjun-binance-phase-c","/etc/xuanjun-binance-phase-c","/var/lib/xuanjun-binance-phase-c")}
          if side=="korea":
              users=pwd.getpwall();groups=grp.getgrall()
              candidates=list(range(1986,1996))
              named_users=[u for u in users if u.pw_name=="xuanjun_binance_shadow"]
              named_groups=[g for g in groups if g.gr_name=="xuanjun_binance_shadow"]
              report["worker_name"]={"user_present":bool(named_users),"group_present":bool(named_groups),"uid":named_users[0].pw_uid if len(named_users)==1 else None,"gid":named_groups[0].gr_gid if len(named_groups)==1 else None}
              report["unallocated_uid_gid_candidates"]=[u for u in candidates if not any(v.pw_uid==u for v in users) and not any(v.gr_gid==u for v in groups)]
              report["broker_identity"]=[{"uid":u.pw_uid,"gid":u.pw_gid,"nologin":u.pw_shell in ("/sbin/nologin","/usr/sbin/nologin")} for u in users if u.pw_name=="xuanjun_binance"]
              try:
                  ips=sorted(set(row[4][0] for row in socket.getaddrinfo("fapi.binance.com",443,type=socket.SOCK_STREAM)))
                  report["binance_dns"]={"status":"RESOLVED_NO_HTTP","host":"fapi.binance.com","public_addresses":[v for v in ips if ipaddress.ip_address(v).is_global],"observed_epoch":int(time.time()),"api_permission_proven":False,"egress_policy_loaded":False}
              except OSError as e:report["binance_dns"]={"status":"UNKNOWN_DNS_ERROR","error_type":type(e).__name__}
          else:
              root="/opt/trading-system/database/data/trading.db"
              report["source_database_metadata"]={p:metadata(p) for p in (root,root+"-wal",root+"-shm")}
              report["actual_schema"]="NOT_READ"
              report["actual_orders_and_protection"]="NOT_READ"
          report["status"]="BINDING_METADATA_COLLECTED_NOT_INSTALL_OR_LIVE_ACCEPTANCE"
          print("PR99_C_BINDING_PREFLIGHT_RECEIPT="+json.dumps(report,sort_keys=True))
          
          PY

  tokyo-ssh-public-host-identity:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.actor == 'huhongchuan0422-creator' &&
      github.ref == 'refs/heads/build/tokyo-korea-migration-prep-20261014' &&
      github.event.head_commit.message == 'PR99_TOKYO_SSH_PUBLIC_HOST_IDENTITY_ONCE' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - name: Read fixed root-owned public host keys only; no private key or ssh login
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/python3.11 -I -B - <<'PY'
          import base64,hashlib,json,os,stat
          from pathlib import Path
          assert os.geteuid()==1001 and os.uname().nodename=="iZ6wee8q9z4t03hvqumwfhZ"
          rows=[]
          for name in ("ssh_host_ecdsa_key.pub","ssh_host_ed25519_key.pub","ssh_host_rsa_key.pub"):
           p=Path("/etc/ssh")/name
           try:
            for parent in reversed(p.parents):
             s=parent.lstat();assert stat.S_ISDIR(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022
            fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
            with os.fdopen(fd,"rb") as f:
             s=os.fstat(f.fileno());assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and s.st_nlink==1 and not s.st_mode&0o022
             raw=f.read(16385);assert len(raw)<=16384
             after=os.fstat(f.fileno())
            current=p.lstat()
            fields=("st_dev","st_ino","st_size","st_mtime_ns","st_ctime_ns")
            assert all(getattr(s,k)==getattr(after,k)==getattr(current,k) for k in fields)
            parts=raw.decode("ascii").strip().split()
            assert len(parts)>=2 and parts[0] in ("ecdsa-sha2-nistp256","ecdsa-sha2-nistp384","ecdsa-sha2-nistp521","ssh-ed25519","ssh-rsa")
            key=base64.b64decode(parts[1],validate=True)
            assert 0<len(key)<8192
            rows.append({"file":name,"type":parts[0],"public_key":parts[0]+" "+parts[1],"fingerprint":"SHA256:"+base64.b64encode(hashlib.sha256(key).digest()).decode().rstrip("="),"uid":s.st_uid,"mode":oct(stat.S_IMODE(s.st_mode))})
           except FileNotFoundError:rows.append({"file":name,"status":"ABSENT"})
           except PermissionError:rows.append({"file":name,"status":"UNREADABLE"})
          assert any("public_key" in row for row in rows)
          print("PR99_TOKYO_SSH_PUBLIC_HOST_IDENTITY="+json.dumps({"host":os.uname().nodename,"uid":os.geteuid(),"delivery_commit":os.environ["GITHUB_SHA"],"public_host_keys":rows,"private_keys_read":False,"production_changes":0},sort_keys=True))
          
          PY

  offline-environment-and-remaining-channel-metadata:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.actor == 'huhongchuan0422-creator' &&
      github.ref == 'refs/heads/build/tokyo-korea-migration-prep-20261014' &&
      github.event.head_commit.message == 'PR99_OFFLINE_ENV_AND_CHANNEL_METADATA_ONCE_20261016' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: korea
            label: xuanjun-korea-binance
          - side: tokyo
            label: xuanjun-tokyo-readonly
    runs-on: [self-hosted, Linux, X64, "${{ matrix.label }}"]
    timeout-minutes: 3
    steps:
      - name: New environment metadata and remaining Tokyo responsibilities; no checkout or sudo
        env:
          XJ_SIDE: ${{ matrix.side }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/python3.11 -I -B - <<'PY'
          import hashlib,ipaddress,json,os,stat,subprocess,time
          from pathlib import Path
          side=os.environ["XJ_SIDE"]
          hosts={"korea":"iZmj7a5kwr75qc1tul4kf9Z","tokyo":"iZ6wee8q9z4t03hvqumwfhZ"}
          assert os.geteuid()==1001 and os.uname().nodename==hosts[side]
          r={"schema_version":1,"host":hosts[side],"side":side,"uid":os.geteuid(),"delivery_commit":os.environ["GITHUB_SHA"],"epoch":int(time.time()),"sudo_calls":0,"database_opened":False,"credentials_read":False,"http_requests":0,"service_actions":0,"production_changes":0}
          def call(args):
           p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=20)
           return p
          def props(unit):
           p=call(["systemctl","show",unit,"-p","Id","-p","User","-p","WorkingDirectory","-p","FragmentPath","-p","ActiveState","-p","SubState","-p","MainPID","--no-pager"])
           return {"exit":p.returncode,"metadata":dict(x.split("=",1) for x in p.stdout.splitlines() if "=" in x)}
          def port_scopes():
           p=call(["ss","-H","-lnt"])
           result=[]
           for line in p.stdout.splitlines():
            x=line.split()
            if len(x)<4:continue
            raw=x[3]
            try:host,port=raw.rsplit(":",1);port=int(port)
            except ValueError:continue
            if port not in (22,80,443,18080,18443,18761,18770,18780,18781,19443,19444):continue
            host=host.strip("[]")
            try:kind="loopback" if ipaddress.ip_address(host).is_loopback else ("wildcard" if ipaddress.ip_address(host).is_unspecified else "bound_address")
            except ValueError:kind="wildcard" if host=="*" else "unknown"
            result.append({"port":port,"bind_scope":kind})
           return {"exit":p.returncode,"listeners":result}
          r["scoped_listeners"]=port_scopes()
          if side=="korea":
           expected={"ccxt":"4.5.78","cryptography":"50.0.1","loguru":"0.7.3","numpy":"2.4.6","pandas":"3.0.5","pymysql":"1.2.2","python-dotenv":"1.2.3","pyyaml":"6.0.3","redis":"8.1.0","requests":"2.34.2","sqlalchemy":"2.0.54","ta":"0.11.0","websocket-client":"1.9.2"}
           root=Path("/opt/xuanjun-binance-offline-env-20261016")
           for d in (Path("/opt"),root,root/"venv",root/"venv/bin"):
            s=d.lstat();assert stat.S_ISDIR(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022,"UNTRUSTED_ENVIRONMENT_CHAIN"
           py=root/"venv/bin/python"
           s=py.lstat();assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022
           code="import importlib.metadata as m,json; names="+repr(tuple(expected))+";print(json.dumps({n:m.version(n) for n in names},sort_keys=True))"
           p=call([str(py),"-I","-B","-c",code]);assert p.returncode==0,"PACKAGE_METADATA_READ_FAILED"
           actual=json.loads(p.stdout);assert actual==expected,"TARGET_PACKAGES_DRIFTED"
           r["dependency_environment"]={"status":"13_EXACT_PACKAGE_VERSIONS_READ_BACK","versions":actual,"interpreter_sha256":hashlib.sha256(py.read_bytes()).hexdigest(),"production_imports":0,"third_party_modules_imported":False,"root_private_receipts_read":False}
           r["existing_phase_b_service"]=props("xuanjun-binance-shadow.service")
           p=call(["systemctl","is-enabled","xuanjun-binance-shadow.service"]);r["existing_phase_b_enabled"]=p.stdout.strip()
           info=r["existing_phase_b_service"]["metadata"];assert info.get("ActiveState")=="inactive" and info.get("MainPID")=="0" and r["existing_phase_b_enabled"]=="disabled"
           r["phase_b_current"]=os.readlink("/opt/xuanjun-binance/current")
           assert r["phase_b_current"]=="/opt/xuanjun-binance/releases/f887b085508e3ed4"
           r["status"]="KOREA_NEW_ENV_METADATA_AND_STOPPED_PHASE_B_PASS"
          else:
           p=call(["systemctl","list-units","--type=service","--state=running","--no-legend","--plain","--no-pager"])
           assert p.returncode==0,"SERVICE_LIST_UNREADABLE"
           names=[line.split()[0] for line in p.stdout.splitlines() if line.split() and line.split()[0].endswith(".service")]
           r["running_services_count"]=len(names)
           r["service_list_truncated"]=len(names)>100
           rows=[]
           for name in names[:100]:
            v=props(name);meta=v["metadata"]
            if meta.get("FragmentPath","").startswith("/etc/systemd/system/") or name in ("nginx.service","sshd.service"):
             rows.append(v)
           r["running_custom_and_entry_services"]=rows
           p=call(["systemctl","list-timers","--all","--no-legend","--no-pager"])
           timers=[]
           for line in p.stdout.splitlines():
            x=line.split()
            if len(x)>=2 and x[-2].endswith(".timer"):
             timers.append({"timer":x[-2],"activates":x[-1]})
           r["loaded_timers"]={"exit":p.returncode,"items":timers}
           r["portal_entry_identity"]={}
           path=Path("/opt/trading-system/scripts/secure_secrets_portal_server.py")
           try:
            s=path.lstat();assert stat.S_ISREG(s.st_mode) and not s.st_mode&0o022
            data=path.read_bytes();after=path.lstat();assert (s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns)
            r["portal_entry_identity"]={"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data),"uid":s.st_uid}
           except PermissionError:r["portal_entry_identity"]={"status":"UNKNOWN_PERMISSION_DENIED"}
           r["root_and_admin_crontabs"]="NOT_READ_NONROOT"
           r["source_database_and_business_state"]="NOT_READ"
           r["channel_configuration_and_credentials"]="NOT_READ"
           r["status"]="TOKYO_REMAINING_DEPENDENCY_METADATA_COLLECTED_NOT_MIGRATED"
          print("PR99_OFFLINE_ENV_CHANNEL_RECEIPT="+json.dumps(r,sort_keys=True))
          
          PY

  tokyo-current-source-and-wal-metadata:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.actor == 'huhongchuan0422-creator' &&
      github.ref == 'refs/heads/build/tokyo-korea-migration-prep-20261014' &&
      github.event.head_commit.message == 'PR99_CURRENT_SOURCE_IDENTITY_ONCE_6215371855' &&
      github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 3
    steps:
      - name: Current selected source identity and DB/WAL metadata; no checkout or sudo
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/python3.11 -I -B - <<'PY'
          import hashlib,json,os,stat,subprocess,time
          from pathlib import Path
          assert os.geteuid()==1001 and os.uname().nodename=="iZ6wee8q9z4t03hvqumwfhZ"
          root=Path("/opt/trading-system")
          excluded={".git",".venv","venv","node_modules","__pycache__",".pytest_cache","site-packages","runtime","logs","backups","secrets","credentials","config","state","data"}
          rows=[];unknown=[];budget=0;started=time.monotonic()
          for base,dirs,files in os.walk(root,followlinks=False):
           dirs[:]=sorted(d for d in dirs if d.lower() not in excluded and not d.startswith(".") and not (Path(base)/d).is_symlink())
           for leaf in sorted(files):
            dependency=leaf in {"pyproject.toml","setup.cfg","Pipfile","Pipfile.lock","poetry.lock","uv.lock"} or leaf.endswith(".txt") and leaf.startswith(("requirements","constraints"))
            if leaf.startswith(".") or not (dependency or leaf.endswith((".py",".pyi",".sql",".sh"))):continue
            p=Path(base)/leaf;rel=str(p.relative_to(root))
            assert len(rows)+len(unknown)<20000 and time.monotonic()-started<90,"INVENTORY_BUDGET"
            try:
             s=p.lstat()
             if not stat.S_ISREG(s.st_mode) or s.st_uid not in (0,1000) or s.st_mode&0o022 or s.st_nlink!=1:
              unknown.append({"path":rel,"reason":"IDENTITY_NOT_ACCEPTED"});continue
             if not 0<=s.st_size<=64*1048576:unknown.append({"path":rel,"reason":"SIZE_LIMIT"});continue
             budget+=s.st_size;assert budget<=512*1048576,"SOURCE_SIZE_BUDGET"
             fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
             with os.fdopen(fd,"rb") as f:
              first=os.fstat(f.fileno());h=hashlib.sha256();count=0
              for block in iter(lambda:f.read(1048576),b""):h.update(block);count+=len(block)
              after=os.fstat(f.fileno())
             current=p.lstat();fields=("st_dev","st_ino","st_size","st_mtime_ns","st_ctime_ns")
             if not count==first.st_size or any(getattr(first,k)!=getattr(after,k) or getattr(after,k)!=getattr(current,k) for k in fields):
              unknown.append({"path":rel,"reason":"CHANGED_DURING_READ"});continue
             rows.append({"path":rel,"sha256":h.hexdigest(),"bytes":count,"mtime_ns":current.st_mtime_ns,"dependency_manifest":dependency})
            except (PermissionError,FileNotFoundError):unknown.append({"path":rel,"reason":"UNREADABLE_OR_CHANGED"})
          rows.sort(key=lambda x:x["path"]);aggregate=hashlib.sha256()
          for row in rows:aggregate.update((row["path"]+"\0"+row["sha256"]+"\0"+str(row["bytes"])+"\n").encode())
          def identity(p):
           try:
            s=Path(p).lstat()
            return {"present":True,"regular":stat.S_ISREG(s.st_mode),"symlink":stat.S_ISLNK(s.st_mode),"uid":s.st_uid,"gid":s.st_gid,"mode":oct(stat.S_IMODE(s.st_mode)),"bytes":s.st_size,"device":s.st_dev,"inode":s.st_ino,"mtime_ns":s.st_mtime_ns}
           except FileNotFoundError:return {"present":False}
           except PermissionError:return {"status":"UNKNOWN_PERMISSION"}
          env=dict(os.environ,GIT_OPTIONAL_LOCKS="0",GIT_TERMINAL_PROMPT="0")
          g=subprocess.run(["git","--no-optional-locks","-c","safe.directory=/opt/trading-system","-C",str(root),"rev-parse","--verify","HEAD"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,env=env,timeout=15)
          head=g.stdout.strip() if g.returncode==0 and len(g.stdout.strip())==40 else "UNKNOWN_GIT_IDENTITY"
          r={"schema_version":1,"host":os.uname().nodename,"uid":os.geteuid(),"delivery_commit":os.environ["GITHUB_SHA"],"epoch":int(time.time()),"source_git_head":head,"source_files":len(rows),"source_bytes":sum(x["bytes"] for x in rows),"aggregate_algorithm":"SHA256(sorted relative_path NUL file_sha256 NUL decimal_bytes LF)","source_aggregate_sha256":aggregate.hexdigest(),"files":rows,"unresolved":unknown,"database_file_identities":{p:identity(p) for p in ("/opt/trading-system/database/data/trading.db","/opt/trading-system/database/data/trading.db-wal","/opt/trading-system/database/data/trading.db-shm")},"database_opened":False,"wal_bytes_read":False,"credentials_read":False,"source_literal_values_exported":False,"sudo_calls":0,"service_actions":0,"api_requests":0,"production_changes":0,"collection_atomic_across_tree":False,"root_cron":"NOT_READ_NONROOT","status":"CURRENT_SOURCE_IDENTITY_AND_DB_WAL_METADATA_ONLY"}
          print("PR99_CURRENT_SOURCE_IDENTITY_RECEIPT="+json.dumps(r,sort_keys=True))
          
          PY

