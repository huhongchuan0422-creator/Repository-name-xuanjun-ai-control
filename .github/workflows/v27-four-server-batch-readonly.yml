name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh tokyo
        if: github.event_name == 'workflow_dispatch'
      - name: PR122 bounded public Nginx source inventory (no sudo or key reads)
        if: github.event_name == 'push'
        env:
          XJ_PR122_SOURCE: ''
        run: |
          python3 -B - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PR122_SOURCE'],validate=True))
          assert len(data)<50000 and hashlib.sha256(data).hexdigest()=='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          env=dict(os.environ);env.pop('XJ_PR122_SOURCE',None);env['XJ_PR122_NGINX_READONLY']='1'
          result=subprocess.run([sys.executable,'-B','-c',data.decode()],env=env,capture_output=True,text=True,timeout=25)
          try: report=json.loads(result.stdout)
          except Exception: report={'status':'INVENTORY_HOLD','reason':'NO_VALID_JSON_RECEIPT','production_mutation':False}
          report['delivery_commit']=os.environ['GITHUB_SHA']
          report['inventory_source_sha256']='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          out=Path(os.environ['RUNNER_TEMP'])/'pr122-tokyo-nginx-inventory.json'
          fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as handle:json.dump(report,handle,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: pr122-tokyo-nginx-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-tokyo-nginx-inventory.json
          if-no-files-found: error
          retention-days: 14
  korea:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh korea
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic


  lazy-dependency-evidence:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - name: Resolve lazy database dependency superset without production imports
        run: |
          python3 -B - <<'PY'
          import os,ast,json,hashlib,re,time
          from pathlib import Path
          assert os.uname().nodename=="iZ6wee8q9z4t03hvqumwfhZ"
          root=Path("/opt/trading-system")
          entry=root/"scripts/secure_secrets_portal_server.py"
          assert hashlib.sha256(entry.read_bytes()).hexdigest()=="528a3b5bd13dfbb5067731b3f0ae1305b28cba888658aacc09bf64cbed8b5006"
          report={"host":os.uname().nodename,"commit":os.environ["GITHUB_SHA"],"production_mutation":False,"modules":[],"lazy_exports":[],"errors":[],"network_requests":0,"production_imports":0,"dns_release":"HOLD"}
          ident=re.compile(r"^[A-Za-z_][A-Za-z0-9_.]*$")
          def symbolic(value):
           if isinstance(value,str):return value if ident.fullmatch(value) else "[NON_SYMBOLIC]"
           if isinstance(value,(tuple,list)):return [symbolic(x) for x in value]
           if isinstance(value,dict):return {k:symbolic(v) for k,v in value.items() if isinstance(k,str) and ident.fullmatch(k)}
           return "[NON_SYMBOLIC]"
          pending=[entry];seen=set();start=time.monotonic()
          # Include entire database models/repositories superset: no runtime imports or DB access.
          for folder in ("database","database/models","database/repositories"):
           pending.extend(sorted((root/folder).glob("*.py")))
          while pending and len(seen)<300 and time.monotonic()-start<35:
           p=pending.pop()
           if p in seen:continue
           seen.add(p)
           if p.is_symlink() or not p.resolve().is_relative_to(root):
            report["errors"].append({"path":str(p),"reason":"UNTRUSTED_SOURCE_PATH"});continue
           try:
            data=p.read_bytes()
            if len(data)>2000000:raise ValueError()
            tree=ast.parse(data)
           except Exception as e:
            report["errors"].append({"path":str(p.relative_to(root)),"reason":type(e).__name__});continue
           imports=set();hits=[];dynamic=[];stack=[]
           def resolve(module):
            target=root.joinpath(*module.split("."))
            for candidate in (target.with_suffix(".py"),target/"__init__.py"):
             if candidate.is_file() and not candidate.is_symlink():pending.append(candidate);return True
            return False
           for node in tree.body:
            if isinstance(node,(ast.Assign,ast.AnnAssign)):
             try:value=ast.literal_eval(node.value)
             except Exception:continue
             if isinstance(value,dict):
              values=list(value.values())
              if values and any(isinstance(v,(str,tuple,list)) and "database." in str(v) for v in values):
               mapped=symbolic(value)
               report["lazy_exports"].append({"path":str(p.relative_to(root)),"line":node.lineno,"mapping":mapped})
               for item in ast.walk(node.value):
                if isinstance(item,ast.Constant) and isinstance(item.value,str) and item.value.startswith("database.") and ident.fullmatch(item.value):resolve(item.value)
           class V(ast.NodeVisitor):
            def visit_FunctionDef(self,n):
             stack.append(n.name);self.generic_visit(n);stack.pop()
            visit_AsyncFunctionDef=visit_FunctionDef
            def visit_Import(self,n):
             for alias in n.names:imports.add(alias.name);resolve(alias.name)
            def visit_ImportFrom(self,n):
             if n.level:
              parts=p.relative_to(root).parent.parts
              prefix=".".join(parts[:len(parts)-n.level+1])
              module=".".join(x for x in (prefix,n.module) if x)
             else:module=n.module or ""
             if module:
              imports.add(module);resolve(module)
              for alias in n.names:
               if alias.name!="*":resolve(module+"."+alias.name)
            def visit_Attribute(self,n):
             if n.attr.lower() in ("client_address","remote_addr","remote_address","remote_ip","client_ip","ip_address","peername"):
              hits.append({"line":n.lineno,"function":".".join(stack),"token":n.attr,"node":"Attribute"})
             self.generic_visit(n)
            def visit_Constant(self,n):
             if isinstance(n.value,str) and n.value.lower() in ("x-real-ip","x-forwarded-for","x-forwarded-proto","forwarded","remote_addr","remote_ip","client_ip","ip_address","rate_limit","ip_whitelist","ip_blacklist"):
              hits.append({"line":n.lineno,"function":".".join(stack),"token":n.value.lower(),"node":"StringKey"})
            def visit_Call(self,n):
             name=n.func.id if isinstance(n.func,ast.Name) else n.func.attr if isinstance(n.func,ast.Attribute) else ""
             if name in ("__import__","import_module","eval","exec"):
              dynamic.append({"line":n.lineno,"function":".".join(stack),"operation":name})
             self.generic_visit(n)
           V().visit(tree)
           record={"path":str(p.relative_to(root)),"sha256":hashlib.sha256(data).hexdigest(),"imports":sorted(imports),"ip_hits":hits,"dynamic_resolution":dynamic}
           if p.name=="secure_secrets_portal.py":
            methods=[]
            for n in ast.walk(tree):
             if isinstance(n,ast.FunctionDef) and n.name=="_validate_submit_session":
              attrs=sorted({x.attr for x in ast.walk(n) if isinstance(x,ast.Attribute)})
              names=sorted({x.id for x in ast.walk(n) if isinstance(x,ast.Name)})
              methods.append({"function":n.name,"line":n.lineno,"attributes":attrs,"variables":names})
            record["rate_limit_dataflow_symbols"]=methods
           report["modules"].append(record)
          report["pending_count"]=len(pending);report["module_count"]=len(report["modules"])
          report["database_python_count"]=sum(x["path"].startswith("database/") for x in report["modules"])
          report["static_scope"]="LOCAL_IMPORTS_PLUS_ALL_DATABASE_TOPLEVEL_MODELS_REPOSITORIES_SUPERSET"
          report["not_proven"]=["CLOUD_WAF","EXTERNAL_LIBRARY_INTERNALS","RUNTIME_MONKEYPATCHES","OWNER_ACCEPTANCE_OF_IP_AUDIT_DIFFERENCE","LIVE_POST_AUTHORIZATION","DNS_PROVIDER_CURRENT_CONFIGURATION"]
          print("PR122_LAZY_DEPENDENCY_RECEIPT="+json.dumps(report,sort_keys=True))
          
          PY
