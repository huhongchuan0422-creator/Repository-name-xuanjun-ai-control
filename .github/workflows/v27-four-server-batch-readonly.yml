          properties=["Id","LoadState","ActiveState","SubState","MainPID","User","Group","WorkingDirectory","FragmentPath","DropInPaths","Requires","Wants","After","BindsTo","PartOf","PrivateNetwork","RestrictAddressFamilies"]
          def run(cmd):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True,timeout=12)
              return p.returncode,p.stdout
          records=[]
          for unit in units[side]:
              rc,out=run(["systemctl","show",unit,"--no-pager"]+[v for name in properties for v in ("-p",name)])
              values=dict(s.split("=",1) for s in out.splitlines() if "=" in s)
