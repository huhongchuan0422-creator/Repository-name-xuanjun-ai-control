name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh tokyo
        if: github.event_name == 'workflow_dispatch'
      - name: PR122 bounded public Nginx source inventory (no sudo or key reads)
        if: github.event_name == 'push'
        env:
          XJ_PR122_SOURCE: ''
        run: |
          python3 -B - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PR122_SOURCE'],validate=True))
          assert len(data)<50000 and hashlib.sha256(data).hexdigest()=='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          env=dict(os.environ);env.pop('XJ_PR122_SOURCE',None);env['XJ_PR122_NGINX_READONLY']='1'
          result=subprocess.run([sys.executable,'-B','-c',data.decode()],env=env,capture_output=True,text=True,timeout=25)
          try: report=json.loads(result.stdout)
          except Exception: report={'status':'INVENTORY_HOLD','reason':'NO_VALID_JSON_RECEIPT','production_mutation':False}
          report['delivery_commit']=os.environ['GITHUB_SHA']
          report['inventory_source_sha256']='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          out=Path(os.environ['RUNNER_TEMP'])/'pr122-tokyo-nginx-inventory.json'
          fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as handle:json.dump(report,handle,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: pr122-tokyo-nginx-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-tokyo-nginx-inventory.json
          if-no-files-found: error
          retention-days: 14
  korea:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'PR99_PHASE_C_NONROOT_METADATA_ONCE_20261016')
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh korea
        if: github.event_name == 'workflow_dispatch'
      - name: PR99 Phase-C nonroot version and candidate metadata only
        if: github.event_name == 'push'
        env:
          XJ_PHASE_C_METADATA_SOURCE: ''
        run: |
          /usr/bin/python3.11 -I -B - <<'PY_PHASE_C_METADATA'
          import base64,gzip,hashlib,os
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PHASE_C_METADATA_SOURCE'],validate=True))
          assert len(data)<12000 and hashlib.sha256(data).hexdigest()=='f027131c4c0a7f25a7c85b8d46c20f43ed182bb0ca32adef232ed48526632576'
          exec(compile(data.decode(),'phase_c_host_metadata.py','exec'),{'__name__':'__main__'})
          PY_PHASE_C_METADATA
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic


  r4-postinstall-evidence:
    if: github.event_name == 'push' && github.sha == '2f644ece195b6001d3dc67cfe135b2b7ee48ea18'
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: tokyo
            runner: xuanjun-tokyo-readonly
          - side: domestic
            runner: xuanjun-domestic-ops
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read existing public receipt, source, service and Work protection only
        env:
          XJ_R4_SIDE: ${{ matrix.side }}
        run: |
          python3 -I -B - <<'PY'
          import hashlib,json,os,stat,subprocess
          from pathlib import Path
          
          side=os.environ["XJ_R4_SIDE"]
          hosts={"tokyo":"iZ6wee8q9z4t03hvqumwfhZ","domestic":"iZvt5t8tlrm8oiZ"}
          assert os.geteuid()!=0 and os.uname().nodename==hosts[side],"NONROOT_APPROVED_HOST_REQUIRED"
          old="d5ab592a6a23dd5ebfa8689c95aaa453e371127aab9a39bc2fe7eba0febbbdf0"
          new="57e38fc9c37d2811010b3170f672c4ba7b4877f2e27575b564131ed12adee1a1"
          home="4cdaa871b46fb8f62a5527a81724a9a955beed76542dba922bb4ac9779e90f20"
          def read_regular(path,limit,uid=None,mode=None):
              fd=os.open(str(path),os.O_RDONLY|os.O_NOFOLLOW)
              with os.fdopen(fd,"rb") as handle:
                  info=os.fstat(handle.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink==1,"REGULAR_SINGLE_LINK_REQUIRED"
                  if uid is not None:assert info.st_uid==uid,"FILE_OWNER_CHANGED"
                  if mode is not None:assert stat.S_IMODE(info.st_mode)==mode,"FILE_MODE_CHANGED"
                  data=handle.read(limit+1);assert len(data)<=limit,"BOUNDED_READ_REQUIRED"
              return data,{"uid":info.st_uid,"gid":info.st_gid,"mode":oct(stat.S_IMODE(info.st_mode)),"size":info.st_size,"sha256":hashlib.sha256(data).hexdigest()}
          report={"schema_version":1,"status":"READONLY_EVIDENCE_PENDING","side":side,
              "host":os.uname().nodename,"uid":os.geteuid(),"delivery_commit":os.environ["GITHUB_SHA"],
              "approved_install_candidate":"b4b8ed3fa7dc9435e4959da11dfc335b04385100",
              "install_action_approval":6206046505,"collector_used_root":False,
              "collector_post_requests":0,"collector_http_requests":0,"collector_service_actions":0,
              "collector_production_writes":False,"dns_change":False}
          if side=="tokyo":
              data,identity=read_regular(Path("/var/lib/xuanjun-pr122-r4-containment-receipt.json"),65536,0,0o644)
              receipt=json.loads(data)
              assert receipt["status"]=="LIVE_R4_CONTAINMENT_PASS" and receipt["host"]==hosts[side]
              assert receipt["source_sha256"]==old and receipt["candidate_sha256"]==new
              assert receipt["apply_started"] is True and receipt["offline_rollback_started"] is False
              assert receipt["dns_change"] is False and receipt["website_files_changed"] is False and receipt["error"] is None
              assert receipt["tiktok_http_disconnect"]=="TEMPORARILY_DISABLED" and receipt["authenticated_disconnect"]=="NOT_IMPLEMENTED"
              expected=[(a,m,s,None) for a in ("47.245.53.152","47.101.152.210") for m,s in (("GET",200),("HEAD",501))]
              expected += [(a,"POST",403,v) for a in ("47.245.53.152","47.101.152.210") for v in ("empty","synthetic_untrusted_headers")]
              actual=[(c["address"],c["method"],c["status"],c.get("variant")) for c in receipt["checks"]]
              assert actual==expected,"ROOT_RECEIPT_CHECKS_CHANGED"
              assert all(c["synthetic_empty_request"] is True and c["tls_verified"] is True for c in receipt["checks"] if c["method"]=="POST")
              assert receipt["service_before"]["MainPID"]=="3075458" and receipt["service_after"]["MainPID"]=="3082952"
              run=subprocess.run(["systemctl","show","secure-secrets-portal.service","-p","MainPID","-p","User","-p","ActiveState","-p","SubState","-p","WorkingDirectory"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True,check=True,timeout=10)
              service=dict(x.split("=",1) for x in run.stdout.splitlines() if "=" in x)
              assert service==receipt["service_after"],"CURRENT_SERVICE_DIFFERS_FROM_ROOT_RECEIPT"
              source_data,source_info=read_regular(Path("/opt/trading-system/scripts/secure_secrets_portal_server.py"),200000,1000,0o755)
              assert source_info["sha256"]==new,"CURRENT_SOURCE_CHANGED"
              assert service["ActiveState"]=="active" and service["SubState"]=="running" and service["User"]=="admin" and service["WorkingDirectory"]=="/opt/trading-system"
              report.update(public_root_receipt=receipt,public_receipt_identity=identity,current_source=source_info,current_service=service,
                  private_root_anchor_backup_consumption="NOT_READ_BY_NONROOT_COLLECTOR")
              homepage=Path("/var/www/wenwenwenyiyiyi.work/index.html")
          else:
              current=Path("/var/www/wenwenwenyiyiyi.work/current")
              expected="/var/www/wenwenwenyiyiyi.work/releases/pr122-d8b08ed-recovery-stage"
              assert current.is_symlink() and os.readlink(str(current))==expected,"DOMESTIC_CURRENT_CHANGED"
              report["domestic_current"]=expected
              homepage=current/"public/index.html"
          unused,identity=read_regular(homepage,2000000)
          assert identity["sha256"]==home,"WORK_HOMEPAGE_CHANGED"
          report["homepage"]=identity
          report["status"]="NONROOT_POSTINSTALL_EVIDENCE_PASS"
          print("PR122_R4_POSTINSTALL_RECEIPT="+json.dumps(report,sort_keys=True))
          PY

  dns-postsave-observation:
    if: github.event_name == 'push' && github.sha == 'fe9e1320bd9a9602b061b1e7c0e8dce5aaac95cc'
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: tokyo
            runner: xuanjun-tokyo-readonly
          - side: domestic
            runner: xuanjun-domestic-ops
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 3
    steps:
      - name: Observe Owner-saved apex DNS and unchanged Work homepage without writes
        env:
          XJ_DNS_SIDE: ${{ matrix.side }}
        run: |
          python3 -I -B - <<'PY'
          import hashlib, http.client, json, os, shutil, socket, ssl, subprocess, time
          from pathlib import Path
          
          side = os.environ['XJ_DNS_SIDE']
          hosts = {'tokyo': 'iZ6wee8q9z4t03hvqumwfhZ', 'domestic': 'iZvt5t8tlrm8oiZ'}
          assert os.geteuid() != 0 and os.uname().nodename == hosts[side]
          domain = 'wenwenwenyiyiyi.work'
          expected = '4cdaa871b46fb8f62a5527a81724a9a955beed76542dba922bb4ac9779e90f20'
          report = {'schema_version': 1, 'side': side, 'host': os.uname().nodename,
                    'uid': os.geteuid(), 'observed_epoch': int(time.time()),
                    'delivery_commit': os.environ['GITHUB_SHA'],
                    'owner_reported_dns_saved': True, 'dns_release_approval': 'NOT_ESTABLISHED',
                    'production_writes': 0, 'post_requests': 0, 'service_actions': 0,
                    'root_used': False, 'dns_changes_by_collector': 0}
          report['resolvers'] = {}
          for label, family in [('A', socket.AF_INET), ('AAAA', socket.AF_INET6)]:
              try:
                  report['resolvers'][label] = sorted(set(x[4][0] for x in socket.getaddrinfo(domain, 443, family, socket.SOCK_STREAM)))
              except socket.gaierror as error:
                  report['resolvers'][label] = {'error': error.errno}
          report['authoritative'] = []
          dig = shutil.which('dig')
          if dig:
              for server in ('celine.ns.cloudflare.com', 'chris.ns.cloudflare.com'):
                  for kind in ('A', 'AAAA'):
                      try:
                          r = subprocess.run([dig, '+time=3', '+tries=1', '@'+server, domain, kind,
                                              '+noall', '+answer', '+authority', '+comments'],
                                             stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                             universal_newlines=True, timeout=7)
                          report['authoritative'].append({'server': server, 'type': kind,
                              'exit': r.returncode, 'public_dns_reply': r.stdout[:5000]})
                      except Exception as error:
                          report['authoritative'].append({'server': server, 'type': kind, 'error': type(error).__name__})
          else:
              report['authoritative_note'] = 'DIG_NOT_AVAILABLE; resolver answer is not a management-plane snapshot'
          
          def get_https(address, path, check_home=False):
              result = {'address': address, 'method': 'GET', 'path': path}
              try:
                  with socket.create_connection((address, 443), timeout=10) as raw:
                      with ssl.create_default_context().wrap_socket(raw, server_hostname=domain) as tls:
                          result['peer'] = tls.getpeername()[0]
                          result['tls_verified'] = True
                          c = http.client.HTTPConnection(domain, timeout=10)
                          c.sock = tls
                          c.request('GET', path, headers={'Host': domain, 'Connection': 'close'})
                          r = c.getresponse()
                          body = r.read(2000001)
                          result.update(status=r.status, bytes=len(body),
                                        csp_present=bool(r.getheader('Content-Security-Policy')))
                          if check_home:
                              result['sha256'] = hashlib.sha256(body).hexdigest()
                              result['work_home_matches'] = len(body) <= 2000000 and result['sha256'] == expected
                          c.close()
              except Exception as error:
                  result['error'] = type(error).__name__
              return result
          
          report['https'] = [get_https(domain, '/', True),
                             get_https('47.101.152.210', '/', True),
                             get_https(domain, '/healthz')]
          try:
              c = http.client.HTTPConnection(domain, 80, timeout=10)
              c.request('GET', '/', headers={'Host': domain, 'Connection': 'close'})
              r = c.getresponse()
              report['http'] = {'status': r.status, 'location': r.getheader('Location')}
              r.read(1024)
              c.close()
          except Exception as error:
              report['http'] = {'error': type(error).__name__}
          
          try:
              if side == 'domestic':
                  current = Path('/var/www/'+domain+'/current')
                  report['current'] = os.readlink(str(current))
                  report['current_unchanged'] = report['current'] == '/var/www/'+domain+'/releases/pr122-d8b08ed-recovery-stage'
                  homepage = current/'public/index.html'
              else:
                  homepage = Path('/var/www/'+domain+'/index.html')
              data = homepage.read_bytes()
              report['local_home_sha256'] = hashlib.sha256(data).hexdigest()
              report['local_work_home_unchanged'] = report['local_home_sha256'] == expected
          except Exception as error:
              report['local_protection_error'] = type(error).__name__
          
          main = report['https'][0]
          report['domain_reached_domestic'] = main.get('peer') == '47.101.152.210'
          report['targeted_home_tls_pass'] = all(x.get('status') == 200 and x.get('tls_verified') and x.get('work_home_matches') for x in report['https'][:2])
          report['status'] = 'READONLY_COLLECTION_COMPLETE'
          report['migration_complete'] = False
          report['remaining_gates'] = ['IP_AUDIT_SCOPE_RELEASE', 'CURRENT_APEX_AAAA_AND_ACCOUNT_SNAPSHOT', 'POST_CUTOVER_RELEASE_REVIEW', 'FULL_BACKEND_MIGRATION']
          print('PR122_DNS_POSTSAVE_RECEIPT='+json.dumps(report, sort_keys=True))
          PY

  ip-peripheral-metadata:
    if: github.event_name == 'push' && github.sha == 'de30ac366cd907e6b8337c4c7eba74d146254e8d'
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: tokyo
            runner: xuanjun-tokyo-readonly
          - side: domestic
            runner: xuanjun-domestic-ops
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 3
    steps:
      - name: Read only bounded IP-security and logging service metadata without config or logs
        env:
          XJ_IP_SIDE: ${{ matrix.side }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, re, stat, subprocess, time
          from pathlib import Path
          
          side = os.environ['XJ_IP_SIDE']
          hosts = {'tokyo': 'iZ6wee8q9z4t03hvqumwfhZ', 'domestic': 'iZvt5t8tlrm8oiZ'}
          assert os.geteuid() != 0 and os.uname().nodename == hosts[side]
          pattern = re.compile(r'fail2ban|crowdsec|modsecurity|waf|filebeat|fluent|logstash|promtail|vector|rsyslog|syslog-ng|auditd|aegis|aliyun|hids|ossec|wazuh|secagent', re.I)
          result = {'schema_version': 1, 'side': side, 'host': hosts[side], 'uid': os.geteuid(),
                    'observed_epoch': int(time.time()), 'delivery_commit': os.environ['GITHUB_SHA'],
                    'scope': 'BOUNDED_NAMED_LOCAL_SERVICE_PROCESS_AND_DIRECTORY_METADATA_ONLY',
                    'root_calls': 0, 'http_requests': 0, 'post_requests': 0, 'production_writes': 0,
                    'configuration_contents_read': False, 'raw_logs_read': False,
                    'credentials_or_business_data_read': False, 'commands': {}, 'units': []}
          
          def run(label, command):
              try:
                  proc = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                        universal_newlines=True, timeout=12)
                  result['commands'][label] = {'exit': proc.returncode}
                  return proc.stdout if proc.returncode == 0 else ''
              except Exception as error:
                  result['commands'][label] = {'error': type(error).__name__}
                  return ''
          
          units = set()
          for label, command in (
              ('loaded_services', ['systemctl', 'list-units', '--all', '--type=service', '--no-legend', '--no-pager', '--plain']),
              ('installed_services', ['systemctl', 'list-unit-files', '--type=service', '--no-legend', '--no-pager']),
          ):
              for line in run(label, command).splitlines():
                  fields = line.split()
                  if fields and fields[0].endswith('.service') and pattern.search(fields[0]):
                      units.add(fields[0])
          result['matched_unit_count'] = len(units)
          result['unit_inventory_truncated'] = len(units) > 30
          for unit in sorted(units)[:30]:
              output = run('unit:'+unit, ['systemctl', 'show', unit, '-p', 'Id', '-p', 'LoadState',
                                        '-p', 'ActiveState', '-p', 'SubState', '-p', 'UnitFileState',
                                        '-p', 'MainPID', '-p', 'FragmentPath'])
              allowed = {'Id', 'LoadState', 'ActiveState', 'SubState', 'UnitFileState', 'MainPID', 'FragmentPath'}
              item = {'requested_unit': unit}
              item.update({k: v for k, v in (line.split('=', 1) for line in output.splitlines() if '=' in line) if k in allowed})
              result['units'].append(item)
          processes = run('process_names', ['ps', '-eo', 'comm='])
          result['matched_process_names'] = sorted(set(line.strip() for line in processes.splitlines() if pattern.search(line)))[:50]
          result['directory_metadata'] = []
          for raw in ('/etc/fail2ban', '/etc/crowdsec', '/etc/modsecurity', '/etc/filebeat',
                      '/etc/fluent-bit', '/etc/logstash', '/etc/promtail', '/etc/vector', '/etc/rsyslog.d'):
              item = {'path': raw}
              try:
                  info = os.lstat(raw)
                  item.update(exists=True, uid=info.st_uid, mode=oct(stat.S_IMODE(info.st_mode)),
                              is_directory=stat.S_ISDIR(info.st_mode), is_symlink=stat.S_ISLNK(info.st_mode))
              except FileNotFoundError:
                  item['exists'] = False
              except PermissionError:
                  item['visibility'] = 'PERMISSION_DENIED_NOT_ABSENT'
              result['directory_metadata'].append(item)
          result['limitations'] = ['No service config, firewall rules, cloud policy, log contents or environment inspected',
                                  'Unmatched/custom agents and remote log consumers remain unverified',
                                  'Absent named unit does not prove no IP-dependent policy',
                                  'Owner IP audit acceptance and independent release decision remain pending']
          result['status'] = 'READONLY_PERIPHERAL_METADATA_COLLECTED'
          print('PR122_IP_PERIPHERAL_RECEIPT='+json.dumps(result, sort_keys=True))
          PY

  backend-migration-preflight:
    if: github.event_name == 'push' && github.sha == '84ed1a9b890e38d646739f6f1066adbed5b53d3a'
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: tokyo
            runner: xuanjun-tokyo-readonly
          - side: domestic
            runner: xuanjun-domestic-ops
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 3
    steps:
      - name: Bounded backend host readiness and directory metadata only
        env:
          XJ_BACKEND_SIDE: ${{ matrix.side }}
        run: |
          python3 -I -B - <<'PY'
          import collections, json, os, re, shutil, socket, stat, subprocess, sys, time
          from pathlib import Path
          side=os.environ['XJ_BACKEND_SIDE']
          hosts={'tokyo':'iZ6wee8q9z4t03hvqumwfhZ','domestic':'iZvt5t8tlrm8oiZ'}
          assert os.geteuid()!=0 and os.uname().nodename==hosts[side]
          r={'schema_version':1,'side':side,'host':hosts[side],'uid':os.geteuid(),
             'delivery_commit':os.environ['GITHUB_SHA'],'observed_epoch':int(time.time()),
             'production_writes':0,'root_calls':0,'http_requests':0,'file_contents_read':False,
             'python_version':list(sys.version_info[:3]),'cpu_count':os.cpu_count(),
             'disk_free_bytes':shutil.disk_usage('/var/tmp').free,'services':[],'paths':[]}
          def command(label,args):
           try:
            p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True,timeout=12)
            r.setdefault('command_exit',{})[label]=p.returncode
            return p.stdout if p.returncode==0 else ''
           except Exception as e:r.setdefault('command_errors',{})[label]=type(e).__name__;return ''
          listed=command('services',['systemctl','list-units','--all','--type=service','--plain','--no-legend','--no-pager'])
          names={line.split()[0] for line in listed.splitlines() if line.split() and re.search(r'secure-secrets-portal|provider-neutral|telegram|wecom|novel.*tunnel|model-rpc',line.split()[0])}
          for unit in sorted(names)[:40]:
           text=command(unit,['systemctl','show',unit,'-p','Id','-p','ActiveState','-p','SubState','-p','MainPID','-p','User','-p','WorkingDirectory','-p','FragmentPath'])
           r['services'].append(dict(x.split('=',1) for x in text.splitlines() if '=' in x))
          ports={18080,18081,18443,19443,18761,18770,18780,18781,18880}
          lines=command('listeners',['ss','-H','-lnt']).splitlines()
          r['listeners']=[x.split()[3] for x in lines if len(x.split())>=4 and any(x.split()[3].endswith(':'+str(port)) for port in ports)]
          paths=(['/opt/trading-system/runtime/secure-secrets-portal',
           '/opt/trading-system/runtime/secure-secrets-portal/sessions',
           '/opt/trading-system/runtime/secure-secrets-portal/tiktok-oauth-state',
           '/opt/trading-system/runtime/secure-secrets-portal/douyin-oauth-state',
           '/opt/trading-system/runtime/secure-secrets-portal/tiktok-token-state',
           '/opt/trading-system/runtime/secure-secrets-portal/douyin-token-state',
