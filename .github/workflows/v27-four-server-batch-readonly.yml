          assert hashlib.sha256((old/'current_point.py').read_bytes()).hexdigest()=='56d0a9d7fc1ff6447fc9fd5cf995bf79c61765d04ca2e058e675675967627e03'
          assert hashlib.sha256((old/'run_current_point.py').read_bytes()).hexdigest()=='088d80531066c20e0f2bca74393d73633a51830c7a500f651afd66bee9f3b2f1'
          assert (new/'source-identities.json').read_bytes()==(old/'source-identities.json').read_bytes()
          binding=json.loads((new/'BINDING.json').read_text())
          expected={'README.md','current_point.py','run_current_point.py','source-identities.json','test_current_point.py'}
          assert set(binding['files'])==expected
