                      for n in sorted(expected|{'BINDING.json'}):
                          data=(new/n).read_bytes();m=tarfile.TarInfo(n);m.size=len(data);m.mode=0o400;m.mtime=0
                          t.addfile(m,io.BytesIO(data))
          r={'schema_version':1,'source_commit':os.environ['GITHUB_SHA'],'new_tests':7,'skipped':0,'original_20':'INHERITED_NOT_REEXECUTED','unchanged_functions':unchanged,'binding_sha256':hashlib.sha256((new/'BINDING.json').read_bytes()).hexdigest(),'tar_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'tar_bytes':p.stat().st_size,'bound_files':5,'regular_members':6,'production_hosts_used':False,'database_exported':False,'production_actions':0,'status':'R2_OFFLINE_INCREMENTAL_REVIEW_ONLY'}
          print('PR99_CURRENT_POINT_R2_CI_RECEIPT='+json.dumps(r,sort_keys=True))
          (p.parent/'PR99_CURRENT_POINT_R2_CI_RECEIPT.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
