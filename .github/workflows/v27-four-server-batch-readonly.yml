        id: python
        with:
          python-version: '3.11'
      - name: New private-contract synthetic tests only, no production host
        env:
          XJ_S06_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          sudo -n -- "$XJ_S06_PYTHON" -I -B - <<'PY'
          import sys,unittest
          sys.path.insert(0,'evidence/pr99-service-handoff/s06-candidate')
          suite=unittest.defaultTestLoader.loadTestsFromName('test_runtime_contract')
          r=unittest.TextTestRunner(verbosity=2).run(suite)
