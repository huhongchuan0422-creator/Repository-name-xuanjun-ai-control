name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh tokyo
        if: github.event_name == 'workflow_dispatch'
      - name: PR122 bounded public Nginx source inventory (no sudo or key reads)
        if: github.event_name == 'push'
        env:
          XJ_PR122_SOURCE: ''
        run: |
          python3 -B - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PR122_SOURCE'],validate=True))
          assert len(data)<50000 and hashlib.sha256(data).hexdigest()=='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          env=dict(os.environ);env.pop('XJ_PR122_SOURCE',None);env['XJ_PR122_NGINX_READONLY']='1'
          result=subprocess.run([sys.executable,'-B','-c',data.decode()],env=env,capture_output=True,text=True,timeout=25)
          try: report=json.loads(result.stdout)
          except Exception: report={'status':'INVENTORY_HOLD','reason':'NO_VALID_JSON_RECEIPT','production_mutation':False}
          report['delivery_commit']=os.environ['GITHUB_SHA']
          report['inventory_source_sha256']='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          out=Path(os.environ['RUNNER_TEMP'])/'pr122-tokyo-nginx-inventory.json'
          fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as handle:json.dump(report,handle,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: pr122-tokyo-nginx-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-tokyo-nginx-inventory.json
          if-no-files-found: error
          retention-days: 14
  korea:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh korea
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic

  website-source-search:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [xuanjun-tokyo-readonly, xuanjun-domestic-ops]
    runs-on: [self-hosted, Linux, X64, "${{ matrix.runner }}"]
    timeout-minutes: 2
    steps:
      - name: Bounded read-only website package and deployed file identification
        run: |
          python3 -B - <<'PY'
          import os,json,hashlib,subprocess,time
          from pathlib import Path
          host=os.uname().nodename
          assert host in ("iZ6wee8q9z4t03hvqumwfhZ","iZvt5t8tlrm8oiZ")
          deadline=time.monotonic()+55
          report={"host":host,"uid":os.geteuid(),"production_mutation":False,"packages":[],"sites":[],"errors":[]}
          roots=[x for x in ("/tmp","/home/admin","/home/openclaw_ops","/opt","/var/backups") if os.path.isdir(x)]
          cmd=["find"]+roots+["-maxdepth","9","-type","f","(","-iname","*website*20261013*","-o","-iname","*yunhui*handoff*","-o","-iname","*website*copy*","-o","-iname","*website*language*","-o","-name","website-public-copy-review.patch",")","-print0"]
          r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=25)
          report["search_exit"]=r.returncode
          report["search_permission_denied_count"]=r.stderr.count(b"Permission denied")
          def digest(p):
           h=hashlib.sha256()
           with p.open("rb") as f:
            while True:
             if time.monotonic()>deadline: raise RuntimeError("TIME_BOUND")
             b=f.read(1048576)
             if not b: break
             h.update(b)
           return h.hexdigest()
          for raw in sorted(set(x for x in r.stdout.split(b"\0") if x))[:30]:
           p=Path(os.fsdecode(raw))
           try:
            s=p.stat();v={"path":str(p),"size":s.st_size,"mtime_epoch":s.st_mtime}
            if s.st_size<=100*1024*1024:v["sha256"]=digest(p)
            report["packages"].append(v)
           except (OSError,RuntimeError):report["errors"].append("PACKAGE_READ_FAILED:"+str(p))
          base=Path("/var/www/wenwenwenyiyiyi.work")
          for root in (base,base/"current/public"):
           v={"path":str(root),"resolved":str(root.resolve())}
           try:
            if not root.is_dir():v["status"]="ABSENT_OR_NOT_ACCESSIBLE"
            elif not (root/"index.html").is_file():v["status"]="NO_INDEX"
            else:
             h=hashlib.sha256();count=0;size=0;manifest={}
             for d,dirs,files in os.walk(str(root),followlinks=False):
              dirs[:]=sorted(x for x in dirs if not x.startswith(".") and not Path(d,x).is_symlink())
              for n in sorted(files):
               p=Path(d,n)
               if p.is_symlink():continue
               s=p.stat()
               if s.st_size>20*1024*1024:raise RuntimeError("FILE_SIZE_BOUND")
               sha=digest(p);h.update((str(p.relative_to(root))+"\0"+sha+"\n").encode())
               manifest[str(p.relative_to(root))]=sha
               count+=1;size+=s.st_size
               if count>10000:raise RuntimeError("COUNT_BOUND")
             v.update(status="READ_COMPLETE",web_files=count,web_bytes=size,web_manifest_sha256=h.hexdigest(),file_manifest=manifest)
             v["selected"]={n:digest(root/n) for n in ("index.html","yunhui.css","yunhui.js","assets/tiktok-integration.js") if (root/n).is_file()}
           except (OSError,RuntimeError) as e:v["status"]="READ_INCOMPLETE";v["reason"]=type(e).__name__
           report["sites"].append(v)
          print(json.dumps(report,sort_keys=True))
          PY
