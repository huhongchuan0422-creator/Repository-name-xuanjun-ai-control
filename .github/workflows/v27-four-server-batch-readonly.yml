          raise SystemExit(not r.wasSuccessful() or bool(r.skipped))
          PY
      - name: Bind exact small review package, no private runtime contents
        env:
          XJ_EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$XJ_EXPECTED_HEAD"
          python -I -B - <<'PY'
          import gzip,hashlib,io,json,os,pathlib,tarfile
          root=pathlib.Path('evidence/pr99-service-handoff/s06-candidate')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          files={p:(root/p).read_bytes() for p in ('runtime_contract.py','test_runtime_contract.py','README.md','BINDING.json')}
          b=json.loads(files['BINDING.json'])
          assert set(b['files'])==set(files)-{'BINDING.json'}
          assert all(sha(files[p])==h for p,h in b['files'].items())
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w',format=tarfile.USTAR_FORMAT) as t:
              for p,data in sorted(files.items()):
                  i=tarfile.TarInfo(p);i.size=len(data);i.uid=i.gid=i.mtime=0;i.mode=0o400;t.addfile(i,io.BytesIO(data))
          raw=gzip.compress(buf.getvalue(),mtime=0)
          out=pathlib.Path('/tmp/pr99-s06-runtime-review');out.mkdir(mode=0o700)
          (out/'PR99_S06_RUNTIME_REVIEW.tar.gz').write_bytes(raw)
          r=dict(schema_version=1,source_commit=os.environ['XJ_EXPECTED_HEAD'],script_sha256=sha(files['runtime_contract.py']),binding_sha256=sha(files['BINDING.json']),tar_sha256=sha(raw),tar_bytes=len(raw),bound_files=3,regular_members=4,new_tests=19,production_executed=False)
          (out/'BUILD_RECEIPT.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr99-s06-runtime-private-contract-review
          path: /tmp/pr99-s06-runtime-review/
          if-no-files-found: error
          retention-days: 7

