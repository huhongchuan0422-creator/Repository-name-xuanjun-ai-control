name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh tokyo
        if: github.event_name == 'workflow_dispatch'
      - name: PR122 bounded public Nginx source inventory (no sudo or key reads)
        if: github.event_name == 'push'
        env:
          XJ_PR122_SOURCE: ''
        run: |
          python3 -B - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PR122_SOURCE'],validate=True))
          assert len(data)<50000 and hashlib.sha256(data).hexdigest()=='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          env=dict(os.environ);env.pop('XJ_PR122_SOURCE',None);env['XJ_PR122_NGINX_READONLY']='1'
          result=subprocess.run([sys.executable,'-B','-c',data.decode()],env=env,capture_output=True,text=True,timeout=25)
          try: report=json.loads(result.stdout)
          except Exception: report={'status':'INVENTORY_HOLD','reason':'NO_VALID_JSON_RECEIPT','production_mutation':False}
          report['delivery_commit']=os.environ['GITHUB_SHA']
          report['inventory_source_sha256']='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          out=Path(os.environ['RUNNER_TEMP'])/'pr122-tokyo-nginx-inventory.json'
          fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as handle:json.dump(report,handle,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: pr122-tokyo-nginx-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-tokyo-nginx-inventory.json
          if-no-files-found: error
          retention-days: 14
  korea:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh korea
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic


  r4-installation-model:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: I1 admission plus affected installation and offline rollback models
        run: |
          sudo -n python3 -I -B - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_r4_*.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==60 and not result.skipped and result.wasSuccessful()
          PY
      - name: Build complete controlled-install review evidence
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,importlib.util,io,json,os,tarfile
          from pathlib import Path
          root=Path("deploy/pr122-r4-controlled-install")
          binding=json.loads((root/"REVIEW_BINDING.json").read_text())
          for path,digest in binding["files"].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          spec=importlib.util.spec_from_file_location("r4install",root/"controlled_install.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          assert hashlib.sha256(base64.b64decode(module.GUARD_B64,validate=True)).hexdigest()==module.GUARD_SHA256
          assert base64.b64decode(module.GATE_B64,validate=True)==(root/"approval_gate.py").read_bytes()
          assert hashlib.sha256(base64.b64decode(module.GATE_B64,validate=True)).hexdigest()==module.GATE_SHA256
          assert hashlib.sha256(Path("deploy/pr122-portal-log-capability/portal_log_capability.py").read_bytes()).hexdigest()==module.HELPER_SHA256
          plan=json.loads((root/"INSTALL_PLAN.json").read_text())
          assert hashlib.sha256((root/"controlled_install.py").read_bytes()).hexdigest()==plan["installer_sha256"]
          out=Path(os.environ["RUNNER_TEMP"])/"pr122-r4-install-review";out.mkdir(mode=0o700)
          archive=out/"PR122_R4_CONTROLLED_INSTALL_REVIEW.tar.gz"
          paths=sorted(list(binding["files"])+[str(root/"REVIEW_BINDING.json")])
          with archive.open("xb") as raw:
              with tarfile.open(fileobj=raw,mode="w:gz") as tar:
                  for path in paths:
                      data=Path(path).read_bytes();item=tarfile.TarInfo(path);item.size=len(data);item.mode=0o400;item.mtime=0
                      tar.addfile(item,io.BytesIO(data))
          receipt={"status":"PASS_SYNTHETIC_INSTALL_MODEL_ONLY","commit":os.environ["GITHUB_SHA"],"tests":60,"admission_tests":40,"affected_installation_models":20,"fixture":"SYNTHETIC_TEMPORARY_ROOT_FILESYSTEM","source_scope_approval":"PR122#6205371670","installation_plan_approval":"PENDING","reused_engine_sha256":module.HELPER_SHA256,"approved_builder_sha256":module.GUARD_SHA256,"installer_sha256":plan["installer_sha256"],"tar_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),"tar_size":archive.stat().st_size,"bound_files":len(binding["files"]),"archive_entries":len(paths),"production_root":False,"production_install":False,"production_post":False,"production_stop_restart":False,"dns_change":False}
          (out/"CI_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("PR122_R4_INSTALL_MODEL_RECEIPT="+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-r4-controlled-install-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-r4-install-review/
          if-no-files-found: error
          retention-days: 14

