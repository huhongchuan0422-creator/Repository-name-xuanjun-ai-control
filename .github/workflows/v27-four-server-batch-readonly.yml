name: V2.7 Four Server Read-Only Batch
on:
  workflow_dispatch:
  push:
    branches: [feature/stage5-next25-integration-20261015]
    paths:
      - '.github/workflows/v27-four-server-batch-readonly.yml'
permissions:
  contents: read
concurrency:
  group: v27-readonly-batch
  cancel-in-progress: false
jobs:
  uk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-uk-dev]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh uk
  tokyo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-tokyo-readonly]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - run: bash scripts/v27-batch-readonly.sh tokyo
        if: github.event_name == 'workflow_dispatch'
      - name: PR122 bounded public Nginx source inventory (no sudo or key reads)
        if: github.event_name == 'push'
        env:
          XJ_PR122_SOURCE: ''
        run: |
          python3 -B - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(os.environ['XJ_PR122_SOURCE'],validate=True))
          assert len(data)<50000 and hashlib.sha256(data).hexdigest()=='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          env=dict(os.environ);env.pop('XJ_PR122_SOURCE',None);env['XJ_PR122_NGINX_READONLY']='1'
          result=subprocess.run([sys.executable,'-B','-c',data.decode()],env=env,capture_output=True,text=True,timeout=25)
          try: report=json.loads(result.stdout)
          except Exception: report={'status':'INVENTORY_HOLD','reason':'NO_VALID_JSON_RECEIPT','production_mutation':False}
          report['delivery_commit']=os.environ['GITHUB_SHA']
          report['inventory_source_sha256']='605b225f280bbbffcce6c041ed7483d9acd598ca4905f874fae2e3dc1a272bf5'
          out=Path(os.environ['RUNNER_TEMP'])/'pr122-tokyo-nginx-inventory.json'
          fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as handle:json.dump(report,handle,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: pr122-tokyo-nginx-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-tokyo-nginx-inventory.json
          if-no-files-found: error
          retention-days: 14
  korea:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-korea-binance]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh korea
  domestic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/v27-batch-readonly.sh domestic


  boundary-evidence:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [xuanjun-tokyo-readonly, xuanjun-domestic-ops]
    runs-on: [self-hosted, Linux, X64, "${{ matrix.runner }}"]
    timeout-minutes: 5
    steps:
      - name: Read-only IP dependency and eleven HEAD boundary receipts
        run: |
          python3 -B - <<'PY'
          import os,json,hashlib,re,ast,ssl,socket,http.client,subprocess,shutil,glob
          from pathlib import Path
          host=os.uname().nodename
          assert host in ("iZvt5t8tlrm8oiZ","iZ6wee8q9z4t03hvqumwfhZ")
          domestic=host=="iZvt5t8tlrm8oiZ"
          ip="47.101.152.210" if domestic else "47.245.53.152"
          domain="wenwenwenyiyiyi.work"
          report={"host":host,"commit":os.environ["GITHUB_SHA"],"production_mutation":False,"dns_release":"HOLD","dynamic":[],"source":[],"nginx":[],"gaps":[]}
          entry=Path("/opt/trading-system/scripts/secure_secrets_portal_server.py")
          if not domestic:
           try:
            data=entry.read_bytes();tree=ast.parse(data);methods=sorted({n.name for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name.startswith("do_")})
            report["portal_entry"]={"sha256":hashlib.sha256(data).hexdigest(),"matches_owner_entry":hashlib.sha256(data).hexdigest()=="528a3b5bd13dfbb5067731b3f0ae1305b28cba888658aacc09bf64cbed8b5006","handler_methods":methods}
            assert "do_HEAD" not in methods and "do_OPTIONS" not in methods,"Unexpected method handler"
           except Exception as e:
            report["gaps"].append("PORTAL_ENTRY:"+type(e).__name__)
           for folder in ("scripts","ai_service","accounts","douyin","tiktok","database","trading_execution"):
            base=Path("/opt/trading-system")/folder
            for p in sorted(base.rglob("*.py"))[:500]:
             if p.is_symlink():continue
             try:
              data=p.read_bytes()
              if len(data)>2000000:continue
              lines=data.decode("utf-8").splitlines();hits=[]
              for i,line in enumerate(lines,1):
               tags=[token for token in ("client_address","remote_addr","X-Real-IP","X-Forwarded-For","X-Forwarded-Proto","REMOTE_ADDR","ip_address","rate_limit","ip_whitelist","ip_blacklist") if token.lower() in line.lower()]
               if tags:hits.append({"line":i,"tokens":tags})
              report["source"].append({"path":str(p.relative_to("/opt/trading-system")),"sha256":hashlib.sha256(data).hexdigest(),"ip_security_hits":hits})
             except (OSError,UnicodeError):report["gaps"].append("SOURCE_UNREADABLE:"+str(p.relative_to("/opt/trading-system")))
          # Read configurations as data, never nginx -T, sudo, key files, or production imports.
          pending=[Path("/etc/nginx/nginx.conf")];seen=set()
          while pending and len(seen)<80:
           p=pending.pop()
           if str(p) in seen:continue
           seen.add(str(p))
           try:
            if not str(p.resolve()).startswith("/etc/nginx/"):continue
            data=p.read_bytes()
            if len(data)>1000000:continue
            text=data.decode();items=[]
            for i,line in enumerate(text.splitlines(),1):
             s=line.split("#",1)[0].strip()
             if not s:continue
             key=s.split(None,1)[0]
             if key=="include":
              value=s.split(None,1)[1].rstrip(";").strip()
              if value.startswith("/etc/nginx/"):pending.extend(Path(x) for x in glob.glob(value))
             if key in ("allow","deny","real_ip_header","set_real_ip_from","real_ip_recursive","limit_req","limit_req_zone","limit_conn","limit_conn_zone","auth_request","auth_basic","proxy_next_upstream","proxy_pass_request_headers","proxy_ssl_verify","proxy_ssl_name","proxy_set_header","access_log","log_format","geo","map","if"):
              item={"line":i,"directive":key}
              if key=="proxy_set_header":
               parts=s.split()
               item["header"]=parts[1] if len(parts)>1 else "UNKNOWN"
               if item["header"].lower() in ("x-real-ip","x-forwarded-for","x-forwarded-proto","host","connection"):item["value"]=" ".join(parts[2:])
               else:item["value"]="REDACTED"
              elif key in ("real_ip_header","set_real_ip_from","real_ip_recursive","allow","deny","proxy_next_upstream","proxy_ssl_verify","proxy_ssl_name"):item["value"]=s[len(key):].strip()
              else:item["value"]="REDACTED"
              items.append(item)
            report["nginx"].append({"path":str(p),"sha256":hashlib.sha256(data).hexdigest(),"security_directives":items})
           except (OSError,UnicodeError):report["gaps"].append("CONFIG_UNREADABLE:"+str(p))
          routes=[("/p/","/p/pr122-nonexistent-readonly"),("/submit/douyin","/submit/douyin"),("/submit/tiktok","/submit/tiktok"),("/integrations/douyin/oauth/callback","/integrations/douyin/oauth/callback"),("/integrations/tiktok/oauth/start","/integrations/tiktok/oauth/start"),("/integrations/tiktok/oauth/callback","/integrations/tiktok/oauth/callback"),("/integrations/tiktok/status","/integrations/tiktok/status"),("/integrations/tiktok/disconnect","/integrations/tiktok/disconnect"),("/healthz","/healthz"),("/telegram-webhook/","/telegram-webhook/pr122-nonexistent-readonly"),("/telegram-canary/status","/telegram-canary/status")]
          ctx=ssl.create_default_context()
          def probe(path,variant):
           raw=socket.create_connection((ip,443),timeout=5);tls=ctx.wrap_socket(raw,server_hostname=domain)
           c=http.client.HTTPConnection(domain,timeout=5);c.sock=tls
           try:
            headers={"Host":domain,"Connection":"close"}
            if variant=="spoofed_source":headers.update({"X-Real-IP":"192.0.2.123","X-Forwarded-For":"192.0.2.123","X-Forwarded-Proto":"http","Origin":"https://invalid.example"})
            c.request("HEAD",path,headers=headers);r=c.getresponse()
            return {"variant":variant,"method":"HEAD","status":r.status,"tls_verified":True,"location_present":bool(r.getheader("Location")),"set_cookie_present":bool(r.getheader("Set-Cookie"))}
           finally:c.close()
          for responsibility,path in routes:
           item={"responsibility":responsibility,"path":path,"checks":[],"business_write":"NOT_TESTED","oauth_get":"NOT_TESTED","authorization_contract":"NOT_ESTABLISHED_BY_HEAD"}
           for variant in ("baseline","spoofed_source"):
            try:item["checks"].append(probe(path,variant))
            except Exception as e:item["checks"].append({"variant":variant,"error":type(e).__name__})
           report["dynamic"].append(item)
          report["dns_addresses"]=sorted(set(x[4][0] for x in socket.getaddrinfo(domain,443,type=socket.SOCK_STREAM)))
          dig=shutil.which("dig")
          if dig:
           report["public_dns"]={}
           for kind in ("A","AAAA","NS","SOA"):
            try:
             r=subprocess.run([dig,"+time=3","+tries=1","+noall","+answer",domain,kind],stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True,timeout=5)
             report["public_dns"][kind]=r.stdout[:5000]
            except Exception as e:report["gaps"].append("DNS_"+kind+":"+type(e).__name__)
          else:report["gaps"].append("DIG_UNAVAILABLE_CONFIGURED_DNS_TTL_UNKNOWN")
          report["gaps"]+=["DNS_PROVIDER_PROXY_AND_EXACT_ROLLBACK_NOT_VERIFIED","CLOUD_WAF_AND_PERIPHERAL_IP_DEPENDENCIES_NOT_VERIFIED","HEAD_DOES_NOT_ESTABLISH_GET_POST_AUTHORIZATION","OWNER_IP_AUDIT_DIFFERENCE_ACCEPTANCE_NOT_GRANTED"]
          print("PR122_BOUNDARY_RECEIPT="+json.dumps(report,sort_keys=True))
          
          PY
