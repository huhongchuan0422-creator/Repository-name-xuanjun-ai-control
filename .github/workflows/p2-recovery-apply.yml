name: P2 controlled recovery apply acceptance
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - 'production/p2_recovery/**'
      - 'tests/p2_recovery/test_apply.py'
      - 'tests/p2_recovery/test_provider_server.py'
      - '.github/workflows/p2-recovery-apply.yml'
permissions:
  contents: read
  actions: read
jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.6.15', '3.12.15']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse exact approved 6041 runtime Kit artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12142409951'
          run-id: '39144492649'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inherited-artifact
          merge-multiple: true
      - name: Real socket RSA SQLite affected recovery integration
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          mkdir apply-output
          docker run --rm --user 0:0 --hostname iZd7oeikknn1z21sq6ji6zZ -v "$PWD:/repo:ro" -v "$PWD/apply-output:/output" -w /repo "python:${PYTHON_VERSION}" sh -ec '
            set +e
            python -I -B -S tests/p2_recovery/test_provider_server.py > /output/provider-tests.log 2>&1
            provider_result=$?
            cat /output/provider-tests.log
            if [ "$provider_result" -ne 0 ]; then exit "$provider_result"; fi
            python -I -B -S tests/p2_recovery/test_apply.py > /output/tests.log 2>&1
            result=$?
            cat /output/tests.log
            exit "$result"
          '
      - name: Versioned closure and exact manifest
        run: python3 -I -B -S production/p2_recovery/build_apply.py apply-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-recovery-apply-${{ matrix.python }}
          path: |
            apply-output/*.log
            apply-package/*
          if-no-files-found: error
