name: P2 UK authoritative package verify-only
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - .github/workflows/uk-p2-frozen-candidate-verify.yml
permissions:
  contents: read
  actions: read
env:
  # Native bootstrap release path is bound to this manifest prefix: integration-2b49066f37742ded.
  P2_ARTIFACT_ID: "11825547804"
  P2_TAR_SHA256: "a84de84e082022956de7c0e9ee6e12440b41835b7bc8828daab4954ef1f34d8d"
  P2_SOURCE_COMMIT: "62d2e64d34feea1f02bffa7e8b597484bb98307f"
  P2_SOURCE_TREE: "e75e549d87515aee1c022faa04e805f694088d6e"
  P2_MANIFEST_SHA256: "2b49066f37742dedd41657fb445c91f4204fd4a2a257f921dd9fd514e5b25f0e"
  P2_WORK_DIR: "/tmp/p2pkg-${{ github.run_id }}-${{ github.run_attempt }}"
  P2_TAR_PATH: "/tmp/p2-candidate-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
jobs:
  verify:
    runs-on:
      - self-hosted
      - linux
      - x64
      - xuanjun-uk-dev
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reconcile previous isolated SDK fixture containers by protected receipt and inspect SDK workspace semantics
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B - "$P2_WORK_DIR" <<'PY'
          import os,sys,socket,json,stat,hashlib,subprocess,re
          assert os.geteuid()==0 and socket.gethostname().split('.')[0]=='iZd7oeikknn1z21sq6ji6zZ'
          root=sys.argv[1];prior='/tmp/p2pkg-38389224848-1'
          fd=os.open(prior+'/protected-native-sdk-placement-receipt.json',os.O_RDONLY|os.O_NOFOLLOW)
          with os.fdopen(fd,'rb') as f:
              s=os.fstat(f.fileno());data=f.read();assert s.st_uid==0 and stat.S_IMODE(s.st_mode)==0o600
          assert hashlib.sha256(data).hexdigest()=='d4b9e0953199af81e1a73f4d5cad4b3acd243bf4478af3d4ec5d3c9cf5a152c7'
          receipt=json.loads(data.decode());rows=[]
          for context in receipt.get('sdk_contexts',[]):
              name=context['runtimeId'];assert re.fullmatch(r'xjp2fix-[A-Za-z0-9_.-]{1,100}',name)
              p=subprocess.run(['/usr/bin/docker','inspect',name],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15)
              row={'runtime_id':name,'inspect_before_exit':p.returncode}
              if p.returncode==0:
                  obj=json.loads(p.stdout.decode())[0]
                  assert obj['Name'].lstrip('/')==name and obj['Image']=='sha256:5341f193a5741b64f2acc63a99dc95910289fcc39ff17dacff373a50e233724d'
                  assert any(m.get('Source','').startswith(prior+'/') for m in obj.get('Mounts',[]))
                  row['observed_mounts']=[{'type':m.get('Type'),'source':m.get('Source'),'destination':m.get('Destination'),'rw':m.get('RW')} for m in obj.get('Mounts',[])]
                  p=subprocess.run(['/usr/bin/docker','rm','--force',obj['Id']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20);assert p.returncode==0
              p=subprocess.run(['/usr/bin/docker','inspect',name],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=15)
              row['removed_or_absent']=p.returncode!=0;assert row['removed_or_absent'];rows.append(row)
          result={'schema':1,'state':'PREVIOUS_FIXTURE_EXACT_CONTAINER_CLEANUP_CONFIRMED','previous_name_filter_was_not_exact_container_cleanup_proof':True,'containers':rows,'production_services_changed':False,'canonical_ledger_changed':False,'model_calls':0}
          raw=(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n').encode()
          fd=os.open('/var/lib/xuanjun-p2-preparation/artifact-11796280855-p2pkg-38372304180-1/sdk-cleanup-'+os.path.basename(root)+'.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          print(json.dumps(result,sort_keys=True));print('SDK_FIXTURE_CLEANUP_CORRECTION_SHA256='+hashlib.sha256(raw).hexdigest())
          base='/home/xuanjun_dev/.openclaw/tools/node-v24.21.0/lib/node_modules/openclaw/dist'
          for name,markers in [('context-Dt2Gy7El.mjs',('async function resolveSandboxContext(', 'function resolveSandboxContext(')),('shared-BLNeHhmu.mjs',('function resolveSandboxWorkspaceLayoutPaths(',)),('config-CQ7BYVQS.mjs',('function resolveSandboxDockerConfig(',))]:
              with open(base+'/'+name,'rb') as f:
                  s=os.fstat(f.fileno());source=f.read();assert s.st_uid==1002 and not s.st_mode&0o022
              text=source.decode()
              for marker in markers:
                  pos=text.find(marker)
                  if pos>=0:print('SDK_WORKSPACE_FUNCTION_SOURCE='+json.dumps({'module':name,'sha256':hashlib.sha256(source).hexdigest(),'source':text[pos:pos+7500]}))
          PY

      - name: Download exact artifact with Python 3.6 stdlib
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test ! -e "$P2_WORK_DIR"
          test ! -e "$P2_TAR_PATH"
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,io,os,tarfile,urllib.parse,urllib.request,zipfile,sys
          assert sys.version_info[:3]==(3,6,8)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  x=urllib.request.HTTPRedirectHandler.redirect_request(self,req,fp,code,msg,headers,newurl)
                  if x is not None and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:
                      x.remove_header('Authorization')
                  return x
          url='https://api.github.com/repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/%s/zip'%os.environ['P2_ARTIFACT_ID']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'p2-uk'})
          raw=urllib.request.build_opener(SafeRedirect()).open(req,timeout=30).read(8*1024*1024+1)
          tarbytes=zipfile.ZipFile(io.BytesIO(raw)).read('p2-candidate.tar.gz')
          assert hashlib.sha256(tarbytes).hexdigest()==os.environ['P2_TAR_SHA256']
          with tarfile.open(fileobj=io.BytesIO(tarbytes),mode='r:gz') as t:
              seen=set()
              for m in t.getmembers():
                  parts=m.name.split('/')
                  assert m.isfile() and parts[0]=='xuanjun-p2-package'
                  assert all(p not in ('','.', '..') for p in parts) and m.name not in seen
                  seen.add(m.name)
              t.extractall(os.environ['P2_WORK_DIR'])
          open(os.environ['P2_TAR_PATH'],'wb').write(tarbytes)
          print('P2_UK_ARTIFACT_EXTRACT=PASS')
          PY
      - name: Python 3.6.8 WAL pagination and relay boundedness regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$P2_WORK_DIR/xuanjun-p2-package"
          test "$(/usr/bin/python3 -c 'import sys;print(".".join(map(str,sys.version_info[:3])))')" = 3.6.8
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B evidence/p2-native-wiring-work-20261012/test_service_context_task23.py
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B evidence/p2-native-wiring-work-20261012/test_c2_install_highs.py
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B - <<'PY'
          import json,os,socket,struct,sys
          root=os.environ['P2_SOURCE_ROOT']
          sys.path.insert(0,root+'/stage1')
          import p2_gateway_relay as relay
          class Controller(object):
              def __init__(self): self.calls=0
              def preflight(self,c): self.calls+=1; return {'ready':True}
          class Base(object):
              def __init__(self,uid=31337): self.uid=uid; self.sent=b''; self.timeout=None; self.done=False
              def settimeout(self,v): self.timeout=v
              def getsockopt(self,*a): return struct.pack('3i',111,self.uid,222)
              def sendall(self,d): self.sent+=d
          class Timeout(Base):
              def recv(self,n): raise socket.timeout('fixture timeout')
          class Oversize(Base):
              def recv(self,n):
                  if self.done:return b''
                  self.done=True;return b'x'*(relay.MAXIMUM+1)
          class Valid(Base):
              def recv(self,n):
                  if self.done:return b''
                  self.done=True;return b'{"operation":"preflight"}\n'
          c=Controller()
          a=relay.serve_connection(Timeout(),c,31337)
          assert a['ok'] is False and a['error'] in ('timeout','TimeoutError') and c.calls==0
          b=relay.serve_connection(Oversize(),c,31337)
          assert b['ok'] is False and b['error']=='ValueError' and c.calls==0
          v=relay.serve_connection(Valid(),c,31337)
          assert v['ok'] is True and v['result']['ready'] is True and c.calls==1
          print('P2_UK_RELAY_TIMEOUT_OVERSIZE_PORTABLE=PASS')
          PY
          echo P2_UK_PYTHON368_WAL_PAGINATION_RELAY_REGRESSION=PASS
          echo P2_SOCKET_ACTIVATION_INSTALL_ACCEPTANCE=NOT_RUN

      - name: Verify exact package through real installer on UK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$P2_WORK_DIR/xuanjun-p2-package"
          /usr/bin/python3 "$ROOT/tools/p2-package-freeze.py" verify --archive "$P2_TAR_PATH" --sha256 "$P2_TAR_SHA256" --source-commit "$P2_SOURCE_COMMIT" --source-tree "$P2_SOURCE_TREE"
          # Real install staging is root-owned. Reproduce only that ownership in /tmp
          # before invoking the root-only release installer verifier.
          sudo -n /usr/bin/chown -R 0:0 "$P2_WORK_DIR"
          sudo -n /usr/bin/python3 -I -B - "$ROOT" <<'PY'
          import hashlib,importlib.util,json,os,pwd,stat,subprocess,sys,grp
          assert sys.version_info[:3]==(3,6,8)
          root=sys.argv[1]
          spec=importlib.util.spec_from_file_location('installer',root+'/scripts/uk-integration-install.py')
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.verify(root,root+'/deploy/integration-manifest.json',
                   '62d2e64d34feea1f02bffa7e8b597484bb98307f',
                   '2b49066f37742dedd41657fb445c91f4204fd4a2a257f921dd9fd514e5b25f0e',
                   'e75e549d87515aee1c022faa04e805f694088d6e')
          assert hashlib.sha256(open('/usr/libexec/platform-python3.6','rb').read()).hexdigest()=='ba19929d7038d0c2304f528213fa11e5f10c1ce65f0a891afa459bd167c7e5f6'
          transport=json.load(open(root+'/stage1/native_gateway_controller.py.json','r'))
          assert transport=={'relay_socket':'/run/xuanjun-development/p2-gateway.sock','server_user':'xuanjun_dev','client_group':'xuanjun-dispatcher'}
          relay=json.load(open(root+'/deploy/p2-gateway-relay.json.template','r'))
          assert relay['openclaw_bin']=='/home/xuanjun_dev/.openclaw/bin/openclaw'
          assert relay['openclaw_owner_uid']==1002
          actual=hashlib.sha256(open(relay['openclaw_bin'],'rb').read()).hexdigest()
          assert actual==relay['openclaw_sha256']=='b6aff1f40be0d46330c167e44525ef9080d66e40bb36dbb66c3811b4103fe3f2'
          service=open(root+'/deploy/xuanjun-development-dispatcher.service','r').read()
          controller_sha=hashlib.sha256(open(root+'/stage1/native_gateway_controller.py','rb').read()).hexdigest()
          assert 'ProtectHome=yes' in service
          assert 'Requires=xuanjun-p2-gateway-relay.socket' in service
