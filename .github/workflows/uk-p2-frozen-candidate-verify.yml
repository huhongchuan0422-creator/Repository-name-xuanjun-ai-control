name: P2 UK authoritative package verify-only
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - .github/workflows/uk-p2-frozen-candidate-verify.yml
      - evidence/p2-native-wiring-work-20261012/test_c2_install_highs.py
permissions:
  contents: read
  actions: read
env:
  P2_ARTIFACT_ID: "11796280855"
  P2_TAR_SHA256: "66cc89391b1bf4d0bdee7293ecc0fcc3ef2b3b7969da9abc72771d41042c38fd"
  P2_SOURCE_COMMIT: "f01148fdeaa60c0a6dc1e9d30e9e707b61a65c06"
  P2_SOURCE_TREE: "3fc23b2a01bd8f01ea0edcef9216ded7313409c2"
  P2_MANIFEST_SHA256: "afce7dc6b5207be938c7f12619bb36073530f6f2a883353335bdcf8cc4fa3601"
  P2_WORK_DIR: "/tmp/p2pkg-${{ github.run_id }}-${{ github.run_attempt }}"
  P2_TAR_PATH: "/tmp/p2-candidate-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
jobs:
  verify:
    runs-on:
      - self-hosted
      - linux
      - x64
      - xuanjun-uk-dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact artifact with Python 3.6 stdlib
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test ! -e "$P2_WORK_DIR"
          test ! -e "$P2_TAR_PATH"
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,io,os,tarfile,urllib.parse,urllib.request,zipfile,sys
          assert sys.version_info[:3]==(3,6,8)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  x=urllib.request.HTTPRedirectHandler.redirect_request(self,req,fp,code,msg,headers,newurl)
                  if x is not None and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:
                      x.remove_header('Authorization')
                  return x
          url='https://api.github.com/repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/%s/zip'%os.environ['P2_ARTIFACT_ID']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'p2-uk'})
          raw=urllib.request.build_opener(SafeRedirect()).open(req,timeout=30).read(8*1024*1024+1)
          tarbytes=zipfile.ZipFile(io.BytesIO(raw)).read('p2-candidate.tar.gz')
          assert hashlib.sha256(tarbytes).hexdigest()==os.environ['P2_TAR_SHA256']
          with tarfile.open(fileobj=io.BytesIO(tarbytes),mode='r:gz') as t:
              seen=set()
              for m in t.getmembers():
                  parts=m.name.split('/')
                  assert m.isfile() and parts[0]=='xuanjun-p2-package'
                  assert all(p not in ('','.', '..') for p in parts) and m.name not in seen
                  seen.add(m.name)
              t.extractall(os.environ['P2_WORK_DIR'])
          open(os.environ['P2_TAR_PATH'],'wb').write(tarbytes)
          print('P2_UK_ARTIFACT_EXTRACT=PASS')
          PY
      - name: Python 3.6.8 WAL pagination and relay boundedness regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$P2_WORK_DIR/xuanjun-p2-package"
          test "$(/usr/bin/python3 -c 'import sys;print(".".join(map(str,sys.version_info[:3])))')" = 3.6.8
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B evidence/p2-native-wiring-work-20261012/test_service_context_task23.py
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B evidence/p2-native-wiring-work-20261012/test_c2_install_highs.py
          P2_SOURCE_ROOT="$ROOT" /usr/bin/python3 -B - <<'PY'
          import json,os,socket,struct,sys
          root=os.environ['P2_SOURCE_ROOT']
          sys.path.insert(0,root+'/stage1')
          import p2_gateway_relay as relay
          class Controller(object):
              def __init__(self): self.calls=0
              def preflight(self,c): self.calls+=1; return {'ready':True}
          class Base(object):
              def __init__(self,uid=31337): self.uid=uid; self.sent=b''; self.timeout=None; self.done=False
              def settimeout(self,v): self.timeout=v
              def getsockopt(self,*a): return struct.pack('3i',111,self.uid,222)
              def sendall(self,d): self.sent+=d
          class Timeout(Base):
              def recv(self,n): raise socket.timeout('fixture timeout')
          class Oversize(Base):
              def recv(self,n):
                  if self.done:return b''
                  self.done=True;return b'x'*(relay.MAXIMUM+1)
          class Valid(Base):
              def recv(self,n):
                  if self.done:return b''
                  self.done=True;return b'{"operation":"preflight"}\n'
          c=Controller()
          a=relay.serve_connection(Timeout(),c,31337)
          assert a['ok'] is False and a['error'] in ('timeout','TimeoutError') and c.calls==0
          b=relay.serve_connection(Oversize(),c,31337)
          assert b['ok'] is False and b['error']=='ValueError' and c.calls==0
          v=relay.serve_connection(Valid(),c,31337)
          assert v['ok'] is True and v['result']['ready'] is True and c.calls==1
          print('P2_UK_RELAY_TIMEOUT_OVERSIZE_PORTABLE=PASS')
          PY
          echo P2_UK_PYTHON368_WAL_PAGINATION_RELAY_REGRESSION=PASS
          echo P2_SOCKET_ACTIVATION_INSTALL_ACCEPTANCE=NOT_RUN

      - name: Verify exact package through real installer on UK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$P2_WORK_DIR/xuanjun-p2-package"
          /usr/bin/python3 "$ROOT/tools/p2-package-freeze.py" verify --archive "$P2_TAR_PATH" --sha256 "$P2_TAR_SHA256" --source-commit "$P2_SOURCE_COMMIT" --source-tree "$P2_SOURCE_TREE"
          # Real install staging is root-owned. Reproduce only that ownership in /tmp
          # before invoking the root-only release installer verifier.
          sudo -n /usr/bin/chown -R 0:0 "$P2_WORK_DIR"
          sudo -n /usr/bin/python3 -I -B - "$ROOT" <<'PY'
          import hashlib,importlib.util,json,os,pwd,stat,subprocess,sys,grp
          assert sys.version_info[:3]==(3,6,8)
          root=sys.argv[1]
          spec=importlib.util.spec_from_file_location('installer',root+'/scripts/uk-integration-install.py')
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.verify(root,root+'/deploy/integration-manifest.json',
                   'f01148fdeaa60c0a6dc1e9d30e9e707b61a65c06',
                   'afce7dc6b5207be938c7f12619bb36073530f6f2a883353335bdcf8cc4fa3601',
                   '3fc23b2a01bd8f01ea0edcef9216ded7313409c2')
          assert hashlib.sha256(open('/usr/libexec/platform-python3.6','rb').read()).hexdigest()=='ba19929d7038d0c2304f528213fa11e5f10c1ce65f0a891afa459bd167c7e5f6'
          transport=json.load(open(root+'/stage1/native_gateway_controller.py.json','r'))
          assert transport=={'relay_socket':'/run/xuanjun-development/p2-gateway.sock','server_user':'xuanjun_dev','client_group':'xuanjun-dispatcher'}
          relay=json.load(open(root+'/deploy/p2-gateway-relay.json.template','r'))
          assert relay['openclaw_bin']=='/home/xuanjun_dev/.openclaw/bin/openclaw'
          assert relay['openclaw_owner_uid']==1002
          actual=hashlib.sha256(open(relay['openclaw_bin'],'rb').read()).hexdigest()
          assert actual==relay['openclaw_sha256']=='b6aff1f40be0d46330c167e44525ef9080d66e40bb36dbb66c3811b4103fe3f2'
          service=open(root+'/deploy/xuanjun-development-dispatcher.service','r').read()
          controller_sha=hashlib.sha256(open(root+'/stage1/native_gateway_controller.py','rb').read()).hexdigest()
          assert 'ProtectHome=yes' in service
          assert 'Requires=xuanjun-p2-gateway-relay.socket' in service
          assert '/home/xuanjun_dev' not in service
          assert service.count('--native-controller ')==3
          assert service.count('--native-controller-sha256 '+controller_sha)==3
          relay_service=open(root+'/deploy/xuanjun-p2-gateway-relay.service','r').read()
          assert 'User=xuanjun_dev' in relay_service and 'ProtectHome=read-only' in relay_service
          assert 'p2_service_context_preflight.py' in service
          ledger=open(root+'/stage1/execution_ledger.py','r').read()
          wake=open(root+'/stage1/mechanical_wake_service.py','r').read()
          assert '_pinned_transaction' in ledger and 'record_inventory_notices' in ledger
          assert 'record_inventory_notices()' in wake
          assert "file:/proc/self/fd/%d?mode=rw" in ledger
          intake=open(root+'/deploy/xuanjun-github-intake.service','r').read()
          assert 'mechanical_wake_service.py' in intake
          try:
              pwd.getpwnam('xuanjun-dispatcher')
          except KeyError:
              print('P2_UK_SERVICE_CONTEXT_LIVE_PREFLIGHT=DEFERRED_UNTIL_INSTALL_IDENTITY_CREATION')
          else:
              print('P2_UK_SERVICE_CONTEXT_IDENTITY_PRESENT=YES_RUNTIME_PREFLIGHT_STILL_REQUIRES_INSTALLED_RELAY')
          def show(k):
              return subprocess.check_output(['/usr/bin/systemctl','show','xuanjun-uk-openclaw.service','--property='+k,'--value'],universal_newlines=True).strip()
          assert show('User')=='xuanjun_dev' and show('ActiveState')=='active' and show('SubState')=='running'
          st=os.stat('/var/run/docker.sock')
          assert st.st_gid==grp.getgrnam('docker').gr_gid and stat.S_IMODE(st.st_mode)==0o660
          print('P2_UK_REAL_RELEASE_INSTALLER_VERIFY=PASS')
          print('P2_UK_PYTHON_3_6_8=PASS')
          print('P2_UK_MODEL_CALLS=0')
          print('P2_UK_INSTALL_EFFECTS=0')
          PY

      - name: Prepare protected prerequisite inventory without install effects
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B - "$P2_WORK_DIR" <<'PY'
          import os,pwd,grp,stat,hashlib,json,socket,sys
          assert os.geteuid()==0 and socket.gethostname().split('.')[0]=='iZd7oeikknn1z21sq6ji6zZ'
          root=sys.argv[1]
          s=os.lstat(root)
          assert stat.S_ISDIR(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022
          def metadata(path,binary=False):
              try:
                  s=os.lstat(path)
              except FileNotFoundError:
                  return {'path':path,'exists':False}
              row={'path':path,'exists':True,'uid':s.st_uid,'gid':s.st_gid,'mode':oct(stat.S_IMODE(s.st_mode)),'symlink':stat.S_ISLNK(s.st_mode),'size':s.st_size}
              if binary and stat.S_ISREG(s.st_mode) and 0<s.st_size<134217728 and os.path.realpath(path)==path:
                  fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
                  try:
                      before=os.fstat(fd);h=hashlib.sha256();header=os.read(fd,20);h.update(header)
                      while True:
                          chunk=os.read(fd,1048576)
                          if not chunk:break
                          h.update(chunk)
                      after=os.fstat(fd)
                      assert (before.st_size,before.st_mtime_ns)==(after.st_size,after.st_mtime_ns)
                      row.update(sha256=h.hexdigest(),elf64_x86_64=header[:6]==b'\x7fELF\x02\x01' and header[18:20]==b'\x3e\x00')
                  finally:os.close(fd)
              return row
          uids={u.pw_uid for u in pwd.getpwall()};gids={g.gr_gid for g in grp.getgrall()}
          free=[x for x in range(1003,60001) if x not in uids and x not in gids][:4]
          users={}
          for name in ('xuanjun_dev','xuanjun-dispatcher','xuanjun-callback','xj_codex_worker'):
              try:
                  u=pwd.getpwnam(name);users[name]={'uid':u.pw_uid,'gid':u.pw_gid,'home':u.pw_dir,'shell':u.pw_shell,'groups':os.getgrouplist(name,u.pw_gid)}
              except KeyError:users[name]={'exists':False}
          sources=('/opt/xuanjun-runtime/gh/gh','/opt/xuanjun-runtime/codex-0.160.0/codex',
           '/home/xuanjun_dev/.openclaw/tools/codex-0.160.0/codex',
           '/home/xuanjun_dev/.openclaw/tools/codex/codex','/home/xuanjun_dev/.openclaw/bin/codex',
           '/usr/local/bin/codex','/usr/bin/codex','/usr/local/bin/gh','/usr/bin/gh')
          paths=('/etc/xuanjun-development','/etc/xuanjun-owner-callback','/var/lib/xuanjun-owner-callback/state',
           '/var/lib/xuanjun-development','/opt/xuanjun-runtime','/etc/nginx','/etc/nginx/conf.d',
           '/etc/letsencrypt/live','/sys/fs/cgroup/systemd',
           '/home/xuanjun_dev/.openclaw/agents/developer/agent/openclaw-agent.sqlite',
           '/home/xuanjun_dev/.openclaw/openclaw.json')
          value={'schema':1,'state':'PREREQUISITE_INVENTORY_NOT_INSTALL_PLAN','artifact_id':11796280855,
           'archive_sha256':'66cc89391b1bf4d0bdee7293ecc0fcc3ef2b3b7969da9abc72771d41042c38fd',
           'candidate_free_uid_gid_pairs_not_reserved':free,'users':users,
           'binary_candidates':[metadata(p,True) for p in sources],'paths':[metadata(p) for p in paths],
           'source_binaries_executed':False,'credentials_read':False,'services_changed':False,
           'canonical_ledger_changed':False,'install_admission':'NOT_GRANTED'}
          raw=(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
          path=root+'/protected-prerequisite-inventory.json'
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          print(json.dumps(value,sort_keys=True))
          print('PROTECTED_PREPARATION_PATH='+path)
          print('PROTECTED_PREPARATION_SHA256='+hashlib.sha256(raw).hexdigest())
          PY

      - name: Stage pinned official binaries and protected prerequisites subplan only
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 -I -B - "$P2_WORK_DIR" <<'PY'
          import os,sys,socket,stat,json,hashlib,urllib.request,tarfile,subprocess
          assert os.geteuid()==0 and socket.gethostname().split('.')[0]=='iZd7oeikknn1z21sq6ji6zZ'
          root=sys.argv[1]
          info=os.lstat(root)
          assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
          inventory=json.load(open(root+'/protected-prerequisite-inventory.json'))
          assert inventory['artifact_id']==11796280855
          assets=[
           ('gh','https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz',
            'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386',33554432,
            'gh_2.102.0_linux_amd64/bin/gh','/opt/xuanjun-runtime/gh/gh','gh version 2.102.0'),
           ('codex','https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-x86_64-unknown-linux-musl.tar.gz',
            '306865417d4ee7a927785852910a527f41e1e159add390ac5ae3accb67d44a13',109304578,
            'codex-x86_64-unknown-linux-musl','/opt/xuanjun-runtime/codex-0.160.0/codex','codex-cli 0.160.0')]
          stage=root+'/pinned-binaries';os.mkdir(stage,0o700)
          home=stage+'/offline-home';os.mkdir(home,0o700)
          bindings=[];receipts=[]
          for name,url,digest,bound,member,target,version in assets:
              archive=stage+'/'+name+'.tar.gz';h=hashlib.sha256();size=0
              fd=os.open(archive,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as output:
                  with urllib.request.urlopen(url,timeout=45) as response:
                      while True:
                          chunk=response.read(1048576)
                          if not chunk:break
                          size+=len(chunk)
                          if size>bound:raise ValueError('PINNED_ARCHIVE_BOUND')
                          h.update(chunk);output.write(chunk)
                  output.flush();os.fsync(output.fileno())
              if h.hexdigest()!=digest:raise ValueError('PINNED_ARCHIVE_DIGEST')
              path=stage+'/'+name;binary_hash=hashlib.sha256();total=0
              with tarfile.open(archive,'r:gz') as tf:
                  entries=[m for m in tf.getmembers() if m.name==member]
                  if len(entries)!=1 or not entries[0].isfile() or not 0<entries[0].size<=536870912:
                      raise ValueError('EXACT_OFFICIAL_BINARY_MEMBER_REQUIRED')
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o500)
                  with os.fdopen(fd,'wb') as output:
                      source=tf.extractfile(entries[0]);header=source.read(20)
                      if header[:6]!=b'\x7fELF\x02\x01' or header[18:20]!=b'\x3e\x00':
                          raise ValueError('PINNED_X86_64_ELF_REQUIRED')
                      output.write(header);binary_hash.update(header);total=len(header)
                      while True:
                          chunk=source.read(1048576)
                          if not chunk:break
                          total+=len(chunk)
                          if total>536870912:raise ValueError('PINNED_BINARY_BOUND')
                          output.write(chunk);binary_hash.update(chunk)
                      if total!=entries[0].size:raise ValueError('PINNED_BINARY_SIZE')
                      output.flush();os.fsync(output.fileno())
              actual=binary_hash.hexdigest()
              if name=='gh' and actual!='7469124f706944133d6a169691dd1c6c3511b12e85878d255e044e2948df4c9b':
                  raise ValueError('EXISTING_GH_RECEIPT_MISMATCH')
              result=subprocess.check_output([path,'--version'],stderr=subprocess.DEVNULL,timeout=15,
                env={'HOME':home,'PATH':'/usr/bin:/bin','LANG':'C','GH_NO_UPDATE_NOTIFIER':'1','GH_NO_EXTENSION_UPDATE_NOTIFIER':'1','GH_PROMPT_DISABLED':'1'})
              if len(result)>4096 or not result.decode('utf-8').splitlines()[0].startswith(version):
                  raise ValueError('PINNED_OFFLINE_VERSION_MISMATCH')
              os.chmod(path,0o555)
              bindings.append({'source':path,'target':target,'sha256':actual})
              receipts.append({'name':name,'official_archive_sha256':digest,'binary_sha256':actual,'binary_size':total,'offline_version':version,'installed':False})
          pairs=inventory['candidate_free_uid_gid_pairs_not_reserved']
          assert len(pairs)==4
          names=('xuanjun-dispatcher','xuanjun-callback','xj_codex_worker','xuanjun-control-db')
          groups=dict(zip(names,pairs));users={};directories=[]
          def directory(path,uid=0,gid=0,mode=0o755):
              directories.append({'path':path,'uid':uid,'gid':gid,'mode':mode})
          for path in ('/opt/xuanjun-runtime','/opt/xuanjun-runtime/gh','/opt/xuanjun-runtime/codex-0.160.0',
           '/var/lib/xuanjun-development','/var/lib/xuanjun-development/users'):
              directory(path)
          directory('/etc/xuanjun-development',0,pairs[3],0o750)
          directory('/etc/xuanjun-owner-callback',0,pairs[3],0o750)
          for name in names[:3]:
              uid=groups[name];home='/var/lib/xuanjun-development/users/'+name
              users[name]={'uid':uid,'gid':uid,'home':home,
                'groups':[] if name=='xj_codex_worker' else ['xuanjun-control-db']}
              directory(home,uid,uid,0o700)
          plan={'schema':1,'groups':groups,'users':users,'directories':directories,'binaries':bindings}
          sys.path.insert(0,root+'/xuanjun-p2-package/stage1')
          from p2_prerequisites import validate
          validate(plan)
          def protected_write(path,value):
              raw=(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n').encode()
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
              return hashlib.sha256(raw).hexdigest()
          plan_path=root+'/protected-prerequisites-subplan.json'
          plan_hash=protected_write(plan_path,plan)
          record={'schema':1,'state':'PINNED_BINARIES_STAGED_SUBPLAN_VALIDATED_NOT_INSTALLED','artifact_id':11796280855,
           'subplan_sha256':plan_hash,'subplan_path':plan_path,'binaries':receipts,
           'scope':'BINARY_AND_ACCOUNT_PREREQUISITES_ONLY_NOT_COMPLETE_P2_PLAN',
           'missing_full_plan_sections':['protected_receiver_auth','runtime_provisioning','TLS_callback','cutover_activation'],
           'accounts_created':False,'services_changed':False,'canonical_ledger_changed':False,'model_calls':0}
          protected_write(root+'/protected-binary-preparation-receipt.json',record)
          print(json.dumps(record,sort_keys=True))
          PY
