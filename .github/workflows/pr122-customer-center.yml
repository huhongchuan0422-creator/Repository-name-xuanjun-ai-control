name: PR122 Customer Center Isolated Review
on:
  workflow_dispatch:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - 'tools/pr122_login_config_prepare.py'
      - 'tests/test_pr122_login_config_prepare.py'
      - 'tools/pr122_login_initial_prepare.py'
      - 'tests/test_pr122_login_initial_prepare.py'
      - 'docs/development/PR122_LOGIN_CONFIG_PREPARATION.md'
      - 'scripts/pr122_customer_*.py'
      - 'tests/test_pr122_customer_*.py'
      - 'tests/pr122_customer_*'
      - 'deploy/pr122-customer-center/**'
      - 'docs/development/PR122_CUSTOMER_CENTER*'
      - '.github/workflows/pr122-customer-center.yml'
permissions:
  contents: read
  actions: read
jobs:
  isolated-customer-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact isolated runtime dependencies and wheel hashes
        run: |
          mkdir -p /tmp/pr122-customer/wheels
          python -m pip download --only-binary=:all: --dest /tmp/pr122-customer/wheels cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          sha256sum /tmp/pr122-customer/wheels/* > /tmp/pr122-customer/WHEEL_SHA256SUMS
          python -m pip install --no-index --find-links /tmp/pr122-customer/wheels cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
      - name: SMTP TLS mode and durable unknown offline regression
        run: python -B -m unittest tests.test_pr122_customer_providers.SMTPTransportTests -v
      - name: Exact 33 synthetic identity mapping and authorization regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PR122_IDENTITY_COMMIT="$GITHUB_SHA" PR122_IDENTITY_RUN="$GITHUB_RUN_ID" "$(command -v python)" -B - <<'PYIDENTITY' 2>&1 | tee /tmp/pr122-customer/IDENTITY_AUTHORIZATION_TESTS.log
          import json,os,unittest
          from pathlib import Path
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_pr122_customer_identity')
          assert suite.countTestCases()==33, 'Identity test collection changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==33 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          receipt={'commit':os.environ['PR122_IDENTITY_COMMIT'],'run_id':os.environ['PR122_IDENTITY_RUN'],'total':result.testsRun,'skipped':0,'failures':0,'errors':0,'scope':'SYNTHETIC_LOCAL_IDENTITIES_AND_HTTP_ONLY_NOT_PRODUCTION'}
          Path('/tmp/pr122-customer/IDENTITY_AUTHORIZATION_COUNTS.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PYIDENTITY
      - name: Exact 110 offline configuration preparation regressions Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          export PR122_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python -B - <<'PYOFFLINE' 2>&1 | tee /tmp/pr122-customer/OFFLINE_CONFIG_TESTS.log
          import hashlib,json,os,sys,unittest
          from pathlib import Path
          assert sys.version_info[:2]==(3,11), 'Target Python version changed'
          assert os.geteuid()!=0, 'Offline synthetic tests must run non-root'
          blocked=[]
          def guard(event,args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn','os.fork','os.forkpty','os.exec'):
                  blocked.append(event)
                  raise AssertionError('FORBIDDEN_NETWORK_OR_PROCESS')
              if event=='open' and args and isinstance(args[0],str) and any(args[0]==p or args[0].startswith(p+'/') for p in ('/etc/xuanjun-customer-center','/var/lib/xuanjun-customer-center','/usr/local/lib/xuanjun-customer-center')):
                  blocked.append('protected-path')
                  raise AssertionError('FORBIDDEN_PRODUCTION_PATH')
          sys.addaudithook(guard)
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_pr122_login_config_prepare')
          assert suite.countTestCases()==110, 'Offline preparation test count changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==110 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses and not blocked
          folder=Path('/tmp/pr122-customer/offline-config-preparation')
          folder.mkdir()
          bindings=[]
          for name in ('tools/pr122_login_config_prepare.py','tests/test_pr122_login_config_prepare.py','docs/development/PR122_LOGIN_CONFIG_PREPARATION.md','.github/workflows/pr122-customer-center.yml'):
              body=Path(name).read_bytes()
              artifact_path='workflow/pr122-customer-center.yml' if name=='.github/workflows/pr122-customer-center.yml' else name
              target=folder/artifact_path
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(body)
              bindings.append({'path':name,'artifact_path':artifact_path,'size':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          receipt={'source_commit':os.environ['GITHUB_SHA'],'source_tree':os.environ['PR122_SOURCE_TREE'],'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version,'total':result.testsRun,'passed':result.testsRun,'skipped':0,'errors':0,'failures':0,'expected_failures':0,'unexpected_successes':0,'blocked_network_process_or_protected_path_attempts':blocked,'files':bindings,'scope':'OFFLINE_SYNTHETIC_ONLY','production_release':'HOLD','real_credentials':'NOT_USED','target_install':'NOT_RUN'}
          (folder/'OFFLINE_CONFIG_BINDING.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PYOFFLINE
      - name: Exact 23 initial preparation regressions including 6 nonroot filesystem cases
        shell: bash
        run: |
          set -euo pipefail
          export PR122_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python -B - <<'PYINITIAL' 2>&1 | tee /tmp/pr122-customer/INITIAL_PREPARATION_TESTS.log
          import hashlib,json,os,sys,unittest
          from pathlib import Path
          assert sys.version_info[:2]==(3,11), 'Target Python version changed'
          assert os.geteuid()!=0, 'Initial synthetic tests must run non-root'
          blocked=[]
          def guard(event,args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn','os.fork','os.forkpty','os.exec'):
                  blocked.append(event)
                  raise AssertionError('FORBIDDEN_NETWORK_OR_PROCESS')
              if event=='open' and args and isinstance(args[0],str) and any(args[0]==p or args[0].startswith(p+'/') for p in ('/etc/xuanjun-customer-center','/var/lib/xuanjun-customer-center','/usr/local/lib/xuanjun-customer-center')):
                  blocked.append('protected-path')
                  raise AssertionError('FORBIDDEN_PRODUCTION_PATH')
          sys.addaudithook(guard)
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_pr122_login_initial_prepare')
          def cases(group):
              for item in group:
                  if isinstance(item,unittest.TestSuite):yield from cases(item)
                  else:yield item.id()
          case_ids=list(cases(suite))
          filesystem=[name for name in case_ids if '.FilesystemTests.' in name]
          assert suite.countTestCases()==len(set(case_ids))==23, 'Initial test collection changed'
          assert len(filesystem)==6, 'Nonroot filesystem collection changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==23 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses and not blocked
          bindings=[]
          for name in ('tools/pr122_login_initial_prepare.py','tests/test_pr122_login_initial_prepare.py','tools/pr122_login_config_prepare.py','.github/workflows/pr122-customer-center.yml'):
              body=Path(name).read_bytes()
              bindings.append({'path':name,'size':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          receipt={'source_commit':os.environ['GITHUB_SHA'],'source_tree':os.environ['PR122_SOURCE_TREE'],'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version,'euid':os.geteuid(),'total':result.testsRun,'passed':result.testsRun,'filesystem_cases':filesystem,'case_ids':case_ids,'skipped':0,'errors':0,'failures':0,'blocked_network_process_or_protected_path_attempts':blocked,'files':bindings,'scope':'OFFLINE_SYNTHETIC_ONLY','production_release':'HOLD','real_credentials':'NOT_USED','target_install':'NOT_RUN'}
          Path('/tmp/pr122-customer/INITIAL_PREPARATION_BINDING.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PYINITIAL
      - name: Removed collector reference and tree consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          removed=[
              'tools/'+'pr122_'+'readonly_'+'delta_'+'collect.py',
              'tests/'+'test_'+'pr122_'+'readonly_'+'delta_'+'collect.py',
              'tests/'+'test_'+'pr122_'+'readonly_'+'delta_'+'schema.py',
              'docs/development/'+'PR122_'+'READONLY_'+'DELTA_'+'COLLECTION.md',
          ]
          workflow=Path('.github/workflows/pr122-customer-center.yml').read_text()
          for item in removed:
              assert not Path(item).exists(), 'REMOVED_COLLECTOR_PATH_REAPPEARED:'+item
              assert item not in workflow, 'REMOVED_COLLECTOR_REFERENCE_REAPPEARED:'+item
          assert ('READONLY_'+'DELTA_'+'BINDING.json') not in workflow
          assert ('readonly-'+'delta-'+'collector') not in workflow
          print('REMOVED_COLLECTOR_REFERENCE_CLOSURE=PASS; PATHS=4')
          PY
      - name: Authentication authorization material channels and encrypted restore
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$(command -v python)" -B -m unittest tests.test_pr122_customer_center.CustomerTests tests.test_pr122_customer_bind_tokens.BindTokenTests tests.test_pr122_customer_http.HttpTests tests.test_pr122_customer_providers.ProviderTests tests.test_pr122_customer_release.ReleaseTests tests.test_pr122_customer_revision tests.test_pr122_customer_changes.ChangeTests tests.test_pr122_customer_changes.ChangeHTTPTests tests.test_pr122_change_submit_idempotency_full.ChangeSubmitIdempotencyFullTests tests.test_pr122_customer_preview.PreviewTests tests.test_pr122_customer_preview.PreviewHTTPTests tests.test_pr122_customer_runtime.RuntimeTests tests.test_pr122_customer_channel_binding.BindingTests tests.test_pr122_customer_channel_upgrade.UpgradeTests tests.test_pr122_customer_channel_upgrade.FrozenPinTests tests.test_pr122_customer_publication_worker.PublicationTests tests.test_pr122_customer_small_edit.SmallEditTests tests.test_pr122_customer_edit_jobs.EditJobTests tests.test_pr122_customer_edit_jobs.EditJobHTTPTests -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_TESTS.log
          python -m py_compile scripts/pr122_customer_*.py
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_TESTS.log').read_text()
          counts=re.findall(r'Ran (\d+) tests in ',text)
          assert counts and re.search(r'^OK$',text,re.M) and not re.search(r'skipped=|FAILED|ERROR:|FAIL:',text)
          n=int(counts[-1]);receipt={'total':n,'executed':n,'passed':n,'skipped':0,'errors':0,'failures':0,'scope':'Isolated Hosted tests, not production'}
          Path('/tmp/pr122-customer/CUSTOMER_TEST_COUNTS.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Exact 152 evidence privacy identity and restore regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PYTEST' 2>&1 | tee /tmp/pr122-customer/CUSTOMER_EVIDENCE_TESTS.log
          import json,os,unittest
          from pathlib import Path
          names = [
              'tests.test_pr122_customer_center.CustomerTests',
              'tests.test_pr122_customer_providers.ProviderTests',
              'tests.test_pr122_site_hub_identity_integration.IdentityIntegrationTests',
              'tests.test_pr122_customer_message_evidence.MessageEvidenceTests',
              'tests.test_pr122_customer_message_evidence.MessageEvidenceHTTPTests',
              'tests.test_pr122_customer_activity_evidence.ActivityEvidenceTests',
              'tests.test_pr122_customer_privacy.PrivacyTests',
              'tests.test_pr122_customer_privacy_http.PrivacyHTTPTests',
              'tests.test_pr122_customer_context_config.ContextConfigTests',
              'tests.test_pr122_customer_context_config.PrivacyBackupTests',
              'tests.test_pr122_customer_changes.ChangeTests',
          ]
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          loaded=suite.countTestCases()
          print(json.dumps({'loaded':loaded,'expected':152,'test_classes':names},sort_keys=True),flush=True)
          assert loaded==152, 'Frozen evidence regression count changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          receipt={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'total':result.testsRun,'executed':result.testsRun-len(result.skipped),'passed':result.testsRun-len(result.skipped)-len(result.errors)-len(result.failures),'skipped':len(result.skipped),'errors':len(result.errors),'failures':len(result.failures),'scope':'ISOLATED_IN_PROCESS_SYNTHETIC_NOT_PRODUCTION'}
          Path('/tmp/pr122-customer/CUSTOMER_EVIDENCE_TEST_COUNTS.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          assert result.testsRun==152 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PYTEST
          node tests/pr122_customer_auth_ui.cjs 2>&1 | tee /tmp/pr122-customer/CUSTOMER_AUTH_PRIVACY_DOM_TESTS.log
      - name: V2 checkpoint recovery isolated regression
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_resume tests.test_pr122_customer_resume_review -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_RESUME_TESTS.log
          python - <<'PYCOUNT'
          import json,os,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_RESUME_TESTS.log').read_text()
          counts=re.findall(r'^Ran (\d+) tests? in ',text,re.M)
          assert counts and int(counts[-1])==36 and re.search(r'^OK$',text,re.M)
          assert not re.search(r'\b(skipped|expected failures|unexpected successes)\b',text,re.I)
          Path('/tmp/pr122-customer/CUSTOMER_RESUME_COUNTS.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'unique_cases':int(counts[-1]),'passed':int(counts[-1]),'scope':'SYNTHETIC_NONROOT_FIXTURES_NOT_SERVER_EXECUTION','production':'NOT_RUN'},sort_keys=True)+'\n')
          PYCOUNT
      - name: Controlled attempts isolated non-root regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_release tests.test_pr122_customer_attempts -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_ATTEMPT_TESTS.log
          python - <<'PYATTEMPTS'
          import json,os,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_ATTEMPT_TESTS.log').read_text()
          counts=re.findall(r'Ran (\d+) tests in ',text)
          assert counts and int(counts[-1])==33 and re.search(r'^OK$',text,re.M)
          assert not re.search(r'skipped=|FAILED|ERROR:|FAIL:',text)
          Path('/tmp/pr122-customer/CUSTOMER_ATTEMPT_COUNTS.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'unique_cases':33,'passed':33,'scope':'SYNTHETIC_NONROOT_FIXTURES_NOT_SERVER_EXECUTION','production':'NOT_RUN'},sort_keys=True)+'\n')
          PYATTEMPTS
      - name: Whole website fixed-stage isolated regression
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_workflow tests.test_pr122_customer_workflow_review tests.test_pr122_customer_preparation_bridges tests.test_pr122_customer_policy_restore tests.test_pr122_customer_channel_workflow tests.test_pr122_customer_workflow_apply tests.test_pr122_customer_workflow_operations tests.test_pr122_customer_protected_runtime tests.test_pr122_customer_workflow_signature -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_WHOLE_WORKFLOW_TESTS.log
      - name: Protected workflow entry and non-executable review request
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_workflow_request -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_WORKFLOW_ENTRY_TESTS.log
      - name: Signed login-only profile and five-hour scope regressions
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_login_profile tests.test_pr122_customer_login_release tests.test_pr122_customer_login_ops_review -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_LOGIN_SCOPE_TESTS.log
      - name: Install isolated browser only
        run: |
          npm install --prefix "$RUNNER_TEMP/pr122-customer-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-customer-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Authenticated desktop and mobile fixture flows
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-customer-browser/node_modules/playwright" node tests/pr122_customer_browser.cjs
      - name: Real queued candidate to isolated desktop and mobile test
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-customer-browser/node_modules/playwright" node tests/pr122_customer_edit_pipeline_browser.cjs
      - name: Validate isolated service candidates and Nginx route
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          # Disposable Hosted syntax fixture only; not a domestic runtime install.
          sudo install -d -m 0755 /usr/local/lib/xuanjun-customer-runtime/venv/bin
          sudo install -m 0755 "$(command -v python)" /usr/local/lib/xuanjun-customer-runtime/venv/bin/python
          sudo systemd-analyze verify deploy/pr122-customer-center/xuanjun-customer-center.service deploy/pr122-customer-center/xuanjun-customer-delivery.service deploy/pr122-customer-center/xuanjun-customer-delivery.timer deploy/pr122-customer-center/xuanjun-customer-publication.service deploy/pr122-customer-center/xuanjun-customer-publication.socket deploy/pr122-customer-center/xuanjun-customer-publication.timer
          python - <<'PY'
          import pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as folder:
              p=pathlib.Path(folder)/'nginx.conf'
              p.write_text('pid '+folder+'/nginx.pid; error_log '+folder+'/error.log; events {} http { server { listen 127.0.0.1:18796; include '+str(root/'deploy/pr122-customer-center/locations.conf')+'; } }')
              subprocess.run(['sudo','nginx','-t','-c',str(p)],check=True)
          PY
      - name: Real isolated Nginx proxy origin and concurrent-client regression
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: sudo -n --preserve-env=XJ_CUSTOMER_REPORT_DIR "$(command -v python)" -B -m tests.pr122_customer_proxy
      - name: Bind complete review-only package to exact checkout
        run: |
          python -m scripts.pr122_customer_package --output /tmp/pr122-customer --source-commit "$GITHUB_SHA" --source-tree "$(git rev-parse HEAD^{tree})"
          python - <<'PY'
          import json,os,subprocess,pathlib
          pathlib.Path('/tmp/pr122-customer/CI_BINDING.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'scope':'ISOLATED_FIXTURE_ONLY','host_mutations':0,'production_acceptance_14':'NOT_RUN','independent_review':'PENDING','production_release':'HOLD'},indent=2))
          PY
      - name: Build exact 103-member fixed-channel rebind candidate and upgrade parse no root execution
        run: |
          python - <<'PYCODE'
          import json,os,urllib.request
          from pathlib import Path
          from scripts.pr122_customer_channel_binding import bind
          from scripts.pr122_customer_channel_upgrade import unpack as upgrade_unpack
          from scripts.pr122_customer_core import canonical,digest
          url='https://raw.githubusercontent.com/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/7e5d42f5a5331dc261074ddd780413d03de9c591/scripts/pr122_domestic_customer_channel.py'
          with urllib.request.urlopen(url,timeout=20) as response:original=response.read(100001)
          archive_raw=Path('/tmp/pr122-customer/PR122_CUSTOMER_CENTER_REVIEW_ONLY.tar.gz').read_bytes()
          upgrade_files,upgrade_manifest,upgrade_manifest_sha=upgrade_unpack(archive_raw)
          assert len(upgrade_files)==103 and len(upgrade_manifest['files'])==102
          assert upgrade_manifest['source_commit']==os.environ['GITHUB_SHA']
          package_receipt=json.loads(Path('/tmp/pr122-customer/CUSTOMER_PACKAGE_RECEIPT.json').read_bytes())
          assert upgrade_manifest_sha==package_receipt['manifest_sha256']
          code,binding=bind(original,archive_raw,'/tmp/pr122-customer/wheels')
          out=Path('/tmp/pr122-customer/rebind-candidate');out.mkdir()
          (out/'channel.py').write_bytes(code);(out/'REBIND_BINDING.json').write_bytes(canonical(binding))
          print(canonical(binding).decode())
          import os,subprocess
          builder=Path('scripts/pr122_customer_runtime.py').read_bytes()
          Path('/tmp/pr122-customer/runtime-builder.py').write_bytes(builder)
          Path('/tmp/pr122-customer/RUNTIME_BUILDER_BINDING.json').write_bytes(canonical({'source_commit':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'builder_sha256':__import__('hashlib').sha256(builder).hexdigest()}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: /tmp/pr122-customer/
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: /tmp/pr122-customer-roundtrip
      - name: Verify downloaded archive and complete source closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,tarfile
          from pathlib import Path
          folder=Path('/tmp/pr122-customer-roundtrip')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          receipt=json.loads((folder/'CUSTOMER_PACKAGE_RECEIPT.json').read_bytes())
          raw=(folder/'PR122_CUSTOMER_CENTER_REVIEW_ONLY.tar.gz').read_bytes()
          assert receipt['source_commit']==os.environ['GITHUB_SHA'] and sha(raw)==receipt['tar_sha256']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              items=archive.getmembers()
              assert len(items)==receipt['members'] and len({x.name for x in items})==len(items)
              assert all(x.isfile() and x.name.startswith('customer-center/') and '..' not in Path(x.name).parts for x in items)
              files={x.name.removeprefix('customer-center/'):archive.extractfile(x).read() for x in items}
          manifest_raw=files.pop('CUSTOMER_MANIFEST.json')
          assert sha(manifest_raw)==receipt['manifest_sha256']
          manifest=json.loads(manifest_raw)
          assert manifest['source_commit']==os.environ['GITHUB_SHA'] and len(files)==receipt['bound_files']==len(manifest['files'])
          assert set(files)=={x['path'] for x in manifest['files']}
          assert {'scripts/pr122_customer_attempts.py','tests/test_pr122_customer_attempts.py','scripts/pr122_customer_resume.py','tests/test_pr122_customer_resume.py','tests/test_pr122_customer_resume_review.py'} <= set(files)
          for item in manifest['files']:
              body=files[item['path']]
              assert len(body)==item['size'] and sha(body)==item['sha256']
              source=Path('deploy/pr122-customer-center/boot.py') if item['path']=='boot.py' else Path(item['path'])
              assert source.read_bytes()==body
          binding=json.loads((folder/'rebind-candidate/REBIND_BINDING.json').read_bytes())
          assert (folder/'rebind-candidate/channel.py').read_bytes()==Path('/tmp/pr122-customer/rebind-candidate/channel.py').read_bytes()
          assert (folder/'runtime-builder.py').read_bytes()==Path('scripts/pr122_customer_runtime.py').read_bytes()
          offline=folder/'offline-config-preparation'
          offline_binding=json.loads((offline/'OFFLINE_CONFIG_BINDING.json').read_bytes())
          assert offline_binding['source_commit']==os.environ['GITHUB_SHA'] and offline_binding['source_tree']==manifest['source_tree'] and str(offline_binding['run_id'])==os.environ['GITHUB_RUN_ID']
          assert offline_binding['total']==offline_binding['passed']==110 and all(offline_binding[key]==0 for key in ('skipped','errors','failures','expected_failures','unexpected_successes'))
          assert offline_binding['blocked_network_process_or_protected_path_attempts']==[] and offline_binding['scope']=='OFFLINE_SYNTHETIC_ONLY' and offline_binding['production_release']=='HOLD'
          assert {item['path'] for item in offline_binding['files']}=={'tools/pr122_login_config_prepare.py','tests/test_pr122_login_config_prepare.py','docs/development/PR122_LOGIN_CONFIG_PREPARATION.md','.github/workflows/pr122-customer-center.yml'}
          assert len(offline_binding['files'])==4
          for item in offline_binding['files']:
              expected_artifact_path='workflow/pr122-customer-center.yml' if item['path']=='.github/workflows/pr122-customer-center.yml' else item['path']
              assert item['artifact_path']==expected_artifact_path
              body=(offline/item['artifact_path']).read_bytes()
              assert len(body)==item['size'] and sha(body)==item['sha256'] and body==Path(item['path']).read_bytes()
          print(json.dumps({'downloaded_tar_sha256':sha(raw),'manifest_sha256':sha(manifest_raw),'members':len(items),'bound_files':len(files),'source_closure':'PASS','channel_roundtrip':'PASS','raw_zip_recalculation':'INDEPENDENT_REVIEW_PENDING'},sort_keys=True))
          PY

  isolated-domestic-runtime:
    if: ${{ false }}
    needs: isolated-customer-center
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-customer-runtime-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exact offline wheel ABI and crypto verification as non-root
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/('pr122-customer-runtime-input-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          binding=json.loads((folder/'RUNTIME_BUILDER_BINDING.json').read_bytes())
          assert set(binding)=={'source_commit','source_tree','run_id','builder_sha256'} and binding['source_commit']==os.environ['GITHUB_SHA'] and binding['run_id']==os.environ['GITHUB_RUN_ID']
          assert hashlib.sha256((folder/'runtime-builder.py').read_bytes()).hexdigest()==binding['builder_sha256']
          print('EXACT_ARTIFACT_BUILDER_BINDING=PASS; CHECKOUT_NOT_USED; ROOT_NOT_CALLED')
          PY
          /usr/bin/python3 -I -B "$RUNNER_TEMP/pr122-customer-runtime-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/runtime-builder.py" --wheels "$RUNNER_TEMP/pr122-customer-runtime-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/wheels" --output "$RUNNER_TEMP/pr122-customer-runtime-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-domestic-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-customer-runtime-output-${{ github.run_id }}-${{ github.run_attempt }}/RUNTIME_REPORT.json
          if-no-files-found: error
          retention-days: 14


