name: PR122 Customer Center Isolated Review
on:
  workflow_dispatch:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - 'scripts/pr122_customer_*.py'
      - 'tests/test_pr122_customer_*.py'
      - 'tests/pr122_customer_*'
      - 'deploy/pr122-customer-center/**'
      - 'docs/development/PR122_CUSTOMER_CENTER*'
      - '.github/workflows/pr122-customer-center.yml'
permissions:
  contents: read
  actions: read
jobs:
  isolated-customer-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact isolated runtime dependencies and wheel hashes
        run: |
          mkdir -p /tmp/pr122-customer/wheels
          python -m pip download --only-binary=:all: --dest /tmp/pr122-customer/wheels cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          sha256sum /tmp/pr122-customer/wheels/* > /tmp/pr122-customer/WHEEL_SHA256SUMS
          python -m pip install --no-index --find-links /tmp/pr122-customer/wheels cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
      - name: Authentication authorization material channels and encrypted restore
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "$(command -v python)" -B -m unittest tests.test_pr122_customer_center.CustomerTests tests.test_pr122_customer_http.HttpTests tests.test_pr122_customer_providers.ProviderTests tests.test_pr122_customer_release.ReleaseTests tests.test_pr122_customer_revision tests.test_pr122_customer_changes.ChangeTests tests.test_pr122_customer_changes.ChangeHTTPTests tests.test_pr122_customer_preview.PreviewTests tests.test_pr122_customer_preview.PreviewHTTPTests tests.test_pr122_customer_runtime.RuntimeTests tests.test_pr122_customer_channel_binding.BindingTests tests.test_pr122_customer_channel_upgrade.UpgradeTests tests.test_pr122_customer_channel_upgrade.FrozenPinTests tests.test_pr122_customer_publication_worker.PublicationTests tests.test_pr122_customer_small_edit.SmallEditTests tests.test_pr122_customer_edit_jobs.EditJobTests tests.test_pr122_customer_edit_jobs.EditJobHTTPTests -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_TESTS.log
          python -m py_compile scripts/pr122_customer_*.py
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_TESTS.log').read_text()
          counts=re.findall(r'Ran (\d+) tests in ',text)
          assert counts and re.search(r'^OK$',text,re.M) and not re.search(r'skipped=|FAILED|ERROR:|FAIL:',text)
          n=int(counts[-1]);receipt={'total':n,'executed':n,'passed':n,'skipped':0,'errors':0,'failures':0,'scope':'Isolated Hosted tests, not production'}
          Path('/tmp/pr122-customer/CUSTOMER_TEST_COUNTS.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Exact 150 evidence privacy identity and restore regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PYTEST' 2>&1 | tee /tmp/pr122-customer/CUSTOMER_EVIDENCE_TESTS.log
          import json,os,unittest
          from pathlib import Path
          names = [
              'tests.test_pr122_customer_center.CustomerTests',
              'tests.test_pr122_customer_providers.ProviderTests',
              'tests.test_pr122_site_hub_identity_integration.IdentityIntegrationTests',
              'tests.test_pr122_customer_message_evidence.MessageEvidenceTests',
              'tests.test_pr122_customer_message_evidence.MessageEvidenceHTTPTests',
              'tests.test_pr122_customer_activity_evidence.ActivityEvidenceTests',
              'tests.test_pr122_customer_privacy.PrivacyTests',
              'tests.test_pr122_customer_privacy_http.PrivacyHTTPTests',
              'tests.test_pr122_customer_context_config.ContextConfigTests',
              'tests.test_pr122_customer_context_config.PrivacyBackupTests',
              'tests.test_pr122_customer_changes.ChangeTests',
          ]
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          assert suite.countTestCases()==150, 'Frozen evidence regression count changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          receipt={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'total':result.testsRun,'executed':result.testsRun-len(result.skipped),'passed':result.testsRun-len(result.skipped)-len(result.errors)-len(result.failures),'skipped':len(result.skipped),'errors':len(result.errors),'failures':len(result.failures),'scope':'ISOLATED_IN_PROCESS_SYNTHETIC_NOT_PRODUCTION'}
          Path('/tmp/pr122-customer/CUSTOMER_EVIDENCE_TEST_COUNTS.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          assert result.testsRun==150 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          PYTEST
          node tests/pr122_customer_auth_ui.cjs 2>&1 | tee /tmp/pr122-customer/CUSTOMER_AUTH_PRIVACY_DOM_TESTS.log
      - name: V2 checkpoint recovery isolated regression
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_resume tests.test_pr122_customer_resume_review -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_RESUME_TESTS.log
          python - <<'PYCOUNT'
          import json,os,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_RESUME_TESTS.log').read_text()
          counts=re.findall(r'^Ran (\d+) tests? in ',text,re.M)
          assert counts and int(counts[-1])==36 and re.search(r'^OK$',text,re.M)
          assert not re.search(r'\b(skipped|expected failures|unexpected successes)\b',text,re.I)
          Path('/tmp/pr122-customer/CUSTOMER_RESUME_COUNTS.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'unique_cases':int(counts[-1]),'passed':int(counts[-1]),'scope':'SYNTHETIC_NONROOT_FIXTURES_NOT_SERVER_EXECUTION','production':'NOT_RUN'},sort_keys=True)+'\n')
          PYCOUNT
      - name: Controlled attempts isolated non-root regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_pr122_customer_release tests.test_pr122_customer_attempts -v 2>&1 | tee /tmp/pr122-customer/CUSTOMER_ATTEMPT_TESTS.log
          python - <<'PYATTEMPTS'
          import json,os,re
          from pathlib import Path
          text=Path('/tmp/pr122-customer/CUSTOMER_ATTEMPT_TESTS.log').read_text()
          counts=re.findall(r'Ran (\d+) tests in ',text)
          assert counts and int(counts[-1])==33 and re.search(r'^OK$',text,re.M)
          assert not re.search(r'skipped=|FAILED|ERROR:|FAIL:',text)
          Path('/tmp/pr122-customer/CUSTOMER_ATTEMPT_COUNTS.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'unique_cases':33,'passed':33,'scope':'SYNTHETIC_NONROOT_FIXTURES_NOT_SERVER_EXECUTION','production':'NOT_RUN'},sort_keys=True)+'\n')
          PYATTEMPTS
      - name: Install isolated browser only
        run: |
          npm install --prefix "$RUNNER_TEMP/pr122-customer-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-customer-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Authenticated desktop and mobile fixture flows
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-customer-browser/node_modules/playwright" node tests/pr122_customer_browser.cjs
      - name: Real queued candidate to isolated desktop and mobile test
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-customer-browser/node_modules/playwright" node tests/pr122_customer_edit_pipeline_browser.cjs
      - name: Validate isolated service candidates and Nginx route
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          # Disposable Hosted syntax fixture only; not a domestic runtime install.
          sudo install -d -m 0755 /usr/local/lib/xuanjun-customer-runtime/venv/bin
          sudo install -m 0755 "$(command -v python)" /usr/local/lib/xuanjun-customer-runtime/venv/bin/python
          sudo systemd-analyze verify deploy/pr122-customer-center/xuanjun-customer-center.service deploy/pr122-customer-center/xuanjun-customer-delivery.service deploy/pr122-customer-center/xuanjun-customer-delivery.timer deploy/pr122-customer-center/xuanjun-customer-publication.service deploy/pr122-customer-center/xuanjun-customer-publication.socket deploy/pr122-customer-center/xuanjun-customer-publication.timer
          python - <<'PY'
          import pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as folder:
              p=pathlib.Path(folder)/'nginx.conf'
              p.write_text('pid '+folder+'/nginx.pid; error_log '+folder+'/error.log; events {} http { server { listen 127.0.0.1:18796; include '+str(root/'deploy/pr122-customer-center/locations.conf')+'; } }')
              subprocess.run(['sudo','nginx','-t','-c',str(p)],check=True)
          PY
      - name: Real isolated Nginx proxy origin and concurrent-client regression
        env:
          XJ_CUSTOMER_REPORT_DIR: /tmp/pr122-customer
        run: sudo -n --preserve-env=XJ_CUSTOMER_REPORT_DIR "$(command -v python)" -B -m tests.pr122_customer_proxy
      - name: Bind complete review-only package to exact checkout
        run: |
          python -m scripts.pr122_customer_package --output /tmp/pr122-customer --source-commit "$GITHUB_SHA" --source-tree "$(git rev-parse HEAD^{tree})"
          python - <<'PY'
          import json,os,subprocess,pathlib
          pathlib.Path('/tmp/pr122-customer/CI_BINDING.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'scope':'ISOLATED_FIXTURE_ONLY','host_mutations':0,'production_acceptance_14':'NOT_RUN','independent_review':'PENDING','production_release':'HOLD'},indent=2))
          PY
      - name: Build exact fixed-channel rebind candidate no root execution
        run: |
          python - <<'PYCODE'
          import urllib.request
          from pathlib import Path
          from scripts.pr122_customer_channel_binding import bind
          from scripts.pr122_customer_core import canonical
          url='https://raw.githubusercontent.com/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/7e5d42f5a5331dc261074ddd780413d03de9c591/scripts/pr122_domestic_customer_channel.py'
          with urllib.request.urlopen(url,timeout=20) as response:original=response.read(100001)
          code,binding=bind(original,Path('/tmp/pr122-customer/PR122_CUSTOMER_CENTER_REVIEW_ONLY.tar.gz').read_bytes(),'/tmp/pr122-customer/wheels')
          out=Path('/tmp/pr122-customer/rebind-candidate');out.mkdir()
          (out/'channel.py').write_bytes(code);(out/'REBIND_BINDING.json').write_bytes(canonical(binding))
          print(canonical(binding).decode())
          import os,subprocess
          builder=Path('scripts/pr122_customer_runtime.py').read_bytes()
          Path('/tmp/pr122-customer/runtime-builder.py').write_bytes(builder)
          Path('/tmp/pr122-customer/RUNTIME_BUILDER_BINDING.json').write_bytes(canonical({'source_commit':os.environ['GITHUB_SHA'],'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'builder_sha256':__import__('hashlib').sha256(builder).hexdigest()}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: /tmp/pr122-customer/
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: /tmp/pr122-customer-roundtrip
      - name: Verify downloaded archive and complete source closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,tarfile
          from pathlib import Path
          folder=Path('/tmp/pr122-customer-roundtrip')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          receipt=json.loads((folder/'CUSTOMER_PACKAGE_RECEIPT.json').read_bytes())
          raw=(folder/'PR122_CUSTOMER_CENTER_REVIEW_ONLY.tar.gz').read_bytes()
          assert receipt['source_commit']==os.environ['GITHUB_SHA'] and sha(raw)==receipt['tar_sha256']
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              items=archive.getmembers()
              assert len(items)==receipt['members'] and len({x.name for x in items})==len(items)
              assert all(x.isfile() and x.name.startswith('customer-center/') and '..' not in Path(x.name).parts for x in items)
              files={x.name.removeprefix('customer-center/'):archive.extractfile(x).read() for x in items}
          manifest_raw=files.pop('CUSTOMER_MANIFEST.json')
          assert sha(manifest_raw)==receipt['manifest_sha256']
          manifest=json.loads(manifest_raw)
          assert manifest['source_commit']==os.environ['GITHUB_SHA'] and len(files)==receipt['bound_files']==len(manifest['files'])
          assert set(files)=={x['path'] for x in manifest['files']}
          assert {'scripts/pr122_customer_attempts.py','tests/test_pr122_customer_attempts.py','scripts/pr122_customer_resume.py','tests/test_pr122_customer_resume.py','tests/test_pr122_customer_resume_review.py'} <= set(files)
          for item in manifest['files']:
              body=files[item['path']]
              assert len(body)==item['size'] and sha(body)==item['sha256']
              source=Path('deploy/pr122-customer-center/boot.py') if item['path']=='boot.py' else Path(item['path'])
              assert source.read_bytes()==body
          binding=json.loads((folder/'rebind-candidate/REBIND_BINDING.json').read_bytes())
          assert (folder/'rebind-candidate/channel.py').read_bytes()==Path('/tmp/pr122-customer/rebind-candidate/channel.py').read_bytes()
          assert (folder/'runtime-builder.py').read_bytes()==Path('scripts/pr122_customer_runtime.py').read_bytes()
          print(json.dumps({'downloaded_tar_sha256':sha(raw),'manifest_sha256':sha(manifest_raw),'members':len(items),'bound_files':len(files),'source_closure':'PASS','channel_roundtrip':'PASS','raw_zip_recalculation':'INDEPENDENT_REVIEW_PENDING'},sort_keys=True))
          PY

  isolated-domestic-runtime:
    if: ${{ false }}
    needs: isolated-customer-center
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr122-customer-center-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-customer-runtime-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exact offline wheel ABI and crypto verification as non-root
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/('pr122-customer-runtime-input-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          binding=json.loads((folder/'RUNTIME_BUILDER_BINDING.json').read_bytes())
          assert set(binding)=={'source_commit','source_tree','run_id','builder_sha256'} and binding['source_commit']==os.environ['GITHUB_SHA'] and binding['run_id']==os.environ['GITHUB_RUN_ID']
          assert hashlib.sha256((folder/'runtime-builder.py').read_bytes()).hexdigest()==binding['builder_sha256']
          print('EXACT_ARTIFACT_BUILDER_BINDING=PASS; CHECKOUT_NOT_USED; ROOT_NOT_CALLED')
          PY
          /usr/bin/python3 -I -B "$RUNNER_TEMP/pr122-customer-runtime-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/runtime-builder.py" --wheels "$RUNNER_TEMP/pr122-customer-runtime-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/wheels" --output "$RUNNER_TEMP/pr122-customer-runtime-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-domestic-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-customer-runtime-output-${{ github.run_id }}-${{ github.run_attempt }}/RUNTIME_REPORT.json
          if-no-files-found: error
          retention-days: 14


