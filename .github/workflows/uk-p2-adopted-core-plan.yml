name: P2 UK adopted core plan preparation
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - evidence/p2-install-preparation-20261013/prepare_adopted_core_plan.py
      - .github/workflows/uk-p2-adopted-core-plan.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/prepare_adopted_core_plan.py
