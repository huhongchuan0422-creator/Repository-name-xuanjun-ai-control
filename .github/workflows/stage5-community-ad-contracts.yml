name: Stage5 offline advertising contracts
on:
  pull_request:
    paths:
      - 'scripts/community_ad_contract.py'
      - 'tests/test_community_ad_contract.py'
      - '.github/workflows/stage5-community-ad-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated pure-function contracts
        run: python -m unittest -v tests/test_community_ad_contract.py
