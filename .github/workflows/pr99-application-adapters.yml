name: PR99 exact application configuration and queue adapters
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'evidence/pr99-service-handoff/application-adapters/**'
      - '.github/workflows/pr99-application-adapters.yml'
permissions:
  contents: read
concurrency:
  group: pr99-application-adapters-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
      github.event.pull_request.number == 99 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'build/tokyo-korea-migration-prep-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned crypto dependency for synthetic acceptance tests
        run: python -m pip install cryptography==50.0.2
      - name: Test original-gate application adapters without business imports or cloud
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: evidence/pr99-service-handoff/application-adapters:evidence/pr99-service-handoff/runtime-controller
        run: python -B -m unittest discover -s evidence/pr99-service-handoff/application-adapters -p 'test_*.py' -v
      - name: Bind exact sources and inherited gate to this commit and tree
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          base=Path('evidence/pr99-service-handoff/application-adapters')
          names=('wecom_queue_binding.py','effective_database_binding.py','credential_key_binding.py','credential_write_preparation.py','test_credential_write_preparation.py','test_credential_key_binding.py','accept_private_credential_bindings.py','test_private_credential_acceptance.py','test_wecom_queue_binding.py','test_effective_database_binding.py','README.md')
          gate=Path('evidence/pr99-service-handoff/runtime-controller/ingress_gate.py')
          expected_gate='14514d40bee4d4bf560b4b32e1cf5df7cf72c0ff3105c55eee969a01b6f1f6c8'
          assert hashlib.sha256(gate.read_bytes()).hexdigest()==expected_gate
          receipt={'code_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'code_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
           'sources':{n:hashlib.sha256((base/n).read_bytes()).hexdigest() for n in names},
           'inherited_ingress_gate_sha256':expected_gate,'ordinary_tests':44,
           'business_api_and_source_verification':'FIXTURES_NOT_NATIVE_ACCEPTANCE',
           'production_started':False,'actual_configuration_exported':False,
           'live_application_hook_installed':False,'m99':'NOT_RUN'}
          print(json.dumps(receipt,sort_keys=True))
          (base/'ci-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr99-application-adapters-${{ matrix.python }}
          path: evidence/pr99-service-handoff/application-adapters/
          if-no-files-found: error
          retention-days: 30
