name: Complete batch delivery contract
on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test positive and negative delivery contracts
        run: python3 -B -m unittest discover -s tests -p 'test_delivery_contract_check.py' -v
      - name: Fetch complete current PR metadata without executing its text
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          endpoint = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/pulls/' + os.environ['GH_PR']
          def read(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read(4 * 1024 * 1024 + 1)
              if len(raw) > 4 * 1024 * 1024: raise ValueError('API_RESPONSE_BOUND')
              return json.loads(raw)
          pr = read(endpoint)
          if pr['head']['sha'] != os.environ['EXPECTED_HEAD']: raise ValueError('PR_CHANGED_RETRY_CURRENT_EVENT')
          names = []
          for page in range(1, 32):
              rows = read(endpoint + '/files?per_page=100&page=' + str(page))
              if not rows: break
              names.extend(row['filename'] for row in rows)
          if len(names) != pr['changed_files'] or not 0 < len(names) <= 3000 or len(names) != len(set(names)):
              raise ValueError('INCOMPLETE_CHANGED_FILE_INVENTORY')
          if read(endpoint)['head']['sha'] != pr['head']['sha']: raise ValueError('PR_CHANGED_DURING_READ')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'delivery-event.json').write_text(json.dumps({'pull_request': pr}))
          (root / 'delivery-files.json').write_text(json.dumps(names))
          PY
      - name: Validate exact HEAD and complete batch metadata
        run: python3 -B scripts/delivery_contract_check.py --event "$RUNNER_TEMP/delivery-event.json" --changed "$RUNNER_TEMP/delivery-files.json"
