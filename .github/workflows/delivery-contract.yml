name: Trusted complete batch delivery contract
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, edited, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch workflow commit only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind actual trusted checkout
        run: git rev-parse HEAD > .trusted-source-sha
      - name: Check inert PR metadata using trusted code and rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B - <<'PYTHON'
          import runpy, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          runpy.run_path('scripts/trusted_delivery_gate.py', run_name='__main__')
          PYTHON
