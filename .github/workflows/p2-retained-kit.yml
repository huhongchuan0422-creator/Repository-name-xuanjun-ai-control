name: P2 Complete Retained Kit Checkpoint
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - 'evidence/p2-epoch7-access-repair-20261014/recovery-kit-source/**'
      - 'evidence/p2-epoch7-access-repair-20261014/runtime/**'
      - 'tests/test_p2_full_kit_checkpoint.py'
      - 'tests/test_p2_full_kit_wrapper_contract.py'
      - '.github/workflows/p2-retained-kit.yml'
permissions:
  contents: read
concurrency:
  group: p2-retained-kit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete-offline-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build twice, verify archive and execute all mandatory offline suites
        run: |
          set -euo pipefail
          umask 0077
          # Hosted /home has a default ACL. Keep production checks unchanged:
          # use only a new disposable CI workspace under the verified filesystem root.
          python -I -B - <<'PY'
          import os, stat, errno
          for path in ('/',):
              info=os.lstat(path)
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and info.st_gid==0
              assert not info.st_mode & 0o7022
              for name in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,name,follow_symlinks=False)
                  except OSError as error: assert error.errno in (errno.ENODATA,errno.ENOTSUP)
                  else: raise RuntimeError('CI_STAGING_ANCESTRY_ACL')
          PY
          CI_ROOT=$(sudo /usr/bin/mktemp -d /xuanjun-p2-ci.XXXXXXXX)
          sudo /usr/bin/chown "$(id -u):$(id -g)" "$CI_ROOT"
          test "$(stat -c %a "$CI_ROOT")" = 700
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          EXPECTED_TREE=$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_SHA^{tree}")
          git -c core.hooksPath=/dev/null clone --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$CI_ROOT/repository"
          git -C "$CI_ROOT/repository" -c core.hooksPath=/dev/null checkout --detach "$GITHUB_SHA"
          test "$(git -C "$CI_ROOT/repository" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$CI_ROOT/repository" rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          mkdir -m 700 "$CI_ROOT/temp"
          export RUNNER_TEMP="$CI_ROOT/temp" TMPDIR="$CI_ROOT/temp"
          cd "$CI_ROOT/repository"
          python -I -B - <<'PY'
          import os, stat, json
          paths=set()
          for value in (os.getcwd(),os.environ.get('RUNNER_TEMP'),os.environ.get('HOME')):
              if not value: continue
              path=os.path.abspath(value)
              while True:
                  paths.add(path)
                  parent=os.path.dirname(path)
                  if parent==path: break
                  path=parent
          for path in sorted(paths):
              info=os.lstat(path)
              row={'path':path,'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode))}
              for key in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,key,follow_symlinks=False)
                  except OSError as error: row[key]={'errno':error.errno}
                  else: row[key]={'present':True}
              print('CI_ONLY_PATH_METADATA='+json.dumps(row,sort_keys=True))
          PY
          python -B -m unittest discover -s tests -p 'test_p2_full_kit*.py' -v
