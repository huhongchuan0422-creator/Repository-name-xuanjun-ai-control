name: Feature Compliance Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  feature-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Positive and negative governance cases
        run: python -m unittest discover -s tests -p 'test_feature_compliance_check.py' -v
      - name: Validate feature mapping and new code ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-status --diff-filter=A "$BASE_SHA"...HEAD > /tmp/feature-changed.tsv
            python scripts/feature_compliance_check.py --changed-file-list /tmp/feature-changed.tsv
          else
            python scripts/feature_compliance_check.py
          fi
