name: Stage5 offline ad module v2 contracts
on:
  pull_request:
    paths:
      - 'scripts/community_ad_contract.py'
      - 'scripts/community_ad_store.py'
      - 'tests/test_community_ad_contract.py'
      - 'tests/test_community_ad_store.py'
      - '.github/workflows/stage5-community-ad-module-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-module:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pure contracts and isolated sqlite store
        run: python -m unittest -v tests.test_community_ad_contract tests.test_community_ad_store
