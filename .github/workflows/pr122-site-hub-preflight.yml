name: PR122 Site Hub Preflight
on:
  workflow_dispatch:
    inputs:
      protected_builder:
        description: 'Invoke only the separately installed candidate-only fixed root channel'
        type: boolean
        default: false
      showcase_review_ids:
        description: 'Approved PR122 content-review comment IDs; blank means preview only'
        required: false
        type: string
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - 'demos/xuanjun-site-hub/**'
      - 'showcase/**'
      - 'scripts/pr122_showcase*.py'
      - 'scripts/community_saas_*.py'
      - 'tests/test_pr122_showcase*.py'
      - 'tests/pr122_showcase_browser.cjs'
      - 'tests/pr122_showcase_nginx.py'
      - '.github/workflows/pr122-showcase-review-event.yml'
      - 'deploy/pr122-showcase/**'
      - 'demos/community-local-e2e/**'
      - 'scripts/pr122_site_hub_*.py'
      - 'tests/test_pr122_site_hub_integration.py'
      - 'tests/pr122_site_hub_browser.cjs'
      - 'tests/fixtures/pr122-site-shell/**'
      - 'tests/test_pr122_site_hub_release_delta.py'
      - 'tests/test_pr122_site_hub_preview.py'
      - 'deploy/pr122-site-hub-preview/**'
      - 'evidence/pr122-site-hub/PR122_SITE_HUB_REVIEW_ONLY.tar.gz'
      - '.github/workflows/pr122-site-hub-preflight.yml'
      - 'tests/test_pr122_site_hub_experience_release.py'
      - 'deploy/pr122-site-hub-experience/**'
      - 'evidence/pr122-site-hub-experience/**'
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  static-and-synthetic:
    if: github.event_name != 'workflow_dispatch' || inputs.protected_builder != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source inventory, not a release gate
        run: python scripts/pr122_site_hub_preflight.py --output /tmp/pr122-site-hub/STATIC_PREFLIGHT.json
      - name: Offline quote and simulated frontend regressions
        run: node --test demos/xuanjun-site-hub/assets/ecv-quote.test.cjs demos/community-local-e2e/*.test.mjs
      - name: Isolated integrated HTTP and language tests
        run: python -m unittest tests.test_pr122_site_hub_integration tests.test_pr122_site_hub_preview -v
      - name: Validate isolated preview Nginx and service candidates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          python - <<'PY'
          import pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as td:
              config=pathlib.Path(td)/'nginx.conf'
              config.write_text('pid '+td+'/nginx.pid; error_log '+td+'/error.log; events {} http { access_log off; include '+str(root/'deploy/pr122-site-hub-preview/http-limit.conf')+'; server { listen 127.0.0.1:18794; server_name wenwenwenyiyiyi.work; include '+str(root/'deploy/pr122-site-hub-preview/server-location.conf')+'; } }')
              subprocess.run(['sudo','nginx','-t','-c',str(config)],check=True)
          subprocess.run(['systemd-analyze','verify',str(root/'deploy/pr122-site-hub-preview/xuanjun-site-hub-preview.service')],check=True)
          PY
      - name: Controlled publisher addition delta and existing transaction regressions
        run: |
          python -m unittest tests.test_pr122_site_hub_release_delta.AdditionTests -v
          sudo -n "$(command -v python)" scripts/pr122_site_hub_release_regression.py
      - name: New static UI package and r2-preserving release transaction
        run: |
          python - <<'PYCODE'
          import json,shutil
          from pathlib import Path
          from scripts import pr122_site_hub_experience_release as r
          folder=Path('evidence/pr122-site-hub-experience')
          pins=json.loads(r.PINS.read_text())
          data=r.entries((folder/'PR122_SITE_HUB_REVIEW_ONLY.tar.gz').read_bytes(),pins)
          snippet,routes=r.routes(data)
          assert snippet==(folder/'locations.conf').read_bytes()
          assert len(routes)==182 and sum(k=='file' for k,t in routes.values())==137
          for name in ('PR122_SITE_HUB_REVIEW_ONLY.tar.gz','PACKAGE_RECEIPT.json','locations.conf'):
              shutil.copyfile(folder/name,Path('/tmp/pr122-site-hub')/('EXPERIENCE_'+name))
          print('EXPERIENCE_PACKAGE_PASS; 449_REGULAR_MEMBERS; 448_MANIFEST_FILES; NO_DEPLOYMENT')
          PYCODE
          python -m scripts.pr122_site_hub_experience_package --output /tmp/pr122-site-hub
          sudo -n env XJ_COMBINED_SYNTHETIC_FIXTURE=1 "$(command -v python)" -m unittest tests.test_pr122_site_hub_experience_release.ExperienceTests -v
      - name: Reuse exact unchanged browser source audit
        id: browser-baseline
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          pins=json.loads(Path('evidence/pr122-site-hub/BROWSER_SOURCE_PINS_d1e57c91.json').read_text())
          def same(p,expected):
              path=Path(p)
              if not path.is_file():return False
              b=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==expected
          reused=all(same(p,h) for p,h in pins.items())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('reuse='+str(reused).lower()+'\n')
          if reused:
              shutil.copyfile('evidence/pr122-site-hub/BROWSER_REPORT_d1e57c91.json','/tmp/pr122-site-hub/BROWSER_REPORT.json')
              print('BROWSER_AUDIT_REUSED=d1e57c918c5578104ba8f55f4fc8505cedbaec61; RUN=38846477623; ARTIFACT=12023297533; EXACT_DEPENDENCIES='+str(len(pins)))
          PY
      - name: Install pinned browser test dependencies in temporary directory
        if: steps.browser-baseline.outputs.reuse != 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/pr122-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build explicitly limited old-shell fixture with actual new content
        if: steps.browser-baseline.outputs.reuse != 'true'
        run: python scripts/pr122_site_hub_stage.py --browser-fixture tests/fixtures/pr122-site-shell --output /tmp/pr122-site-browser
      - name: Chromium desktop, mobile, CSP and existing loopback simulation flows
        if: steps.browser-baseline.outputs.reuse != 'true'
        env:
          XJ_HUB_STAGE: /tmp/pr122-site-browser
          XJ_HUB_REPORT: /tmp/pr122-site-hub/BROWSER_REPORT.json
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-browser/node_modules/playwright" node tests/pr122_site_hub_browser.cjs
      - name: Dynamic showcase lifecycle and isolated static publisher
        run: |
          python -m unittest tests.test_pr122_showcase tests.test_pr122_showcase_sources -v
          sudo -n "$(command -v python)" -m unittest tests.test_pr122_showcase_trust tests.test_pr122_showcase_protected_build tests.test_pr122_showcase_build_channel -v
          sudo -n "$(command -v python)" -m unittest tests.test_pr122_showcase_install -v
          sudo -n env XJ_SHOWCASE_REPORT_DIR=/tmp/pr122-site-hub "$(command -v python)" -m unittest tests.test_pr122_showcase_promote tests.test_pr122_showcase_poll -v
          python -m scripts.pr122_showcase_build --registry showcase --output /tmp/pr122-showcase-preview --preview
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.pr122_showcase import discover,canonical,sha
          claims=[{'project_id':o['project_id'],'kind':o['kind'],'id':o['id'],'version':o['version'],'object_sha256':sha(canonical(o))} for o in discover(Path('showcase'))]
          Path('/tmp/pr122-site-hub/SHOWCASE_DECLARATION_CLAIMS.json').write_text(json.dumps(claims,indent=2)+'\n')
          PYCODE
          python -m scripts.pr122_showcase_package --public /tmp/pr122-showcase-preview --output /tmp/pr122-site-hub/SHOWCASE_PREVIEW.tar.gz --preview
          sudo -n "$(command -v python)" -m tests.pr122_showcase_nginx --public /tmp/pr122-showcase-preview --report /tmp/pr122-site-hub/SHOWCASE_NGINX_REPORT.json
          python -m scripts.pr122_showcase_mechanism_package --output /tmp/pr122-site-hub --source-commit "$GITHUB_SHA"
          sudo systemd-analyze verify deploy/pr122-showcase/xuanjun-showcase-publish.service deploy/pr122-showcase/xuanjun-showcase-publish.timer deploy/pr122-showcase/xuanjun-showcase-build.service
          XJ_SHOWCASE_PUBLIC=/tmp/pr122-showcase-preview XJ_SHOWCASE_REPORT_DIR=/tmp/pr122-site-hub XJ_HUB_STAGE=/tmp/pr122-site-browser PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-browser/node_modules/playwright" node tests/pr122_showcase_browser.cjs
      - name: Build a reviewed publication only after actual content-review events
        if: github.event_name == 'workflow_dispatch' && inputs.showcase_review_ids != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REVIEW_IDS: ${{ inputs.showcase_review_ids }}
        run: |
          python - <<'PYCODE'
          import os,subprocess
          ids=os.environ['REQUESTED_REVIEW_IDS'].split(',')
          assert ids and all(i.isdigit() for i in ids)
          command=['python','-m','scripts.pr122_showcase_build','--registry','showcase','--output','/tmp/pr122-showcase-reviewed','--reviewer','huhongchuan0422-creator','--discover-reviews','--published-pages','showcase/published-main-r2.json']
          for identifier in ids:command+=['--review-comment-id',identifier]
          subprocess.run(command,check=True)
          PYCODE
          python -m scripts.pr122_showcase_package --public /tmp/pr122-showcase-reviewed --output /tmp/pr122-site-hub/SHOWCASE_RELEASE.tar.gz
      - name: Bind receipt to actual checkout
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          browser=json.loads(Path('/tmp/pr122-site-hub/BROWSER_REPORT.json').read_text())
          receipt = {'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'run_id':os.environ['GITHUB_RUN_ID'], 'tests':'inventory, synthetic frontend, integrated HTTP and controlled publisher delta', 'production_release':'HOLD', 'browser_fixture_acceptance':browser['status'], 'browser_scope':browser['scope'], 'production_browser_acceptance':'NOT_RUN', 'independent_review':'PENDING'}
          Path('/tmp/pr122-site-hub/CI_BINDING.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Bind review-only overlay archive without activating any release
        run: |
          python - <<'PY'
          import hashlib,json,shutil,tarfile
          from pathlib import Path
          receipt=json.loads(Path('evidence/pr122-site-hub/PACKAGE_RECEIPT_20261016.json').read_text())
          archive=Path('evidence/pr122-site-hub/PR122_SITE_HUB_REVIEW_ONLY.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==receipt['tar_sha256']=='dcf96b124cea6170453bdec52e60fc94d157864f342e2d1706801d54568abafb'
          with tarfile.open(archive) as bundle:
              members=bundle.getmembers()
              assert len({m.name for m in members})==len(members)
              assert all(m.isfile() and not m.name.startswith('/') and '..' not in Path(m.name).parts for m in members)
              manifest=json.loads(bundle.extractfile('pr122-site-hub/PACKAGE_MANIFEST.json').read())
              assert hashlib.sha256(bundle.extractfile('pr122-site-hub/PACKAGE_MANIFEST.json').read()).hexdigest()==receipt['package_manifest_sha256']
              for entry in manifest['files']:
                  data=bundle.extractfile('pr122-site-hub/'+entry['path']).read()
                  assert len(data)==entry['size'] and hashlib.sha256(data).hexdigest()==entry['sha256']
                  # This archive belongs to the unchanged r2 snapshot; it is
                  # not evidence that future development code was deployed.
                  # Its original internal manifest remains fully verified.
              from scripts.pr122_site_hub_release_delta import publisher_source
              assert bundle.extractfile('pr122-site-hub/bin/pr122_website_release.py').read()==publisher_source()
          shutil.copyfile(archive,'/tmp/pr122-site-hub/'+archive.name)
          shutil.copyfile('evidence/pr122-site-hub/PACKAGE_RECEIPT_20261016.json','/tmp/pr122-site-hub/PACKAGE_RECEIPT.json')
          print('REVIEW_ARCHIVE_PASS; NO_INSTALL_EXECUTED; SHA256='+receipt['tar_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-site-hub-preflight-${{ github.sha }}
          path: /tmp/pr122-site-hub/
          retention-days: 14

  protected-domestic-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.protected_builder == true && vars.PR122_SHOWCASE_PIPELINE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/pr122-showcase-builder-')
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 8
    steps:
      - name: Invoke fixed candidate-only root capability without checking out code
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
          mkdir -p "$RUNNER_TEMP/pr122-reviewed-candidate"
          sudo -n /usr/local/libexec/xuanjun-showcase-build build > "$RUNNER_TEMP/pr122-reviewed-candidate/STATUS.json"
          sudo -n /usr/local/libexec/xuanjun-showcase-build export > "$RUNNER_TEMP/pr122-reviewed-candidate/EXPORT.json"
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'pr122-reviewed-candidate'
          envelope=json.loads((folder/'EXPORT.json').read_bytes());receipt=envelope['receipt']
          assert receipt['mechanism_source_commit']==os.environ['GITHUB_SHA']
          raw=base64.b64decode(envelope['tar_base64'],validate=True)
          assert len(raw)<=16000000 and hashlib.sha256(raw).hexdigest()==receipt['tar_sha256']
          (folder/'SHOWCASE_RELEASE.tar.gz').write_bytes(raw)
          (folder/'BUILD_RECEIPT.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          (folder/'CI_BINDING.json').write_text(json.dumps({'workflow_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'content_commit':receipt['source_commit'],'production_publication':'NOT_EXECUTED'},sort_keys=True)+'\n')
          (folder/'EXPORT.json').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr122-reviewed-showcase-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr122-reviewed-candidate/
          retention-days: 14
