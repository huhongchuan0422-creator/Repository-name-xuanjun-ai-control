name: PR122 Site Hub Live Baseline Read Only
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - '.github/workflows/pr122-site-hub-live-baseline.yml'
      - 'scripts/pr122_site_hub_release_observation.py'
permissions:
  contents: read
jobs:
  public-baseline-only:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read exact deployed experience-r2 baseline without root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr122-unified-observation"
          python3 -m scripts.pr122_site_hub_release_observation | tee "$RUNNER_TEMP/pr122-unified-observation/PUBLIC_OBSERVATION.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr122-unified-target-observation-${{ github.sha }}
          path: ${{ runner.temp }}/pr122-unified-observation/
          retention-days: 14
