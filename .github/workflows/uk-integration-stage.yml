name: UK Integration Stage and Contracts
on:
  push:
    branches: [feature/uk-autonomous-loop-20261011]
    paths: ['stage1/**', 'scripts/**', 'canonical/PROJECT_STATE.md', 'plans/UNFINISHED_TASK_TRACKER_20261011.md', 'plans/MODEL_POLICY_20261011.md', 'plans/TOKYO_MIGRATION_DEADLINE_20261020.md', 'plans/COMMUNITY_POINTS_REQUIREMENTS_20261011.md', '.github/workflows/uk-integration-stage.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python 3.6 and stage reviewed integration source
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = "iZd7oeikknn1z21sq6ji6zZ"
          python3 -m compileall -q stage1
          python3 -m py_compile scripts/uk-contract-export.py scripts/uk-dev-bootstrap.py
          python3 -m unittest discover -s stage1 -q
          STAGE="/tmp/xuanjun-uk-integration-${GITHUB_SHA}"
          mkdir -p "$STAGE/stage1" "$STAGE/scripts" "$STAGE/canonical" "$STAGE/plans"
          cp stage1/*.py stage1/*.html "$STAGE/stage1/"
          # Reuse the Runner's authenticated checkout for the Work-approved
          # task source. The conversational agent needs no new GitHub token.
          # These are immutable-SHA source documents, not a runtime queue.
          cp canonical/PROJECT_STATE.md "$STAGE/canonical/"
          cp plans/UNFINISHED_TASK_TRACKER_20261011.md plans/MODEL_POLICY_20261011.md plans/TOKYO_MIGRATION_DEADLINE_20261020.md plans/COMMUNITY_POINTS_REQUIREMENTS_20261011.md "$STAGE/plans/"
          cp scripts/uk-contract-export.py scripts/uk-dev-bootstrap.py scripts/uk-sol-diagnostic.py scripts/uk-sol-canary.py scripts/uk-sol-check-bootstrap.py scripts/uk-takeover-observation.py scripts/uk-56-canary.py scripts/uk-codex-runtime-align.py scripts/uk-codex-post-align.py "$STAGE/scripts/"
          printf '%s\n' "$GITHUB_SHA" > "$STAGE/SOURCE_COMMIT"
          # /tmp is retained for existing Owner-assisted scripts only.
          # OpenClaw has PrivateTmp=yes; its source is the verified checkout.
          echo "OPENCLAW_CONTROL_CHECKOUT=$GITHUB_WORKSPACE"
          echo "OPENCLAW_CONTROL_SHA=$GITHUB_SHA"
          echo "OPENCLAW_TMP_HANDOFF=DO_NOT_USE"
          chmod -R a+rX "$STAGE"
          sha256sum "$STAGE/scripts/uk-contract-export.py"
          echo "UK_INTEGRATION_STAGE=$STAGE"
          echo "UK_CONTROL_SOURCE=$STAGE/canonical/PROJECT_STATE.md"
          echo "UK_TASK_SOURCE_SHA=$GITHUB_SHA"
          echo "WORKER_TASK_DISPATCH=NOT_EXECUTED"
          echo "PRODUCTION_DEPLOYMENT=NOT_EXECUTED"
      - name: Collect bounded development results without applying or deploying
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/uk-work-result-collect.py
      - name: Read actual contracts only through authorized fixed gateway
        shell: bash
        run: |
          set -euo pipefail
          if test -x /usr/local/sbin/xj-uk-contract-export; then
            sudo -n /usr/local/sbin/xj-uk-contract-export
            python3 - <<'PY'
          import json
          for name in ['uk','tokyo']:
              path='/var/lib/xuanjun-contract-export/'+name+'.json'
              with open(path) as stream: obj=json.load(stream)
              print('LIVE_CONTRACT_'+name.upper()+'='+json.dumps(obj))
          PY
          else
            echo "LIVE_CONTRACT=WAITING_HUMAN_FIXED_GATEWAY_INSTALL"
          fi

      - name: Read authenticated dashboard and model capability audit
        shell: bash
        run: |
          set -euo pipefail
          if test -x /usr/local/sbin/xuanjun-uk-owner-audit; then
            sudo -n /usr/local/sbin/xuanjun-uk-owner-audit
          else
            echo "OWNER_DASHBOARD_AUDIT=WAITING_FIXED_BOOTSTRAP_INSTALL"
          fi

