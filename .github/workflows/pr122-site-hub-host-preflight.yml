name: PR122 site hub domestic host read-only preflight
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-site-hub-host-preflight.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr122-domestic-readonly
  cancel-in-progress: false
jobs:
  fixed-channel-inspect:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 2
    steps:
      - name: Approved post-recovery fixed inspect only
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZvt5t8tlrm8oiZ
          test "$(id -u)" = 1002
          echo 'APPROVAL_REFERENCE=PR122#6213703300; ACTION=inspect'
          sudo -n /usr/local/libexec/xuanjun-customer-channel inspect
          echo 'FIXED_ROOT_INSPECT_EXIT=0; CUSTOMER_INSTALL_NOT_CALLED'

      - name: Unprivileged runtime and reusable service metadata inventory
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import importlib.metadata,json,os,pwd,shutil,signal,ssl,subprocess
          signal.alarm(40)
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          report={'production_mutations':0,'dependency_versions':{},'tools':{},'service_units':[]}
          for name in ('cryptography','cffi','pycparser'):
              try:report['dependency_versions'][name]=importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:report['dependency_versions'][name]='ABSENT'
          report['openssl']=ssl.OPENSSL_VERSION
          for name in ('clamdscan','clamscan','systemd-analyze'):
              report['tools'][name]=shutil.which(name)
          try:
              p=pwd.getpwnam('xuanjun-customer')
              report['customer_account']={'uid':p.pw_uid,'gid':p.pw_gid,'shell':p.pw_shell}
          except KeyError:report['customer_account']='ABSENT'
          r=subprocess.run(['/usr/bin/systemctl','list-unit-files','--type=service','--no-legend','--no-pager'],capture_output=True,text=True,timeout=10)
          if r.returncode==0:
              for line in r.stdout.splitlines():
                  name=line.split()[0] if line.split() else ''
                  if any(word in name.lower() for word in ('xuanjun','domestic','identity','crm','clam','telegram','feishu','bridge','secretref')):
                      report['service_units'].append(name)
          else:report['service_inventory']='UNKNOWN'
          print('CUSTOMER_RUNTIME_METADATA='+json.dumps(report,sort_keys=True))
          PY

      - name: Verify already staged frozen wheels without installation
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/home/githubrunner/pr122-approved-channel-inputs/customer/wheels')
          expected={
          'cffi-2.0.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl':'8941aaadaf67246224cee8c3803777eed332a19d909b47e29c9842ef1e79ac26',
          'cryptography-46.0.3-cp311-abi3-manylinux_2_34_x86_64.whl':'10b01676fc208c3e6feeb25a8b83d81767e8059e1fe86e1dc62d10a3018fa926',
          'pycparser-2.23-py3-none-any.whl':'e5c6e8d3fbad53479cab09ac03729e0a9faf2bee3db8208a550daf5af81a5934'}
          for name,h in expected.items():
              p=root/name
              assert not p.is_symlink() and p.is_file() and p.stat().st_size<10000000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h
          print('FROZEN_WHEELS=3_OF_3_HASH_PASS; INSTALL_NOT_CALLED')
          PY

  stage-approved-static-experience:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 5
    steps:
      - name: Download exact independently reviewed artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12047517541'
          run-id: '38904927962'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr122-experience-6216329680
      - name: Stage hashed package as unprivileged data only
        env:
          INPUT_DIR: ${{ runner.temp }}/pr122-experience-6216329680
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          assert os.uname().nodename=='iZvt5t8tlrm8oiZ' and os.getuid()==1002
          sources=list(Path(os.environ['INPUT_DIR']).rglob('PR122_EXPERIENCE_RELEASE_REVIEW_ONLY.tar.gz'))
          assert len(sources)==1
          raw=sources[0].read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='d1458c593c2c8538742fc7c6c743e4b70ddf7e6f575db5fed0fc38fce7f967f3'
          destination=Path('/home/githubrunner/pr122-experience-6216329680')
          destination.mkdir(mode=0o700,exist_ok=False)
          p=destination/'approved-release.tar.gz'
          fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
          with os.fdopen(fd,'wb') as out:
              out.write(raw);out.flush();os.fsync(out.fileno())
          print('STAGED_PACKAGE='+str(p))
          print('PACKAGE_SHA256='+hashlib.sha256(raw).hexdigest())
          print('ROOT_NOT_CALLED; APPLY_NOT_CALLED; PRODUCTION_CHANGES=0')
          PY
