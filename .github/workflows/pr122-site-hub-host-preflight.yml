name: PR122 production browser acceptance
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-site-hub-host-preflight.yml]
permissions:
  contents: read
concurrency:
  group: pr122-production-browser-readonly
  cancel-in-progress: false
jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pr122-public-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-public-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real HTTPS desktop and mobile acceptance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pr122-public-browser/node_modules/playwright
          REPORT_DIR: ${{ runner.temp }}/pr122-production-report
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {chromium}=require(process.env.PLAYWRIGHT_MODULE);
          const base='https://wenwenwenyiyiyi.work',out=process.env.REPORT_DIR;
          (async()=>{fs.mkdirSync(out,{recursive:true});const browser=await chromium.launch({headless:true});
          const report={scope:'Real production HTTPS; no request interception; no root changes',transaction:'pr122-public-mobile-20261016',pages:[],checks:[],failures:[],js_errors:[],asset_failures:[],showcase_links:[]};
          try{const context=await browser.newContext({ignoreHTTPSErrors:false});const page=await context.newPage();
          page.on('pageerror',e=>report.js_errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error'&&/Content Security Policy|Refused to/.test(m.text()))report.js_errors.push(m.text());});
          page.on('response',r=>{if(r.status()>=400&&/\.(css|js|mjs|png|jpg|webp|svg)(\?|$)/.test(r.url()))report.asset_failures.push({url:r.url(),status:r.status()});});
          async function check(name,fn){try{await fn();report.checks.push({name,status:'PASS'});}catch(e){report.failures.push({name,error:String(e.message).slice(0,800)});}}
          const paths=['/','/marketplace/','/marketplace/modules/','/visual/','/visual/catalog/','/visual/community-payment/','/ecosystem/','/ecosystem/tiers/','/ecosystem/co-create/','/ecosystem/profit-sharing/','/ecosystem/ledger/','/ecosystem/activities/','/ecosystem/governance/','/customer/projects/','/customer/projects/acceptance/'];
          for(const width of [1440,390,320]){await page.setViewportSize({width,height:900});
          for(const path of paths){await check(width+' '+path,async()=>{const r=await page.goto(base+path);assert.equal(r.status(),200);assert(await page.locator('h1').count());assert.equal(await page.locator('a[href="https://beian.miit.gov.cn/"]').count(),1);assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'horizontal overflow');report.pages.push({width,path,status:r.status(),title:await page.title()});});}
          await page.goto(base+'/');await page.screenshot({path:out+'/HOME_'+width+'.png',fullPage:true});
          if(width===390){await check('mobile menu and second dropdown',async()=>{await page.locator('.mobile-toggle').click();assert(await page.locator('#primary-nav').isVisible());const b=page.locator('#primary-nav .nav-group').nth(1).locator('button');const before=await b.boundingBox();await b.click();assert.equal(await b.getAttribute('aria-expanded'),'true');await b.click();assert.equal(await b.getAttribute('aria-expanded'),'false');const after=await b.boundingBox();assert(Math.abs(before.y-after.y)<2,'menu moved vertically');await page.locator('.mobile-toggle').click();});}
          await check('three merchants '+width,async()=>{await page.goto(base+'/visual/community-payment/merchant-dashboard/');for(const merchant of ['grocer','cafe','home']){await page.locator('#merchantSelect').selectOption(merchant);await page.getByRole('button',{name:'订单管理',exact:true}).click();assert.match(await page.locator('#merchantIdentity').innerText(),/模拟商家/);assert.equal(await page.locator('#orderRows tr').count(),3);}await page.screenshot({path:out+'/MERCHANT_'+width+'.png',fullPage:true});});
          }
          await page.setViewportSize({width:1440,height:900});await page.goto(base+'/');
          await check('original navigation and 5px geometry',async()=>{assert.deepEqual(await page.locator('#primary-nav .nav-group>a').allTextContents(),['解决方案','功能市场','定制与交付','共创生态']);const gaps=await page.locator('#primary-nav .nav-group').evaluateAll(gs=>gs.map(g=>{const a=document.createRange(),b=document.createRange();a.selectNodeContents(g.querySelector('a'));b.selectNodeContents(g.querySelector('button'));return b.getBoundingClientRect().left-a.getBoundingClientRect().right;}));for(const n of gaps)assert(n>=4&&n<=6,'arrow gap '+n);report.arrow_gaps=gaps;});
          const links=await page.locator('a[href^="/showcase/"]').evaluateAll(xs=>Array.from(new Set(xs.map(x=>x.getAttribute('href')))));
          for(const href of links){const r=await context.request.get(base+href);report.showcase_links.push({href,status:r.status()});if(r.status()!==200)report.failures.push({name:'homepage dynamic entry',href,status:r.status(),scope:'Dynamic mechanism not installed; cannot claim complete acceptance'});}
          await check('English and Chinese switching',async()=>{await page.locator('.language>button').click();await page.locator('.language-panel a[lang="en"]').click();await page.waitForURL(base+'/en/');assert.equal(await page.locator('html').getAttribute('lang'),'en');assert.match(await page.locator('h1').innerText(),/AI that fits/);await page.locator('.language>button').click();await page.locator('.language-panel a[lang="zh-CN"]').click();assert.match(await page.locator('h1').innerText(),/AI/);});
          await check('calculator limits and UNKNOWN',async()=>{await page.goto(base+'/marketplace/');await page.locator('#credit').fill('5000');await page.locator('#ecvQuote button').click();let s=await page.locator('#quoteResult').innerText();assert.match(s,/2400\.00/);assert.match(s,/1200\.00/);assert.equal(await page.locator('#directCost').count(),0,'private cost field must not be public');await page.locator('#serviceKind').selectOption('ordinary');await page.locator('#listPrice').fill('100');await page.locator('#credit').fill('100');await page.locator('#ecvQuote button').click();s=await page.locator('#quoteResult').innerText();assert.match(s,/上限90%/);assert.match(s,/预计实付：¥10\.00/);});
          for(const path of ['/about','/capabilities/customer-communication','/en/about']){await check('legacy '+path,async()=>{const r=await page.goto(base+path);assert.equal(r.status(),200);});}
          for(const path of ['/pr122-browser-unknown','/customer/private/']){const r=await context.request.get(base+path);report.checks.push({name:'negative '+path,status:r.status()===404?'PASS':'FAIL',http:r.status()});if(r.status()!==404)report.failures.push({path,status:r.status()});}
          await page.setViewportSize({width:390,height:844});
          await check('consumer phone simulation and order navigation',async()=>{await page.goto(base+'/visual/community-payment/mobile/');await page.getByText('隔离模拟会话已就绪 · 无真实资金',{exact:true}).waitFor();await page.getByRole('link',{name:/云汇邻里体验店/}).click();await page.getByRole('link',{name:'体验付款 →',exact:true}).click();await page.locator('#yuan').fill('12.00');await page.locator('#startOrder').click();await page.locator('#payOrder:not([disabled])').waitFor();assert(await page.locator('#payOrder').isEnabled());await page.locator('#payOrder').click();await page.getByRole('heading',{name:'模拟付款已完成',exact:true}).waitFor();assert(await page.locator('#successAd').isVisible());await page.getByRole('link',{name:'查看本次订单',exact:true}).click();await page.locator('#query').click();await page.getByText('本地模拟状态：SUCCESS（非真实支付凭证）',{exact:true}).waitFor();assert.equal(new URL(page.url()).hash,'#orders');await page.screenshot({path:out+'/PHONE_ORDER.png',fullPage:true});});
          for(const role of ['merchant','community','beneficiary','platform']){await check('phone role '+role,async()=>{const r=await page.goto(base+'/visual/community-payment/mobile/'+role+'.html');assert.equal(r.status(),200);assert(await page.locator('h1').count());assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));await page.screenshot({path:out+'/PHONE_'+role+'.png',fullPage:true});});}
          await context.close();
          }catch(e){report.failures.push({name:'runner',error:String(e.message).slice(0,800)});}finally{await browser.close();report.status=report.failures.length||report.js_errors.length||report.asset_failures.length?'PARTIAL_NOT_ACCEPTED':'PASS';fs.writeFileSync(out+'/PRODUCTION_BROWSER_REPORT.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));if(report.status!=='PASS')process.exitCode=1;}})();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr122-production-browser-unified
          path: ${{ runner.temp }}/pr122-production-report
          retention-days: 14
