name: PR122 site hub domestic host read-only preflight
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-site-hub-host-preflight.yml]
permissions:
  contents: read
concurrency:
  group: pr122-domestic-readonly
  cancel-in-progress: false
jobs:
  target-readonly:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      - name: Owner authorized customer prerequisite metadata only
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, pwd, signal, stat, subprocess
          from pathlib import Path
          signal.alarm(45)
          if os.uname().nodename != 'iZvt5t8tlrm8oiZ':
              raise SystemExit('HOLD_WRONG_HOST')
          report={'schema':1,'action':'CUSTOMER_PREREQUISITE_METADATA_ONLY','uid':os.getuid(),'production_mutations':0,'objects':{},'accounts':{}}
          for name in ('nginx','xuanjun-customer'):
              try:
                  p=pwd.getpwnam(name)
                  report['accounts'][name]={'uid':p.pw_uid,'gid':p.pw_gid,'shell':p.pw_shell}
              except KeyError:report['accounts'][name]='ABSENT'
          for name in ('/etc/xuanjun-customer-center','/etc/xuanjun-customer-center/config.json','/etc/xuanjun-customer-center/runtime.json','/etc/xuanjun-customer-center/INDEPENDENT_REVIEW_TRUST.json','/etc/xuanjun-customer-center/TARGET_ACCEPTANCE.json','/var/lib/xuanjun-customer-preflight','/usr/local/lib/xuanjun-customer-center','/run/xuanjun-customer-api/http.sock'):
              try:
                  s=Path(name).lstat()
                  report['objects'][name]={'mode':oct(stat.S_IMODE(s.st_mode)),'uid':s.st_uid,'gid':s.st_gid,'symlink':stat.S_ISLNK(s.st_mode)}
              except FileNotFoundError:report['objects'][name]='ABSENT'
              except PermissionError:report['objects'][name]='PERMISSION_DENIED'
          report['current']=os.readlink('/var/www/wenwenwenyiyiyi.work/current')
          report['python']=__import__('sys').version.split()[0]
          report['machine']=os.uname().machine
          for key,cmd in (('glibc',['getconf','GNU_LIBC_VERSION']),('sudo_noninteractive_true',['sudo','-n','/usr/bin/true'])):
              try:
                  r=subprocess.run(cmd,capture_output=True,text=True,timeout=5,stdin=subprocess.DEVNULL)
                  report[key]={'exit':r.returncode}
                  if key=='glibc':report[key]['version']=r.stdout.strip()[:80]
              except (OSError,subprocess.TimeoutExpired):report[key]={'state':'UNAVAILABLE'}
          print('PR122_CUSTOMER_HOST_METADATA='+json.dumps(report,sort_keys=True))
          PY
