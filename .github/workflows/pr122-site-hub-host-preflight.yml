name: PR122 site hub domestic host read-only preflight
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths: [.github/workflows/pr122-site-hub-host-preflight.yml]
permissions:
  contents: read
jobs:
  target-readonly:
    runs-on: [self-hosted, Linux, X64, xuanjun-domestic-ops]
    timeout-minutes: 3
    steps:
      - name: Bounded host metadata and config source inspection
        env:
          XJ_PREFLIGHT_PAYLOAD: ""
        run: |
          python3 -I -B - <<'PYCODE'
          import os, gzip, base64, hashlib
          raw = gzip.decompress(base64.b64decode(os.environ['XJ_PREFLIGHT_PAYLOAD']))
          assert hashlib.sha256(raw).hexdigest() == '6b6a8b5fab42c54970d49e41cd1572dfbc58683f0ab90ac993d43653d9f39138'
          exec(compile(raw, 'pr122_site_hub_host_preflight.py', 'exec'), {'__name__': '__main__'})
          PYCODE
