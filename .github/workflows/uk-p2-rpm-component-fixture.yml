name: P2 UK frozen RPM component isolated kernel fixture
on:
  push:
    branches:
      - repair/p2-chatgpt-clean-review-20261013
    paths:
      - evidence/p2-install-preparation-20261013/frozen_rpm_component_fixture.py
      - .github/workflows/uk-p2-rpm-component-fixture.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise frozen component payload journal and numeric UID in disposable root
        env:
          P2_CANARY_RUN: "${{ github.run_id }}"
        run: sudo -n /usr/bin/python3 -I -B evidence/p2-install-preparation-20261013/frozen_rpm_component_fixture.py "$P2_CANARY_RUN"
