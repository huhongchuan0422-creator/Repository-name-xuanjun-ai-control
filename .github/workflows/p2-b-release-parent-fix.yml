name: P2 B Release Parent Fix
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - 'evidence/p2-epoch7-access-repair-20261014/b-release-parent-fix/kit-overlay/**'
      - 'evidence/p2-epoch7-access-repair-20261014/b-release-parent-fix/preparation/**'
      - 'evidence/p2-epoch7-access-repair-20261014/b-release-parent-fix/tests/**'
      - 'evidence/p2-epoch7-access-repair-20261014/b-release-parent-fix/reference-tests/**'
      - 'evidence/p2-epoch7-access-repair-20261014/b-release-parent-fix/build/**'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/epoch7_prepare.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/epoch7_prepare_data.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/epoch7_topology_projection.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/test_epoch7_prepare_data_r7.py'
      - 'evidence/p2-epoch7-access-repair-20261014/preparation-source-r7-fresh/test_epoch7_topology_projection.py'
      - 'governance/features.json'
      - 'evidence/p2-epoch7-access-repair-20261014/artifacts/epoch7-kit-dc18f73e.tar.gz'
      - 'tests/test_p2_b_release_parent_fix.py'
      - 'tests/test_p2_b_release_parent_fix_contract.py'
      - '.github/workflows/p2-b-release-parent-fix.yml'
permissions:
  contents: read
concurrency:
  group: p2-b-release-parent-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  parent-fix-public-fixture:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: python:3.6.15-bullseye
            expected: '3.6'
          - image: python:3.12-bookworm
            expected: '3.12'
    # Docker Official Images supply an unmodified native interpreter; no local
    # retained runtime or unsupported setup-python Linux 3.6 binary is reused.
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_PYTHON: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require clean native Python import
        run: |
          python3 -I -B -S - <<'PYTHON'
          import ctypes, os, sys, uuid
          assert '.'.join(map(str,sys.version_info[:2])) == os.environ['EXPECTED_PYTHON']
          assert ctypes.CDLL(None).getpid() == os.getpid()
          assert len(uuid.uuid4().bytes) == 16
          print('CLEAN_NATIVE_IMPORT_PASS='+sys.version.split()[0])
          PYTHON
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GIT=$(command -v git)
          test "$("$GIT" -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify exact public focused fixture
        run: |
          set -euo pipefail
          python3 --version
          GIT=$(command -v git)
          MKTEMP=$(command -v mktemp)
          CHOWN=$(command -v chown)
          ID=$(command -v id)
          STAT=$(command -v stat)
          MKDIR=$(command -v mkdir)
          umask 0077
          # Preserve the reviewed ACL-safe staging outside hosted /home. Keep production checks unchanged:
          # use only a new disposable CI workspace under the verified filesystem root.
          python3 -I -B -S - <<'PY'
          import os, stat, errno
          for path in ('/',):
              info=os.lstat(path)
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and info.st_gid==0
              assert not info.st_mode & 0o7022
              for name in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,name,follow_symlinks=False)
                  except OSError as error: assert error.errno in (errno.ENODATA,errno.ENOTSUP)
                  else: raise RuntimeError('CI_STAGING_ANCESTRY_ACL')
          PY
          CI_ROOT=$("$MKTEMP" -d /xuanjun-p2-parentfix-ci.XXXXXXXX)
          "$CHOWN" "$("$ID" -u):$("$ID" -g)" "$CI_ROOT"
          test "$("$STAT" -c %a "$CI_ROOT")" = 700
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          EXPECTED_TREE=$("$GIT" -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_SHA^{tree}")
          "$GIT" -c safe.directory="$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE/.git" -c core.hooksPath=/dev/null clone --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$CI_ROOT/repository"
          "$GIT" -C "$CI_ROOT/repository" -c core.hooksPath=/dev/null checkout --detach "$GITHUB_SHA"
          test "$("$GIT" -C "$CI_ROOT/repository" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$("$GIT" -C "$CI_ROOT/repository" rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          "$MKDIR" -m 700 "$CI_ROOT/temp"
          export RUNNER_TEMP="$CI_ROOT/temp" TMPDIR="$CI_ROOT/temp"
          cd "$CI_ROOT/repository"
          python3 -I -B -S - <<'PY'
          import os, stat, json
          paths=set()
          for value in (os.getcwd(),os.environ.get('RUNNER_TEMP'),os.environ.get('HOME')):
              if not value: continue
              path=os.path.abspath(value)
              while True:
                  paths.add(path)
                  parent=os.path.dirname(path)
                  if parent==path: break
                  path=parent
          for path in sorted(paths):
              info=os.lstat(path)
              row={'path':path,'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode))}
              for key in ('system.posix_acl_access','system.posix_acl_default'):
                  try: os.getxattr(path,key,follow_symlinks=False)
                  except OSError as error: row[key]={'errno':error.errno}
                  else: row[key]={'present':True}
              print('CI_ONLY_PATH_METADATA='+json.dumps(row,sort_keys=True))
          PY
          python3 -I -B -S tests/test_p2_b_release_parent_fix_contract.py -v
          python3 -I -B -S tests/test_p2_b_release_parent_fix.py -v
