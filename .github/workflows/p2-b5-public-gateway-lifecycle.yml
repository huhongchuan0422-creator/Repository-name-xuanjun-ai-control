name: P2 B5 public Gateway lifecycle contract
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - production/p2_install/b5_public_gateway_lifecycle.mjs
      - tests/p2_install/test_b5_public_gateway_lifecycle.mjs
      - .github/workflows/p2-b5-public-gateway-lifecycle.yml
  workflow_dispatch:
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: New public-owner lifecycle cases only; no SDK execution
        run: node tests/p2_install/test_b5_public_gateway_lifecycle.mjs
