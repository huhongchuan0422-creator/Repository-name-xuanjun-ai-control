name: P2 B2 isolated evidence import
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - 'production/p2_install/evidence_import.py'
      - 'tests/p2_install/test_evidence_import.py'
      - '.github/workflows/p2-b2-evidence.yml'
  pull_request:
    paths:
      - 'production/p2_install/evidence_import.py'
      - 'tests/p2_install/test_evidence_import.py'
      - '.github/workflows/p2-b2-evidence.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B tests/p2_install/test_evidence_import.py -v
