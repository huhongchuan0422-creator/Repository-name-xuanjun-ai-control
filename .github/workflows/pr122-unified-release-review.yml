name: PR122 Unified Static Candidate
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - 'tools/pr122_static_baseline_readonly.py'
      - 'scripts/pr122_static_*.py'
      - 'scripts/pr122_customer_workflow.py'
      - 'scripts/pr122_customer_review.py'
      - 'tests/test_pr122_static_*.py'
      - 'scripts/pr122_site_hub_unified_package.py'
      - 'scripts/pr122_site_hub_unified_release.py'
      - 'scripts/pr122_site_hub_unified_distribution.py'
      - 'tests/test_pr122_site_hub_unified_release.py'
      - 'deploy/pr122-site-hub-unified/**'
      - 'evidence/pr122-unified-release/**'
      - 'tests/test_pr122_site_hub_unified_package.py'
      - 'tests/pr122_site_hub_unified_nginx.py'
      - '.github/workflows/pr122-unified-release-review.yml'
permissions:
  contents: read
jobs:
  unified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR122_FROZEN_MOBILE_ARTIFACT: /tmp/pr122-reviewed-mobile/COMMUNITY_EXPERIENCE_REVIEW_ONLY.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact 23 static baseline readonly regressions as nonroot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr122-unified-reports
          export PR122_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python -B - <<'PYBASELINE' 2>&1 | tee /tmp/pr122-unified-reports/STATIC_BASELINE_READONLY_TESTS.log
          import hashlib,json,os,sys,unittest
          from pathlib import Path
          assert sys.version_info[:2]==(3,11), 'Target Python version changed'
          assert os.geteuid()!=0, 'Readonly synthetic tests must run non-root'
          blocked=[]
          def guard(event,args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn','os.fork','os.forkpty','os.exec'):
                  blocked.append(event)
                  raise AssertionError('FORBIDDEN_NETWORK_OR_PROCESS')
              if event=='open' and args and isinstance(args[0],str) and any(args[0]==p or args[0].startswith(p+'/') for p in ('/etc/nginx','/etc/systemd/system','/var/www/wenwenwenyiyiyi.work','/var/lib/xuanjun-pr122-site-hub','/var/lib/xuanjun-site-hub-preview','/usr/local/libexec/pr122_website_release.py')):
                  blocked.append('protected-path')
                  raise AssertionError('FORBIDDEN_PRODUCTION_PATH')
          sys.addaudithook(guard)
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_pr122_static_baseline_readonly')
          def cases(group):
              for item in group:
                  if isinstance(item,unittest.TestSuite):yield from cases(item)
                  else:yield item.id()
          case_ids=list(cases(suite))
          assert suite.countTestCases()==len(set(case_ids))==23, 'Readonly test collection changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==23 and result.wasSuccessful() and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses and not blocked
          bindings=[]
          for name in ('tools/pr122_static_baseline_readonly.py','tests/test_pr122_static_baseline_readonly.py','.github/workflows/pr122-unified-release-review.yml'):
              body=Path(name).read_bytes()
              bindings.append({'path':name,'size':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          receipt={'source_commit':os.environ['GITHUB_SHA'],'source_tree':os.environ['PR122_SOURCE_TREE'],'run_id':os.environ['GITHUB_RUN_ID'],'python':sys.version,'euid':os.geteuid(),'case_ids':case_ids,'total':result.testsRun,'passed':result.testsRun,'skipped':0,'errors':0,'failures':0,'blocked_network_process_or_protected_path_attempts':blocked,'files':bindings,'scope':'SYNTHETIC_FD_FIXTURES_ONLY','real_collect':'NOT_RUN','field_execution':'NOT_RUN','production_release':'HOLD'}
          Path('/tmp/pr122-unified-reports/STATIC_BASELINE_READONLY_BINDING.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PYBASELINE
      - name: Static controlled profile and inherited ledger regressions
        run: |
          set -euo pipefail
          python -m pip install cryptography==46.0.3
          python -B -m unittest tests.test_pr122_delivery_controlled_apply tests.test_pr122_static_github_approval tests.test_pr122_static_public_transport tests.test_pr122_static_package_schema tests.test_pr122_static_workflow tests.test_pr122_static_signature tests.test_pr122_static_operations tests.test_pr122_static_source_gate tests.test_pr122_static_source_package tests.test_pr122_customer_workflow tests.test_pr122_customer_workflow_apply tests.test_pr122_customer_workflow_review tests.test_pr122_customer_workflow_signature tests.test_pr122_customer_login_release -v
      - name: Package exact controlled static source closure
        run: python -B -m scripts.pr122_static_source_package --output /tmp/pr122-static-controlled-source
      - name: Bind exact controller CI to the independently delivered public artifact
        run: |
          python -B - <<'PYDELIVERY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          reference=json.loads(Path('evidence/pr122-delivery-release/ARTIFACT_BINDING.json').read_bytes())
          assert reference['package_schema']=='FULL_STATIC_DELIVERY_REVIEW_V1'
          assert reference['static_artifact_sha256']=='4881d1e30da4815969cb44fd82411e0bef179cafa3444bf03f58e0ad8aabed80'
          folder=Path('/tmp/pr122-static-controlled-source')
          source=(folder/'PR122_STATIC_CONTROLLED_SOURCE_REVIEW_ONLY.tar.gz').read_bytes()
          binding=json.loads((folder/'STATIC_SOURCE_BINDING.json').read_bytes())
          assert binding['source_commit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256(source).hexdigest()==binding['archive_sha256']
          assert binding['source_members']==24 and binding['source_bindings']==23
          report={'source_commit':os.environ['GITHUB_SHA'],
                  'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'run_id':os.environ['GITHUB_RUN_ID'],'controller_source':binding,
                  'public_artifact_reference':reference,
                  'public_tar_bytes_in_this_run':'NOT_READ_NOT_REBUILT_USE_COORDINATOR_VERIFIED_ORIGINAL',
                  'scope':'EXACT_CONTROLLER_SOURCE_CI_WITH_UNCHANGED_PUBLIC_REFERENCE',
                  'production_execution':'NOT_RUN','installation_permission':'NOT_ISSUED'}
          Path('/tmp/pr122-unified-reports/DELIVERY_CI_BINDING.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PYDELIVERY
      - name: Reconstruct historical mobile fixture from its exact reviewed source
        run: |
          git fetch --depth=1 origin 790937a5c96afcf3b3660e36cf36cfaab2002a72
          python - <<'PYCODE'
          import io,os,subprocess,sys,tarfile,tempfile
          from pathlib import Path
          revision='790937a5c96afcf3b3660e36cf36cfaab2002a72'
          raw=subprocess.check_output(['git','archive',revision])
          with tempfile.TemporaryDirectory() as folder:
              with tarfile.open(fileobj=io.BytesIO(raw)) as archive:archive.extractall(folder,filter='data')
              subprocess.run([sys.executable,str(Path(folder)/'scripts/pr122_community_experience_package.py'),'--output','/tmp/pr122-reviewed-mobile'],cwd=folder,env=dict(os.environ,GITHUB_SHA=revision),check=True)
          from scripts.pr122_site_hub_unified_package import MOBILE_SHA,sha
          assert sha(Path(os.environ['PR122_FROZEN_MOBILE_ARTIFACT']).read_bytes())==MOBILE_SHA
          PYCODE
      - name: Composition and inherited integration regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_pr122_site_hub_unified_package tests.test_pr122_site_hub_integration tests.test_pr122_site_hub_preview -v
          node --test demos/xuanjun-site-hub/assets/ecv-quote.test.cjs
      - name: Reproduce reviewed phone bytes and compose exact candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr122-unified-reports
          test -f "$PR122_FROZEN_MOBILE_ARTIFACT"
          python scripts/pr122_site_hub_stage.py --browser-fixture tests/fixtures/pr122-site-shell --output /tmp/pr122-unified-stage
          python -m scripts.pr122_site_hub_unified_package --static evidence/pr122-public-presentation/PR122_PUBLIC_PRESENTATION_REVIEW_ONLY.tar.gz --mobile /tmp/pr122-reviewed-mobile/COMMUNITY_EXPERIENCE_REVIEW_ONLY.tar.gz --output /tmp/pr122-unified-candidate --stage /tmp/pr122-unified-stage
      - name: Frozen unified wrapper, full release and controlled rollback regression
        run: |
          set -euo pipefail
          sudo -n env XJ_COMBINED_SYNTHETIC_FIXTURE=1 PR122_FROZEN_MOBILE_ARTIFACT=/tmp/pr122-reviewed-mobile/COMMUNITY_EXPERIENCE_REVIEW_ONLY.tar.gz "$(command -v python)" -m unittest tests.test_pr122_site_hub_unified_release.UnifiedTransactionTests -v
          python -m scripts.pr122_site_hub_unified_distribution --candidate /tmp/pr122-unified-candidate/PR122_UNIFIED_REVIEW_ONLY.tar.gz --output /tmp/pr122-unified-distribution
      - name: Browser and real Nginx test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          npm install --prefix "$RUNNER_TEMP/pr122-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: All canonical and exact routes in isolated real Nginx
        run: sudo -n "$(command -v python)" -m tests.pr122_site_hub_unified_nginx --candidate /tmp/pr122-unified-candidate/PR122_UNIFIED_REVIEW_ONLY.tar.gz --report /tmp/pr122-unified-reports/NGINX_REPORT.json
      - name: Current public page tests and exact historical 790937 mobile fixture tests
        env:
          XJ_HUB_STAGE: /tmp/pr122-unified-stage
          XJ_HUB_REPORT: /tmp/pr122-unified-reports/PUBLIC_BROWSER_REPORT.json
          TEST_STAGE: /tmp/pr122-unified-stage
          REPORT_DIR: /tmp/pr122-unified-reports
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-browser/node_modules/playwright"
          node tests/pr122_site_hub_browser.cjs
          git show 790937a5c96afcf3b3660e36cf36cfaab2002a72:tests/community-experience/browser.cjs > /tmp/pr122-reviewed-mobile-browser.cjs
          echo '549e9c91c0efc56d606c8b1a9cb8616aad0904d8a7557a325ee247e018ca9e5b  /tmp/pr122-reviewed-mobile-browser.cjs' | sha256sum -c -
          node /tmp/pr122-reviewed-mobile-browser.cjs
          python - <<'PY'
          import json,os
          from pathlib import Path
          Path('/tmp/pr122-unified-reports/CI_BINDING.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'production_changes':0,'production_release_approved':False,'mobile_fixture_and_browser_commit':'790937a5c96afcf3b3660e36cf36cfaab2002a72','mobile_browser_blob':'9abee086b583d12117a81030ef94daea64952274','mobile_browser_sha256':'549e9c91c0efc56d606c8b1a9cb8616aad0904d8a7557a325ee247e018ca9e5b','mobile_scope':'Historical reviewed fixture, not current navigation candidate'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr122-unified-static-${{ github.sha }}
          path: |
            /tmp/pr122-unified-reports/
            /tmp/pr122-unified-candidate/
            /tmp/pr122-unified-distribution/
            /tmp/pr122-static-controlled-source/
          retention-days: 14

