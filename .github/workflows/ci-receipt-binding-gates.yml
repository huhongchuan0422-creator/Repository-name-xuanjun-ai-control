name: CI receipt identity gates
on:
  pull_request:
    paths:
      - scripts/ci_receipt_binding.py
      - tests/test_ci_receipt_binding.py
      - docs/CI_RECEIPT_BINDING.md
      - .github/workflows/ci-receipt-binding-gates.yml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate pure source checks
        run: |
          python3 -m py_compile scripts/ci_receipt_binding.py
          python3 -B -m unittest discover -s tests -p 'test_ci_receipt_binding.py' -v
