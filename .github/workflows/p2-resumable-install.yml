name: P2 resumable installation journal
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - 'production/p2_install/**'
      - 'tests/p2_install/**'
      - '.github/workflows/p2-resumable-install.yml'
  pull_request:
    paths:
      - 'production/p2_install/**'
      - 'tests/p2_install/**'
      - '.github/workflows/p2-resumable-install.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B tests/p2_install/test_journal.py -v
      - name: B6 offline persistence and preactivation scope tests
        run: python -B tests/p2_install/test_b6_persistence.py -v
