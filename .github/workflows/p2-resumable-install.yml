name: P2 resumable installation journal
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - 'production/p2_install/**'
      - 'tests/p2_install/**'
      - 'plans/p2_b5_new19_offline_candidate/**'
      - '.github/workflows/p2-resumable-install.yml'
  pull_request:
    paths:
      - 'production/p2_install/**'
      - 'tests/p2_install/**'
      - 'plans/p2_b5_new19_offline_candidate/**'
      - '.github/workflows/p2-resumable-install.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B tests/p2_install/test_journal.py -v
      - name: B6 offline persistence and preactivation scope tests
        run: python -B tests/p2_install/test_b6_persistence.py -v
      - name: B5 staged successor contract and recovery tests
        run: |
          for test_file in plans/p2_b5_new19_offline_candidate/test_successor_*.py; do
            python -B "$test_file" -v
          done
      - name: B5 offline reader and closeout scope tests
        run: |
          python -B plans/p2_b5_new19_offline_candidate/test_old_policy_dependency_reader.py -v
          python -B plans/p2_b5_new19_offline_candidate/test_adapter_closeout_scope.py -v
          python -B plans/p2_b5_new19_offline_candidate/test_original_capability_preflight.py -v
          python -B plans/p2_b5_new19_offline_candidate/test_canonical_prestart_proof.py -v
          python -B plans/p2_b5_new19_offline_candidate/test_runtime_freeze_and_caller.py -v
