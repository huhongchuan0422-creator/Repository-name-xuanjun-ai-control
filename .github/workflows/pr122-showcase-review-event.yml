name: PR122 Showcase Review Event
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  review-notification-only:
    if: github.event.issue.number == 122 && (startsWith(github.event.comment.body, 'XUANJUN_SHOWCASE_REVIEW') || startsWith(github.event.comment.body, 'XUANJUN_SHOWCASE_BUILD_REQUEST'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require independent protected builder admission
        run: |
          echo 'HOLD_OWNER_ANCHORED_REVIEW_REQUIRED'
          echo 'Comment events cannot authorize tags, dispatches, or production builds.'
          echo 'Use the approved protected builder with independently enrolled exact anchors.'
