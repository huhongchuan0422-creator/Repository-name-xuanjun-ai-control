name: Delivery gate candidate tests (no approval authority)
on:
  pull_request:
    paths: ['AGENTS.md', 'docs/DEVELOPMENT_EXECUTION_AND_FEEDBACK_RULES_20261012.md', 'scripts/*delivery*.py', 'tests/test_*delivery*.py', '.github/workflows/delivery-contract*.yml', 'governance/features.json']
permissions:
  contents: read
jobs:
  delivery-contract-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Candidate regression and trust-boundary attacks
        run: python3 -B -m unittest discover -s tests -p 'test_*delivery*.py' -v
