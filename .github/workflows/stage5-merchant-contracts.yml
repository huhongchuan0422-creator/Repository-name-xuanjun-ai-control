name: Stage5 merchant standalone contracts
on:
  pull_request:
    paths:
      - 'scripts/community_merchant_contract.py'
      - 'tests/test_community_merchant_contract.py'
      - '.github/workflows/stage5-merchant-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 10 independent merchant contracts
        run: python -m unittest -v tests.test_community_merchant_contract
