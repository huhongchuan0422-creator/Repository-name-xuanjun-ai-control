name: Stage5 Real Chromium E2E
on:
  pull_request:
    paths:
      - 'tests/test_stage5_browser_e2e.py'
      - '.github/workflows/stage5-real-browser-e2e.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_stage5_browser_e2e.py' -v
      - run: |
          echo REAL_CHROMIUM_BROWSER_E2E=TESTED
          echo SIMULATION_ONLY=YES
          echo REAL_WECHAT_AND_PROVIDER_SETTLEMENT=NOT_RUN
