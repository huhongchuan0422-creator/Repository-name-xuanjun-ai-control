name: Community isolated UI preview scoped gate
on:
  push:
    branches: [feature/chatgpt-community-wechat-sp-offline-20261017]
    paths:
      - clients/community-mini/**
      - scripts/community_review_runtime.py
      - demos/community-stage/review-runtime.html
      - demos/community-stage/review-native.js
      - tests/test_community_review_runtime.py
      - scripts/community_mini_merchant.py
      - scripts/community_mini_center_identity.py
      - scripts/community_mini_http.py
      - scripts/community_mini_application.py
      - scripts/community_collection_code.py
      - scripts/community_merchant_onboarding.py
      - scripts/community_wechat_applyment.py
      - tests/test_community_mini_merchant.py
      - tests/test_community_collection_code.py
      - tests/community_mini_merchant_http.cjs
      - demos/community-stage/ui-preview/**
      - scripts/community_ui_preview_build.py
      - scripts/community_web_entries.py
      - scripts/community_stage_package.py
      - tests/test_community_ui_preview.py
      - .github/workflows/community-ui-preview-scoped.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  click-through:
    if: "!contains(github.event.head_commit.message, '[community-ocr-host-scope]') && !contains(github.event.head_commit.message, '[community-ocr-scope]') && !contains(github.event.head_commit.message, '[preview-version-scope]') && !contains(github.event.head_commit.message, '[preview-inspection-scope]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMMUNITY_UI_EVIDENCE: ui-evidence
      NODE_OPTIONS: --test-reporter=tap
      COMMUNITY_REVIEW_EVIDENCE: runtime-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0 cryptography==46.0.3
      - run: python -m playwright install --with-deps chromium
      - name: Original-field generated assets must be committed exactly
        run: |
          python scripts/community_ui_preview_build.py
          git diff --exit-code -- demos/community-stage/ui-preview/sources.js demos/community-stage/ui-preview/original.css docs/development/COMMUNITY_UI_PREVIEW_PAGE_MAP_20261022.md
      - name: Install official nginx parser on CI only
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx
      - name: Actual desktop and mobile click-through
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -p test_community_ui_preview.py -v 2>&1 | tee ui-click-through.log
      - name: Same mini native controllers and original Center HTTP
        shell: bash
        run: |
          set -o pipefail
          node --test clients/community-mini/*.test.cjs 2>&1 | tee ui-native.log
          PYTHONPATH=tests:. python -B -m unittest test_community_mini_merchant test_community_collection_code test_community_mini_center_identity test_community_mini_application test_community_center_operations -v 2>&1 | tee ui-mini-http.log
      - name: Original material scene requirements and permission regression
        if: "!contains(github.event.head_commit.message, '[ui-navigation-only]')"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. python -B -m unittest test_community_onboarding_scene_materials test_community_merchant_onboarding test_community_merchant_opening test_community_onboarding_conditional_materials test_community_applyment_conditions test_community_applyment_rejection_recovery test_community_wechat_payment_activation -v 2>&1 | tee ui-material-scenes.log
      - name: Integrated isolated runtime with exact native controllers and original role APIs
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. python -B -m unittest test_community_review_runtime -v 2>&1 | tee ui-integrated-runtime.log
      - name: Original role entries and real source ZIP closure
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -p test_community_ui_nginx.py -v 2>&1 | tee ui-nginx.log
          python -B -m unittest discover -s tests -p test_community_web_entries.py -v 2>&1 | tee ui-original-entries.log
          python -B -m unittest discover -s tests -p test_community_stage_package.py -v 2>&1 | tee ui-source-zip.log
      - name: Self-contained review preview and source
        run: |
          python scripts/community_ui_preview_build.py --bundle community-ui-preview.html
          python scripts/community_stage_package.py --output community-stage-source.zip
          sha256sum community-ui-preview.html community-stage-source.zip > ui-artifact.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-isolated-ui-review
          path: |
            ui-evidence/
            runtime-evidence/
            ui-*.log
            ui-artifact.sha256
            community-ui-preview.html
            community-stage-source.zip
            docs/development/COMMUNITY_UI_PREVIEW_PAGE_MAP_20261022.md
            docs/development/COMMUNITY_ADMISSION_MINIMAL_DELTA_20261022.md
            docs/development/COMMUNITY_MINI_DUAL_TERMINAL_REVIEW_20261022.md
