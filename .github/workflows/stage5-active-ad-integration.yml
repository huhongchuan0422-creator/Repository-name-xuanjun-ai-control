name: Stage5 Active Ad Integration
on:
  pull_request:
    paths:
      - 'tests/test_stage5_active_ad_integration.py'
      - '.github/workflows/stage5-active-ad-integration.yml'
permissions:
  contents: read
jobs:
  active-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_stage5_active_ad_integration.py' -v
          python -m unittest discover -s tests -p 'test_community_storefront_snapshot.py' -v
          echo REAL_BROWSER_AUTH_AND_PAYMENT=NOT_RUN
