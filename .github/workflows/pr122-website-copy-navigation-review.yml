name: PR122 Website Copy and Navigation Hosted Review Only
on:
  push:
    branches: [feature/work-pr122-site-hub-integration-20261016]
    paths:
      - scripts/pr122_site_hub_*.py
      - scripts/pr122_community_experience_package.py
      - demos/xuanjun-site-hub/**
      - demos/work-community-experience/**
      - docs/legal/**
      - demos/legal/**
      - scripts/build_legal_previews.py
      - tests/test_legal_contract_center.py
      - tests/test_legal_static_alignment.py
      - tests/test_single_contract_consistency.py
      - tests/test_pr122_ecology_copy.py
      - tests/test_pr122_public_copy_audit.py
      - tests/test_pr122_role_navigation.py
      - tests/test_pr122_navigation_stage.py
      - tests/test_pr122_full_package_navigation.py
      - tests/test_pr122_site_hub_identity_integration.py
      - tests/test_pr122_site_hub_unified_package.py
      - tests/pr122_*browser.cjs
      - tests/pr122_role_navigation.cjs
      - tests/ecv-quote-fractional.test.cjs
      - tests/fixtures/pr122-site-shell/**
      - tests/fixtures/pr122-public-copy-evidence.json
      - .github/workflows/pr122-website-copy-navigation-review.yml
permissions:
  contents: read
jobs:
  hosted-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source and simulated regressions without target host access
        run: |
          mkdir -p /tmp/pr122-website-review
          python -m unittest tests.test_pr122_ecology_copy tests.test_pr122_public_copy_audit tests.test_pr122_role_navigation tests.test_pr122_navigation_stage -v
          node --test demos/xuanjun-site-hub/assets/ecv-quote.test.cjs tests/ecv-quote-fractional.test.cjs
          node tests/pr122_role_navigation.cjs
      - name: Actual in-process customer identity and channel integration without sockets
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pr122-identity-integration"
          "$RUNNER_TEMP/pr122-identity-integration/bin/python" -m pip install cryptography==46.0.3 cffi==2.0.0 pycparser==2.23
          "$RUNNER_TEMP/pr122-identity-integration/bin/python" -m pip freeze > /tmp/pr122-website-review/IDENTITY_INTEGRATION_DEPENDENCIES.txt
          "$RUNNER_TEMP/pr122-identity-integration/bin/python" -B -m unittest tests.test_pr122_site_hub_identity_integration.IdentityIntegrationTests -v 2>&1 | tee /tmp/pr122-website-review/IDENTITY_INTEGRATION_TESTS.log
          "$RUNNER_TEMP/pr122-identity-integration/bin/python" - <<'PY'
          import json,re
          from pathlib import Path
          log=Path('/tmp/pr122-website-review/IDENTITY_INTEGRATION_TESTS.log').read_text()
          counts=re.findall(r'Ran (\d+) tests in ',log)
          assert counts and int(counts[-1])==8 and re.search(r'^OK$',log,re.M) and not re.search(r'skipped=|FAILED|ERROR:|FAIL:',log)
          Path('/tmp/pr122-website-review/IDENTITY_INTEGRATION_COUNTS.json').write_text(json.dumps({'executed':8,'passed':8,'skipped':0,'scope':'Actual in-process HTTP handler, SQLite and cryptography; memory transport; synthetic identities; production and external provider calls NOT_RUN'},sort_keys=True)+'\n')
          PY
      - name: Offline mocked full-package controls; no original-source acceptance
        run: python -m unittest tests.test_pr122_full_package_navigation -v
      - name: Legal draft alignment, 16 offline checks and clean regeneration
        run: |
          set -euo pipefail
          python scripts/build_legal_previews.py
          git diff --exit-code -- demos/legal
          test -z "$(git ls-files --others --exclude-standard -- demos/legal)"
          python -m unittest tests.test_legal_contract_center tests.test_legal_static_alignment tests.test_single_contract_consistency -v
          git diff --exit-code -- demos/legal
      - name: Reproduce the pinned historical mobile package without changing release pins
        run: |
          git fetch --depth=1 origin 790937a5c96afcf3b3660e36cf36cfaab2002a72
          python -m unittest tests.test_pr122_site_hub_unified_package -v
      - name: Install pinned Hosted browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/pr122-copy-browser" --no-save playwright@1.55.0
          "$RUNNER_TEMP/pr122-copy-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Customer authentication UI with synthetic HTTP only
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version | tee /tmp/pr122-website-review/CUSTOMER_AUTH_BROWSER_VERSION.txt
          XJ_CHROMIUM_EXECUTABLE=/opt/google/chrome/chrome PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-copy-browser/node_modules/playwright" node tests/pr122_site_hub_auth_browser.cjs | tee /tmp/pr122-website-review/CUSTOMER_AUTH_UI_BROWSER_REPORT.json
      - name: Build current synthetic website with opt-in navigation before CSP and manifest
        run: python scripts/pr122_site_hub_stage.py --browser-fixture tests/fixtures/pr122-site-shell --output /tmp/pr122-current-website --derive-navigation
      - name: Exercise real Chromium copy, responsive layout and role navigation
        env:
          XJ_HUB_STAGE: /tmp/pr122-current-website
          XJ_ECOLOGY_REPORT: /tmp/pr122-website-review/ecology
          XJ_ROLE_NAV_REPORT: /tmp/pr122-website-review/role-navigation
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-copy-browser/node_modules/playwright" node tests/pr122_ecology_browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pr122-copy-browser/node_modules/playwright" node tests/pr122_role_navigation_browser.cjs
      - name: Bind exact source and current synthetic preview; no production permission
        run: |
          python - <<'PYCODE'
          import gzip,hashlib,io,json,os,subprocess,tarfile
          from pathlib import Path
          paths=['.github/workflows/pr122-website-copy-navigation-review.yml', 'demos/legal/service-package-rights.html', 'demos/work-community-experience/role.js', 'demos/xuanjun-site-hub/assets/ecv-quote-ui.js', 'demos/xuanjun-site-hub/assets/ecv-quote.js', 'demos/xuanjun-site-hub/assets/ecv-quote.test.cjs', 'demos/xuanjun-site-hub/customer/projects/index.html', 'demos/xuanjun-site-hub/marketplace/index.html', 'demos/xuanjun-site-hub/visual/community-payment/index.html', 'docs/development/DEVELOPMENT_V27_ECOLOGY_V11_20261014.md', 'scripts/pr122_community_experience_package.py', 'scripts/pr122_site_hub_english.py', 'scripts/pr122_site_hub_public_copy.py', 'scripts/pr122_site_hub_stage.py', 'scripts/pr122_site_hub_unified_package.py', 'tests/ecv-quote-fractional.test.cjs', 'tests/fixtures/pr122-public-copy-evidence.json', 'tests/fixtures/pr122-site-shell/PINS.json', 'tests/fixtures/pr122-site-shell/custom-ai/index.html', 'tests/fixtures/pr122-site-shell/en/custom-ai/index.html', 'tests/fixtures/pr122-site-shell/zh-cn/custom-ai/index.html', 'tests/pr122_ecology_browser.cjs', 'tests/pr122_role_navigation.cjs', 'tests/pr122_role_navigation_browser.cjs', 'tests/test_pr122_ecology_copy.py', 'tests/test_pr122_navigation_stage.py', 'tests/test_pr122_public_copy_audit.py', 'tests/test_pr122_role_navigation.py', 'tests/test_pr122_site_hub_unified_package.py', 'demos/legal/custom-development.html', 'demos/legal/custom-sow.html', 'demos/legal/index.html', 'docs/legal/registry.json', 'docs/legal/templates/custom-development.md', 'docs/legal/templates/custom-sow.md', 'docs/legal/templates/service-package-rights.md', 'scripts/build_legal_previews.py', 'tests/test_legal_contract_center.py', 'tests/test_legal_static_alignment.py', 'tests/test_single_contract_consistency.py', 'scripts/pr122_site_hub_package.py', 'tests/test_pr122_full_package_navigation.py']
          paths += ['tests/pr122_site_hub_auth_browser.cjs', 'deploy/pr122-customer-center/ui/app.js', 'deploy/pr122-customer-center/ui/index.html', 'deploy/pr122-customer-center/ui/app.css']
          paths += ["tests/test_pr122_site_hub_identity_integration.py","scripts/community_merchant_contract.py","scripts/pr122_customer_change_authority.py","scripts/pr122_customer_changes.py","scripts/pr122_customer_core.py","scripts/pr122_customer_delivery_source.py","scripts/pr122_customer_edit_jobs.py","scripts/pr122_customer_http.py","scripts/pr122_customer_ops.py","scripts/pr122_customer_preview.py","scripts/pr122_customer_providers.py","scripts/pr122_customer_publication_worker.py","scripts/pr122_customer_small_edit.py","scripts/pr122_customer_source.py","tests/test_pr122_customer_center.py","tests/test_pr122_customer_providers.py"]
          # Brand-only candidate sources are bound in addition to existing coverage.
          paths += ['README.md', 'demos/community-local-e2e/beneficiary.html', 'demos/community-local-e2e/community.html', 'demos/community-local-e2e/saas-panel.html', 'demos/legal/custom-development.html', 'demos/legal/index.html', 'demos/legal/platform-terms.html', 'demos/legal/privacy.html', 'demos/legal/referral.html', 'demos/visual/community-payment/index.html', 'demos/work-community-experience/index.html', 'demos/xuanjun-site-hub/customer/projects/acceptance/index.html', 'demos/xuanjun-site-hub/customer/projects/index.html', 'demos/xuanjun-site-hub/ecosystem/activities/index.html', 'demos/xuanjun-site-hub/ecosystem/co-create/index.html', 'demos/xuanjun-site-hub/ecosystem/governance/index.html', 'demos/xuanjun-site-hub/ecosystem/index.html', 'demos/xuanjun-site-hub/ecosystem/ledger/index.html', 'demos/xuanjun-site-hub/ecosystem/profit-sharing/index.html', 'demos/xuanjun-site-hub/ecosystem/tiers/index.html', 'demos/xuanjun-site-hub/index.html', 'demos/xuanjun-site-hub/marketplace/index.html', 'demos/xuanjun-site-hub/marketplace/modules/index.html', 'demos/xuanjun-site-hub/visual/catalog/index.html', 'demos/xuanjun-site-hub/visual/community-payment/index.html', 'demos/xuanjun-site-hub/visual/community-payment/merchant-dashboard/index.html', 'demos/xuanjun-site-hub/visual/index.html', 'deploy/pr122-customer-center/ui/index.html', 'docs/DEVELOPMENT_EXECUTION_AND_FEEDBACK_RULES_20261012.md', 'docs/development/DEVELOPMENT_V27_ECOLOGY_V11_20261014.docx', 'docs/development/DEVELOPMENT_V27_ECOLOGY_V11_20261014.md', 'docs/development/LEGAL_CONTRACT_CENTER_20261015.md', 'docs/development/PR122_COMMUNITY_CUSTOMER_PILOT_20261016.md', 'docs/legal/README.md', 'docs/legal/registry.json', 'docs/legal/templates/custom-development.md', 'docs/legal/templates/platform-terms.md', 'docs/legal/templates/privacy.md', 'docs/legal/templates/referral.md', 'plans/XUANJUN_DOMAIN_DNS_UK_DOMESTIC_MIGRATION_MASTER_20261015.md', 'scripts/build_legal_previews.py', 'scripts/pr122_community_experience_package.py', 'scripts/pr122_customer_providers.py', 'scripts/pr122_showcase.py', 'scripts/pr122_site_hub_english.py', 'scripts/pr122_site_hub_public_copy.py', 'scripts/pr122_site_hub_stage.py', 'showcase/projects/community-payment/views/merchant/v1/public/index.html', 'tests/test_legal_static_alignment.py', 'tests/test_pr122_customer_providers.py', 'tests/test_pr122_customer_small_edit.py', 'tests/test_pr122_ecology_copy.py', 'tests/test_pr122_public_copy_audit.py', 'tests/test_pr122_showcase_promote.py', 'tests/test_pr122_site_hub_integration.py']
          # Exact versioned brand package reader, producer and recovery consumers.
          paths += ['inventory/XUANJUN_EXISTING_ASSET_MAP_V1.md', 'plans/MIGRATION_SEQUENCE_V1.md', 'scripts/pr122_site_hub_package.py', 'scripts/pr122_site_hub_unified_release.py', 'scripts/pr122_static_workflow.py', 'scripts/pr122_static_operations.py', 'tests/test_pr122_static_package_schema.py', 'tests/test_pr122_static_source_gate.py', 'tests/test_pr122_static_operations.py', 'tests/test_pr122_static_public_transport.py']
          paths = sorted(set(paths))
          files={name:Path(name).read_bytes() for name in paths}
          manifest={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'scope':'CURRENT_WEBSITE_SYNTHETIC_REVIEW_ONLY','production_release':'HOLD','target_host_commands':'NOT_EXECUTED','files':[{'path':name,'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()} for name,raw in sorted(files.items())]}
          raw=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();files['SOURCE_MANIFEST.json']=raw
          buffer=io.BytesIO()
          with tarfile.open(fileobj=buffer,mode='w') as archive:
              for name,data in sorted(files.items()):
                  member=tarfile.TarInfo(name);member.size=len(data);member.mode=0o644;member.mtime=0;archive.addfile(member,io.BytesIO(data))
          packed=gzip.compress(buffer.getvalue(),mtime=0)
          out=Path('/tmp/pr122-website-review');(out/'SOURCE_REVIEW.tar.gz').write_bytes(packed);(out/'SOURCE_MANIFEST.json').write_bytes(raw)
          (out/'SOURCE_CHECKSUMS.json').write_text(json.dumps({'tar_sha256':hashlib.sha256(packed).hexdigest(),'manifest_sha256':hashlib.sha256(raw).hexdigest(),'files':len(paths)},sort_keys=True)+'\n')
          stage=Path('/tmp/pr122-current-website');binding=json.loads((stage/'MANIFEST.json').read_text())
          assert binding['status']=='HOSTED_BROWSER_FIXTURE_ONLY' and binding['production_approved'] is False
          with tarfile.open(out/'CURRENT_WEBSITE_HOSTED_FIXTURE_PREVIEW.tar.gz','w:gz') as archive:
              for file in sorted(stage.rglob('*')):
                  if file.is_file():
                      assert not file.is_symlink();archive.add(file,arcname=file.relative_to(stage),recursive=False)
          (out/'CURRENT_WEBSITE_MANIFEST.json').write_bytes((stage/'MANIFEST.json').read_bytes())
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr122-website-copy-navigation-${{ github.sha }}
          path: /tmp/pr122-website-review/
          retention-days: 14
