name: Fixed reviewed community package metadata delivery
on:
  push:
    branches: [feature/chatgpt-community-wechat-sp-offline-20261017]
    paths:
      - '.github/workflows/chatgpt-community-package-metadata-c19.yml'
      - 'delivery/community-package-metadata-c19/package-metadata.json'
      - 'delivery/community-package-metadata-c19/COMMUNITY_211_ORIGINAL_INSTALL.py'
      - 'delivery/community-installer-57242-253cad/COMMUNITY_572_ORIGINAL_INSTALL.py'
      - 'delivery/community-installer-57242-253cad/package-metadata.json'
permissions:
  contents: read
jobs:
  deliver-fixed-metadata:
    if: github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' && !contains(github.event.head_commit.message, '[community-installer-f9603d]') && !contains(github.event.head_commit.message, '[community-installer-253cad]') && !contains(github.event.head_commit.message, '[community-installer-253cad-metadata]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify fixed metadata bytes only; no payload execution or carrier download
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('delivery/community-package-metadata-c19/package-metadata.json').read_bytes()
          assert len(raw)==228340
          assert hashlib.sha256(raw).hexdigest()=='b2191e3f45b51d8b3a7333714e62ebd76b2794d7ebd4c09787b1a10ec722f2d7'
          value=json.loads(raw)
          assert value['object_spec']['artifact_id']==12982446450
          assert value['object_spec']['package']['payload']=='community-backend-image.tar.gz'
          print('FIXED_METADATA_BYTES_MATCH; NOT_DOWNLOADED; NOT_INSTALLED')
          PY
      - name: Publish exact single metadata member
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-community-57242-package-metadata
          path: delivery/community-package-metadata-c19/package-metadata.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  deliver-fixed-installer:
    if: github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' && contains(github.event.head_commit.message, '[community-installer-f9603d]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original reviewed installer bytes only; never execute payload
        run: |
          python - <<'PYVERIFY'
          import hashlib,pathlib
          raw=pathlib.Path('delivery/community-package-metadata-c19/COMMUNITY_211_ORIGINAL_INSTALL.py').read_bytes()
          assert len(raw)==444025
          assert hashlib.sha256(raw).hexdigest()=='f9603de88dc5379e63e639542b3512c4baea8a3503539f00a462bf6f63e61887'
          print('FIXED_INSTALLER_BYTES_MATCH; NOT_EXECUTED; NOT_INSTALLED')
          PYVERIFY
      - name: Publish exact single installer member
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-community-211a9-installer-f9603d
          path: delivery/community-package-metadata-c19/COMMUNITY_211_ORIGINAL_INSTALL.py
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  deliver-fixed-572-installer:
    if: github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' && contains(github.event.head_commit.message, '[community-installer-253cad]') && !contains(github.event.head_commit.message, '[community-installer-f9603d]') && !contains(github.event.head_commit.message, '[community-installer-253cad-metadata]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact independently reviewed 572 installer bytes only; never execute
        run: |
          python - <<'PYVERIFY'
          import hashlib,pathlib
          raw=pathlib.Path('delivery/community-installer-57242-253cad/COMMUNITY_572_ORIGINAL_INSTALL.py').read_bytes()
          assert len(raw)==492949
          assert hashlib.sha256(raw).hexdigest()=='253cad266d661c9ea9362b07fb4459d6556f1b90665d0577367ebd49e9222059'
          print('FIXED_INSTALLER_BYTES_MATCH; NOT_EXECUTED; NOT_INSTALLED')
          PYVERIFY
      - name: Publish exact single 572 installer member
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-community-57242-installer-253cad
          path: delivery/community-installer-57242-253cad/COMMUNITY_572_ORIGINAL_INSTALL.py
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
