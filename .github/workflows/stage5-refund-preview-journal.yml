name: Stage5 Refund Preview Journal
on:
  pull_request:
    paths:
      - 'scripts/community_refund_preview_store.py'
      - 'tests/test_community_refund_preview_store.py'
      - 'scripts/community_order_store.py'
      - '.github/workflows/stage5-refund-preview-journal.yml'
permissions:
  contents: read
jobs:
  refund-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_community_refund_preview_store.py' -v
          python -m unittest discover -s tests -p 'test_community_order_store.py' -v
          echo REAL_REFUND_EXECUTED=NO
          echo PROVIDER_SETTLEMENT=NOT_RUN
