name: UK supervision binding read-only audit
on:
  push:
    branches: [audit/dots-canonical-scope-20261013]
    paths:
      - scripts/uk-supervisor-binding-audit.py
      - .github/workflows/uk-supervisor-binding-audit.yml
concurrency:
  group: xuanjun-readonly-dots-canonical-scope
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed nonroot read-only audit without model calls
        run: |
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          /usr/bin/python3 -B -m py_compile scripts/uk-supervisor-binding-audit.py
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/python3 -I -B - < scripts/uk-supervisor-binding-audit.py
