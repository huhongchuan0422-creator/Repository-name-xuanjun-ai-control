name: UK supervision binding read-only audit
on:
  push:
    branches: [audit/uk-supervisor-binding-20261012]
    paths:
      - scripts/uk-supervisor-binding-audit.py
      - .github/workflows/uk-supervisor-binding-audit.yml
concurrency:
  group: xuanjun-readonly-supervisor-binding-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed nonroot read-only audit without model calls
        run: |
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          /usr/bin/python3 -B -m py_compile scripts/uk-supervisor-binding-audit.py
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/python3 -I -B - < scripts/uk-supervisor-binding-audit.py

      - name: Preserve exact existing Stage B package, no rebuild or installation
        run: |
          mkdir -m 700 "$RUNNER_TEMP/p2-stage-b-retained"
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/python3 -I -B - < scripts/uk-stage-b-package-export.py > "$RUNNER_TEMP/p2-stage-b-retained/PROVENANCE.json"
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/python3 -I -B - --bytes < scripts/uk-stage-b-package-export.py > "$RUNNER_TEMP/p2-stage-b-retained/candidate.tar.gz"
          test -s "$RUNNER_TEMP/p2-stage-b-retained/candidate.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-stage-b-exact-review-${{ github.run_id }}
          path: ${{ runner.temp }}/p2-stage-b-retained
          retention-days: 30
          if-no-files-found: error
