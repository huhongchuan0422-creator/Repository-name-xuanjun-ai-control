name: Task4 Task5 UK isolated E2E
on:
  push:
    branches: [repair/task45-chatgpt-closed-loop-review-20261013]
    paths:
      - scripts/entry_review_gate.py
      - scripts/development_closed_loop.py
      - scripts/task_supervisor.py
      - tests/test_entry_review_gate.py
      - tests/test_development_closed_loop.py
      - .github/workflows/uk-task45-isolated-e2e.yml
permissions:
  contents: read
jobs:
  isolated-e2e:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: UK Python 3.6.8 isolated closed-loop E2E
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          /usr/bin/python3 - <<'PY'
          import ast,pathlib,sys
          assert sys.version_info[:3]==(3,6,8)
          for name in ('scripts/entry_review_gate.py','scripts/development_closed_loop.py',
                       'scripts/task_supervisor.py'):
              ast.parse(pathlib.Path(name).read_text(),filename=name)
          print('TASK45_UK_PYTHON_3_6_8=PASS')
          PY
          /usr/bin/python3 -m unittest tests.test_entry_review_gate tests.test_development_closed_loop
          echo TASK4_UK_ISOLATED_E2E=PASS
          echo TASK5_UK_REVIEW_REPAIR_HANDOFF=PASS
          echo MODEL_CALLS=0
          echo PRODUCTION_MUTATION=0
          echo RELEASE_APPROVED=NO
