name: ChatGPT Native Issue19 Offline Observation
on:
  push:
    branches:
      - feature/chatgpt-native-entry-offline-receipt-20261017
    paths:
      - scripts/chatgpt_native_handoff_observer.py
      - scripts/chatgpt_feature_inventory_readonly.py
      - scripts/chatgpt_native_patch_preflight.py
      - tests/test_chatgpt_native_handoff_observer.py
      - tests/test_chatgpt_feature_inventory_readonly.py
      - tests/test_chatgpt_native_patch_preflight.py
      - .github/workflows/chatgpt-native-handoff-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify offline Issue19 observer
        run: |
          python3 -B -m unittest discover -s tests -p 'test_chatgpt_*_readonly.py' -v
          python3 -B -m unittest discover -s tests -p test_chatgpt_native_handoff_observer.py -v
          python3 -B -m unittest discover -s tests -p test_chatgpt_native_patch_preflight.py -v
      - name: Assert no host action or lease mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/chatgpt_native_handoff_observer.py').read_text()
          assert 'writer_permission": "NOT_GRANTED"' in text
          assert 'side_effects": 0' in text
          print('OFFLINE_ONLY_NO_WRITER_ADMISSION')
          PY
