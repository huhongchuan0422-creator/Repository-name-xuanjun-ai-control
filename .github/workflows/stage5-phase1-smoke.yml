name: Stage5 Phase1 Aggregate Smoke
on:
  pull_request:
    paths:
      - 'plans/STAGE5_PHASE1_INTEGRATION_ACCEPTANCE_20261014.md'
      - 'tests/test_stage5_phase1_smoke.py'
      - '.github/workflows/stage5-phase1-smoke.yml'
permissions:
  contents: read
jobs:
  phase1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_stage5_phase1_smoke.py' -v
          python -m unittest discover -s tests -p 'test_community_checkout.py' -v
          python -m unittest discover -s tests -p 'test_community_order_store.py' -v
          node --test demos/community-payment/demo.test.mjs
          node --test demos/community-admin/admin.test.mjs
          echo PHASE1_FULL_E2E_ACCEPTANCE=NOT_RUN
          echo REAL_WECHAT_AND_UK_DEPLOYMENT=NOT_RUN
