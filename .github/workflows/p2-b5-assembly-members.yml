name: P2 B5 four assembly analysis candidate
on:
  push:
    branches: [repair/p2-resumable-install-20261020]
    paths:
      - scripts/p2_b5_assembly_members.py
      - scripts/p2_b5_assembly_bootstrap.py
      - tests/p2_install/test_b5_assembly_members.py
      - .github/workflows/p2-b5-assembly-members.yml
  workflow_dispatch:
jobs:
  targeted:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['python:3.6.8@sha256:f20a9bfddd87c238c3d2316b4179222f219090cbb25d5b6975070d4dd4b75004', 'python:3.12-slim']
    steps:
      - uses: actions/checkout@v4
      - name: Targeted source tests only
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=64m -v "$PWD:/work:ro" -w /work '${{ matrix.image }}' python -I -B -S tests/p2_install/test_b5_assembly_members.py -v
