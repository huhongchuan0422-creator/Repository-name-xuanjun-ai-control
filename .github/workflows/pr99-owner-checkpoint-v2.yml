              need(type(d['part'])is int and d['part']==PART)
              raw=b''.join(CHUNKS[:PART+1])
              need(type(d['prefix_bytes'])is int and d['prefix_bytes']==len(raw) and d['prefix_sha256']==hashlib.sha256(raw).hexdigest())
