ceipt_sha256\':p[\'source_writer_fence_receipt_sha256\']}))\n  created={};journal=EffectJournal()\n  journal.effect(\'retire-stopped-candidate\',lambda:retire_stopped_candidate(p,candidate))\n  try:\n   for n,b in payload.items():\n    journal.effect(\'create:\'+n,lambda n=n,b=b:create(SYSTEMD/n,b,0o644));created[n]=b\n   journal.effect(\'daemon-reload\',lambda:ctl(\'daemon-reload\'))\n   verify_units(payload)\n   require(int(time.time())<p[\'expires_at\'],\'ADMISSION_EXPIRED_BEFORE_START\')\n   require(admit()[0]==p,\'PRESTART_DRIFT\')\n   for n in payload:\n    require(int(time.time())<p[\'expires_at\'],\'ADMISSION_EXPIRED_BEFORE_START\')\n    journal.effect(\'start:\'+n,lambda n=n:ctl(\'start\',n))\n   deadline=time.monotonic()+30;statuses={}\n   while time.monotonic()<deadline:\n    statuses={role:health(port) for role,(_,port) in UNITS.items()}\n    if all(v==200 for v in statuses.values()) and all(supervised(n) for n in payload):break\n    time.sleep(.5)\n   require(set(statuses)==set(UNITS) and all(v==200 for v in statuses.values()) and all(supervised(n) for n in payload),\'START_HEALTH_OR_SUPERVISION_FAILED\')\n   result={\'status\':\'THREE_APPS_STARTED_NO_TRAFFIC_CUTOVER\',\'health\':statuses,\'services_installed\':True,\'production_cutover\':False,\'upstream_auth_acceptance\':\'PENDING\',\'final_data_restored_on_failure\':False}\n   create(STATE/\'receipt.json\',canonical(result));return result\n  except EffectUnknown:\n   # In-flight start/stop/daemon actions must not race a compensating command.\n   create(STATE/\'failure.json\',canonical({\'status\':\'EFFECT_UNKNOWN_QUERY_ONLY_NO_REPLAY\',\'retry_allowed\':False}));raise\n  except BaseException:\n   # Known failure: journal containment too. Existing rollback only touches exact\n   # owned unit bytes, never resumes a source writer or restores data.\n   try:r=journal.effect(\'rollback-owned\',lambda:rollback_owned(created,effect=journal.effect))\n   except BaseException:r={\'status\':\'ROLLBACK_UNKNOWN_PRESERVE_NO_RETRY\'}\n   create(STATE/\'failure.json\',canonical(r));raise\n\n\nFROZEN_STOPPED=\'"""PR99 exact-byte, stopped-unit installation and conflict-safe rollback.\\nNo start/enable/restart, route edit, data restore, user creation or cloud call.\\nHost execution requires a separate root-held, independently issued admission.\\n"""\\nimport argparse\\nimport fcntl\\nimport hashlib\\nimport json\\nimport os\\nimport re\\nimport stat\\nimport subprocess\\nimport time\\nfrom pathlib import Path\\n\\nHOST = \\\'iZvt5t8tlrm8oiZ\\\'\\nRELEASE = \\\'/opt/xuanjun-migration-s07/releases/domestic-r2\\\'\\nSTATE = \\\'/var/lib/xuanjun-pr99-s09-stopped-install-v1\\\'\\nADMISSION = \\\'/etc/xuanjun-pr99/s09-stopped-install.admission.json\\\'\\nNAMES = tuple(\\\'xuanjun-pr99-domestic-\\\' + r + \\\'.service\\\' for r in (\\\'portal\\\', \\\'contact\\\', \\\'customer-service\\\'))\\nORIGINAL = (\\\'secure-secrets-portal.service\\\', \\\'xuanjun-wecom-customer-contact.service\\\', \\\'xuanjun-wecom-customer-service.service\\\')\\nPROTECTED = ORIGINAL + (\\\'provider-neutral-domestic-bridge.service\\\', \\\'winctl.service\\\', \\\'nginx.service\\\')\\n\\n\\ndef require(ok, code):\\n    if not ok:\\n        raise RuntimeError(code)\\n\\n\\ndef digest(data):\\n    return hashlib.sha256(data).hexdigest()\\n\\n\\ndef encode(value):\\n    return (json.dumps(value, sort_keys=True, indent=2) + \\\'\\\\n\\\').encode()\\n\\n\\ndef read_regular(path, limit=100000, private=False):\\n    path = Path(path)\\n    for parent in reversed(path.parents):\\n        require(not parent.is_symlink(), \\\'SYMLINK_PARENT\\\')\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\n    try:\\n        before = os.fstat(fd)\\n        require(stat.S_ISREG(before.st_mode) and before.st_uid == 0 and before.st_nlink == 1, \\\'FILE_IDENTITY\\\')\\n        require(not before.st_mode & 0o022, \\\'WRITABLE_INPUT\\\')\\n        if private:\\n            require(not before.st_mode & 0o077, \\\'PRIVATE_INPUT_MODE\\\')\\n        data = os.read(fd, limit + 1)\\n        after = os.fstat(fd)\\n        identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns)\\n        require(len(data) <= limit and identity(before) == identity(after), \\\'INPUT_CHANGED_OR_OVERSIZE\\\')\\n        return data\\n    finally:\\n        os.close(fd)\\n\\n\\ndef write_exclusive(path, data, mode=0o600):\\n    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)\\n    try:\\n        with os.fdopen(fd, \\\'wb\\\', closefd=False) as stream:\\n            stream.write(data)\\n            stream.flush()\\n            os.fsync(fd)\\n    finally:\\n        os.close(fd)\\n    directory = os.open(Path(path).parent, os.O_RDONLY | os.O_DIRECTORY)\\n    try:\\n        os.fsync(directory)\\n    finally:\\n        os.close(directory)\\n\\n\\ndef unit_bytes():\\n    commands = (\\n        \\\'scripts/secure_secrets_portal_server.py serve --host 127.0.0.1 --port 18080\\\',\\n        \\\'-m ai_service.wecom_customer_contact_service\\\',\\n        \\\'-m ai_service.wecom_customer_service\\\',\\n    )\\n    result = {}\\n    for name, command in zip(NAMES, commands):\\n        # Quarantine is mandatory. These units cannot reach the real bridge.\\n        result[name] = (\\\'\\\'\\\'[Unit]\\nDescription=PR99 quarantined domestic candidate\\nConditionPathExists={release}/callback-restart-acceptance-v1/receipt.json\\n\\n[Service]\\nType=simple\\nUser=65534\\nGroup=65534\\nRootDirectory={release}/rootfs\\nWorkingDirectory=/opt/trading-system\\nExecStart=/venv/bin/python {command}\\nEnvironment=PYTHONPATH=/opt/trading-system PYTHONDONTWRITEBYTECODE=1\\nEnvironment=WECOM_CONTACT_HOST=127.0.0.1 WECOM_CONTACT_PORT=18781\\nEnvironment=WECOM_KF_HOST=127.0.0.1 WECOM_KF_PORT=18780\\nBindReadOnlyPaths=/usr /lib /lib64\\nPrivateDevices=yes\\nPrivateNetwork=yes\\nPrivateTmp=yes\\nProtectSystem=strict\\nReadWritePaths=/opt/trading-system/runtime /home /tmp\\nNoNewPrivileges=yes\\nCapabilityBoundingSet=\\nRestrictSUIDSGID=yes\\nUMask=0077\\nRestart=no\\nTimeoutStopSec=15\\nKillMode=control-group\\nStandardOutput=null\\nStandardError=null\\n\\\'\\\'\\\'.format(release=RELEASE, command=command)).encode()\\n    return result\\n\\n\\ndef manifest():\\n    return {\\\'schema\\\': 1, \\\'action\\\': \\\'INSTALL_STOPPED_QUARANTINE_ONLY\\\', \\\'host\\\': HOST,\\n            \\\'release\\\': RELEASE, \\\'unit_hashes\\\': {n: digest(b) for n, b in unit_bytes().items()},\\n            \\\'activation_supported\\\': False, \\\'production_cutover\\\': False}\\n\\n\\ndef systemctl(*args):\\n    result = subprocess.run([\\\'/usr/bin/systemctl\\\', *args], capture_output=True, timeout=20)\\n    require(result.returncode == 0, \\\'SYSTEMCTL_FAILED_PRESERVE\\\')\\n    return result.stdout.decode()\\n\\n\\ndef snapshot():\\n    result = {u: systemctl(\\\'show\\\', u, \\\'--property=LoadState,ActiveState,SubState,MainPID,FragmentPath\\\', \\\'--no-pager\\\') for u in PROTECTED}\\n    for name in (\\\'/var/www/wenwenwenyiyiyi.work/current\\\', \\\'/opt/trading-system\\\'):\\n        p = Path(name)\\n        if p.is_symlink():\\n            result[name] = {\\\'link\\\': os.readlink(p)}\\n        elif p.exists():\\n            s = p.stat()\\n            result[name] = {\\\'dev\\\': s.st_dev, \\\'ino\\\': s.st_ino, \\\'mode\\\': s.st_mode, \\\'uid\\\': s.st_uid, \\\'gid\\\': s.st_gid}\\n        else:\\n            result[name] = None\\n    return result\\n\\n\\ndef stopped(name):\\n    value = systemctl(\\\'show\\\', name, \\\'--property=ActiveState,MainPID\\\', \\\'--no-pager\\\')\\n    fields = dict(line.split(\\\'=\\\', 1) for line in value.splitlines() if \\\'=\\\' in line)\\n    return fields.get(\\\'MainPID\\\') == \\\'0\\\' and fields.get(\\\'ActiveState\\\') in (\\\'inactive\\\', \\\'failed\\\')\\n\\n\\ndef admission(action, source):\\n    raw = read_regular(ADMISSION, private=True)\\n    permit = json.loads(raw)\\n    require(permit[\\\'schema\\\'] == 1 and permit[\\\'host\\\'] == HOST, \\\'ADMISSION_HOST\\\')\\n    require(permit[\\\'action\\\'] == action and permit[\\\'source_sha256\\\'] == digest(source), \\\'ADMISSION_ACTION_SOURCE\\\')\\n    require(permit[\\\'manifest_sha256\\\'] == digest(encode(manifest())), \\\'ADMISSION_MANIFEST\\\')\\n    now = int(time.time())\\n    require(type(permit[\\\'issued_at\\\']) is int and type(permit[\\\'expires_at\\\']) is int, \\\'ADMISSION_TIME_TYPE\\\')\\n    require(permit[\\\'issued_at\\\'] <= now < permit[\\\'expires_at\\\'] <= permit[\\\'issued_at\\\'] + 7200, \\\'ADMISSION_EXPIRED\\\')\\n    require(re.fullmatch(r\\\'[a-zA-Z0-9_-]{16,80}\\\', permit[\\\'nonce\\\']) is not None, \\\'ADMISSION_NONCE\\\')\\n    require(type(permit[\\\'independent_review_comment_id\\\']) is int and permit[\\\'independent_review_comment_id\\\'] > 0, \\\'INDEPENDENT_REVIEW_REFERENCE\\\')\\n    # A local file is not itself independent review evidence. Its provisioning\\n    # through the original reviewed authority is a separate mandatory host gate.\\n    return permit, digest(raw)\\n\\n\\ndef install(units_dir, state, permit, permit_hash):\\n    units = unit_bytes()\\n    before = snapshot()\\n    for original in ORIGINAL:\\n        require(\\\'LoadState=not-found\\\' in before[original], \\\'ORIGINAL_UNIT_PRESENT\\\')\\n    for name in NAMES:\\n        require(not os.path.lexists(units_dir / name), \\\'TARGET_UNIT_PRESENT\\\')\\n        require(stopped(name), \\\'TARGET_NOT_STOPPED\\\')\\n    receipt = json.loads(read_regular(Path(RELEASE) / \\\'callback-restart-acceptance-v1/receipt.json\\\', private=True))\\n    require(receipt[\\\'status\\\'] == \\\'R2_CALLBACK_REJECTION_RESTART_CLEANUP_PASS_NOT_PRODUCTION\\\' and receipt[\\\'application_processes_stopped\\\'] is True, \\\'COPY_ACCEPTANCE_MISSING\\\')\\n    write_exclusive(state / \\\'before.json\\\', encode(before))\\n    write_exclusive(state / \\\'intent.json\\\', encode({\\\'permit_sha256\\\': permit_hash, \\\'nonce\\\': permit[\\\'nonce\\\'], \\\'manifest\\\': manifest()}))\\n    created = []\\n    try:\\n        for name, data in units.items():\\n            write_exclusive(units_dir / name, data, 0o644)\\n            created.append(name)\\n            write_exclusive(state / (name + \\\'.created\\\'), encode({\\\'sha256\\\': digest(data)}))\\n        systemctl(\\\'daemon-reload\\\')\\n        require(all(stopped(n) for n in NAMES), \\\'UNIT_NOT_STOPPED\\\')\\n        require(snapshot() == before, \\\'PROTECTED_CHANGED\\\')\\n        write_exclusive(state / \\\'receipt.json\\\', encode({\\\'status\\\': \\\'QUARANTINE_UNITS_INSTALLED_STOPPED_NOT_PRODUCTION\\\', \\\'manifest\\\': manifest(), \\\'protected_state_unchanged\\\': True, \\\'starts\\\': 0, \\\'enables\\\': 0}))\\n    except BaseException:\\n        # Never delete an unrecognised or running unit, even after partial failure.\\n        write_exclusive(state / \\\'failure.json\\\', encode({\\\'status\\\': \\\'HOLD_PRESERVE\\\', \\\'created\\\': created}))\\n        raise\\n\\n\\ndef rollback(units_dir, state, permit, permit_hash):\\n    intent = json.loads(read_regular(state / \\\'intent.json\\\', private=True))\\n    require(intent[\\\'manifest\\\'] == manifest(), \\\'ROLLBACK_MANIFEST\\\')\\n    require(not (state / \\\'rollback.intent.json\\\').exists(), \\\'ROLLBACK_ALREADY_CONSUMED\\\')\\n    before = snapshot()\\n    targets = []\\n    for name, data in unit_bytes().items():\\n        p = units_dir / name\\n        if os.path.lexists(p):\\n            require(read_regular(p) == data and stopped(name), \\\'ROLLBACK_CONFLICT_OR_RUNNING\\\')\\n            # Only units whose transaction intent predates creation may be removed.\\n            marker = json.loads(read_regular(state / (name + \\\'.created\\\'), private=True))\\n            require(marker[\\\'sha256\\\'] == digest(data), \\\'ROLLBACK_OWNERSHIP\\\')\\n            targets.append(name)\\n    write_exclusive(state / \\\'rollback.intent.json\\\', encode({\\\'nonce\\\': permit[\\\'nonce\\\'], \\\'permit_sha256\\\': permit_hash, \\\'targets\\\': targets}))\\n    for name in targets:\\n        require(read_regular(units_dir / name) == unit_bytes()[name] and stopped(name), \\\'ROLLBACK_CHANGED\\\')\\n        (units_dir / name).unlink()\\n    systemctl(\\\'daemon-reload\\\')\\n    require(snapshot() == before, \\\'PROTECTED_CHANGED\\\')\\n    write_exclusive(state / \\\'rollback.receipt.json\\\', encode({\\\'status\\\': \\\'OWNED_STOPPED_UNITS_REMOVED\\\', \\\'removed\\\': targets, \\\'production_cutover\\\': False}))\\n\\n\\ndef main():\\n    parser = argparse.ArgumentParser()\\n    parser.add_argument(\\\'action\\\', choices=(\\\'manifest\\\', \\\'install-stopped\\\', \\\'rollback-stopped\\\'))\\n    args = parser.parse_args()\\n    if args.action == \\\'manifest\\\':\\n        print(encode(manifest()).decode(), end=\\\'\\\')\\n        return\\n    require(os.geteuid() == 0 and os.uname().nodename == HOST, \\\'HOST_ROOT\\\')\\n    os.umask(0o077)\\n    source = read_regular(Path(__file__), 100000)\\n    permit, permit_hash = admission(args.action, source)\\n    state = Path(STATE)\\n    if args.action == \\\'install-stopped\\\':\\n        state.mkdir(mode=0o700)  # one attempt; never replay or merge state\\n    require(stat.S_IMODE(state.lstat().st_mode) == 0o700 and state.lstat().st_uid == 0 and not state.is_symlink(), \\\'STATE_IDENTITY\\\')\\n    lock = os.open(state / \\\'lock\\\', os.O_RDWR | os.O_CREAT | os.O_NOFOLLOW, 0o600)\\n    try:\\n        fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)\\n        if args.action == \\\'install-stopped\\\':\\n            install(Path(\\\'/etc/systemd/system\\\'), state, permit, permit_hash)\\n        else:\\n            rollback(Path(\\\'/etc/systemd/system\\\'), state, permit, permit_hash)\\n    finally:\\n        os.close(lock)\\n\\n\\nif __name__ == \\\'__main__\\\':\\n    main()\\n\'\n\nOWNER_AUTHORITY={\'mode\':\'OWNER_DIRECT\',\'instruction_at\':\'2026-10-19T00:29:13+08:00\',\'scope\':\'PR99_DOMESTIC_MIGRATION\'}\n\ndef validate_owner_authority(p):\n require(p.get(\'owner_authority\')==OWNER_AUTHORITY,\'OWNER_AUTHORITY_BINDING\')\n require(type(p.get(\'nonce\'))is str and re.fullmatch(\'[A-Za-z0-9_-]{16,80}\',p[\'nonce\']),\'OWNER_INPUT_NONCE\')\n # A reviewer ID cannot replace Owner authority and is not required.\n return True\n\ndef stopped_library():\n require(sha(FROZEN_STOPPED.encode())==\'99225aacc11cae6dc9d190015c95c9883e13d8e2691da864fb026f8afdfee315\',\'ORIGINAL_STOPPED_SOURCE\')\n n={\'__name__\':\'original_stopped_definitions\'}\n exec(compile(FROZEN_STOPPED,\'original_stopped_definitions\',\'exec\'),n)\n n[\'PROTECTED\']=tuple(sorted(set(n[\'PROTECTED\'])|{\'windows-interaction-http.service\'}))\n n[\'systemctl\']=ctl\n return n\n\ndef inspect_stopped_candidate():\n n=stopped_library();names=n[\'NAMES\'];state=Path(n[\'STATE\'])\n present=[os.path.lexists(SYSTEMD/name) for name in names]\n if not any(present):\n  if os.path.lexists(state):\n   # Previously installed candidates may only be absent after the exact\n   # original terminal rollback; unexplained deletion is never adopted.\n   receipt=json.loads(n[\'read_regular\'](state/\'rollback.receipt.json\',private=True))\n   require(receipt.get(\'status\')==\'OWNED_STOPPED_UNITS_REMOVED\' and set(receipt.get(\'removed\',[]))==set(names),\'ORIGINAL_REMOVAL_UNKNOWN\')\n  require(all(stopped(name) for name in names),\'TARGET_STILL_RUNNING\')\n  return {\'kind\':\'NO_CANDIDATE\',\'library\':n}\n require(all(present),\'PARTIAL_OR_FOREIGN_CANDIDATE\')\n receipt=json.loads(n[\'read_regular\'](state/\'receipt.json\',private=True))\n require(receipt.get(\'status\')==\'QUARANTINE_UNITS_INSTALLED_STOPPED_NOT_PRODUCTION\' and receipt.get(\'manifest\')==n[\'manifest\']() and receipt.get(\'starts\')==receipt.get(\'enables\')==0,\'ORIGINAL_STOPPED_RECEIPT\')\n require(not os.path.lexists(state/\'rollback.intent.json\'),\'ORIGINAL_RETIREMENT_ALREADY_CONSUMED\')\n for name,data in n[\'unit_bytes\']().items():\n  require(n[\'read_regular\'](SYSTEMD/name)==data and stopped(name),\'FOREIGN_OR_RUNNING_CANDIDATE\')\n  marker=json.loads(n[\'read_regular\'](state/(name+\'.created\'),private=True))\n  require(marker.get(\'sha256\')==n[\'digest\'](data),\'ORIGINAL_CANDIDATE_OWNERSHIP\')\n return {\'kind\':\'EXACT_OWNED_STOPPED_CANDIDATE\',\'library\':n}\n\ndef retire_stopped_candidate(p,candidate):\n require(inspect_stopped_candidate()[\'kind\']==candidate[\'kind\'],\'CANDIDATE_CHANGED_BEFORE_RETIREMENT\')\n if candidate[\'kind\']==\'NO_CANDIDATE\':return {\'status\':\'NO_CANDIDATE_TO_RETIRE\'}\n require(candidate[\'kind\']==\'EXACT_OWNED_STOPPED_CANDIDATE\',\'CANDIDATE_KIND\')\n n=candidate[\'library\'];state=Path(n[\'STATE\'])\n # The original rollback removes ONLY its exact stopped bytes and records\n # its own before/after protected snapshots. It does not stop any service.\n n[\'rollback\'](SYSTEMD,state,{\'nonce\':p[\'nonce\']},sha(canonical(p[\'owner_authority\'])))\n receipt=json.loads(n[\'read_regular\'](state/\'rollback.receipt.json\',private=True))\n require(receipt.get(\'status\')==\'OWNED_STOPPED_UNITS_REMOVED\' and set(receipt.get(\'removed\',[]))==set(n[\'NAMES\']),\'ORIGINAL_RETIREMENT_TERMINAL_RECEIPT\')\n return receipt\n\ndef start():\n from contextlib import ExitStack\n require(os.geteuid()==0 and os.uname().nodename==HOST,\'HOST_ROOT\')\n n=stopped_library();state=Path(n[\'STATE\'])\n # Borrow the exact existing stopped-install lock across final admission,\n # removal and production installation. No second candidate claim is made.\n with ExitStack() as stack:\n  if os.path.lexists(state):\n   s=state.lstat();require(stat.S_ISDIR(s.st_mode) and s.st_uid==0 and stat.S_IMODE(s.st_mode)==0o700,\'ORIGINAL_STOPPED_STATE\')\n   fd=os.open(state/\'lock\',os.O_RDWR|os.O_NOFOLLOW|os.O_CLOEXEC)\n   stack.callback(os.close,fd)\n   s=os.fstat(fd);require(stat.S_ISREG(s.st_mode) and s.st_uid==0 and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o600,\'ORIGINAL_STOPPED_LOCK\')\n   fcn