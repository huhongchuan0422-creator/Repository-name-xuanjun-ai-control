name: UK host permission command mechanical validation
on:
  push:
    branches: [proposal/uk-mechanical-bootstrap-20261012]
    paths: ['.github/workflows/uk-host-permission-command-check.yml', 'scripts/xuanjun-uk-host-permissions-20261012.sh']
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash, embedded Python36 and sudoers parsing only
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          bash -n scripts/xuanjun-uk-host-permissions-20261012.sh
          /usr/bin/python3 -B - <<'PY'
          import ast,hashlib,os,tempfile,subprocess
          with open('scripts/xuanjun-uk-host-permissions-20261012.sh') as f:s=f.read()
          assert hashlib.sha256(s.encode()).hexdigest()=='0b08adbed54209b3eddf93ed05a7b87acac912fc612f650c1d44807f329574ba'
          code=s.split("<<'XJ_AUDIT_PYTHON'\n",1)[1].split('\nXJ_AUDIT_PYTHON',1)[0]+'\n'
          ast.parse(code)
          assert hashlib.sha256(code.encode()).hexdigest()=='1fa4bf89868de245a82e1a7a22ae6035acd1975b42de3252197b68d08fa676c8'
          with tempfile.TemporaryDirectory() as d:
              p=d+'/audit.py'
              with open(p,'w') as f:f.write(code)
              subprocess.run(['/usr/bin/python3','-I','-B',p,'--self-test'],check=True)
              for name,policy in [('dev','xuanjun_dev ALL=(root) NOPASSWD: ALL\n'),('audit','githubrunner ALL=(root) NOPASSWD: /usr/local/sbin/xuanjun-uk-install-audit ""\n')]:
                  p=d+'/'+name
                  with open(p,'w') as f:f.write(policy)
                  os.chmod(p,0o440)
                  subprocess.run(['/usr/sbin/visudo','-cf',p],check=True)
          print('ROOT_PERMISSION_INSTALL=NOT_EXECUTED; MECHANICAL_CHECKS=PASS')
          PY
