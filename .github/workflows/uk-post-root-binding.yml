name: UK post-root native consumer metadata
on:
  push:
    branches: [audit/uk-post-root-binding-20261012]
    paths: ['scripts/post-root-native-binding-audit.py', '.github/workflows/uk-post-root-binding.yml']
permissions:
  contents: read
concurrency:
  group: xuanjun-uk-post-root-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, xuanjun-uk-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual privilege without changing host state
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          test "$(id -un)" = githubrunner
          test "$(sudo -n /usr/bin/id -u)" = 0
          test "$(sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/sudo -n /usr/bin/id -u)" = 0
          echo '0b6c6a699b790e25e3631d96448f899382d35702cf79440ae9f92b5fd6b9091e  /etc/sudoers.d/xuanjun-uk-longterm-development' | sudo -n /usr/bin/sha256sum -c -
          echo ROOT_TRANSPORT_ACTUALLY_VERIFIED
      - name: Read sanitized actual native consumer metadata
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B -m py_compile scripts/post-root-native-binding-audit.py
          sudo -n /usr/bin/python3 -I -B scripts/post-root-native-binding-audit.py
          echo 'INSTALL=NO; MODEL_CALLS=0; LEASE_SERVICE_MUTATIONS=NONE' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact committed code for reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = iZd7oeikknn1z21sq6ji6zZ
          destination="$RUNNER_TEMP/p2-retained-$GITHUB_RUN_ID"
          mkdir -m 700 "$destination"
          repository=/home/xuanjun_dev/xuanjun-p2-native-adapter-6121230482
          for revision in d99b04060b703f68cc784ba55911009094492104 70309e7634d7fba3d6f16e0af4fa093fc159e2e7 c0a25ccacb0d33a73498126eee9f159aedde8c68 3888f859eeb440a63602b2e9822823447ea8294c; do
            sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git --no-optional-locks -C "$repository" archive --format=tar "$revision" > "$destination/$revision.tar"
            test -s "$destination/$revision.tar"
            (cd "$destination" && sha256sum "$revision.tar") >> "$destination/SHA256SUMS"
          done
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git --no-optional-locks -C "$repository" fsck --full --no-reflogs > "$destination/GIT_FSCK.txt" 2>&1 || echo GIT_INTEGRITY_HOLD >> "$destination/STATUS.txt"
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git --no-optional-locks -C "$repository" log --max-count=12 --format='%H %T %P' > "$destination/COMMIT_GRAPH.txt"
          recovery=/home/xuanjun_dev/p2-object-recovery-$GITHUB_RUN_ID
          sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git clone --no-checkout --no-hardlinks "$repository" "$recovery"
          echo '' | base64 -d > "$destination/missing-commit.raw"
          restored=$(sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git -C "$recovery" hash-object -t commit -w --stdin < "$destination/missing-commit.raw")
          test "$restored" = 34bd8d8b0306127f84e0274fe44c012f1244f420
          if sudo -n /usr/sbin/runuser -u xuanjun_dev -- /usr/bin/git -C "$recovery" fsck --full --no-reflogs > "$destination/ISOLATED_FSCK.txt" 2>&1; then
            echo ISOLATED_OBJECT_COMPLETENESS_PASS >> "$destination/RECOVERY_STATUS.txt"
          else
            echo ISOLATED_OBJECT_COMPLETENESS_HOLD >> "$destination/RECOVERY_STATUS.txt"
          fi
          echo "$recovery" >> "$destination/RECOVERY_STATUS.txt"
          (cd "$destination" && sha256sum -c SHA256SUMS)
          echo 'RETAINED_SOURCE_ONLY_NOT_INSTALLER; TASK=XUANJUN_WORK_DOTS_OPENCLAW_FOUNDATION_DISCOVERY_V1; FREEZE=NOT_ADMITTED' > "$destination/STATUS.txt"
          echo "P2_RETENTION_PATH=$destination" >> "$GITHUB_ENV"
      - name: Retain both source trees without installation admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-unadmitted-retained-source-${{ github.run_id }}
          path: ${{ env.P2_RETENTION_PATH }}
          retention-days: 30
          if-no-files-found: error
