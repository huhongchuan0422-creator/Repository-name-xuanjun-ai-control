name: Stage5 Demo API
on:
  pull_request:
    paths:
      - 'scripts/community_demo_api.py'
      - 'tests/test_community_demo_api.py'
      - '.github/workflows/stage5-demo-api.yml'
permissions:
  contents: read
jobs:
  demo-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Loopback API and order storage regressions
        run: |
          python -m unittest discover -s tests -p 'test_community_demo_api.py' -v
          python -m unittest discover -s tests -p 'test_community_order_store.py' -v
          echo ACTUAL_PAYMENT_PROVIDER=NOT_RUN
          echo UK_HOST_DEPLOYMENT=NOT_RUN
