name: PR99 offline transaction verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'evidence/pr99-service-handoff/s09-install-candidate/stopped_transaction.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_stopped_transaction.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/production_start.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_production_start.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/migration_transaction.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/final_materials.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_migration_transaction.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_final_materials.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/production_transport.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_production_transport.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_production_durable.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_final_sqlite.py'
      - 'evidence/pr99-service-handoff/s09-install-candidate/test_final_admission.py'
      - 'evidence/pr99-service-handoff/aliyun-execution/s07_private_coordinator.py'
      - '.github/workflows/pr99-stopped-transaction-validation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Offline transactions and temporary filesystem negative tests
        run: |
          python3 -B -m unittest discover -s evidence/pr99-service-handoff/s09-install-candidate -p 'test_*.py' -v
          python3 evidence/pr99-service-handoff/s09-install-candidate/stopped_transaction.py manifest
