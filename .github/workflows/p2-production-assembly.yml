name: P2 production assembly affected acceptance
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - production/p2_attempt5/**
      - tests/p2_production_assembly/**
      - .github/workflows/p2-production-assembly.yml
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: python:3.6.15-bullseye
            version: '3.6.15'
          - image: python:3.12.15-bookworm
            version: '3.12.15'
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact interpreter, affected integration and unchanged core closure
        env:
          EXPECTED_PYTHON: ${{ matrix.version }}
        run: |
          python3 -I -B -S -c 'import os,sys; assert ".".join(map(str,sys.version_info[:3]))==os.environ["EXPECTED_PYTHON"]'
          python3 -I -B -S production/p2_attempt5/verify.py "$GITHUB_WORKSPACE/.assembly-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-production-assembly-${{ matrix.version }}
          path: .assembly-results/
          if-no-files-found: error
