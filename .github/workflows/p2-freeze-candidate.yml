name: P2 freeze self-contained candidate (zero model)
on:
  push:
    branches: [repair/p2-chatgpt-clean-review-20261013]
    paths:
      - evidence/p2-native-wiring-work-20261012/**
      - scripts/owner_feishu_*.py
      - tests/test_owner_feishu_*
      - .github/workflows/p2-freeze-candidate.yml
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact old frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/huhongchuan0422-creator/Repository-name-xuanjun-ai-control/actions/artifacts/11747942678/zip > /tmp/p2-frozen.zip
      - name: Reconstruct, regress and authoritative-freeze exact source
        env:
          P2_FROZEN_ZIP: /tmp/p2-frozen.zip
          P2_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export P2_BUILD_TREE="$(git rev-parse 'HEAD^{tree}')"
          python evidence/p2-native-wiring-work-20261012/source_ci.py
          cp /tmp/xuanjun-p2-native-ci/authoritative-p2-package.tar.gz /tmp/p2-candidate.tar.gz
          python /tmp/xuanjun-p2-native-ci/xuanjun-p2-package/tools/p2-package-freeze.py verify \
            --archive /tmp/p2-candidate.tar.gz \
            --source-commit "$P2_BUILD_COMMIT" --source-tree "$P2_BUILD_TREE"
          sha256sum /tmp/p2-candidate.tar.gz | tee /tmp/p2-candidate.tar.gz.sha256
          printf '%s\n' "$P2_BUILD_TREE" > /tmp/p2-source-tree.txt
          echo MODEL_CALLS=0
          echo UK_RUNTIME=NOT_RUN
          echo RELEASE_GATE=NOT_GRANTED
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-candidate-${{ github.sha }}
          path: |
            /tmp/p2-candidate.tar.gz
            /tmp/p2-candidate.tar.gz.sha256
            /tmp/p2-source-tree.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
