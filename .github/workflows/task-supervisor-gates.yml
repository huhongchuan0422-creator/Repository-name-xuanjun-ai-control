name: Durable task supervisor gates
on:
  pull_request:
    paths:
      - scripts/task_supervisor.py
      - tests/test_task_supervisor.py
      - .github/workflows/task-supervisor-gates.yml
permissions:
  contents: read
jobs:
  supervisor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run deterministic fault injections
        run: |
          python3 -m py_compile scripts/task_supervisor.py tests/test_task_supervisor.py
          python3 -B -m unittest tests/test_task_supervisor.py -v
