name: Owner action digest gates
on:
  pull_request:
    paths:
      - scripts/owner_action_digest.py
      - tests/test_owner_action_digest.py
      - docs/OWNER_ACTION_DIGEST.md
      - .github/workflows/owner-action-digest-gates.yml
permissions:
  contents: read
jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate read-only human action projection
        run: |
          python3 -m py_compile scripts/owner_action_digest.py
          python3 -B -m unittest discover -s tests -p 'test_owner_action_digest.py' -v
