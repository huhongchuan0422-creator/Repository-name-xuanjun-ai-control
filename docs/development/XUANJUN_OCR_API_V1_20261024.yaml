openapi: 3.1.0
info:
  title: Xuanjun OCR Gateway
  version: 1.0.0
  description: >
    Contract only. No public listener or production endpoint is deployed yet.
    OCR suggestions never establish document authenticity and must be confirmed by a user.
servers:
  - url: https://{configured-host}/api/v1
    variables:
      configured-host:
        default: ocr.example.invalid
security:
  - bearerAuth: []
paths:
  /ocr/jobs:
    post:
      operationId: createOcrJob
      summary: Submit one authorized document image for OCR
      description: >
        Requires existing user identity, tenant ownership, onboarding attachment authorization,
        upload malware/image validation, and an idempotency key. No image may be sent to a cloud
        provider unless separately enabled with explicit authorization and a configured cost limit.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type, onboarding_application_id, attachment_id]
              properties:
                file: {type: string, format: binary}
                document_type:
                  type: string
                  enum: [business_license, id_front]
                onboarding_application_id: {type: string, minLength: 1, maxLength: 128}
                attachment_id: {type: string, minLength: 1, maxLength: 128}
      responses:
        '202':
          description: Accepted for processing; this does not imply recognition succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, contract_version]
                properties:
                  job_id: {type: string}
                  status: {type: string, enum: [queued, processing, needs_review, failed, confirmed]}
                  contract_version: {type: string, const: '1.0.0'}
        '400': {description: Invalid image, unsupported type, or invalid request}
        '401': {description: Missing or invalid authentication}
        '403': {description: Tenant or attachment authorization denied}
        '413': {description: Image exceeds configured size or pixel limits}
        '429': {description: Rate limit exceeded}
  /ocr/jobs/{job_id}:
    get:
      operationId: getOcrJob
      summary: Read processing state and field suggestions
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current job state; fields are suggestions only. Returns confirmed_fields and confirmation_revision after user confirmation; current application and attachment authorization must be rechecked before returning any job.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, contract_version, requires_human_confirmation, authenticity_verified]
                properties:
                  job_id: {type: string}
                  status: {type: string, enum: [queued, processing, needs_review, failed, confirmed]}
                  contract_version: {type: string, const: '1.0.0'}
                  document_type: {type: string}
                  engine: {type: string}
                  model_version: {type: string}
                  confirmed_fields:
                    type: object
                    additionalProperties: {type: string}
                  confirmation_revision: {type: integer, minimum: 1}
                  application_revision: {oneOf: [{type: string, pattern: '^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){0,3}
                  fields:
                    type: object
                    additionalProperties:
                      type: object
                      required: [value, confidence, requires_review, source]
                      properties:
                        value: {type: string}
                        confidence: {type: number, minimum: 0, maximum: 1}
                        requires_review: {type: boolean}
                        source: {type: string, const: ocr}
                  warnings: {type: array, items: {type: string}}
                  error_code: {type: string}
                  requires_human_confirmation: {type: boolean, const: true}
                  authenticity_verified: {type: boolean, const: false}
        '401': {description: Missing or invalid authentication}
        '403': {description: Tenant/job access denied or current application/attachment authorization revoked}
        '404': {description: Job not found or not visible to this subject}
    delete:
      operationId: deleteOcrJob
      summary: Delete OCR job payload
      description: >
        Rechecks current application and attachment authorization, including attachment content SHA-256, document type, and the stored authoritative application revision. Deletes encrypted job
        payload and confirmed fields, while retaining encrypted ocr_audit_details records (which include
        confirmation field values) and encrypted confirmation idempotency response records. This is
        not merely a non-sensitive tombstone and does not promise complete erasure from backups or
        external retention layers.
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '204': {description: Job payload deleted; audit tombstone retained}
        '401': {description: Missing or invalid authentication}
        '403': {description: Current application or attachment authorization revoked}
        '404': {description: Job not found or not visible to this subject}
  /ocr/jobs/{job_id}/confirm:
    post:
      operationId: confirmOcrFields
      summary: Store user-reviewed field values
      description: Confirmation must be immutable/audited; retrying recognition must never overwrite user-confirmed values. Recheck current application and attachment authorization against the stored attachment ID, content SHA-256, document type, and authoritative application revision before accepting confirmation.
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, fields, application_revision, provider_version]
              properties:
                revision: {type: integer, minimum: 1}
                application_revision: {oneOf: [{type: string, pattern: '^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){0,3}
                  type: object
                  additionalProperties: {type: string}
      responses:
        '200': {description: User-confirmed fields and the exact application/provider version tuple recorded and returned; shared writeback eligibility is false if provider_version is absent}
        '400': {description: Invalid schema or stale revision}
        '401': {description: Missing or invalid authentication}
        '403': {description: Tenant/job access denied or current application/attachment authorization revoked}
        '409': {description: Conflicting confirmation revision, application/provider version tuple, or idempotency payload}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
