<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玄钧 · 开发工作台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10151c;color:#e5edf6}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin-top:30px}.muted{color:#9aabc0;font-size:14px}.badge{border:1px solid #43516a;border-radius:20px;padding:7px 12px;font-size:13px}.ok{color:#6fe4b8}.warn{color:#ffcb78}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#19212d;border:1px solid #2c394c;border-radius:12px;padding:18px}.number{font-size:30px;margin:6px 0}.auth{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}input,button{background:#19212d;border:1px solid #43516a;border-radius:7px;padding:11px;color:#e5edf6}input{width:340px;max-width:100%}button{cursor:pointer;background:#2965cd}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #2c394c;vertical-align:top}th{color:#9aabc0;font-weight:500}td:first-child{overflow-wrap:anywhere}.table{overflow:auto}.notice{padding:14px;border-left:3px solid #ffcb78;background:#19212d;border-radius:4px}#error{color:#ffcb78;margin:16px 0}footer{margin-top:30px;color:#9aabc0;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}main{padding:24px 16px}}
</style></head><body><main>
<header><div><div class="muted">XUANJUN / OWNER WORKBENCH</div><h1>开发工作台</h1><div class="muted">持久任务 · 执行证据 · 集中人工待办</div></div><span id="connection" class="badge warn">等待连接真实状态</span></header>
<form class="auth" id="login"><input id="token" type="password" autocomplete="off" placeholder="输入工作台访问令牌" aria-label="访问令牌"><button>连接工作台</button><button type="button" id="logout">清除令牌</button></form>
<div id="error" role="status"></div><div class="cards"><div class="card"><div class="muted">有执行心跳</div><div class="number" id="active">—</div></div><div class="card"><div class="muted">已完成</div><div class="number" id="done">—</div></div><div class="card"><div class="muted">等待人工</div><div class="number" id="human">—</div></div><div class="card"><div class="muted">等待资源</div><div class="number" id="paused">—</div></div></div>
<div class="notice">只有有效租约与最近 60 秒的匹配 Worker 心跳，才显示持续执行证据。没有观测数据的组件保持 UNKNOWN。</div>
<h2>集中人工待办</h2><div id="humans" class="muted">连接后读取。</div><h2>任务与最近进度</h2><div class="table"><table><thead><tr><th>任务</th><th>状态</th><th>执行证据</th><th>最近更新</th><th>阶段 / CI / QA</th></tr></thead><tbody id="tasks"></tbody></table></div>
<h2>组件观测</h2><div id="services" class="muted">尚未读取。</div><footer id="timestamp">尚无状态快照。模型策略与真实调用状态等待核查。</footer>
</main><script>
const el=id=>document.getElementById(id);let token=sessionStorage.getItem('xj-owner-token')||'',busy=false,generation=0;
function time(t){return typeof t==='number'?new Date(t*1000).toLocaleString('zh-CN'):'UNKNOWN'}
function clear(){['active','done','human','paused'].forEach(id=>el(id).textContent='—');el('tasks').replaceChildren();el('humans').textContent='状态不可用';el('services').textContent='UNKNOWN'}
async function refresh(){if(!token||busy)return;busy=true;const current=generation;try{const r=await fetch('api/state',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw new Error(r.status===401?'访问令牌无效':'暂时无法读取状态');const s=await r.json();if(current!==generation)return;el('connection').textContent='已连接真实状态';el('connection').className='badge ok';el('error').textContent='';el('active').textContent=s.tasks.filter(t=>t.execution_evidence==='FRESH_WORKER_HEARTBEAT').length;el('done').textContent=s.counts.DONE||0;el('human').textContent=s.counts.WAITING_HUMAN||0;el('paused').textContent=s.counts.PAUSED_RESOURCE||0;el('tasks').replaceChildren();for(const t of s.tasks){const tr=document.createElement('tr');for(const v of [t.id,t.state,t.execution_evidence,time(t.updated),JSON.stringify(t.checkpoint||{})]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}el('tasks').appendChild(tr)}el('humans').replaceChildren();if(!s.human_queue.length)el('humans').textContent='当前没有人工待办。';for(const t of s.human_queue){const p=document.createElement('p');p.textContent=t.id+' · WAITING_HUMAN · Fence '+t.fence+' · 原因：'+((t.checkpoint||{}).reason||(t.checkpoint||{}).error_code||'UNKNOWN');el('humans').appendChild(p)}el('services').textContent=Object.entries(s.services).map(([k,v])=>k+': '+v).join(' / ');el('timestamp').textContent='快照：'+time(s.observed_at)+' · 最近完成：'+time(s.last_completed_at)+(s.truncated?' · 仅显示最近 200 项':'')+' · Owner目标主模型：'+((s.model_policy||{}).primary||'UNKNOWN')+' · 唯一备用：'+((s.model_policy||{}).fallbacks||[]).join(', ')+' · 实际调用模型：'+(s.model||'UNKNOWN')+' · 实际切换次数：'+(typeof s.fallbacks==='number'?s.fallbacks:'UNKNOWN');}catch(e){if(current!==generation)return;clear();el('connection').textContent='连接中断 / 无法验证进度';el('connection').className='badge warn';el('error').textContent=e.message;}finally{busy=false}}
el('login').addEventListener('submit',e=>{e.preventDefault();generation++;token=el('token').value.trim();sessionStorage.setItem('xj-owner-token',token);el('token').value='';refresh()});el('logout').onclick=()=>{generation++;token='';sessionStorage.removeItem('xj-owner-token');clear();el('connection').textContent='已清除访问令牌'};setInterval(refresh,5000);refresh();
</script></body></html>
