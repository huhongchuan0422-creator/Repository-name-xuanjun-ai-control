# LOCAL DISABLED CANDIDATE. New file only on original PR #122 head; not published.
# Both literal gates must remain false until independent review and explicit approval.
name: Alibaba Cloud account preparation once 20261017
run-name: ${{ github.event.label.name }}
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: xuanjun-domestic-account-prepare-once-20261017
  cancel-in-progress: false
jobs:
  prepare-account-once:
    if: >-
      ${{ false &&
          github.repository == 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control' &&
          github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.pull_request.number == 122 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feature/stage5-next25-integration-20261015' &&
          github.event.pull_request.base.ref == 'feature/stage5-merchant-platform-storefront-ui-20261014' &&
          github.actor == 'huhongchuan0422-creator' &&
          github.triggering_actor == 'huhongchuan0422-creator' &&
          github.run_attempt == 1 &&
          github.event.label.name == format('xuanjun-account-prepare-once-20261017-{0}', github.event.pull_request.head.sha) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Fixed reviewed account-only transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          """DISABLED LOCAL REVIEW CANDIDATE. Never execute while preparing/reviewing."""
          import base64, datetime, hashlib, hmac, json, os, re, time, urllib.error, urllib.parse, urllib.request, uuid, zlib
          from pathlib import Path
          ARMED = False
          EXPIRES = '1970-01-01T00:00:00+00:00'  # Set a short reviewed expiry immediately before publication.
          REPO = 'huhongchuan0422-creator/Repository-name-xuanjun-ai-control'
          ACTOR = 'huhongchuan0422-creator'
          BRANCH = 'feature/stage5-next25-integration-20261015'
          BASE = 'feature/stage5-merchant-platform-storefront-ui-20261014'
          WORKFLOW_PATH = '.github/workflows/aliyun-account-prepare-once-20261017.yml'
          PREFIX = 'xuanjun-account-prepare-once-20261017-'
          ROLE = 'acs:ram::1384884686754410:role/xuanjun-automation'
          REGION = 'cn-shanghai'
          INSTANCE = '3a22c458934142eea89ec6e3bf481a57'
          HOST = 'iZvt5t8tlrm8oiZ'
          ENDPOINT = 'swas.cn-shanghai.aliyuncs.com'
          PAYLOAD_SHA = '885b850864465a554d99adbdfb4b4d4e33abf5dc52e7dcf84f27597c247c0818'
          PAYLOAD_Z64 = ''
          RECEIPT = Path('account-prepare-receipt.json')
          row = {'schema': 1, 'status': 'HOLD', 'stage': 'GATE', 'retry_allowed': False,
                 'account': 'xuanjun-customer', 'hostname': HOST, 'region': REGION,
                 'instance_id': INSTANCE, 'payload_sha256': PAYLOAD_SHA}
          class Hold(Exception): pass
          def need(ok, code):
              if not ok: raise Hold(code)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          def persist():
              # Fixed nonsecret status fields only. fsync before remote mutation and before polling.
              with open(RECEIPT, 'w', encoding='utf-8') as out:
                  json.dump(row, out, sort_keys=True); out.write('\n'); out.flush(); os.fsync(out.fileno())
              fd = os.open('.', os.O_RDONLY | os.O_DIRECTORY)
              try: os.fsync(fd)
              finally: os.close(fd)
          def github(path):
              need(path.startswith('/repos/' + REPO + '/'), 'GITHUB_ENDPOINT')
              req = urllib.request.Request('https://api.github.com' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect()).open(req, timeout=20) as response:
                      raw = response.read(4000001)
                  need(len(raw) <= 4000000, 'GITHUB_RESPONSE_SIZE')
                  result = json.loads(raw)
                  need(isinstance(result, dict), 'GITHUB_RESPONSE_SCHEMA')
                  return result
              except Exception: raise Hold('GITHUB_GATE_UNKNOWN') from None
          def gate():
              need(ARMED, 'DISABLED_PENDING_INDEPENDENT_REVIEW')
              expiry = datetime.datetime.fromisoformat(EXPIRES)
              now = datetime.datetime.now(datetime.timezone.utc)
              need(now < expiry <= now + datetime.timedelta(minutes=30), 'EXPIRED_OR_INVALID_WINDOW')
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr = event['pull_request']; head = pr['head']['sha']; label = event['label']['name']
              need(os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and event['action'] == 'labeled', 'EVENT')
              need(os.environ['GITHUB_REPOSITORY'] == REPO and event['repository']['full_name'] == REPO, 'REPOSITORY')
              need(os.environ['GITHUB_ACTOR'] == ACTOR and os.environ['GITHUB_TRIGGERING_ACTOR'] == ACTOR and event['sender']['login'] == ACTOR, 'ACTOR')
              need(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'RERUN_DENIED')
              need(pr['number'] == 122 and pr['state'] == 'open', 'PR')
              need(pr['head']['repo']['full_name'] == REPO and pr['head']['ref'] == BRANCH and pr['base']['ref'] == BASE, 'BRANCH')
              need(re.fullmatch('[0-9a-f]{40}', head) and label == PREFIX + head, 'EXACT_SHA_LABEL')
              current = github('/repos/' + REPO + '/pulls/122')
              need(current['head']['sha'] == head and current['head']['ref'] == BRANCH and current['head']['repo']['full_name'] == REPO and current['state'] == 'open' and current['base']['ref'] == BASE, 'PR_DRIFT')
              need(any(x['name'] == label for x in current['labels']), 'LABEL_REMOVED')
              need(current.get('mergeable') is True, 'PR_NOT_CLEAN')
              run_id = int(os.environ['GITHUB_RUN_ID'])
              run = github('/repos/' + REPO + '/actions/runs/' + str(run_id))
              need(run['event'] == 'pull_request' and run['run_attempt'] == 1 and run['path'] == WORKFLOW_PATH and run['display_title'] == label and run['actor']['login'] == ACTOR and run['head_branch'] == BRANCH, 'RUN_IDENTITY')
              workflow = run['workflow_id']; count = 0; seen_current = False
              for page in range(1, 101):
                  data = github('/repos/' + REPO + '/actions/workflows/' + str(workflow) + '/runs?per_page=100&page=' + str(page))
                  runs = data['workflow_runs']; need(isinstance(runs, list), 'HISTORY_SCHEMA')
                  count += len(runs)
                  for prior in runs:
                      if prior['id'] == run_id: seen_current = True; continue
                      # Stronger than exact-label matching: any other matching head blocks too,
                      # including failed, cancelled and skipped runs. Never delete history to rearm.
                      if prior['head_sha'] == head or prior['display_title'] == label:
                          raise Hold('OTHER_ONE_SHOT_RUN_NO_RETRY')
                  if len(runs) < 100:
                      need(count == data['total_count'] and seen_current, 'INCOMPLETE_HISTORY')
                      break
              else: raise Hold('HISTORY_LIMIT_FAIL_CLOSED')
              row.update(head_sha=head, label=label, github_run_id=run_id)
              payload = zlib.decompress(base64.b64decode(PAYLOAD_Z64, validate=True))
              need(hashlib.sha256(payload).hexdigest() == PAYLOAD_SHA, 'PAYLOAD_HASH')
              return payload
          
          def quote(value): return urllib.parse.quote(str(value), safe='~')
          def rpc(endpoint, version, action, credentials, **params):
              need((endpoint, version, action) in {
                  ('sts.aliyuncs.com', '2015-04-01', 'AssumeRole'),
                  (ENDPOINT, '2020-06-01', 'RunCommand'),
                  (ENDPOINT, '2020-06-01', 'DescribeInvocationResult')}, 'RPC_ENDPOINT_ACTION')
              key, secret, token = credentials
              values = dict(params, Action=action, Version=version, Format='JSON', AccessKeyId=key,
                  SignatureMethod='HMAC-SHA1', SignatureVersion='1.0', SignatureNonce=uuid.uuid4().hex,
                  Timestamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
              if token: values['SecurityToken'] = token
              canonical = '&'.join(quote(k) + '=' + quote(v) for k, v in sorted(values.items()))
              sig = hmac.new((secret + '&').encode(), ('POST&%2F&' + quote(canonical)).encode(), hashlib.sha1).digest()
              values['Signature'] = base64.b64encode(sig).decode()
              req = urllib.request.Request('https://' + endpoint + '/', data=urllib.parse.urlencode(values).encode(),
                  headers={'Content-Type': 'application/x-www-form-urlencoded'}, method='POST')
              try:
                  with urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect()).open(req, timeout=20) as response: raw = response.read(262145)
                  need(len(raw) <= 262144, 'RPC_RESPONSE_SIZE')
                  data = json.loads(raw)
                  need(isinstance(data, dict) and 'Code' not in data, 'RPC_REJECTED')
                  return data
              except Exception: raise Hold('RPC_RESULT_UNKNOWN_NO_RETRY') from None
          
          def command(payload, nonce):
              # Fixed reviewed embedded source only, no checkout, downloads or command inputs.
              code = '''import base64,contextlib,hashlib,io,json,os,sys,zlib
          p=zlib.decompress(base64.b64decode(%r,validate=True))
          assert hashlib.sha256(p).hexdigest()==%r
          assert os.uname().nodename==%r and os.getuid()==os.geteuid()==0
          ns={'__name__':'reviewed_account_payload'}
          try:
           with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
            exec(compile(p,'reviewed-account-payload','exec'),ns)
            result=ns['main'](['--apply'])
           print(json.dumps({'hostname':os.uname().nodename,'nonce':%r,'payload_sha256':%r,'result':result},sort_keys=True))
          except BaseException:
           print('{"state":"HOLD","retry_allowed":false}')
           sys.exit(2)
          ''' % (base64.b64encode(zlib.compress(payload,9)).decode(), PAYLOAD_SHA, HOST, nonce, PAYLOAD_SHA)
              import shlex
              return '#!/bin/sh\nset -eu\nPYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -B -c ' + shlex.quote(code) + '\n'
          
          def validate(detail, invoke, nonce):
              need(detail.get('InstanceId') == INSTANCE and detail.get('InvokeId') == invoke, 'RESULT_IDENTITY')
              need(detail.get('InvocationStatus') == 'Success' and type(detail.get('ExitCode')) is int and detail['ExitCode'] == 0, 'REMOTE_NOT_SUCCESS')
              output = detail.get('Output'); need(isinstance(output, str) and len(output) < 8192, 'OUTPUT_SIZE')
              try: data = json.loads(output)
              except Exception:
                  try: data = json.loads(base64.b64decode(output, validate=True))
                  except Exception: raise Hold('OUTPUT_SCHEMA') from None
              need(isinstance(data, dict) and set(data) == {'hostname','nonce','payload_sha256','result'}, 'OUTPUT_SCHEMA')
              need(data['hostname'] == HOST and data['nonce'] == nonce and data['payload_sha256'] == PAYLOAD_SHA, 'OUTPUT_BINDING')
              r = data['result']
              need(isinstance(r, dict) and set(r) == {'state','account','uid','gid','retry_allowed','sudo_privileges','polkit_global_policy','privilege_policy_changes'}, 'ACCOUNT_SCHEMA')
              need(r['state'] == 'ACCOUNT_CREATED_VERIFIED' and r['account'] == 'xuanjun-customer' and r['retry_allowed'] is False and r['sudo_privileges'] == 'DENIED' and r['polkit_global_policy'] == 'NOT_AUDITED' and r['privilege_policy_changes'] is False, 'ACCOUNT_RESULT')
              need(all(type(r[k]) is int and 0 < r[k] < 65534 for k in ('uid','gid')), 'ACCOUNT_IDS')
              return r
          
          def main():
              try:
                  persist(); payload = gate()
                  master = (os.environ.get('ALIYUN_ACCESS_KEY_ID',''), os.environ.get('ALIYUN_ACCESS_KEY_SECRET',''), '')
                  need(all(master[:2]), 'MISSING_EXISTING_SECRETS')
                  row['stage'] = 'ASSUME_EXISTING_ROLE'; persist()
                  data = rpc('sts.aliyuncs.com','2015-04-01','AssumeRole',master,RoleArn=ROLE,
                      RoleSessionName='xuanjun-account-' + uuid.uuid4().hex[:16],DurationSeconds=900)
                  c = data['Credentials']; credentials = (c['AccessKeyId'],c['AccessKeySecret'],c['SecurityToken'])
                  need(all(isinstance(v,str) and v and '\n' not in v and '\r' not in v for v in credentials), 'STS_SCHEMA')
                  # No credential output, not even masking directives.
                  nonce = uuid.uuid4().hex
                  script = command(payload, nonce)
                  need(len(base64.b64encode(script.encode('utf-8'))) <= 16384, 'COMMAND_SIZE_LIMIT')
                  need(datetime.datetime.now(datetime.timezone.utc) < datetime.datetime.fromisoformat(EXPIRES), 'EXPIRED_BEFORE_RUN')
                  row.update(stage='INTENT_BEFORE_RUN_NO_RETRY'); persist()
                  print(json.dumps(row, sort_keys=True), flush=True)
                  result = rpc(ENDPOINT,'2020-06-01','RunCommand',credentials,CommandContent=script,RegionId=REGION,
                      Type='RunShellScript',InstanceId=INSTANCE,WorkingUser='root',WorkingDir='/root',Timeout=90,
                      Name='xuanjun-account-prepare-once-20261017')
                  invoke = result.get('InvokeId')
                  need(isinstance(invoke,str) and re.fullmatch(r'[A-Za-z0-9_-]{1,180}',invoke), 'DISPATCH_RESULT_UNKNOWN_NO_RETRY')
                  row.update(invoke_id=invoke,stage='DISPATCHED_NO_RETRY')
                  print(json.dumps({'invoke_id':invoke,'stage':row['stage']}, sort_keys=True), flush=True)
                  persist()  # Durable receipt BEFORE any result polling.
                  deadline = time.monotonic() + 180
                  while time.monotonic() < deadline:
                      result = rpc(ENDPOINT,'2020-06-01','DescribeInvocationResult',credentials,
                          RegionId=REGION,InstanceId=INSTANCE,InvokeId=invoke)
                      detail = result.get('InvocationResult'); need(isinstance(detail,dict), 'QUERY_SCHEMA')
                      need(detail.get('InstanceId') == INSTANCE and detail.get('InvokeId') == invoke, 'QUERY_IDENTITY')
                      if detail.get('InvocationStatus') in ('Pending','Running','Stopping'):
                          time.sleep(5); continue
                      account = validate(detail,invoke,nonce)
                      row.update(status='PASS',stage='ACCOUNT_CREATED_VERIFIED',account_result=account); persist()
                      print(json.dumps(row,sort_keys=True),flush=True)
                      return 0
                  raise Hold('POLL_TIMEOUT_HOLD_NO_RETRY')
              except Hold as exc:
                  row.update(status='HOLD',reason=str(exc))
              except BaseException:
                  row.update(status='HOLD',reason='UNKNOWN_PRESERVE_NO_RETRY')
              persist(); print(json.dumps(row,sort_keys=True),flush=True)
              return 2
          if __name__ == '__main__': raise SystemExit(main())
          PY
      - name: Preserve nonsecret intent and invocation receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: account-prepare-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: account-prepare-receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
