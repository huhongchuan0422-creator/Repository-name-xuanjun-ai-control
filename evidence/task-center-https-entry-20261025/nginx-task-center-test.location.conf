# Candidate-only include for the existing server_name uk.wenwenwenyiyiyi.work.
# NOT INSTALLED. Preserve the URI prefix: proxy_pass intentionally has no trailing slash.
location = /task-center-test {
    return 308 /task-center-test/;
}

location ^~ /task-center-test/ {
    limit_req zone=owner_callback_rate burst=10 nodelay;
    limit_conn owner_callback_conn 4;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host uk.wenwenwenyiyiyi.work;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering off;
}
