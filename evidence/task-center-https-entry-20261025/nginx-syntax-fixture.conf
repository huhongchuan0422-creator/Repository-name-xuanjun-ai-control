pid /tmp/xuanjun-task-center-nginx-syntax.pid;
error_log stderr notice;
events { worker_connections 16; }
http {
    access_log off;
    client_body_temp_path /tmp/xuanjun-task-center-nginx-client;
    proxy_temp_path /tmp/xuanjun-task-center-nginx-proxy;
    fastcgi_temp_path /tmp/xuanjun-task-center-nginx-fastcgi;
    uwsgi_temp_path /tmp/xuanjun-task-center-nginx-uwsgi;
    scgi_temp_path /tmp/xuanjun-task-center-nginx-scgi;
    limit_req_zone $binary_remote_addr zone=owner_callback_rate:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=owner_callback_conn:1m;
    server {
        listen 127.0.0.1:18080;
        server_name uk.wenwenwenyiyiyi.work;
        include nginx-task-center-test.location.conf;
        location / { return 404; }
    }
}
