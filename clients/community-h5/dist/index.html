<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区服务</title><link rel="stylesheet" href="app.css"></head><body><form id="login-panel" class="card"><div class="h5-login-heading">登录现有账户</div><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button><p>使用已有消费者账户，不新建账号或角色。</p></form><div id="h5-message" role="status"></div><main id="app"></main><aside style="padding:16px 18px 90px"><button type="button" id="h5-privacy">隐私指引（草案待审核）</button><button type="button" id="h5-logout" hidden>退出当前账户</button></aside><script src="app.js" defer></script></body></html>
