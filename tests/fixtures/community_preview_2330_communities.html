<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区管理 · 玄钧云汇</title><link rel="stylesheet" href="/community/portal.css"></head><body><main><h1>社区管理</h1><p id="message" role="status">请从客户中心进入已授权社区工作区。</p><section><h2>个人资料与推荐关系</h2><button id="readProfile">读取我的资料</button><form id="customerProfile"><label>昵称<input id="nickname" maxlength="80"></label><label>联系方式<input id="customerContact" maxlength="200"></label><button>保存个人资料</button></form><button id="referralCode">获取我的推荐码</button><label>推荐码<input id="referralInput" maxlength="32"></label><button id="bindReferrer">确认绑定推荐人</button><button id="notices">我的通知</button><pre id="customerResult"></pre></section><section><h2>社区资料</h2><form id="profile"><label>社区名称<input id="name" maxlength="120" required></label><label>社区介绍<textarea id="description" maxlength="2000"></textarea></label><label>联系人及联系方式<input id="contact" maxlength="200" required></label><button>保存资料</button></form><button id="submit">提交审核</button><button id="mine">我的社区</button></section><section><h2>打开社区</h2><label>社区编号<input id="reference"></label><button id="read">查询</button><label>关系类型<select id="kind"><option value="CUSTOMER">消费者</option><option value="MERCHANT">商家</option></select></label><button id="join">加入社区</button><button id="leave">退出社区</button><button id="members">查看成员</button></section><section><h2>平台审核</h2><button id="pending">待审社区</button><label>社区状态<select id="directoryStatus"><option>ALL</option><option>DRAFT</option><option>PENDING</option><option>CORRECTION</option><option>REJECTED</option><option>APPROVED</option><option>PAUSED</option></select></label><button id="listDirectory">查询平台社区</button><label>审核决定<select id="decision"><option>APPROVED</option><option>CORRECTION</option><option>REJECTED</option><option>PAUSED</option></select></label><label>审核意见<textarea id="opinion" maxlength="1000"></textarea></label><button id="review">提交审核决定</button></section><section><h2>社区订单、收益与结算观察</h2><button id="communityOrders">查询社区归属订单</button><button id="communityEarnings">查询已核实分账与回退明细</button><p>收益按微信签名结果列示，页面汇总仅包含当前页；财务核销状态单独确认。</p><h3>平台配置社区分账接收关系</h3><label>已授权财务工作区<input id="receiverWorkspace"></label><label>已准入接收方编号<input id="receiverId"></label><label>关系当前版本（首次为0）<input id="receiverVersion" type="number" min="0" step="1" value="0"></label><button id="bindReceiver">保存社区接收关系（仅新分账规则版本适用）</button></section><section><h2>平台运营查询</h2><label>查看数据<select id="platformView"><option value="platform_overview">经营总览</option><option value="platform_orders">订单</option><option value="platform_customers">原项目用户与消费者关联</option><option value="platform_audit">操作审计</option></select></label><label>订单状态<select id="platformOrderStatus"><option>ALL</option><option>PENDING</option><option>SUCCESS</option><option>FAILED</option><option>CANCELLED</option><option>REFUNDED</option></select></label><button id="readPlatformView">查询运营数据</button><button id="morePlatformView" hidden>下一页运营数据</button><pre id="platformViewResult"></pre></section><section><h2>平台商家管理</h2><button id="platformMerchants">查询已准入商家</button><div id="merchantRecords" aria-label="已准入商家列表"></div><button id="moreMerchants" hidden>下一页商家</button><pre id="merchantResult" aria-live="polite"></pre><label>原商家工作区<input id="platformMerchantWorkspace"></label><label>当前版本（首次0）<input id="platformMerchantVersion" type="number" min="0" step="1" value="0"></label><label>平台状态<select id="platformMerchantState"><option>ACTIVE</option><option>PAUSED</option><option>DISABLED</option></select></label><label>原因<textarea id="platformMerchantReason" maxlength="1000"></textarea></label><button id="saveMerchantState">保存平台状态</button><p>暂停或停用阻止新交易，已有订单查询、取消和退款恢复继续开放。微信进件审核状态单独确认。</p></section><section><h2>社区推广</h2><label>原小程序门店场景<input id="promotionScene"></label><label>推广标题<input id="promotionTitle" maxlength="120"></label><label>到期时间<input id="promotionExpiry" type="datetime-local"></label><button id="createPromotion">创建推广入口</button><button id="listPromotions">查询推广记录</button><label>推广码<input id="promotionCode"></label><label>当前版本<input id="promotionVersion" type="number" min="1" step="1"></label><label>状态<select id="promotionState"><option>ACTIVE</option><option>PAUSED</option></select></label><button id="savePromotionState">更新推广状态</button><p>只统计登录用户确认加入的去重记录，不把打开链接计为新成员。</p></section><section><h2>查询结果</h2><div id="records"></div><button id="more" hidden>下一页</button><pre id="result"></pre></section></main><script src="/community/portal.js" defer></script></body></html>
